                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })()}
                  </div>} {/* end details tab */}

                  {/* ══════════════════════════════════════════
                      TAB: STAY HISTORY
                  ══════════════════════════════════════════ */}
                  {roomDetailTab === "history" && (() => {
                    const history = liveRoom.stayHistory || [];
                    return (
                      <div>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                          <div style={{ fontSize:11, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:"0.08em" }}>
                            Stay History · {history.length} stays
                          </div>
                        </div>
                        {history.length === 0 ? (
                          <div style={{ textAlign:"center", padding:"32px 0", color:"#9ca3af" }}>
                            <div style={{ fontSize:28, marginBottom:8 }}>📋</div>
                            <div style={{ fontSize:12 }}>No stays recorded yet.</div>
                            <div style={{ fontSize:11, marginTop:4 }}>Stays will appear here after each checkout.</div>
                          </div>
                        ) : history.map((stay, idx) => {
                          const nights = stay.nights || 1;
                          const balance = Math.max(0, (stay.total||0) - (stay.paid||0));
                          return (
                            <div key={stay.id || idx} style={{ marginBottom:10, padding:"10px 12px", background:idx===0?"rgba(59,130,246,0.04)":"rgba(0,0,0,0.02)", border:`1px solid ${idx===0?"rgba(59,130,246,0.15)":"rgba(0,0,0,0.07)"}`, borderRadius:8 }}>
                              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 }}>
                                <div>
                                  <div style={{ fontSize:13, fontWeight:700, color:"#111827" }}>{stay.guest}</div>
                                  <div style={{ fontSize:10, color:"#6b7280", marginTop:1 }}>{stay.mobile || "—"} · {stay.bookingSource||"Walk-in"}</div>
                                </div>
                                <div style={{ textAlign:"right" }}>
                                  <div style={{ fontSize:11, fontWeight:700, color:balance===0?"#22c55e":"#ef4444" }}>
                                    {balance===0 ? "✓ Paid" : `⚠ ₹${rupees(balance)} due`}
                                  </div>
                                  <div style={{ fontSize:10, color:"#6b7280" }}>₹{rupees(stay.total||0)} total</div>
                                </div>
                              </div>
                              <div style={{ display:"flex", gap:12, fontSize:11, color:"#374151", marginBottom:stay.earlyDeparture||stay.notes?6:0 }}>
                                <span>📅 {fmtD(stay.checkIn)} → {fmtD(stay.checkOut)}</span>
                                <span>🌙 {nights} night{nights!==1?"s":""}</span>
                                <span>{stay.adults||1}A{stay.children&&stay.children!=="0"?" + "+stay.children+"C":""}</span>
                                
                              </div>
                              {stay.earlyDeparture && (
                                <div style={{ fontSize:10, color:"#a855f7", marginTop:4 }}>⚡ Early departure — original date: {fmtD(stay.earlyDeparture)}</div>
                              )}
                              {stay.incidents && stay.incidents.length > 0 && (
                                <div style={{ marginTop:6 }}>
                                  {stay.incidents.map((inc,i) => (
                                    <div key={i} style={{ fontSize:10, color:"#dc2626", padding:"3px 8px", background:"rgba(239,68,68,0.06)", borderRadius:4, marginBottom:2 }}>⚠ {inc}</div>
                                  ))}
                                </div>
                              )}
                              {/* Incident + Note controls */}
                              <div style={{ marginTop:6, display:"flex", gap:6 }}>
                                <input placeholder="Add incident note (damage, complaint...)"
                                  style={{ flex:1, fontSize:11, padding:"4px 8px", borderRadius:5, border:"1px solid var(--border)", background:"var(--surface2)" }}
                                  onKeyDown={e => {
                                    if (e.key==="Enter" && e.target.value.trim()) {
                                      const updated = history.map((s,i2) => i2===idx ? {...s, incidents:[...(s.incidents||[]),e.target.value.trim()]} : s);
                                      updateRoom(liveRoom.id, { stayHistory: updated });
                                      e.target.value = "";
                                    }
                                  }} />
                                <button style={{ fontSize:10, padding:"4px 8px", borderRadius:5, border:"1px solid var(--border)", background:"transparent", color:"#6b7280", cursor:"pointer" }}
                                  title="Press Enter in the field to add an incident note">⏎</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}

                  {/* ══════════════════════════════════════════
                      TAB: SERVICE REQUESTS
                  ══════════════════════════════════════════ */}
                  {roomDetailTab === "services" && (() => {
                    const requests = liveRoom.serviceRequests || [];
                    const openReqs = requests.filter(r => r.status === "Open");
                    const doneReqs = requests.filter(r => r.status === "Done");
                    const fmtTime = iso => { try { return new Date(iso).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true}); } catch { return "—"; } };
                    return (
                      <div>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                          <div style={{ fontSize:11, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:"0.08em" }}>
                            Service Requests
                          </div>
                          {["Occupied","Checking Out"].includes(liveRoom.status) ? (
                            <button onClick={() => setSvcModal(true)} style={{ padding:"5px 12px", borderRadius:7, border:"1px solid #a07830", background:"rgba(201,168,76,0.08)", color:"#a07830", fontSize:11, fontWeight:700, cursor:"pointer" }}>
                              + New Request
                            </button>
                          ) : (
                            <span style={{ fontSize:11, color:"#9ca3af", fontStyle:"italic" }}>No active guest</span>
                          )}
                        </div>
                        {openReqs.length === 0 && doneReqs.length === 0 ? (
                          <div style={{ textAlign:"center", padding:"24px 0", color:"#9ca3af" }}>
                            <div style={{ fontSize:24, marginBottom:6 }}>🔔</div>
                            <div style={{ fontSize:12 }}>No service requests yet.</div>
                            {["Occupied","Checking Out"].includes(liveRoom.status) && (
                              <button onClick={() => setSvcModal(true)} style={{ marginTop:10, padding:"6px 16px", borderRadius:7, border:"1px solid #a07830", background:"rgba(201,168,76,0.08)", color:"#a07830", fontSize:12, fontWeight:700, cursor:"pointer" }}>Log First Request</button>
                            )}
                          </div>
                        ) : (
                          <>
                            {openReqs.length > 0 && (
                              <div style={{ marginBottom:12 }}>
                                <div style={{ fontSize:10, color:"#ef4444", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>Open ({openReqs.length})</div>
                                {openReqs.map(req => (
                                  <div key={req.id} style={{ display:"flex", gap:10, alignItems:"flex-start", padding:"9px 10px", background:"rgba(239,68,68,0.04)", border:"1px solid rgba(239,68,68,0.15)", borderRadius:7, marginBottom:6 }}>
                                    <div style={{ fontSize:18, lineHeight:1 }}>
                                      {req.type==="Wake-up Call"?"⏰":req.type==="Room Cleaning"?"🧹":req.type==="Maintenance Issue"?"🔧":req.type==="Extra Towels"||req.type==="Extra Pillows"?"🛏":"🔔"}
                                    </div>
                                    <div style={{ flex:1 }}>
                                      <div style={{ fontSize:12, fontWeight:700, color:"#111827" }}>{req.type}</div>
                                      {req.description && <div style={{ fontSize:11, color:"#6b7280", marginTop:1 }}>{req.description}</div>}
                                      <div style={{ fontSize:10, color:"#9ca3af", marginTop:3 }}>
                                        {fmtTime(req.createdAt)} · {req.requestedBy||"Front Desk"} · 
                                        <span style={{ marginLeft:4, padding:"1px 6px", borderRadius:8, fontSize:9, fontWeight:700, background:req.priority==="Urgent"?"#ef4444":req.priority==="High"?"#f59e0b":"rgba(0,0,0,0.08)", color:req.priority==="Urgent"||req.priority==="High"?"#fff":"#6b7280" }}>{req.priority}</span>
                                      </div>
                                    </div>
                                    <button onClick={() => {
                                      const updated = (liveRoom.serviceRequests||[]).map(r => r.id===req.id ? {...r, status:"Done", completedAt:new Date().toISOString()} : r);
                                      updateRoom(liveRoom.id, { serviceRequests: updated });
                                      addLog("Service request completed: "+req.type+" for Room "+liveRoom.number, "edit");
                                    }} style={{ padding:"5px 10px", borderRadius:6, border:"1px solid rgba(34,197,94,0.4)", background:"rgba(34,197,94,0.08)", color:"#16a34a", fontSize:11, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap" }}>
                                      ✓ Done
                                    </button>
                                  </div>
                                ))}
                              </div>
                            )}
                            {doneReqs.length > 0 && (
                              <div>
                                <div style={{ fontSize:10, color:"#22c55e", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>Completed ({doneReqs.length})</div>
                                {doneReqs.slice(0,5).map(req => (
                                  <div key={req.id} style={{ display:"flex", gap:8, alignItems:"center", padding:"7px 10px", background:"rgba(0,0,0,0.02)", border:"1px solid rgba(0,0,0,0.06)", borderRadius:7, marginBottom:4, opacity:0.7 }}>
                                    <span style={{ fontSize:14 }}>✓</span>
                                    <div style={{ flex:1 }}>
                                      <div style={{ fontSize:11, fontWeight:600, color:"#374151" }}>{req.type}</div>
                                      <div style={{ fontSize:10, color:"#9ca3af" }}>{fmtTime(req.createdAt)} → {fmtTime(req.completedAt)}</div>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </>
                        )}
                      </div>
                    );
                  })()}

                  {/* ══════════════════════════════════════════
                      TAB: MAINTENANCE
                  ══════════════════════════════════════════ */}
                  {roomDetailTab === "maint" && (() => {
                    const openM  = (liveRoom.maintenanceLogs||[]).filter(l => l.status === "Open");
                    const closedM = (liveRoom.maintenanceLogs||[]).filter(l => l.status === "Closed");
                    const fmtTs = iso => { try { const d=new Date(iso); return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true}); } catch { return "—"; } };
                    const prioColor = p => p==="High"?"#dc2626":p==="Low"?"#6b7280":"#d97706";
                    const prioBorder = p => p==="High"?"#fecaca":p==="Low"?"#e2e8f0":"#fcd34d";
                    const prioBg = p => p==="High"?"#fef2f2":p==="Low"?"#f8fafc":"#fffbeb";
                    return (
                      <div>
                        {/* Header row: last cleaned + DND + log new */}
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                          <div>
                            <div style={{ fontSize:11, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:"0.08em" }}>
                              Maintenance Logs
                            </div>
                            {liveRoom.lastCleaned && (
                              <div style={{ fontSize:10, color:"#22c55e", marginTop:3 }}>
                                ✓ Last cleaned: {fmtTs(liveRoom.lastCleaned)}
                              </div>
                            )}
                          </div>
                          <div style={{ display:"flex", gap:6 }}>
                            {/* DND Toggle — Bug 2 fix */}
                            <button
                              onClick={() => {
                                const next = !liveRoom.dnd;
                                updateRoom(liveRoom.id, { dnd: next });
                                addLog(`Room ${liveRoom.number} DND ${next ? "activated" : "cleared"}`, "edit");
                              }}
                              title={liveRoom.dnd ? "Clear Do Not Disturb" : "Activate Do Not Disturb"}
                              style={{ padding:"5px 10px", borderRadius:7, fontSize:11, fontWeight:700, cursor:"pointer",
                                border:`1px solid ${liveRoom.dnd?"rgba(239,68,68,0.5)":"rgba(0,0,0,0.12)"}`,
                                background: liveRoom.dnd?"rgba(239,68,68,0.1)":"transparent",
                                color: liveRoom.dnd?"#dc2626":"#6b7280" }}>
                              {liveRoom.dnd ? "🚫 DND On" : "🔔 DND Off"}
                            </button>
                            <button onClick={() => setMaintModal(true)}
                              style={{ padding:"5px 10px", borderRadius:7, border:"1px solid #ef4444", background:"rgba(239,68,68,0.08)", color:"#dc2626", fontSize:11, fontWeight:700, cursor:"pointer" }}>
                              + Log Issue
                            </button>
                          </div>
                        </div>

                        {/* Cleaning priority selector — Bug 3 fix */}
                        <div style={{ marginBottom:14, padding:"10px 12px", background:"rgba(245,158,11,0.04)", border:"1px solid rgba(245,158,11,0.2)", borderRadius:8 }}>
                          <div style={{ fontSize:10, color:"#d97706", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>🧹 Cleaning Priority</div>
                          <div style={{ display:"flex", gap:6 }}>
                            {["Normal","High","Deep Clean"].map(p => (
                              <button key={p} onClick={() => {
                                  updateRoom(liveRoom.id, { cleaningPriority: p });
                                  addLog(`Room ${liveRoom.number} cleaning priority → ${p}`, "edit");
                                }}
                                style={{ flex:1, padding:"6px 0", borderRadius:6, fontWeight:700, fontSize:11, cursor:"pointer",
                                  border:`1px solid ${liveRoom.cleaningPriority===p?"rgba(245,158,11,0.5)":"rgba(0,0,0,0.1)"}`,
                                  background: liveRoom.cleaningPriority===p?"rgba(245,158,11,0.15)":"transparent",
                                  color: liveRoom.cleaningPriority===p?"#b45309":"#6b7280" }}>
                                {p}
                              </button>
                            ))}
                          </div>
                          {liveRoom.cleaningNote && <div style={{ fontSize:10, color:"#6b7280", marginTop:6 }}>📝 {liveRoom.cleaningNote}</div>}
                        </div>

                        {/* Open issues */}
                        {openM.length === 0 && closedM.length === 0 ? (
                          <div style={{ textAlign:"center", padding:"32px 0", color:"#9ca3af" }}>
                            <div style={{ fontSize:28, marginBottom:8 }}>✅</div>
                            <div style={{ fontSize:12, fontWeight:600, color:"#374151" }}>No maintenance issues</div>
                            <div style={{ fontSize:11, marginTop:4 }}>Room is in good condition.</div>
                          </div>
                        ) : (
                          <>
                            {openM.length > 0 && (
                              <div style={{ marginBottom:14 }}>
                                <div style={{ fontSize:10, color:"#ef4444", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>Open ({openM.length})</div>
                                {openM.map(log => (
                                  <div key={log.id} style={{ marginBottom:8, padding:"10px 12px", background:prioBg(log.priority), border:`1px solid ${prioBorder(log.priority)}`, borderLeft:`3px solid ${prioColor(log.priority)}`, borderRadius:8 }}>
                                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                                      <div style={{ flex:1 }}>
                                        <div style={{ fontSize:12, fontWeight:700, color:"#111827" }}>{log.issue}</div>
                                        {log.notes && <div style={{ fontSize:11, color:"#6b7280", marginTop:2, lineHeight:1.4 }}>{log.notes}</div>}
                                        <div style={{ display:"flex", gap:10, fontSize:10, color:"#9ca3af", marginTop:4, flexWrap:"wrap" }}>
                                          {log.date && <span>📅 {fmtTs(log.date)}</span>}
                                          {log.assignedTo && <span>🔧 {log.assignedTo}</span>}
                                          <span style={{ padding:"1px 6px", borderRadius:4, background:prioBg(log.priority), color:prioColor(log.priority), fontWeight:700 }}>{log.priority}</span>
                                          {liveRoom.status === "Occupied" && <span style={{ color:"#3b82f6", fontWeight:600 }}>⚠ Guest in room</span>}
                                        </div>
                                      </div>
                                      {/* ✓ Resolve button — Bug 1 fix */}
                                      <button
                                        onClick={() => {
                                          const updated = (liveRoom.maintenanceLogs||[]).map(l =>
                                            l.id === log.id ? { ...l, status:"Closed", closedAt:new Date().toISOString() } : l
                                          );
                                          const stillOpen = updated.filter(l => l.status === "Open").length;
                                          // Auto-transition room: if no more open issues AND room is Maintenance, move to Dirty
                                          const patch = { maintenanceLogs: updated };
                                          if (stillOpen === 0 && liveRoom.status === "Maintenance") {
                                            patch.status = "Dirty";
                                            const entry = { id:Date.now(), from:"Maintenance", to:"Dirty", note:"Last maintenance issue resolved — ready for housekeeping", timestamp:new Date().toISOString(), changedBy:"Front Desk" };
                                            patch.statusLog = [...(liveRoom.statusLog||[]), entry];
                                          }
                                          updateRoom(liveRoom.id, patch);
                                          addLog(`Maintenance resolved: "${log.issue}" — Room ${liveRoom.number}${stillOpen===0&&liveRoom.status==="Maintenance"?" · Room moved to Dirty":""}`, "edit");
                                        }}
                                        style={{ padding:"5px 10px", borderRadius:6, border:"1px solid rgba(34,197,94,0.4)", background:"rgba(34,197,94,0.08)", color:"#16a34a", fontSize:11, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap" }}>
                                        ✓ Resolve
                                      </button>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                            {closedM.length > 0 && (
                              <div>
                                <div style={{ fontSize:10, color:"#22c55e", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>Resolved ({closedM.length})</div>
                                {closedM.slice(0,5).map(log => (
                                  <div key={log.id} style={{ display:"flex", gap:8, alignItems:"flex-start", padding:"8px 10px", background:"rgba(0,0,0,0.02)", border:"1px solid rgba(0,0,0,0.06)", borderRadius:7, marginBottom:4, opacity:0.7 }}>
                                    <span style={{ fontSize:14, marginTop:1 }}>✅</span>
                                    <div style={{ flex:1 }}>
                                      <div style={{ fontSize:11, fontWeight:600, color:"#374151" }}>{log.issue}</div>
                                      <div style={{ fontSize:10, color:"#9ca3af" }}>
                                        Opened {fmtTs(log.date)}{log.closedAt ? ` · Resolved ${fmtTs(log.closedAt)}` : ""}
                                      </div>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </>
                        )}
                      </div>
                    );
                  })()}

                  {/* ══════════════════════════════════════════
                      TAB: UPGRADE / MOVE HISTORY
                  ══════════════════════════════════════════ */}
                  {roomDetailTab === "upgrades" && (() => {
                    const history = liveRoom.upgradeHistory || [];
                    const moveTypeColor = t => t==="Upgrade"?"#a07830":t==="Downgrade"?"#6b7280":"#3b82f6";
                    const moveTypeBg   = t => t==="Upgrade"?"rgba(201,168,76,0.1)":t==="Downgrade"?"rgba(107,114,128,0.1)":"rgba(59,130,246,0.08)";
                    return (
                      <div>
                        <div style={{ fontSize:11, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:12 }}>
                          Room Move & Upgrade History · {history.length} records
                        </div>
                        {history.length === 0 ? (
                          <div style={{ textAlign:"center", padding:"32px 0", color:"#9ca3af" }}>
                            <div style={{ fontSize:28, marginBottom:8 }}>⬆</div>
                            <div style={{ fontSize:12 }}>No room moves recorded yet.</div>
                            <div style={{ fontSize:11, marginTop:4 }}>Upgrades, downgrades and lateral moves appear here.</div>
                          </div>
                        ) : history.map((entry, idx) => (
                          <div key={entry.id || idx} style={{ marginBottom:10, padding:"10px 12px", background:moveTypeBg(entry.moveType), border:`1px solid ${moveTypeColor(entry.moveType)}33`, borderRadius:8 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                              <span style={{ fontSize:11, fontWeight:800, color:moveTypeColor(entry.moveType), padding:"2px 8px", borderRadius:10, background:moveTypeBg(entry.moveType), border:`1px solid ${moveTypeColor(entry.moveType)}44` }}>
                                {entry.moveType==="Upgrade"?"⬆":entry.moveType==="Downgrade"?"⬇":"↔"} {entry.moveType}
                              </span>
                              <span style={{ fontSize:10, color:"#9ca3af" }}>{entry.date ? new Date(entry.date).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—"}</span>
                            </div>
                            <div style={{ fontSize:13, fontWeight:700, color:"#111827", marginBottom:3 }}>{entry.guest}</div>
                            <div style={{ fontSize:12, color:"#374151", marginBottom:4 }}>
                              Room <strong>{entry.fromRoom}</strong> ({entry.fromType}) → Room <strong>{entry.toRoom}</strong> ({entry.toType})
                            </div>
                            {entry.rateAdjust !== 0 && (
                              <div style={{ fontSize:11, color:entry.rateAdjust>0?"#a07830":"#22c55e", marginBottom:3 }}>
                                {entry.rateAdjust>0?"⬆ Supplement":"⬇ Credit"}: ₹{rupees(Math.abs(entry.rateAdjust))}
                              </div>
                            )}
                            {entry.reason && <div style={{ fontSize:11, color:"#6b7280" }}>📝 {entry.reason}</div>}
                            {entry.authorizedBy && <div style={{ fontSize:10, color:"#9ca3af", marginTop:2 }}>Authorized by: {entry.authorizedBy}</div>}
                            <div style={{ fontSize:10, color:"#9ca3af", marginTop:2 }}>Reservation: {entry.resId}</div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}

                  {/* ══════════════════════════════════════════
                      TAB: NOTES
                  ══════════════════════════════════════════ */}
                  {roomDetailTab === "notes" && (() => {
                    const roomNotes = liveRoom.notes || "";
                    const hkNote = liveRoom.housekeepingNote || "";
                    const statusLog = [...(liveRoom.statusLog || [])].reverse(); // newest first
                    const statusMeta = {
                      "Available":    { color:"#16a34a", bg:"#f0fdf4", border:"#bbf7d0", icon:"✓" },
                      "Dirty":        { color:"#d97706", bg:"#fffbeb", border:"#fcd34d", icon:"🧹" },
                      "Occupied":     { color:"#3b82f6", bg:"#eff6ff", border:"#bfdbfe", icon:"🛏" },
                      "Checking Out": { color:"#a855f7", bg:"#faf5ff", border:"#e9d5ff", icon:"↩" },
                      "Maintenance":  { color:"#ef4444", bg:"#fef2f2", border:"#fecaca", icon:"🔧" },
                      "Blocked":      { color:"#6366f1", bg:"#eef2ff", border:"#c7d2fe", icon:"🔒" },
                    };
                    const fmtTs = ts => {
                      const d = new Date(ts);
                      return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) + " · " +
                             d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});
                    };
                    return (
                      <div style={{ display:"flex", flexDirection:"column", gap:16 }}>

                        {/* Internal Room Notes */}
                        <div>
                          <div style={{ fontSize:10, color:"#374151", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>Internal Room Notes</div>
                          <textarea
                            value={roomNotes}
                            onChange={e => updateRoom(liveRoom.id, { notes: e.target.value })}
                            placeholder="e.g. Squeaky bed, window latch broken, VIP preferences, room quirks..."
                            rows={4}
                            style={{ width:"100%", padding:"10px 12px", fontSize:12, border:"1px solid #e2e8f0", borderRadius:8, background:"#fff", color:"#111827", outline:"none", resize:"vertical", fontFamily:"inherit", boxSizing:"border-box", lineHeight:1.6 }}
                          />
                          <div style={{ fontSize:10, color:"#9ca3af", marginTop:4 }}>Saved automatically as you type.</div>
                        </div>

                        {/* Housekeeping Note */}
                        <div>
                          <div style={{ fontSize:10, color:"#d97706", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>🧹 Housekeeping Note</div>
                          <textarea
                            value={hkNote}
                            onChange={e => updateRoom(liveRoom.id, { housekeepingNote: e.target.value })}
                            placeholder="e.g. Deep clean required, guest left stains, extra towels needed..."
                            rows={2}
                            style={{ width:"100%", padding:"10px 12px", fontSize:12, border:"1px solid #fcd34d", borderRadius:8, background:"#fffbeb", color:"#111827", outline:"none", resize:"vertical", fontFamily:"inherit", boxSizing:"border-box" }}
                          />
                        </div>

                        {/* Status Change Timeline */}
                        <div>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                            <div style={{ fontSize:10, color:"#374151", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em" }}>
                              📋 Status Change Log
                            </div>
                            <div style={{ fontSize:10, color:"#9ca3af" }}>{statusLog.length} entr{statusLog.length===1?"y":"ies"}</div>
                          </div>
                          {statusLog.length === 0 ? (
                            <div style={{ padding:"16px", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:8, textAlign:"center" }}>
                              <div style={{ fontSize:12, color:"#9ca3af" }}>No status changes recorded yet.</div>
                              <div style={{ fontSize:11, color:"#d1d5db", marginTop:3 }}>Changes will appear here once you update the room status.</div>
                            </div>
                          ) : (
                            <div style={{ position:"relative" }}>
                              {/* Timeline line */}
                              <div style={{ position:"absolute", left:15, top:8, bottom:8, width:2, background:"#e2e8f0", zIndex:0 }} />
                              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                                {statusLog.map((entry, idx) => {
                                  const toMeta   = statusMeta[entry.to]   || { color:"#6b7280", bg:"#f8fafc", border:"#e2e8f0", icon:"•" };
                                  const fromMeta = statusMeta[entry.from] || { color:"#9ca3af", bg:"#f8fafc", border:"#e2e8f0", icon:"•" };
                                  return (
                                    <div key={entry.id || idx} style={{ display:"flex", gap:10, alignItems:"flex-start", position:"relative", zIndex:1 }}>
                                      {/* Timeline dot */}
                                      <div style={{ width:18, height:18, borderRadius:"50%", background:toMeta.bg, border:`2px solid ${toMeta.border}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:9, marginTop:2 }}>
                                        {toMeta.icon}
                                      </div>
                                      {/* Entry card */}
                                      <div style={{ flex:1, background:idx===0?toMeta.bg:"#f8fafc", border:`1px solid ${idx===0?toMeta.border:"#e2e8f0"}`, borderRadius:8, padding:"8px 12px" }}>
                                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:entry.note?4:0 }}>
                                          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                                            {entry.from && (
                                              <>
                                                <span style={{ fontSize:11, color:fromMeta.color, fontWeight:600 }}>{entry.from}</span>
                                                <span style={{ fontSize:10, color:"#9ca3af" }}>→</span>
                                              </>
                                            )}
                                            <span style={{ fontSize:11, color:toMeta.color, fontWeight:700 }}>{entry.to}</span>
                                            {idx===0 && <span style={{ fontSize:9, background:toMeta.color, color:"#fff", borderRadius:4, padding:"1px 5px" }}>Latest</span>}
                                          </div>
                                          <div style={{ fontSize:10, color:"#9ca3af", textAlign:"right" }}>
                                            <div>{fmtTs(entry.timestamp)}</div>
                                            <div style={{ marginTop:1 }}>{entry.changedBy}</div>
                                          </div>
                                        </div>
                                        {entry.note && (
                                          <div style={{ fontSize:11, color:"#374151", background:"rgba(0,0,0,0.03)", borderRadius:5, padding:"4px 8px", marginTop:4, lineHeight:1.5 }}>
                                            "{entry.note}"
                                          </div>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>

                        {/* Maintenance note if active */}
                        {liveRoom.maintenanceLogs && liveRoom.maintenanceLogs.length > 0 && (
                          <div>
                            <div style={{ fontSize:10, color:"#ef4444", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>🔧 Last Maintenance Entry</div>
                            {(() => {
                              const last = liveRoom.maintenanceLogs[liveRoom.maintenanceLogs.length - 1];
                              return (
                                <div style={{ padding:"10px 12px", background:"#fef2f2", border:"1px solid #fecaca", borderRadius:8 }}>
                                  <div style={{ fontSize:12, color:"#111827", fontWeight:600 }}>{last.issue}</div>
                                  <div style={{ fontSize:11, color:"#6b7280", marginTop:3 }}>{last.notes}</div>
                                  <div style={{ fontSize:10, color:"#9ca3af", marginTop:4 }}>{last.date} · {last.reportedBy}</div>
                                </div>
                              );
                            })()}
                          </div>
                        )}

                      </div>
                    );
                  })()}

                </div>
              </div>
            );
          })() : (
            <div className="card" style={{ textAlign: "center", padding: "40px 20px" }}>
              <div style={{ fontSize: 32, marginBottom: 12 }}>🏨</div>
              <div style={{ color: "#6b7280", fontSize: 14 }}>Select a room to view details, manage status, and track maintenance</div>
            </div>
          )}
        </div>
      </div>



      {/* ── SERVICE REQUEST MODAL ── */}
      {svcModal && selected && (() => {
        const liveRoom = rooms.find(r => r.id === selected.id) || selected;
        return (
          <div className="modal-overlay" onClick={() => setSvcModal(false)}>
            <div className="modal" style={{ maxWidth:420 }} onClick={e=>e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">🔔 Log Service Request — Room {liveRoom.number}</div>
                <button className="modal-close" onClick={() => setSvcModal(false)}>✕</button>
              </div>
              <div className="modal-body">
                <div className="form-group">
                  <label>Request Type *</label>
                  <select value={svcForm.type} onChange={e=>setSvcForm({...svcForm,type:e.target.value})}>
                    {SERVICE_TYPES.map(t=><option key={t}>{t}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Description / Details</label>
                  <textarea rows={2} placeholder="e.g. Wake up at 6:00 AM, need 2 extra bath towels..." value={svcForm.description} onChange={e=>setSvcForm({...svcForm,description:e.target.value})} style={{ resize:"vertical" }} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                  <div className="form-group" style={{ marginBottom:0 }}>
                    <label>Priority</label>
                    <select value={svcForm.priority} onChange={e=>setSvcForm({...svcForm,priority:e.target.value})}>
                      {["Normal","High","Urgent"].map(p=><option key={p}>{p}</option>)}
                    </select>
                  </div>
                  <div className="form-group" style={{ marginBottom:0 }}>
                    <label>Requested By</label>
                    <input placeholder="Guest / Front Desk..." value={svcForm.requestedBy} onChange={e=>setSvcForm({...svcForm,requestedBy:e.target.value})} />
                  </div>
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={() => setSvcModal(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={() => {
                  const newReq = {
                    id: "SVC-"+Date.now(), type:svcForm.type, description:svcForm.description,
                    priority:svcForm.priority, requestedBy:svcForm.requestedBy||"Front Desk",
                    status:"Open", createdAt:new Date().toISOString(), completedAt:null,
                  };
                  updateRoom(liveRoom.id, { serviceRequests:[newReq,...(liveRoom.serviceRequests||[])] });
                  addLog("Service request logged: "+svcForm.type+" for Room "+liveRoom.number+(svcForm.requestedBy?" by "+svcForm.requestedBy:""), "edit");
                  setSvcModal(false);
                  setSvcForm({ type:"Extra Towels", description:"", priority:"Normal", requestedBy:"" });
                  setRoomDetailTab("services");
                }}>
                  ✓ Log Request
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── BLOCK ROOMS MODAL ── */}
      {blockModal && (
        <div className="modal-overlay" onClick={() => { setBlockModal(false); setBlockConflicts([]); setBlockConflictAcked(false); }}>
          <div className="modal" style={{ maxWidth:420 }} onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{(() => {
                const toBlock  = [...blockedRooms].filter(id=>rooms.find(r=>r.id===id&&r.status!=="Blocked")).length;
                const toExtend = [...blockedRooms].filter(id=>rooms.find(r=>r.id===id&&r.status==="Blocked")).length;
                if (toBlock>0&&toExtend===0) return `🔒 Block ${toBlock} Room${toBlock!==1?"s":""}`;
                if (toExtend>0&&toBlock===0) return `📅 Extend ${toExtend} Block${toExtend!==1?"s":""}`;
                return `🔒 Block ${toBlock} + 📅 Extend ${toExtend}`;
              })()}</div>
              <button className="modal-close" onClick={() => setBlockModal(false)}>✕</button>
            </div>
            {(() => {
              const ids          = [...blockedRooms];
              const toBlockIds   = ids.filter(id => { const r=rooms.find(x=>x.id===id); return r && r.status !== "Blocked"; });
              const toActOnIds   = ids.filter(id => { const r=rooms.find(x=>x.id===id); return r && r.status === "Blocked"; });
              const hasNewBlocks = toBlockIds.length > 0;
              const hasBlocked   = toActOnIds.length > 0;
              // releaseEarly flag reused from blockForm
              const isRelease    = hasBlocked && !hasNewBlocks && blockForm.releaseEarly;
              const accentC      = isRelease ? "#d97706" : "#dc2626";
              const accentBg     = isRelease ? "rgba(245,158,11,0.08)" : "rgba(239,68,68,0.06)";
              return (
                <>
                  <div className="modal-body">
                    {/* Room summary chips */}
                    <div style={{ marginBottom:12, padding:"10px 12px", background:accentBg, borderRadius:8, fontSize:12, color:accentC }}>
                      {hasNewBlocks && <div>🔒 <strong>To Block:</strong> {toBlockIds.map(id=>rooms.find(r=>r.id===id)?.number).filter(Boolean).join(", ")}</div>}
                      {hasBlocked   && <div style={{ marginTop: hasNewBlocks?4:0 }}>{isRelease?"✂":"📅"} <strong>{isRelease?"To Release Early:":"To Extend:"}</strong> {toActOnIds.map(id=>rooms.find(r=>r.id===id)?.number).filter(Boolean).join(", ")}</div>}
                    </div>

                    {/* Extend vs Release Early toggle — only shown when selection is all-Blocked */}
                    {hasBlocked && !hasNewBlocks && (
                      <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                        {[{val:false,icon:"📅",label:"Extend Block"},{val:true,icon:"✂",label:"Release Early"}].map(opt => (
                          <button key={String(opt.val)} onClick={() => setBlockForm(f=>({...f, releaseEarly:opt.val}))}
                            style={{ flex:1, padding:"8px 0", borderRadius:8, fontWeight:700, fontSize:12, cursor:"pointer",
                              border:`1.5px solid ${blockForm.releaseEarly===opt.val ? (opt.val?"#d97706":"#6366f1") : "rgba(0,0,0,0.12)"}`,
                              background: blockForm.releaseEarly===opt.val ? (opt.val?"rgba(245,158,11,0.1)":"rgba(99,102,241,0.1)") : "#fff",
                              color: blockForm.releaseEarly===opt.val ? (opt.val?"#d97706":"#6366f1") : "#6b7280" }}>
                            {opt.icon} {opt.label}
                          </button>
                        ))}
                      </div>
                    )}

                    {/* Reason */}
                    <div className="form-group">
                      <label>{isRelease ? "Reason for Early Release" : "Reason"}{hasNewBlocks ? " *" : " (optional)"}</label>
                      <input placeholder={isRelease ? "e.g. Renovation completed ahead of schedule" : hasNewBlocks ? "e.g. Deep cleaning, Renovation, VIP hold..." : "e.g. Contractor delayed 2 more days"}
                        value={blockForm.reason} onChange={e=>setBlockForm({...blockForm,reason:e.target.value})} />
                    </div>

                    {/* Date fields */}
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                      {hasNewBlocks && (
                        <div className="form-group">
                          <label>Block From</label>
                          <input type="date" value={blockForm.from} min={today} onChange={e=>setBlockForm({...blockForm,from:e.target.value})} />
                        </div>
                      )}
                      <div className="form-group" style={{ gridColumn: hasNewBlocks ? "auto" : "1 / -1" }}>
                        <label>{isRelease ? "Release On (new end date) *" : hasNewBlocks ? "Block Until" : "Extend Until *"}</label>
                        <input type="date" value={blockForm.to} min={isRelease ? today : (blockForm.from || today)} onChange={e=>setBlockForm({...blockForm,to:e.target.value})} />
                      </div>
                    </div>
                  </div>

                  <div className="modal-footer" style={{ flexDirection:"column", gap:0 }}>
                    {/* Inline conflict acknowledgement — replaces blocked window.confirm */}
                    {blockConflicts.length > 0 && (
                      <div style={{ width:"100%", marginBottom:12, padding:"10px 12px", background:"rgba(239,68,68,0.06)", border:"1px solid rgba(239,68,68,0.3)", borderRadius:8 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:"#dc2626", marginBottom:6 }}>⚠ Active reservation conflict</div>
                        {blockConflicts.map((s,i) => <div key={i} style={{ fontSize:11, color:"#374151", marginBottom:2 }}>• {s}</div>)}
                        <div style={{ fontSize:11, color:"#6b7280", margin:"8px 0 6px" }}>Blocking will <strong>not</strong> automatically cancel these bookings — cancel or reassign them manually.</div>
                        <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:12, color:"#dc2626", fontWeight:600, cursor:"pointer" }}>
                          <input type="checkbox" checked={blockConflictAcked} onChange={e => setBlockConflictAcked(e.target.checked)} style={{ width:"auto", accentColor:"#dc2626" }} />
                          I understand — proceed with block anyway
                        </label>
                      </div>
                    )}
                    <div style={{ display:"flex", gap:8, width:"100%" }}>
                    <button className="btn btn-ghost" onClick={() => { setBlockModal(false); setBlockMode(false); setBlockedRooms(new Set()); setBlockForm({reason:"",from:"",to:"",releaseEarly:false}); setBlockConflicts([]); setBlockConflictAcked(false); }}>Cancel</button>
                    <button className="btn btn-primary"
                      disabled={hasNewBlocks ? (!blockForm.reason.trim() || (blockConflicts.length > 0 && !blockConflictAcked)) : !blockForm.to}
                      style={{ background:accentC, borderColor:accentC, opacity:(hasNewBlocks?(!blockForm.reason.trim()||(blockConflicts.length>0&&!blockConflictAcked)):!blockForm.to)?0.45:1 }}
                      onClick={() => {
                        if (hasNewBlocks && !blockForm.reason.trim()) { alert("Please enter a reason for the block."); return; }
                        // Fix 8: warn if any room being freshly blocked has a future active reservation
                        if (hasNewBlocks) {
                          const conflicts = toBlockIds.flatMap(id => {
                            const room = rooms.find(r => r.id === id);
                            if (!room) return [];
                            return (reservations || []).filter(rv =>
                              rv.room === room.number && rv.bhavan === room.bhavan &&
                              rv.status !== "Cancelled" && rv.status !== "Checked Out" && rv.status !== "No Show" &&
                              rv.checkIn >= (blockForm.from || new Date().toISOString().slice(0,10))
                            ).map(rv => `Rm ${room.number}: ${rv.guest} (${rv.checkIn})`);
                          });
                          if (conflicts.length > 0 && !blockConflictAcked) {
                            setBlockConflicts(conflicts);
                            return; // show inline warning; user must tick acknowledge checkbox
                          }
                        }
                        const now = new Date().toISOString();
                        setRooms(prev => prev.map(r => {
                          if (!ids.includes(r.id)) return r;
                          const alreadyBlocked = r.status === "Blocked";
                          if (!alreadyBlocked) {
                            // Fresh block
                            const entry = { id:Date.now()+Math.random(), from:r.status, to:"Blocked", note:blockForm.reason, timestamp:now, changedBy:"Front Desk" };
                            return { ...r, status:"Blocked", blockedReason:blockForm.reason, blockedFrom:blockForm.from, blockedTo:blockForm.to, statusLog:[...(r.statusLog||[]),entry] };
                          } else if (isRelease) {
                            // Release early
                            const entry = { id:Date.now()+Math.random(), from:"Blocked", to:"Blocked", note:"Block released early: "+(r.blockedTo||"—")+" → "+blockForm.to+(blockForm.reason?" — "+blockForm.reason:""), timestamp:now, changedBy:"Front Desk" };
                            return { ...r, blockedTo:blockForm.to, statusLog:[...(r.statusLog||[]),entry] };
                          } else {
                            // Extend
                            const entry = { id:Date.now()+Math.random(), from:"Blocked", to:"Blocked", note:"Block extended: "+(r.blockedTo||"—")+" → "+blockForm.to+(blockForm.reason?" — "+blockForm.reason:""), timestamp:now, changedBy:"Front Desk" };
                            return { ...r, blockedTo:blockForm.to, blockedReason:blockForm.reason||r.blockedReason, statusLog:[...(r.statusLog||[]),entry] };
                          }
                        }));
                        toBlockIds.forEach(id => { const room=rooms.find(r=>r.id===id); if(room) addLog("Room "+room.number+" blocked: "+blockForm.reason+(blockForm.from?" ("+blockForm.from+" to "+(blockForm.to||"?")+")" :""),"edit"); });
                        toActOnIds.forEach(id => { const room=rooms.find(r=>r.id===id); if(room) addLog("Room "+room.number+(isRelease?" block released early to ":" block extended to ")+(blockForm.to||"—")+(blockForm.reason?" — "+blockForm.reason:""),"edit"); });
                        setBlockModal(false); setBlockMode(false); setBlockedRooms(new Set()); setBlockForm({reason:"",from:"",to:"",releaseEarly:false}); setBlockConflicts([]); setBlockConflictAcked(false);
                      }}>
                      {isRelease ? "✂ Confirm Early Release" : hasNewBlocks ? "🔒 Confirm Block" : "📅 Confirm Extension"}
                    </button>
                    </div>
                  </div>
                </>
              );
            })()}
          </div>
        </div>
      )}

      {/* ── EXTEND / SHORTEN BLOCK MODAL ── */}
      {extendBlockModal && (() => {
        const { roomIds, isBatch } = extendBlockModal;
        const roomNums = roomIds.map(id => rooms.find(r=>r.id===id)?.number).filter(Boolean).join(", ");
        const sample = rooms.find(r => r.id === roomIds[0]);
        const isRelease = extendBlockForm.releaseEarly;
        const accentColor = isRelease ? "#d97706" : "#6366f1";
        const accentBg    = isRelease ? "rgba(245,158,11,0.08)" : "rgba(99,102,241,0.08)";
        const accentBorder= isRelease ? "rgba(245,158,11,0.35)" : "rgba(99,102,241,0.3)";
        return (
          <div className="modal-overlay" onClick={() => setExtendBlockModal(null)}>
            <div className="modal" style={{ maxWidth:420 }} onClick={e=>e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">{isRelease ? "✂ Release Block Early" : "📅 Extend Block"}</div>
                <button className="modal-close" onClick={() => setExtendBlockModal(null)}>✕</button>
              </div>
              <div className="modal-body">
                {/* Room(s) summary */}
                <div style={{ background:accentBg, border:`1px solid ${accentBorder}`, borderRadius:8, padding:"10px 14px", marginBottom:14 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:accentColor, marginBottom:4 }}>
                    {isBatch ? `${roomIds.length} Rooms` : `Room ${roomNums}`}
                    {isBatch && <span style={{ fontWeight:400, color:"#6b7280" }}> — {roomNums}</span>}
                  </div>
                  {sample?.blockedReason && (
                    <div style={{ fontSize:11, color:"#374151" }}>Original reason: <strong>{sample.blockedReason}</strong></div>
                  )}
                  <div style={{ display:"flex", gap:14, marginTop:6 }}>
                    {sample?.blockedFrom && <div style={{ fontSize:11, color:"#6b7280" }}>From: <strong>{sample.blockedFrom}</strong></div>}
                    {sample?.blockedTo   && <div style={{ fontSize:11, color:"#6b7280" }}>Current until: <strong style={{ color:accentColor }}>{sample.blockedTo}</strong></div>}
                  </div>
                </div>

                {/* Toggle: Extend vs Release Early */}
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  {[{ id:false, icon:"📅", label:"Extend Block" }, { id:true, icon:"✂", label:"Release Early" }].map(opt => (
                    <button key={String(opt.id)} onClick={() => setExtendBlockForm(f=>({...f, releaseEarly: opt.id}))}
                      style={{ flex:1, padding:"8px 0", borderRadius:8, fontWeight:700, fontSize:12, cursor:"pointer",
                        border:`1.5px solid ${extendBlockForm.releaseEarly===opt.id ? accentColor : "rgba(0,0,0,0.12)"}`,
                        background: extendBlockForm.releaseEarly===opt.id ? accentBg : "#fff",
                        color: extendBlockForm.releaseEarly===opt.id ? accentColor : "#6b7280" }}>
                      {opt.icon} {opt.label}
                    </button>
                  ))}
                </div>

                {/* New date */}
                <div className="form-group">
                  <label>{isRelease ? "Release On (new end date) *" : "Extend Until (new end date) *"}</label>
                  <input type="date" value={extendBlockForm.newTo}
                    min={today}
                    onChange={e => setExtendBlockForm(f=>({...f, newTo: e.target.value}))} />
                  {sample?.blockedTo && extendBlockForm.newTo && extendBlockForm.newTo === sample.blockedTo && (
                    <div style={{ fontSize:11, color:"#f59e0b", marginTop:4 }}>⚠ Date unchanged — please select a different date.</div>
                  )}
                  {sample?.blockedTo && extendBlockForm.newTo && !isRelease && extendBlockForm.newTo < sample.blockedTo && (
                    <div style={{ fontSize:11, color:"#f59e0b", marginTop:4 }}>⚠ New date is earlier than current end — use Release Early instead.</div>
                  )}
                  {sample?.blockedTo && extendBlockForm.newTo && isRelease && extendBlockForm.newTo > sample.blockedTo && (
                    <div style={{ fontSize:11, color:"#f59e0b", marginTop:4 }}>⚠ New date is later than current end — use Extend Block instead.</div>
                  )}
                </div>

                {/* Reason for change */}
                <div className="form-group">
                  <label>{isRelease ? "Reason for Early Release" : "Reason for Extension"} <span style={{ color:"#9ca3af", fontWeight:400 }}>(optional)</span></label>
                  <input placeholder={isRelease ? "e.g. Renovation completed ahead of schedule" : "e.g. Contractor delayed, 2 more days needed"}
                    value={extendBlockForm.reason}
                    onChange={e => setExtendBlockForm(f=>({...f, reason: e.target.value}))} />
                </div>

                {isBatch && (
                  <div style={{ fontSize:11, color:"#6b7280", background:"rgba(0,0,0,0.03)", borderRadius:7, padding:"8px 10px" }}>
                    ℹ This will update all {roomIds.length} selected blocked rooms simultaneously.
                  </div>
                )}
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={() => setExtendBlockModal(null)}>Cancel</button>
                <button className="btn btn-primary"
                  disabled={!extendBlockForm.newTo || extendBlockForm.newTo === sample?.blockedTo}
                  onClick={applyExtendBlock}
                  style={{ background: isRelease ? "#d97706" : "#6366f1", borderColor: isRelease ? "#d97706" : "#6366f1", color:"#fff",
                    opacity: (!extendBlockForm.newTo || extendBlockForm.newTo === sample?.blockedTo) ? 0.45 : 1 }}>
                  {isRelease ? "✂ Confirm Early Release" : "📅 Confirm Extension"}
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── EDIT ROOM MODAL ── */}
      {editModal && selected && (
        <div className="modal-overlay" onClick={() => setEditModal(false)}>
          <div className="modal" style={{ maxWidth: 480 }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">Edit Room {selected.number}</div>
              <button className="modal-close" onClick={() => setEditModal(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <div className="form-group">
                  <label>Room Type</label>
                  <select value={editForm.type} onChange={(e) => setEditForm({ ...editForm, type: e.target.value })}>
                    {ROOM_TYPES.map((t) => <option key={t}>{t}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Rate per Night (₹)</label>
                  <input type="number" value={editForm.rate} onChange={(e) => setEditForm({ ...editForm, rate: e.target.value })} />
                </div>
                <div className="form-group">
                  <label>Max Occupancy</label>
                  <input type="number" min="1" max="10" value={editForm.maxOcc} onChange={(e) => setEditForm({ ...editForm, maxOcc: e.target.value })} />
                </div>
              </div>
              <div className="form-group">
                <label>Room Notes / Remarks</label>
                <input placeholder="e.g. Corner room, extra quiet, adjacent to elevator..." value={editForm.notes} onChange={(e) => setEditForm({ ...editForm, notes: e.target.value })} />
              </div>
              <div className="form-group">
                <label>Amenities</label>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {ROOM_AMENITIES_LIST.map((a) => (
                    <label key={a.id} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 13, cursor: "pointer", padding: "4px 10px", borderRadius: 6, border: `1px solid ${editForm.amenities?.[a.id] ? "rgba(34,197,94,0.4)" : "var(--border)"}`, background: editForm.amenities?.[a.id] ? "rgba(34,197,94,0.08)" : "transparent" }}>
                      <input type="checkbox" style={{ width: "auto" }} checked={!!(editForm.amenities?.[a.id])} onChange={(e) => setEditForm({ ...editForm, amenities: { ...editForm.amenities, [a.id]: e.target.checked } })} />
                      {a.label}
                    </label>
                  ))}
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setEditModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={saveEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}


      {/* ── ADD MAINTENANCE LOG MODAL ── */}
      {maintModal && selected && (
        <div className="modal-overlay" onClick={() => setMaintModal(false)}>
          <div className="modal" style={{ maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">🔧 Log Maintenance — Room {selected.number}</div>
              <button className="modal-close" onClick={() => setMaintModal(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label>Issue Description *</label>
                <input placeholder="e.g. Leaking tap, broken AC remote, bulb replacement..." value={maintForm.issue} onChange={(e) => setMaintForm({ ...maintForm, issue: e.target.value })} />
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <div className="form-group">
                  <label>Priority</label>
                  <select value={maintForm.priority} onChange={(e) => setMaintForm({ ...maintForm, priority: e.target.value })}>
                    {["Low", "Normal", "High"].map((p) => <option key={p}>{p}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Assign To</label>
                  <input placeholder="Staff name or team" value={maintForm.assignedTo} onChange={(e) => setMaintForm({ ...maintForm, assignedTo: e.target.value })} />
                </div>
              </div>
              <div style={{ fontSize: 12, color: "#6b7280", padding: "8px 0" }}>Room status will automatically be set to <strong>Maintenance</strong>.</div>
              <div className="form-group">
                <label>Notes / Details</label>
                <textarea
                  rows={3}
                  placeholder="Parts needed, access instructions, guest impact, related issues..."
                  value={maintForm.notes}
                  onChange={(e) => setMaintForm({ ...maintForm, notes: e.target.value })}
                  style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--bg-input)", resize: "vertical", color: "var(--text-primary)", fontFamily: "inherit", fontSize: 13, boxSizing: "border-box" }}
                />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setMaintModal(false)}>Cancel</button>
              <button className="btn btn-primary" style={{ background: "#ef4444", borderColor: "#ef4444" }} onClick={addMaintLog} disabled={!maintForm.issue.trim()}>Log Issue</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── INVOICE GENERATOR ─────────────────────────────────────────────────────
function printInvoice(r) {
  // ── Core calculations ────────────────────────────────────────────────────
  const checkInDate  = r.checkIn  ? new Date(r.checkIn)  : new Date();
  const checkOutDate = r.checkOut ? new Date(r.checkOut) : new Date();
  const nights       = Math.max(1, Math.round((checkOutDate - checkInDate) / 86400000));
  const rate         = getRoomRate(r.bhavan, r.type, r.room);

  const folio         = r.folio || [];
  // Exclude voided charges and void-reversal lines from the customer-facing invoice.
  // Voided items are internal audit records only; the guest invoice shows live (payable) charges.
  const extraCharges  = folio.filter(f => f.amount > 0 && !f.voided && !f.isVoidReversal && !f.desc.startsWith("Room") && !f.isTip);
  const discountLines = folio.filter(f => f.amount < 0 && !f.voided && !f.isVoidReversal && f.desc.toLowerCase().startsWith("discount"));
  const paymentLines  = folio.filter(f => f.amount < 0 && !f.isVoidReversal && (f.desc.startsWith("Advance") || f.desc.startsWith("Payment")));

  const roomSubtotal   = nights * rate;
  const extraTotal     = extraCharges.reduce((s, f) => s + f.amount, 0);
  const totalDiscount  = discountLines.reduce((s, f) => s + Math.abs(f.amount), 0);
  const grandTotal     = Math.round((roomSubtotal + extraTotal - totalDiscount) * 100) / 100;
  const totalPaid      = Math.round((r.paid || 0) * 100) / 100;
  const balance        = Math.max(0, Math.round((grandTotal - totalPaid) * 100) / 100);
  const isPaid         = balance <= 0;
  const isPartial      = !isPaid && totalPaid > 0;

  // ── Amount in Words (mandatory on Indian invoices) ────────────────────────
  function amountInWords(n) {
    const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine",
      "Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
    const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
    function belowHundred(x) {
      return x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x%10 ? " " + ones[x%10] : "");
    }
    function belowThousand(x) {
      return x >= 100
        ? ones[Math.floor(x/100)] + " Hundred" + (x%100 ? " " + belowHundred(x%100) : "")
        : belowHundred(x);
    }
    const [rupees, paiseRaw] = n.toFixed(2).split(".").map(Number);
    const paise = paiseRaw;
    if (rupees === 0 && paise === 0) return "Zero Rupees Only";
    const parts = [];
    const cr  = Math.floor(rupees / 10000000); const rem1 = rupees % 10000000;
    const lac = Math.floor(rem1 / 100000);     const rem2 = rem1 % 100000;
    const th  = Math.floor(rem2 / 1000);       const rem3 = rem2 % 1000;
    const hun = rem3;
    if (cr)  parts.push(belowThousand(cr) + " Crore");
    if (lac) parts.push(belowThousand(lac) + " Lakh");
    if (th)  parts.push(belowThousand(th) + " Thousand");
    if (hun) parts.push(belowThousand(hun));
    let result = "Rupees " + parts.join(" ");
    if (paise > 0) result += " and " + belowHundred(paise) + " Paise";
    return result + " Only";
  }

  // ── Formatting helpers ───────────────────────────────────────────────────
  const fmt        = n  => `&#8377;${Math.abs(n).toLocaleString("en-IN", { minimumFractionDigits: 2 })}`;
  const fmtDate    = d  => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
  const fmtTime    = d  => d ? new Date(d).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true }) : "";
  const fmtDT      = d  => d ? `${fmtDate(d)}, ${fmtTime(d)}` : "—";

  // ── Invoice metadata ─────────────────────────────────────────────────────
  const now            = new Date();
  const fy             = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1;
  const fyStr          = `${fy}-${String(fy + 1).slice(-2)}`;
  const invoiceNo      = `DJJS/${fyStr}/${r.id}`;
  const folioNo        = `FOL-${r.id}`;
  const invoiceDateStr = fmtDate(now);
  const invoiceTimeStr = fmtTime(now);

  // ── Folio charge rows ─────────────────────────────────────────────────────
  const roomRows = `
    <tr>
      <td>${fmtDate(r.checkIn)} – ${fmtDate(r.checkOut)}</td>
      <td>
        <strong>Room Accommodation</strong>
        <div style="font-size:10px;color:#6b7280;margin-top:2px;">${r.type} Room &mdash; ${r.bhavan}</div>
      </td>
      <td class="c">${nights}</td>
      <td class="r">${fmt(rate)}</td>
      <td class="r bold">${fmt(roomSubtotal)}</td>
    </tr>`;

  const extraRows = extraCharges.map(f => `
    <tr style="background:#fafafa;">
      <td style="color:#6b7280;font-size:10.5px;">${f.date ? fmtDate(f.date) : "—"}</td>
      <td>${f.desc}</td>
      <td class="c">1</td>
      <td class="r">${fmt(f.amount)}</td>
      <td class="r bold">${fmt(f.amount)}</td>
    </tr>`).join("");

  const discountRow = totalDiscount > 0 ? `
    <tr style="background:#f0fdf4;">
      <td colspan="4" style="color:#059669;">Discount Applied</td>
      <td class="r" style="color:#059669;font-weight:700;">&#8722; ${fmt(totalDiscount)}</td>
    </tr>` : "";

  // Badge
  const badgeBg    = isPaid ? "#d1fae5" : isPartial ? "#fef3c7" : "#fee2e2";
  const badgeColor = isPaid ? "#065f46" : isPartial ? "#92400e" : "#991b1b";
  const badgeText  = isPaid ? "&#10004; PAID IN FULL" : isPartial ? "&#11044; PARTIALLY PAID" : "&#9679; PAYMENT DUE";

  // Early departure flag
  const origCheckOut = r._origCheckOut;
  const isEarlyDeparture = origCheckOut && origCheckOut !== r.checkOut;

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tax Invoice ${invoiceNo}</title>
<style>

  body{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;color:#111827;background:#f3f4f6;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .page{max-width:800px;margin:0 auto;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,0.12);}
  .page-inner{padding:32px 36px;}

  /* toolbar */
  .toolbar{display:none;}

  /* letterhead */
  .lh{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;border-bottom:3px solid #c9a84c;margin-bottom:16px;}
  .lh-logo{width:56px;height:56px;border-radius:10px;background:#c9a84c;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:8px;}
  .prop-name{font-size:19px;font-weight:800;color:#c9a84c;letter-spacing:0.03em;}
  .prop-sub{font-size:11px;color:#4b5563;font-weight:600;margin-top:2px;}
  .prop-addr{font-size:10.5px;color:#6b7280;line-height:1.75;margin-top:5px;}
  .prop-reg{font-size:9.5px;color:#9ca3af;margin-top:8px;line-height:1.8;letter-spacing:0.02em;}
  .inv-block{text-align:right;}
  .inv-title{font-size:28px;font-weight:900;color:#111827;letter-spacing:0.12em;text-transform:uppercase;}
  .inv-copy{font-size:9.5px;color:#9ca3af;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
  .inv-tbl{margin-left:auto;margin-top:12px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;min-width:240px;}
  .inv-tbl tr:last-child td{border-bottom:none;}
  .inv-tbl td{padding:5px 12px;font-size:11px;border-bottom:1px solid #f3f4f6;}
  .inv-tbl td:first-child{color:#6b7280;font-weight:500;white-space:nowrap;}
  .inv-tbl td:last-child{font-weight:700;color:#111827;text-align:right;}

  /* status bar */
  .status-bar{display:flex;align-items:center;justify-content:space-between;border-radius:8px;padding:10px 16px;margin-bottom:16px;border:1px solid #e5e7eb;background:#f9fafb;}
  .badge{padding:5px 16px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:0.07em;}

  /* info panels */
  .info-band{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:16px;overflow:hidden;}

  /* footer */
