                </div>

              </div>
            </div>
          </div>
        );
      })()}

      {/* ── QUICK COLLECT PAYMENT MODAL ── */}

      {/* ── RECORD PAYMENT MODAL (from checkout flow) ── */}
      {modal === "pay" && payTargetId && (() => {
        const res = reservations.find(r => r.id === payTargetId);
        if (!res) return null;
        const balanceDue      = Math.round(((res.total||0) - (res.paid||0)) * 100) / 100;
        const discAmt         = Math.round((parseFloat(payForm.discount) || 0) * 100) / 100;
        const tipAmt          = Math.round((parseFloat(payForm.tip)      || 0) * 100) / 100;
        const adjustedBalance = Math.max(0, Math.round((balanceDue - discAmt) * 100) / 100);
        const totalDue        = Math.round((adjustedBalance + tipAmt) * 100) / 100;
        const validSplits     = payForm.splits.filter(s => parseFloat(s.amount) > 0);
        const totalEntered    = Math.round(payForm.splits.reduce((s,sp) => s + (parseFloat(sp.amount)||0), 0) * 100) / 100;
        const isOverpay       = totalEntered > totalDue + 0.001;
        const isFull          = totalEntered >= totalDue - 0.001 && totalEntered > 0;
        const isValid         = validSplits.length > 0 && !isOverpay;
        const balanceAfter    = Math.max(0, Math.round((totalDue - totalEntered) * 100) / 100);

        const METHODS = [
          { id: "UPI",          icon: "📲", refLabel: "UPI Transaction ID",      refRequired: true,  extraLabel: null },
          { id: "Cash",         icon: "💵", refLabel: "Receipt No.",             refRequired: false, extraLabel: "Denomination / Remarks" },
          { id: "Card",         icon: "💳", refLabel: "Approval / Auth Code",    refRequired: true,  extraLabel: "Last 4 Digits · Card Type" },
          { id: "Bank Transfer",icon: "🏦", refLabel: "UTR / NEFT / IMPS Ref",  refRequired: true,  extraLabel: "Bank Name" },
          { id: "Cheque",       icon: "📝", refLabel: "Cheque Number",           refRequired: true,  extraLabel: "Bank Name · Cheque Date" },
          { id: "Complimentary",icon: "🎁", refLabel: "Reference Of",           refRequired: true,  extraLabel: "Reason / Approval Reference" },
          { id: "Sponsor",      icon: "🤝", refLabel: "Reference Of",           refRequired: true,  extraLabel: "Reason / Approval Reference" },
        ];
        const methodMap = Object.fromEntries(METHODS.map(m => [m.id, m]));

        const updateSplit = (id, key, val) =>
          setPayForm({ ...payForm, splits: payForm.splits.map(s => s.id === id ? { ...s, [key]: val } : s) });
        const removeSplit = (id) =>
          setPayForm({ ...payForm, splits: payForm.splits.filter(s => s.id !== id) });
        const addSplit = () =>
          setPayForm({ ...payForm, splits: [...payForm.splits, { id: Date.now(), method: "Cash", amount: "", ref: "", extra: "" }] });
        const setPreset = (id, pct) => {
          const remaining = balanceDue - payForm.splits.filter(s => s.id !== id).reduce((a,s) => a + (parseFloat(s.amount)||0), 0);
          updateSplit(id, "amount", String(Math.round(remaining * pct * 100) / 100));
        };

        function postPayment(andPrint = false) {
          if (!isValid) return;
          const now = new Date();
          const receiptNo = `RCT-${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*9000)+1000)}`;
          const ts = now.toISOString();
          const totalCollected = Math.round(validSplits.reduce((s,sp) => s + parseFloat(sp.amount), 0) * 100) / 100;
          const paymentOnly    = Math.max(0, Math.round((totalCollected - tipAmt) * 100) / 100);
          const totalApplied   = Math.min(paymentOnly, adjustedBalance);
          const ratio = totalApplied > 0 ? totalApplied / Math.max(paymentOnly, 0.01) : 0;
          const paymentSplits = validSplits.map((sp, i) => {
            const rawAmt = Math.max(0, parseFloat(sp.amount) - (i === validSplits.length-1 ? tipAmt : 0));
            const applied = i < validSplits.length-1
              ? Math.round(rawAmt * ratio * 100) / 100
              : Math.round((totalApplied - validSplits.slice(0,i).reduce((s,x) => s + Math.round(Math.max(0,parseFloat(x.amount))*ratio*100)/100, 0)) * 100) / 100;
            const refPart  = sp.ref.trim()   ? ` · Ref: ${sp.ref.trim()}`   : "";
            const extrPart = sp.extra.trim() ? ` · ${sp.extra.trim()}`       : "";
            const notePart = payForm.note.trim() ? ` · ${payForm.note.trim()}` : "";
            const typePart = payForm.paymentType === "deposit" ? " [Deposit]" : payForm.paymentType === "partial" ? " [Partial]" : "";
            return { desc: `Payment — ${sp.method}${refPart}${extrPart}${notePart}${typePart}`, amount: -Math.abs(applied), date: ts, receiptNo, collectedBy: payForm.collectedBy.trim() || "Front Office" };
          });
          if (discAmt > 0) {
            const reason = payForm.discountReason.trim() ? ` · ${payForm.discountReason.trim()}` : "";
            paymentSplits.unshift({ desc: `Discount applied${reason}`, amount: -discAmt, date: ts, receiptNo });
          }
          const tipEntry = tipAmt > 0 ? { desc: `Tip / Donation — ${payForm.collectedBy.trim()||"Front Office"}`, amount: tipAmt, date: ts, isTip: true, collectedBy: payForm.collectedBy.trim()||"Front Office" } : null;
          const updatedRes = { ...res, paid: res.paid + totalApplied, discount: (res.discount||0) + discAmt, total: discAmt > 0 ? res.total - discAmt : res.total, folio: [...res.folio, ...paymentSplits, ...(tipEntry ? [tipEntry] : [])], tips: (res.tips||0) + tipAmt };
          setReservations(reservations.map(r => r.id === payTargetId ? updatedRes : r));
          addLog(`Payment ₹${Math.round(totalApplied)} collected for ${res.guest} (${res.id}) via ${validSplits.map(s=>s.method).join("+")} · Receipt ${receiptNo}`, "pos");
          setPayForm({ paymentType: "full", splits: [{ id: 1, method: "UPI", amount: "", ref: "", extra: "" }], note: "", collectedBy: "", discount: "", discountReason: "", tip: "" });
          setModal(null);
          setPayTargetId(null);
          setShowPaySuccess({ res: updatedRes, splits: validSplits, totalApplied, receiptNo, collectedBy: payForm.collectedBy.trim()||"Front Office", paymentType: payForm.paymentType, at: ts, discAmt, tipAmt });
          if (andPrint) setTimeout(() => printInvoice(updatedRes), 200);
        }

        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.72)", backdropFilter:"blur(4px)", zIndex:9998, display:"flex", alignItems:"flex-start", justifyContent:"center", overflowY:"auto", padding:"24px 16px" }}
            onClick={() => { setModal(null); setPayTargetId(null); }}>
            <div onClick={e => e.stopPropagation()}
              style={{ background:"#ffffff", border:"1px solid rgba(0,0,0,0.06)", borderRadius:18, width:"100%", maxWidth:620, boxShadow:"0 32px 80px rgba(0,0,0,0.45)" }}>

              {/* Header */}
              <div style={{ padding:"20px 24px 16px", borderBottom:"1px solid rgba(0,0,0,0.06)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:700, color:"#111827" }}>Record Payment</div>
                  <div style={{ fontSize:11, color:"#6b7280", marginTop:2 }}>Post payment to guest folio</div>
                </div>
                <button onClick={() => { setModal(null); setPayTargetId(null); }} style={{ background:"none", border:"none", color:"#6b7280", fontSize:20, cursor:"pointer", lineHeight:1, padding:4 }}>✕</button>
              </div>

              <div style={{ padding:"20px 24px", display:"flex", flexDirection:"column", gap:18 }}>

                {/* Guest + Balance summary */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:0, background:"rgba(0,0,0,0.02)", border:"1px solid rgba(0,0,0,0.06)", borderRadius:12, overflow:"hidden" }}>
                  <div style={{ padding:"14px 18px", borderRight:"1px solid rgba(0,0,0,0.06)" }}>
                    <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:6 }}>Guest</div>
                    <div style={{ fontSize:14, fontWeight:700, color:"#111827" }}>{res.guest}</div>
                    <div style={{ fontSize:11, color:"#6b7280", marginTop:2 }}>Room {res.room} · {res.bhavan}</div>
                    <div style={{ fontSize:11, color:"#6b7280" }}>{new Date(res.checkIn).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})} → {new Date(res.checkOut).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</div>
                  </div>
                  <div style={{ padding:"14px 18px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                      <span style={{ fontSize:11, color:"#6b7280" }}>Total Bill</span>
                      <span style={{ fontSize:12, color:"#111827", fontWeight:600 }}>₹{rupees(res.total)}</span>
                    </div>
                    {res.paid > 0 && (
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                        <span style={{ fontSize:11, color:"#22c55e" }}>Paid</span>
                        <span style={{ fontSize:12, color:"#22c55e" }}>−₹{rupees(res.paid)}</span>
                      </div>
                    )}
                    <div style={{ display:"flex", justifyContent:"space-between", paddingTop:6, borderTop:"1px solid rgba(0,0,0,0.06)", marginTop:2 }}>
                      <span style={{ fontSize:12, fontWeight:700, color:"#ef4444" }}>Balance Due</span>
                      <span style={{ fontSize:15, fontWeight:800, color:"#ef4444" }}>₹{rupees(balanceDue)}</span>
                    </div>
                  </div>
                </div>

                {/* Payment Type */}
                <div>
                  <div style={{ fontSize:11, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8, fontWeight:600 }}>Payment Type</div>
                  <div style={{ display:"flex", gap:8 }}>
                    {[{ id:"full", label:"Full Settlement", icon:"✅", desc:"Clears entire balance" },{ id:"partial", label:"Partial Payment", icon:"⚡", desc:"Partial amount now" },{ id:"deposit", label:"Security Deposit", icon:"🔒", desc:"Refundable deposit" }].map(t => (
                      <button key={t.id} onClick={() => setPayForm({ ...payForm, paymentType:t.id })}
                        style={{ flex:1, padding:"10px 8px", borderRadius:10, border:`2px solid ${payForm.paymentType===t.id?"#a07830":"rgba(0,0,0,0.05)"}`, background:payForm.paymentType===t.id?"rgba(201,168,76,0.1)":"rgba(0,0,0,0.02)", cursor:"pointer", textAlign:"center" }}>
                        <div style={{ fontSize:16, marginBottom:3 }}>{t.icon}</div>
                        <div style={{ fontSize:11, fontWeight:700, color:payForm.paymentType===t.id?"#a07830":"#6b7280" }}>{t.label}</div>
                        <div style={{ fontSize:10, color:"#9ca3af", marginTop:2 }}>{t.desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Discount */}
                <div style={{ background:"rgba(34,197,94,0.04)", border:"1px solid rgba(34,197,94,0.18)", borderRadius:10, padding:"14px 16px" }}>
                  <div style={{ fontSize:10, color:"#22c55e", textTransform:"uppercase", letterSpacing:"0.08em", fontWeight:700, marginBottom:10 }}>🏷 Discount</div>
                  <div style={{ display:"flex", gap:10 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:5 }}>Amount (₹)</div>
                      <input type="number" min="0" value={payForm.discount} onChange={e => setPayForm(p => ({ ...p, discount:e.target.value }))}
                        placeholder="0.00" style={{ borderColor: discAmt > balanceDue ? "rgba(239,68,68,0.5)" : discAmt > 0 ? "rgba(34,197,94,0.4)" : undefined }} />
                      {discAmt > balanceDue && <div style={{ fontSize:10, color:"#ef4444", marginTop:4 }}>⚠ Exceeds balance due</div>}
                      {discAmt > 0 && discAmt <= balanceDue && <div style={{ fontSize:10, color:"#22c55e", marginTop:4 }}>Balance reduced to ₹{rupees(adjustedBalance)}</div>}
                    </div>
                    <div style={{ flex:2 }}>
                      <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:5 }}>Reason / Authorised By</div>
                      <input value={payForm.discountReason} onChange={e => setPayForm(p => ({ ...p, discountReason:e.target.value }))}
                        placeholder="e.g. Manager approval, loyalty discount…" />
                    </div>
                  </div>
                </div>

                {/* Payment Splits */}
                <div>
                  <div style={{ fontSize:11, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:10, fontWeight:600, display:"flex", justifyContent:"space-between" }}>
                    <span>Payment {payForm.splits.length > 1 ? "Splits" : "Details"}</span>
                    {payForm.splits.length > 1 && <span style={{ color:"#a07830", fontSize:10 }}>{payForm.splits.length} methods</span>}
                  </div>
                  {payForm.splits.map((split, idx) => {
                    const mInfo = methodMap[split.method] || METHODS[0];
                    const splitAmt = parseFloat(split.amount) || 0;
                    const otherTotal = payForm.splits.filter(s => s.id !== split.id).reduce((a,s) => a + (parseFloat(s.amount)||0), 0);
                    const maxForThis = Math.max(0, balanceDue - otherTotal);
                    return (
                      <div key={split.id} style={{ background:"rgba(0,0,0,0.02)", border:"1px solid rgba(0,0,0,0.06)", borderRadius:12, padding:"14px 16px", marginBottom:10, position:"relative" }}>
                        {payForm.splits.length > 1 && (
                          <button onClick={() => removeSplit(split.id)}
                            style={{ position:"absolute", top:10, right:10, background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.2)", borderRadius:"50%", width:22, height:22, cursor:"pointer", color:"#ef4444", fontSize:12, display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>✕</button>
                        )}
                        <div style={{ marginBottom:12 }}>
                          <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:8 }}>Payment Method</div>
                          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                            {METHODS.map(m => (
                              <button key={m.id} onClick={() => setPayForm(prev => ({ ...prev, splits: prev.splits.map(s => s.id !== split.id ? s : { ...s, method:m.id, amount: s.method !== m.id && (m.id==="Complimentary"||m.id==="Sponsor") ? String(Math.max(0,Math.round((balanceDue - prev.splits.filter(x=>x.id!==s.id).reduce((a,x)=>a+(parseFloat(x.amount)||0),0))*100)/100)) : (s.method!==m.id?"":s.amount) }) }))}
                                style={{ padding:"6px 12px", borderRadius:20, border:`1.5px solid ${split.method===m.id?"#a07830":"rgba(0,0,0,0.08)"}`, background:split.method===m.id?"rgba(201,168,76,0.12)":"transparent", cursor:"pointer", color:split.method===m.id?"#a07830":"#6b7280", fontSize:12, fontWeight:split.method===m.id?700:400, display:"flex", alignItems:"center", gap:5, whiteSpace:"nowrap" }}>
                                <span>{m.icon}</span><span>{m.id}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                        <div style={{ marginBottom: mInfo.refLabel ? 12 : 0 }}>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                            <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase" }}>Amount (₹) *</div>
                            {split.method !== "Complimentary" && split.method !== "Sponsor" && (
                              <div style={{ display:"flex", gap:4 }}>
                                {[["25%",0.25],["50%",0.5],["75%",0.75],["Full",1]].map(([lbl,pct]) => (
                                  <button key={lbl} onClick={() => setPreset(split.id, pct)}
                                    style={{ fontSize:10, padding:"2px 8px", borderRadius:10, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.07)", color:"#a07830", cursor:"pointer" }}>{lbl}</button>
                                ))}
                              </div>
                            )}
                          </div>
                          <input type="number" min="0.01" step="0.01" value={split.amount}
                            onChange={e => updateSplit(split.id, "amount", e.target.value)}
                            placeholder="0.00" autoFocus={idx===0}
                            style={{ borderColor: splitAmt > maxForThis+0.001 ? "rgba(239,68,68,0.5)" : splitAmt > 0 ? "rgba(34,197,94,0.4)" : undefined }} />
                          {splitAmt > maxForThis+0.001 && <div style={{ fontSize:10, color:"#ef4444", marginTop:4 }}>⚠ Exceeds available balance of ₹{rupees(maxForThis)}</div>}
                        </div>
                        {mInfo.refLabel && (
                          <div style={{ display:"grid", gridTemplateColumns:mInfo.extraLabel?"1fr 1fr":"1fr", gap:10 }}>
                            <div>
                              <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:5 }}>{mInfo.refLabel} {mInfo.refRequired && <span style={{ color:"#ef4444" }}>*</span>}</div>
                              <input value={split.ref} onChange={e => updateSplit(split.id, "ref", e.target.value)}
                                placeholder={split.method==="UPI"?"e.g. 4236xxxx1234":split.method==="Card"?"e.g. 489234":split.method==="Bank Transfer"?"e.g. NEFT2025xxxx":split.method==="Cheque"?"e.g. 012345":"Name / Reference"}
                                style={{ fontSize:12 }} />
                            </div>
                            {mInfo.extraLabel && (
                              <div>
                                <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:5 }}>{mInfo.extraLabel}</div>
                                <input value={split.extra} onChange={e => updateSplit(split.id, "extra", e.target.value)}
                                  placeholder={split.method==="Card"?"e.g. 4532 · Visa":split.method==="Bank Transfer"?"e.g. SBI / HDFC":split.method==="Cheque"?"e.g. ICICI · 21 Feb":split.method==="Cash"?"e.g. 2×500 + 4×100":"—"}
                                  style={{ fontSize:12 }} />
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {payForm.splits.length < 3 && balanceDue > 0 && (
                    <button onClick={addSplit}
                      style={{ width:"100%", padding:"9px", border:"1.5px dashed rgba(201,168,76,0.3)", borderRadius:10, background:"transparent", color:"#a07830", fontSize:12, cursor:"pointer", fontWeight:600, display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                      + Add Split Payment Method
                    </button>
                  )}
                </div>

                {/* Running Total */}
                {(totalEntered > 0 || discAmt > 0) && (
                  <div style={{ background:isOverpay?"rgba(239,68,68,0.08)":isFull?"rgba(34,197,94,0.08)":"rgba(245,158,11,0.07)", border:`1px solid ${isOverpay?"rgba(239,68,68,0.25)":isFull?"rgba(34,197,94,0.25)":"rgba(245,158,11,0.2)"}`, borderRadius:10, padding:"12px 16px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                      <span style={{ fontSize:12, color:"#6b7280" }}>Original Balance</span>
                      <span style={{ fontSize:12, color:"#111827" }}>₹{rupees(balanceDue)}</span>
                    </div>
                    {discAmt > 0 && (
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                        <span style={{ fontSize:12, color:"#22c55e" }}>🏷 Discount</span>
                        <span style={{ fontSize:12, color:"#22c55e", fontWeight:600 }}>− ₹{rupees(discAmt)}</span>
                      </div>
                    )}
                    {tipAmt > 0 && (
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                        <span style={{ fontSize:12, color:"#f59e0b" }}>💝 Tip</span>
                        <span style={{ fontSize:12, color:"#f59e0b", fontWeight:600 }}>+ ₹{rupees(tipAmt)}</span>
                      </div>
                    )}
                    <div style={{ display:"flex", justifyContent:"space-between", borderTop:"1px solid rgba(0,0,0,0.06)", paddingTop:6, marginTop:4, marginBottom:5 }}>
                      <span style={{ fontSize:12, color:"#6b7280" }}>Total Collected</span>
                      <span style={{ fontSize:13, fontWeight:700, color:"#111827" }}>₹{rupees(Math.min(totalEntered,totalDue))}</span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between" }}>
                      <span style={{ fontSize:12, fontWeight:700, color:isOverpay?"#ef4444":isFull?"#22c55e":"#f59e0b" }}>
                        {isOverpay?"⚠ Overpay — exceeds balance":isFull?"✓ Fully settled":"Remaining Balance"}
                      </span>
                      <span style={{ fontSize:14, fontWeight:800, color:isOverpay?"#ef4444":isFull?"#22c55e":"#f59e0b" }}>
                        {isOverpay?`−₹${rupees(totalEntered-totalDue)} over`:isFull?"₹0.00":`₹${rupees(balanceAfter)}`}
                      </span>
                    </div>
                  </div>
                )}

                {/* Tip */}
                <div style={{ background:"rgba(245,158,11,0.04)", border:"1px solid rgba(245,158,11,0.18)", borderRadius:10, padding:"14px 16px" }}>
                  <div style={{ fontSize:10, color:"#f59e0b", textTransform:"uppercase", fontWeight:700, marginBottom:10 }}>💝 Tip / Donation</div>
                  <div style={{ display:"flex", gap:10, alignItems:"flex-end" }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:5 }}>Amount (₹)</div>
                      <input type="number" min="0" value={payForm.tip} onChange={e => setPayForm(p => ({ ...p, tip:e.target.value }))} placeholder="0.00" />
                    </div>
                    <div style={{ display:"flex", gap:6, paddingBottom:2 }}>
                      {[100,200,500].map(amt => (
                        <button key={amt} onClick={() => setPayForm(p => ({ ...p, tip:String(amt) }))}
                          style={{ padding:"8px 12px", borderRadius:8, border:`1.5px solid ${payForm.tip===String(amt)?"#f59e0b":"rgba(245,158,11,0.25)"}`, background:payForm.tip===String(amt)?"rgba(245,158,11,0.15)":"rgba(245,158,11,0.07)", color:"#f59e0b", fontSize:12, cursor:"pointer", fontWeight:600, whiteSpace:"nowrap" }}>
                          ₹{amt}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Collected By + Note */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                  <div>
                    <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:6, fontWeight:600 }}>Collected By</div>
                    <input value={payForm.collectedBy} onChange={e => setPayForm({ ...payForm, collectedBy:e.target.value })} placeholder="Staff name / Front Desk" />
                  </div>
                  <div>
                    <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", marginBottom:6, fontWeight:600 }}>Remarks (optional)</div>
                    <input value={payForm.note} onChange={e => setPayForm({ ...payForm, note:e.target.value })} placeholder="e.g. Check-out payment…" />
                  </div>
                </div>

                {/* Actions */}
                <div style={{ display:"flex", gap:10, paddingTop:4, borderTop:"1px solid rgba(0,0,0,0.06)" }}>
                  <button className="btn btn-ghost" onClick={() => { setModal(null); setPayTargetId(null); }} style={{ flex:1 }}>Cancel</button>
                  <button className="btn btn-ghost" onClick={() => postPayment(false)}
                    disabled={!isValid} style={{ flex:1, opacity:isValid?1:0.4 }}>✓ Post Payment</button>
                  <button className="btn btn-primary" onClick={() => postPayment(true)}
                    disabled={!isValid} style={{ flex:1.5, opacity:isValid?1:0.4, display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                    🖨 Post &amp; Print Receipt
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── PAYMENT SUCCESS (Reservations) ── */}
      {showPaySuccess && (() => {
        const { res: pr, splits, totalApplied, receiptNo, collectedBy, paymentType, at } = showPaySuccess;
        const newBalance = Math.max(0, Math.round((pr.total - pr.paid) * 100) / 100);
        const isPaidFull = newBalance <= 0;
        const methodIcons = { UPI:"📲", Cash:"💵", "Bank Transfer":"🏦", Card:"💳", Cheque:"📝", Complimentary:"🎁", Sponsor:"🤝" };
        const typeLabel = { full:"Full Settlement", partial:"Partial Payment", deposit:"Security Deposit" };
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", backdropFilter:"blur(4px)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center" }}
            onClick={() => setShowPaySuccess(null)}>
            <div onClick={e => e.stopPropagation()}
              style={{ background:"#ffffff", border:`1px solid ${isPaidFull?"rgba(34,197,94,0.35)":"rgba(245,158,11,0.35)"}`, borderRadius:20, width:440, padding:"32px 28px", boxShadow:"0 40px 80px rgba(0,0,0,0.65)", textAlign:"center" }}>
              <div style={{ width:68, height:68, borderRadius:"50%", background:isPaidFull?"rgba(34,197,94,0.12)":"rgba(245,158,11,0.12)", border:`2px solid ${isPaidFull?"#22c55e":"#f59e0b"}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:30, margin:"0 auto 16px" }}>
                {isPaidFull?"✓":"⚡"}
              </div>
              <div style={{ fontSize:20, fontWeight:800, color:isPaidFull?"#22c55e":"#f59e0b", marginBottom:4 }}>
                {isPaidFull?"Payment Complete":"Partial Payment Posted"}
              </div>
              <div style={{ fontSize:11, color:"#6b7280", marginBottom:6 }}>
                {new Date(at).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})} · {new Date(at).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true})}
              </div>
              <div style={{ fontSize:11, color:"#9ca3af", fontFamily:"monospace", marginBottom:20 }}>Receipt: {receiptNo}</div>
              <div style={{ background:"rgba(0,0,0,0.02)", border:"1px solid rgba(0,0,0,0.06)", borderRadius:12, padding:"16px 18px", textAlign:"left", marginBottom:20 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8, paddingBottom:8, borderBottom:"1px solid rgba(0,0,0,0.06)" }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:700, color:"#111827" }}>{pr.guest}</div>
                    <div style={{ fontSize:11, color:"#6b7280" }}>Room {pr.room} · {pr.bhavan} · {pr.id}</div>
                  </div>
                  <div style={{ fontSize:10, padding:"3px 10px", borderRadius:10, alignSelf:"flex-start",
                    background:paymentType==="deposit"?"rgba(168,85,247,0.15)":paymentType==="partial"?"rgba(245,158,11,0.15)":"rgba(34,197,94,0.15)",
                    color:paymentType==="deposit"?"#a855f7":paymentType==="partial"?"#f59e0b":"#22c55e",
                    border:`1px solid ${paymentType==="deposit"?"rgba(168,85,247,0.3)":paymentType==="partial"?"rgba(245,158,11,0.3)":"rgba(34,197,94,0.3)"}`,
                    fontWeight:700 }}>
                    {typeLabel[paymentType]||"Payment"}
                  </div>
                </div>
                {(splits||[]).map((sp,i) => (
                  <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                    <span style={{ fontSize:12, color:"#6b7280", display:"flex", alignItems:"center", gap:5 }}>
                      <span>{methodIcons[sp.method]||"💳"}</span> {sp.method}
                      {sp.ref && <span style={{ fontFamily:"monospace", fontSize:10, color:"#9ca3af" }}>· {sp.ref}</span>}
                    </span>
                    <span style={{ fontSize:13, fontWeight:700, color:"#22c55e" }}>₹{rupees(parseFloat(sp.amount))}</span>
                  </div>
                ))}
                {(splits||[]).length > 1 && (
                  <div style={{ display:"flex", justifyContent:"space-between", paddingTop:6, borderTop:"1px solid rgba(0,0,0,0.06)", marginTop:4 }}>
                    <span style={{ fontSize:12, fontWeight:600, color:"#111827" }}>Total Received</span>
                    <span style={{ fontSize:14, fontWeight:800, color:"#22c55e" }}>₹{rupees(totalApplied)}</span>
                  </div>
                )}
                <div style={{ display:"flex", justifyContent:"space-between", paddingTop:8, borderTop:"1px solid rgba(0,0,0,0.06)", marginTop:6 }}>
                  <span style={{ fontSize:12, fontWeight:700, color:isPaidFull?"#22c55e":"#f59e0b" }}>Balance Due</span>
                  <span style={{ fontSize:15, fontWeight:800, color:isPaidFull?"#22c55e":"#f59e0b" }}>
                    {isPaidFull?"₹0.00 — Cleared ✓":`₹${rupees(newBalance)}`}
                  </span>
                </div>
                <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }}>
                  <span style={{ fontSize:10, color:"#9ca3af" }}>Collected by</span>
                  <span style={{ fontSize:11, color:"#6b7280" }}>{collectedBy}</span>
                </div>
              </div>
              <div style={{ display:"flex", gap:10 }}>
                <button className="btn btn-ghost" style={{ flex:1 }} onClick={() => setShowPaySuccess(null)}>Done</button>
                <button className="btn btn-primary" style={{ flex:1.4, display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}
                  onClick={() => { printInvoice(pr); setShowPaySuccess(null); }}>
                  🖨 Print Invoice
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      <AlertBox message={formError} onClose={() => setFormError("")} />
    </div>
  );
}

// ─── ROOMS ────────────────────────────────────────────────────────────────────
function Rooms({ rooms, setRooms, initFilter, initRoomNumber, reservations, onNavigate, addLog }) {
  const [selected, setSelected] = useState(() =>
    initRoomNumber ? rooms.find((r) => r.number === initRoomNumber) || null : null
  );
  const [filter, setFilter] = useState(initFilter || "All");
  const [search, setSearch] = useState(initRoomNumber || "");
  const [bhavanFilter, setBhawanFilter] = useState("All");
  const [editModal, setEditModal] = useState(false);
  const [editForm, setEditForm] = useState({});
  const [maintModal, setMaintModal] = useState(false);
  const [maintForm, setMaintForm] = useState({ issue: "", priority: "Normal", assignedTo: "", notes: "" });
  const [activeTab, setActiveTab] = useState("details");
  const [roomView,    setRoomView]    = useState("grid");       // "grid" | "floorplan"
  const [blockMode,   setBlockMode]   = useState(false);
  const [blockedRooms,setBlockedRooms]= useState(new Set());   // room.id strings
  const [blockForm,   setBlockForm]   = useState({ reason:"", from:"", to:"", releaseEarly:false });
  const [blockModal,  setBlockModal]  = useState(false);
  const [blockConflicts, setBlockConflicts] = useState([]); // rooms with active reservations (shown inline in block modal)
  const [blockConflictAcked, setBlockConflictAcked] = useState(false);
  const [extendBlockModal, setExtendBlockModal] = useState(null); // { roomIds: [...], isBatch: bool }
  const [extendBlockForm,  setExtendBlockForm]  = useState({ newTo: "", reason: "", releaseEarly: false });
  const [svcModal,    setSvcModal]    = useState(false);  // service request modal
  const [svcForm,     setSvcForm]     = useState({ type:"Extra Towels", description:"", priority:"Normal", requestedBy:"" });
  const [roomDetailTab, setRoomDetailTab] = useState("details"); // "details" | "history" | "services" | "upgrades"
  const [requestsMode, setRequestsMode] = useState(false); // true only when Requests chip in header is active
  const [requestsFocus, setRequestsFocus] = useState(null); // room.id focused in requests mode
  const [pendingStatus, setPendingStatus] = useState(""); // status selected but not yet applied
  const [statusNote, setStatusNote] = useState(""); // note for the pending status change
  const SERVICE_TYPES = ["Extra Towels","Extra Pillows","Room Cleaning","Wake-up Call","Minibar Restock","Iron & Board","Baby Cot","Extra Bed","Late Checkout Request","DND Override","Maintenance Issue","Other"];
  const statuses = ["All", "Available", "Occupied", "Dirty", "Maintenance", "Checking Out", "Blocked"];
  const openRequestsCount = rooms.reduce((acc, r) => acc + ((r.serviceRequests||[]).filter(s=>s.status==="Open").length), 0);

  const filtered = rooms.filter((r) => {
    const matchesFilter = filter === "All" || filter === "Requests"
      ? (filter === "Requests" ? (r.serviceRequests||[]).some(s=>s.status==="Open") : filter === "All" || r.status === filter)
      : r.status === filter;
    const matchesBhawan = bhavanFilter === "All" || r.bhavan === bhavanFilter;
    const q = search.toLowerCase();
    const matchesSearch = !q ||
      r.number.includes(q) ||
      r.type.toLowerCase().includes(q) ||
      r.status.toLowerCase().includes(q) ||
      (r.guest && r.guest.toLowerCase().includes(q)) ||
      (r.bhavan && r.bhavan.toLowerCase().includes(q)) ||
      String(r.floor).includes(q);
    return matchesFilter && matchesBhawan && matchesSearch;
  });

  function selectRoom(room) {
    setSelected(room);
    setActiveTab("details");
    setRoomDetailTab("details");
    setRequestsFocus(null);
    setPendingStatus(room.status);
    setStatusNote("");
  }

  function updateRoom(id, patch) {
    setRooms(prev => prev.map((r) => r.id === id ? { ...r, ...patch } : r));
    setSelected((s) => s && s.id === id ? { ...s, ...patch } : s);
  }

  function applyExtendBlock() {
    if (!extendBlockModal || !extendBlockForm.newTo) return;
    const { roomIds } = extendBlockModal;
    const now = new Date().toISOString();
    setRooms(prev => prev.map(r => {
      if (!roomIds.includes(r.id)) return r;
      const oldTo = r.blockedTo || "—";
      const action = extendBlockForm.releaseEarly ? "Block shortened" : "Block extended";
      const entry = {
        id: Date.now() + Math.random(),
        from: "Blocked",
        to: "Blocked",
        note: `${action}: ${oldTo} → ${extendBlockForm.newTo}${extendBlockForm.reason ? " — " + extendBlockForm.reason : ""}`,
        timestamp: now,
        changedBy: "Front Desk",
      };
      return { ...r, blockedTo: extendBlockForm.newTo, statusLog: [...(r.statusLog || []), entry] };
    }));
    roomIds.forEach(id => {
      const room = rooms.find(r => r.id === id);
      if (room) {
        const action = extendBlockForm.releaseEarly ? "shortened" : "extended";
        addLog(`Room ${room.number} block ${action} → until ${extendBlockForm.newTo}${extendBlockForm.reason ? " — " + extendBlockForm.reason : ""}`, "edit");
      }
    });
    setExtendBlockModal(null);
    setExtendBlockForm({ newTo: "", reason: "", releaseEarly: false });
  }

  function updateStatus(id, status, note) {
    const room = rooms.find((r) => r.id === id);
    const patch = { status };
    if (status === "Available") patch.lastCleaned = new Date().toISOString();
    if (status === "Blocked") patch.blockedReason = note || "";
    // Append to statusLog — never overwrite
    const prevLog = room?.statusLog || [];
    const entry = {
      id: Date.now(),
      from: room?.status || "",
      to: status,
      note: note || "",
      timestamp: new Date().toISOString(),
      changedBy: "Front Desk",
    };
    patch.statusLog = [...prevLog, entry];
    updateRoom(id, patch);
    const noteStr = note ? ` — "${note}"` : "";
    if (room) addLog(`Room ${room.number} status → ${status}${noteStr}`, "edit");
  }

  function toggleDnd(id) {
    const room = rooms.find((r) => r.id === id);
    if (!room) return;
    const next = !room.dnd;
    updateRoom(id, { dnd: next });
    addLog(`Room ${room.number} DND ${next ? "activated" : "cleared"}`, "edit");
  }

  function openEdit() {
    const s = selected;
    setEditForm({
      type: s.type,
      rate: s.rate,
      maxOcc: s.maxOcc || 2,
      notes: s.notes || "",
      amenities: { ...(s.amenities || {}) },
    });
    setEditModal(true);
  }

  function saveEdit() {
    updateRoom(selected.id, {
      type: editForm.type,
      rate: Number(editForm.rate),
      maxOcc: Number(editForm.maxOcc),
      notes: editForm.notes,
      amenities: editForm.amenities,
    });
    addLog(`Room ${selected.number} details updated`, "edit");
    setEditModal(false);
  }

  function addMaintLog() {
    if (!maintForm.issue.trim()) return;
    const log = {
      id: Date.now(),
      date: new Date().toISOString(),
      issue: maintForm.issue,
      priority: maintForm.priority,
      assignedTo: maintForm.assignedTo,
      notes: maintForm.notes,
      status: "Open",
    };
    const prev = selected.maintenanceLogs || [];
    // Only set status to Maintenance if the room is NOT currently Occupied.
    // An occupied room has a live guest — flipping status would desync from the
    // active reservation. Log the issue silently; staff action after checkout.
    const isOccupied = selected.status === "Occupied";
    const patch = { maintenanceLogs: [log, ...prev] };
    if (!isOccupied) patch.status = "Maintenance";
    updateRoom(selected.id, patch);
    const occupiedNote = isOccupied ? " (room occupied — status unchanged; issue queued for post-checkout)" : "";
    addLog(`Room ${selected.number} maintenance logged: ${maintForm.issue}${occupiedNote}`, "edit");
    setMaintForm({ issue: "", priority: "Normal", assignedTo: "", notes: "" });
    setMaintModal(false);
  }

  function closeMaintLog(roomId, logId) {
    const room = rooms.find((r) => r.id === roomId);
    if (!room) return;
    const updated = (room.maintenanceLogs || []).map((l) => l.id === logId ? { ...l, status: "Closed", closedAt: new Date().toISOString() } : l);
    updateRoom(roomId, { maintenanceLogs: updated });
  }

  function updateMaintNote(roomId, logId, note) {
    const room = rooms.find((r) => r.id === roomId);
    if (!room) return;
    const updated = (room.maintenanceLogs || []).map((l) => l.id === logId ? { ...l, notes: note } : l);
    updateRoom(roomId, { maintenanceLogs: updated });
  }

  function saveCleaningPriority(roomId, priority, note) {
    updateRoom(roomId, { cleaningPriority: priority, cleaningNote: note });
    addLog(`Room ${rooms.find(r=>r.id===roomId)?.number} cleaning priority → ${priority}`, "edit");
  }

  const statusBg = {
    Available: "rgba(34,197,94,0.18)",
    Occupied: "rgba(59,130,246,0.18)",
    Dirty: "rgba(245,158,11,0.18)",
    Maintenance: "rgba(239,68,68,0.18)",
    "Checking Out": "rgba(168,85,247,0.18)",
    Blocked: "rgba(99,102,241,0.18)",
  };

  const fmtD = (d) => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
  const fmtDT = (d) => d ? `${fmtD(d)} ${new Date(d).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })}` : "—";
  const today = new Date().toISOString().slice(0, 10);

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Room Management</div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
          {/* View toggle */}
          <div style={{ display:"flex", background:"rgba(0,0,0,0.05)", borderRadius:8, padding:2, gap:2 }}>
            {[{id:"grid",label:"⊞ Grid"},{id:"floorplan",label:"🏢 Floor Plan"}].map(v => (
              <button key={v.id} onClick={() => setRoomView(v.id)}
                style={{ padding:"5px 12px", borderRadius:6, border:"none", fontSize:12, fontWeight:700, cursor:"pointer",
                  background: roomView===v.id ? "#a07830" : "transparent",
                  color:      roomView===v.id ? "#fff"    : "#6b7280" }}>
                {v.label}
              </button>
            ))}
          </div>
          {/* Block rooms toggle */}
          <button onClick={() => { if(blockMode && blockedRooms.size>0) setBlockModal(true); else setBlockMode(b=>!b); }}
            style={{ padding:"6px 14px", borderRadius:8, border:"1px solid", fontSize:12, fontWeight:700, cursor:"pointer",
              background: blockMode ? "rgba(239,68,68,0.12)" : "rgba(107,114,128,0.08)",
              color:      blockMode ? "#dc2626"               : "#374151",
              borderColor:blockMode ? "rgba(239,68,68,0.4)"   : "rgba(0,0,0,0.15)" }}>
{blockMode ? (() => {
              const toBlock  = [...blockedRooms].filter(id => rooms.find(r=>r.id===id && r.status!=="Blocked")).length;
              const toExtend = [...blockedRooms].filter(id => rooms.find(r=>r.id===id && r.status==="Blocked")).length;
              if (blockedRooms.size === 0) return "✕ Cancel";
              if (toBlock > 0 && toExtend === 0) return `🔒 Block ${toBlock} Room${toBlock>1?"s":""}`;
              if (toExtend > 0 && toBlock === 0) return `📅 Extend ${toExtend} Block${toExtend>1?"s":""}`;
              return `🔒 ${toBlock} Block + 📅 ${toExtend} Extend`;
            })() : "🔒 Block Rooms"}
          </button>

          {/* Status filters */}
          {statuses.map((s) => {
            const scopedRooms = bhavanFilter === "All" ? rooms : rooms.filter(r => r.bhavan === bhavanFilter);
            const count = s === "All" ? scopedRooms.length : scopedRooms.filter((r) => r.status === s).length;
            if (count === 0 && s !== "All") return null;
            return (
              <button key={s} className={`btn btn-sm ${filter === s ? "btn-primary" : "btn-ghost"}`} onClick={() => { setFilter(s); setSelected(null); setRequestsMode(false); }}>
                {s}
                <span style={{ marginLeft: 6, fontSize: 10, padding: "1px 6px", borderRadius: 10, background: filter === s ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.07)" }}>
                  {count}
                </span>
              </button>
            );
          })}
          {/* Requests chip — always shown, pulses when there are open requests */}
          <button
            className={`btn btn-sm ${filter === "Requests" ? "btn-primary" : "btn-ghost"}`}
            onClick={() => { const entering = filter !== "Requests"; setFilter(entering ? "Requests" : "All"); setSelected(null); setRequestsMode(entering); setRequestsFocus(null); }}
            style={{
              borderColor: openRequestsCount > 0 ? "rgba(239,68,68,0.5)" : undefined,
              color: filter !== "Requests" && openRequestsCount > 0 ? "#dc2626" : undefined,
              background: filter !== "Requests" && openRequestsCount > 0 ? "rgba(239,68,68,0.07)" : undefined,
            }}>
            🔔 Requests
            <span style={{ marginLeft:6, fontSize:10, padding:"1px 6px", borderRadius:10,
              background: openRequestsCount > 0
                ? (filter === "Requests" ? "rgba(0,0,0,0.2)" : "#ef4444")
                : (filter === "Requests" ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.07)"),
              color: openRequestsCount > 0 && filter !== "Requests" ? "#fff" : undefined,
              fontWeight: openRequestsCount > 0 ? 700 : undefined,
            }}>
              {openRequestsCount}
            </span>
          </button>
        </div>
      </div>

      {["grid","floorplan"].includes(roomView) && <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
        <input
          style={{ flex: 1 }}
          placeholder="Search by room number, type, status, guest name, floor, or bhavan..."
          value={search}
          onChange={(e) => { setSearch(e.target.value); setSelected(null); }}
        />
        <select
          value={bhavanFilter}
          onChange={(e) => { setBhawanFilter(e.target.value); setSelected(null); }}
          style={{ width: 220, flexShrink: 0 }}>
          <option value="All">All Bhawans</option>
          {BHAVAN_LIST.map((b) => {
            const cnt = rooms.filter((r) => r.bhavan === b).length;
            return <option key={b} value={b}>{b} ({cnt})</option>;
          })}
        </select>
      </div>}

      {/* Block mode banner */}
      {blockMode && ["grid","floorplan"].includes(roomView) && (
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12, padding:"10px 16px", background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.25)", borderRadius:8 }}>
          <span style={{ fontSize:13, fontWeight:700, color:"#dc2626" }}>🔒 Block Mode Active</span>
          <span style={{ fontSize:12, color:"#374151" }}>Click rooms to select for blocking. <span style={{ color:"#9ca3af" }}>Only Available, Dirty and Checking Out rooms can be blocked.</span> {blockedRooms.size>0?<strong style={{color:"#dc2626"}}>{blockedRooms.size} selected.</strong>:""}</span>
          {blockedRooms.size>0&&<button onClick={()=>setBlockModal(true)} style={{ marginLeft:"auto", padding:"5px 14px", borderRadius:8, border:"1px solid #dc2626", background:"#dc2626", color:"#fff", cursor:"pointer", fontSize:12, fontWeight:700 }}>🔒 Block Selected</button>}
          <button onClick={()=>{setBlockMode(false);setBlockedRooms(new Set());}} style={{ padding:"5px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.15)", background:"transparent", color:"#6b7280", cursor:"pointer", fontSize:12 }}>✕ Cancel</button>
        </div>
      )}

      {/* Active filter banner */}
      {["grid","floorplan"].includes(roomView) && (filter !== "All" || search || bhavanFilter !== "All") && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, padding: "10px 14px", background: "rgba(201,168,76,0.06)", border: "1px solid rgba(201,168,76,0.2)", borderRadius: 8, flexWrap: "wrap" }}>
          {filter !== "All" && <div style={{ width: 10, height: 10, borderRadius: "50%", background: STATUS_COLORS[filter], flexShrink: 0 }} />}
          <span style={{ fontSize: 12, color: "var(--gold)" }}>
            🔍 <strong>{filtered.length}</strong> room{filtered.length !== 1 ? "s" : ""}
            {filter !== "All" && <> · <span style={{ color: STATUS_COLORS[filter] }}>{filter}</span></>}
            {bhavanFilter !== "All" && <> · <span style={{ color: "#a07830" }}>{bhavanFilter.split("–")[0].trim()}</span></>}
            {search && <> · &quot;{search}&quot;</>}
          </span>
          <button className="btn btn-sm btn-ghost" style={{ marginLeft: "auto", fontSize: 11 }}
            onClick={() => { setFilter("All"); setSearch(""); setBhawanFilter("All"); setSelected(null); }}>✕ Clear All</button>
        </div>
      )}

      {["grid","floorplan"].includes(roomView) && <div className="legend">
        {Object.entries(STATUS_COLORS).map(([status, color]) => (
          <div key={status} className="legend-item" style={{ cursor: "pointer", opacity: filter !== "All" && filter !== status ? 0.4 : 1, transition: "opacity 0.15s" }}
            onClick={() => { setFilter(filter === status ? "All" : status); setSelected(null); }}>
            <div className="legend-dot" style={{ background: color }} />
            {status}
          </div>
        ))}
        <div className="legend-item" style={{ cursor:"pointer", opacity: filter !== "All" && filter !== "Requests" ? 0.4 : 1, transition:"opacity 0.15s" }}
          onClick={() => { const entering = filter !== "Requests"; setFilter(entering ? "Requests" : "All"); setSelected(null); setRequestsMode(entering); setRequestsFocus(null); }}>
          <div className="legend-dot" style={{ background: openRequestsCount > 0 ? "#ef4444" : "#9ca3af", position:"relative" }}>
            {openRequestsCount > 0 && <span style={{ position:"absolute", top:-3, right:-3, width:6, height:6, borderRadius:"50%", background:"#ef4444", border:"1px solid #fff" }} />}
          </div>
          🔔 Requests {openRequestsCount > 0 && <span style={{ marginLeft:3, fontSize:10, background:"#ef4444", color:"#fff", borderRadius:8, padding:"0px 5px", fontWeight:700 }}>{openRequestsCount}</span>}
        </div>
      </div>}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 320px", gap: 20 }}>

        {/* ── Floor Plan View ── */}
        {roomView === "floorplan" ? (
          <div className="card" style={{ padding:20 }}>
            <div style={{ fontSize:11, color:"#6b7280", marginBottom:16, textTransform:"uppercase", letterSpacing:"0.1em", fontWeight:700 }}>
              Interactive Floor Plan — click room to view details
            </div>
            {FLOORS.map(floor => {
              const floorRooms = rooms.filter(r => r.floor === floor && (bhavanFilter === "All" || r.bhavan === bhavanFilter));
              if (floorRooms.length === 0) return null;
              const leftWing  = floorRooms.filter((_, i) => i % 2 === 0);
              const rightWing = floorRooms.filter((_, i) => i % 2 === 1);
              return (
                <div key={floor} style={{ marginBottom:24 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
                    <div style={{ fontSize:10, fontWeight:700, color:"#374151", textTransform:"uppercase", letterSpacing:"0.1em", background:"rgba(0,0,0,0.06)", padding:"4px 12px", borderRadius:20 }}>
                      {floor===0?"Ground Floor":`Floor ${floor}`}
                    </div>
                    <div style={{ flex:1, height:1, background:"rgba(0,0,0,0.08)" }} />
                    <div style={{ fontSize:10, color:"#9ca3af" }}>{floorRooms.length} rooms</div>
                  </div>
                  <div style={{ background:"rgba(0,0,0,0.02)", border:"1px solid rgba(0,0,0,0.06)", borderRadius:10, padding:10 }}>
                    <div style={{ display:"flex", gap:6, marginBottom:8, flexWrap:"wrap" }}>
                      {leftWing.map(room => {
                        const lr = reservations?.find(rv=>rv.room===room.number&&(rv.status==="Checked In"||rv.status==="Confirmed"||rv.status==="On Hold"));
                        const nl = lr?.checkOut?Math.ceil((new Date(lr.checkOut+"T00:00:00")-new Date(today+"T00:00:00"))/86400000):null;
                        const isBlocked=blockedRooms.has(room.id); const isSel=selected?.id===room.id;
                        const canBlockFP=["Available","Dirty","Checking Out","Blocked"].includes(room.status); return (<div key={room.id} onClick={()=>{if(blockMode){if(!canBlockFP)return;const s=new Set(blockedRooms);isBlocked?s.delete(room.id):s.add(room.id);setBlockedRooms(s);}else{selectRoom(room);}}}
                          style={{width:72,background:isBlocked?"rgba(239,68,68,0.15)":statusBg[room.status]||"rgba(34,197,94,0.15)",border:`2px solid ${isBlocked?"#dc2626":isSel?"#a07830":STATUS_COLORS[room.status]+"66"}`,borderRadius:6,padding:"8px 6px",cursor:"pointer",textAlign:"center",transition:"all 0.15s",boxShadow:isSel?"0 0 0 2px #a07830":"none"}}>
                          <div style={{fontSize:13,fontWeight:800,color:"#111827"}}>{room.number}</div>
                          <div style={{fontSize:9,color:"#6b7280",marginTop:2}}>{room.type.slice(0,3).toUpperCase()}</div>
                          <div style={{width:8,height:8,borderRadius:"50%",background:STATUS_COLORS[room.status]||"#22c55e",margin:"4px auto 0"}}/>
                          {nl!==null&&<div style={{fontSize:8,color:nl===0?"#a855f7":"#6b7280",fontWeight:700,marginTop:2}}>{nl===0?"OUT":`${nl}n`}</div>}
                          {lr&&<div style={{fontSize:7,color:"#374151",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:68}}>{lr.guest.split(" ")[0]}</div>}
                          {room.dnd&&<div style={{fontSize:7,color:"#ef4444",fontWeight:700}}>DND</div>}
                          {isBlocked&&<div style={{fontSize:9}}>🔒</div>}
                        </div>);
                      })}
                    </div>
                    <div style={{height:18,background:"rgba(0,0,0,0.04)",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:8}}>
                      <div style={{fontSize:9,color:"#9ca3af",letterSpacing:"0.15em",textTransform:"uppercase"}}>— Corridor —</div>
                    </div>
                    <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                      {rightWing.map(room => {
                        const lr = reservations?.find(rv=>rv.room===room.number&&(rv.status==="Checked In"||rv.status==="Confirmed"||rv.status==="On Hold"));
                        const nl = lr?.checkOut?Math.ceil((new Date(lr.checkOut+"T00:00:00")-new Date(today+"T00:00:00"))/86400000):null;
                        const isBlocked=blockedRooms.has(room.id); const isSel=selected?.id===room.id;
                        const canBlockFP=["Available","Dirty","Checking Out","Blocked"].includes(room.status); return (<div key={room.id} onClick={()=>{if(blockMode){if(!canBlockFP)return;const s=new Set(blockedRooms);isBlocked?s.delete(room.id):s.add(room.id);setBlockedRooms(s);}else{selectRoom(room);}}}
                          style={{width:72,background:isBlocked?"rgba(239,68,68,0.15)":statusBg[room.status]||"rgba(34,197,94,0.15)",border:`2px solid ${isBlocked?"#dc2626":isSel?"#a07830":STATUS_COLORS[room.status]+"66"}`,borderRadius:6,padding:"8px 6px",cursor:"pointer",textAlign:"center",transition:"all 0.15s",boxShadow:isSel?"0 0 0 2px #a07830":"none"}}>
                          <div style={{fontSize:13,fontWeight:800,color:"#111827"}}>{room.number}</div>
                          <div style={{fontSize:9,color:"#6b7280",marginTop:2}}>{room.type.slice(0,3).toUpperCase()}</div>
                          <div style={{width:8,height:8,borderRadius:"50%",background:STATUS_COLORS[room.status]||"#22c55e",margin:"4px auto 0"}}/>
                          {nl!==null&&<div style={{fontSize:8,color:nl===0?"#a855f7":"#6b7280",fontWeight:700,marginTop:2}}>{nl===0?"OUT":`${nl}n`}</div>}
                          {lr&&<div style={{fontSize:7,color:"#374151",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:68}}>{lr.guest.split(" ")[0]}</div>}
                          {room.dnd&&<div style={{fontSize:7,color:"#ef4444",fontWeight:700}}>DND</div>}
                          {isBlocked&&<div style={{fontSize:9}}>🔒</div>}
                        </div>);
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
            <div style={{display:"flex",gap:12,marginTop:16,flexWrap:"wrap"}}>
              {Object.entries(STATUS_COLORS).map(([s,col])=>(<div key={s} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#374151"}}><div style={{width:10,height:10,borderRadius:"50%",background:col}}/>{s}</div>))}
              <div style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#374151"}}><div style={{width:10,height:10,borderRadius:2,background:"rgba(239,68,68,0.3)",border:"1px solid #dc2626"}}/>Blocked</div>
            </div>
          </div>
        ) : (
        /* ── Room Grid ── */
        <div className="card">
          {filtered.length === 0 && (

                <div className="room-grid">

                    const linkedRes    = reservations?.find((rv) => rv.room === room.number && (rv.status === "Checked In" || rv.status === "Confirmed" || rv.status === "On Hold"));

                    const nightsLeft   = linkedRes?.checkOut ? Math.ceil((new Date(linkedRes.checkOut+"T00:00:00") - new Date(today+"T00:00:00")) / 86400000) : null;
                    const isDueToday   = nightsLeft === 0;
                    // Fix 10: on checkout day, show Checking Out instead of Occupied to match Gantt
                    const displayStatus = (room.status === "Occupied" && linkedRes?.checkOut === today)
                      ? "Checking Out" : room.status;

                        style={{
                          background: isBlocked ? "rgba(239,68,68,0.15)" : statusBg[displayStatus] || statusBg[room.status],
                          borderColor: isBlocked ? "#dc2626" : isSelected ? "#a07830" : isLinked ? "#3b82f6" : (STATUS_COLORS[displayStatus] || STATUS_COLORS[room.status]) + "44",

                            const canBlock = ["Available","Dirty","Checking Out","Blocked"].includes(room.status);

                            const s = new Set(blockedRooms);
                            isBlocked ? s.delete(room.id) : s.add(room.id);
                            setBlockedRooms(s);

                            selectRoom(room);
                          }

                        {room.dnd && <div style={{ position:"absolute", top:2, right:2, fontSize:8, background:"#ef4444", color:"#fff", borderRadius:3, padding:"0 3px" }}>DND</div>}

                        {nightsLeft === null && <div style={{ width:6, height:6, borderRadius:"50%", background:STATUS_COLORS[displayStatus]||STATUS_COLORS[room.status], marginTop:3 }} />}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        )} {/* end grid/floorplan toggle */}

        {/* ── Right Panel: Room Detail OR Consolidated Log ── */}

            const allMaint = rooms.flatMap(r =>

            );
            const priorityOrder = { High:0, Normal:1, Low:2 };
            const sorted = [...allMaint].sort((a,b) => (priorityOrder[a.priority]??1)-(priorityOrder[b.priority]??1));

                <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
                  {[

                    { label:"Normal", value:sorted.filter(l=>l.priority==="Normal").length, color:"#d97706", bg:"#fffbeb" },
                    { label:"Rooms", value:byRoom.length, color:"#3b82f6", bg:"#eff6ff" },

                    <div key={s.label} style={{ padding:"6px 12px", background:s.bg, borderRadius:8, textAlign:"center" }}>

            const ACTIVE_STATUSES = ["Occupied", "Checking Out"];

              .flatMap(r =>
                (r.serviceRequests||[]).filter(s=>s.status==="Open")

                    guestName:reservations.find(rv=>rv.room===r.number&&rv.status==="Checked In")?.guest||"—"}))

                    { label:"High",   value:allOpenReqs.filter(r=>r.priority==="High").length,           color:"#dc2626", bg:"#fef2f2" },
                    { label:"Normal", value:allOpenReqs.filter(r=>r.priority==="Normal").length,         color:"#d97706", bg:"#fffbeb" },
                    { label:"Rooms",  value:new Set(allOpenReqs.map(r=>r.roomId)).size,                  color:"#3b82f6", bg:"#eff6ff" },

                    <div key={s.label} style={{ flex:1, padding:"6px 8px", background:s.bg, border:`1px solid ${s.bg}`, borderRadius:8, textAlign:"center" }}>

                          </div>
                        </div>
                      );
                    })}
                  </div>

            const upcomingRes = (reservations || []).filter((r) => r.room === liveRoom.number && r.status !== "Checked Out" && r.status !== "Cancelled" && r.status !== "No Show").sort((a, b) => new Date(a.checkIn) - new Date(b.checkIn));
            const openLogs = (liveRoom.maintenanceLogs || []).filter((l) => l.status === "Open");
            const closedLogs = (liveRoom.maintenanceLogs || []).filter((l) => l.status === "Closed");
            const amenList = Object.entries(liveRoom.amenities || {}).filter(([, v]) => v).map(([k]) => ROOM_AMENITIES_LIST.find((a) => a.id === k)?.label).filter(Boolean);
            return (
              <div className="card" style={{ padding: 0, overflow: "hidden" }}>

                    <div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "var(--text-primary)" }}>Room {liveRoom.number}</div>
                      <div style={{ fontSize: 12, color: "#6b7280", marginTop: 2 }}>{liveRoom.type} · { liveRoom.floor === 0 ? "Ground Floor" : `Floor ${liveRoom.floor}` }{liveRoom.bhavan ? ` · ${liveRoom.bhavan.split("–")[0].trim()}` : ""}</div>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                        <StatusPill status={liveRoom.status} />
                        <button onClick={() => setSelected(null)} title="Close room detail"
                          style={{ background:"none", border:"none", color:"#9ca3af", fontSize:16, cursor:"pointer", lineHeight:1, padding:"0 2px" }}>✕</button>
                      </div>
                      {liveRoom.dnd && <span style={{ fontSize: 10, background: "#ef4444", color: "#fff", borderRadius: 4, padding: "1px 6px", fontWeight: 700 }}>🚫 DND</span>}

                    { id:"services", label:"Requests", icon:"🔔" },

                    { id:"history",  label:"Stays",    icon:"📋" },

                    <button key={t.id} onClick={() => setRoomDetailTab(t.id)}
                      style={{ flex:1, padding:"8px 2px", border:"none", borderBottom:`2px solid ${roomDetailTab===t.id?"#a07830":"transparent"}`,

                          {(liveRoom.serviceRequests||[]).filter(s=>s.status==="Open").length}
                        </span>

                        <span style={{ background:"#ef4444", color:"#fff", borderRadius:8, fontSize:9, padding:"1px 4px", lineHeight:1 }}>
                          {(liveRoom.maintenanceLogs||[]).filter(l=>l.status==="Open").length}

                      <div style={{ marginBottom: 14 }}>
                        <div style={{ padding: "8px 10px", background: "rgba(201,168,76,0.06)", border: "1px solid rgba(201,168,76,0.15)", borderRadius: 6 }}>

                          <div style={{ fontSize: 15, fontWeight: 700, color: "var(--gold)" }}>₹{rupees(liveRoom.rate)}</div>
                          <div style={{ fontSize: 10, color: "#9ca3af" }}>per night</div>
                        </div>
                      </div>

                      {/* Current Guest */}
                      {linkedRes && (
                        <div style={{ marginBottom: 14, padding: "10px 12px", background: "rgba(59,130,246,0.07)", border: "1px solid rgba(59,130,246,0.2)", borderRadius: 8 }}>
                          <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.08em", color: "#3b82f6", marginBottom: 6 }}>Current Guest</div>
                          <div style={{ fontWeight: 600, color: "var(--text-primary)", fontSize: 13 }}>{linkedRes.guest}</div>
                          <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>{linkedRes.id} · {linkedRes.adults || 1} Adult{(linkedRes.adults||1)!==1?"s":""}{linkedRes.children&&linkedRes.children!=="0"?` + ${linkedRes.children} Child`:""}</div>
                          <div style={{ display: "flex", gap: 12, marginTop: 6 }}>
                            <div><div style={{ fontSize: 9, color: "#9ca3af", textTransform: "uppercase" }}>Check-In</div><div style={{ fontSize: 11, color: "#a07830", fontWeight: 600 }}>{fmtD(linkedRes.checkIn)}</div></div>
                            <div><div style={{ fontSize: 9, color: "#9ca3af", textTransform: "uppercase" }}>Check-Out</div><div style={{ fontSize: 11, color: "#a855f7", fontWeight: 600 }}>{fmtD(linkedRes.checkOut)}</div></div>
                          </div>
                          {linkedRes.lateCheckOut && <div style={{ fontSize: 10, color: "#a855f7", marginTop: 4 }}>🌙 Late CO requested · {linkedRes.lateCheckOut} hrs</div>}

                          {/* Nights remaining */}
                          {(() => {

                              <div style={{ marginTop:8, padding:"6px 10px", borderRadius:6,

                                border:`1px solid ${nl<=0?"rgba(168,85,247,0.3)":nl===1?"rgba(245,158,11,0.3)":"rgba(34,197,94,0.2)"}` }}>

                          })()}
                          <button className="btn btn-ghost btn-sm" style={{ marginTop: 8, width: "100%", fontSize: 11, color: "#3b82f6", borderColor: "rgba(59,130,246,0.25)" }} onClick={() => onNavigate("reservations", { resFilter: "all" })}>View Reservation ↗</button>
                        </div>

                      {/* ── NEXT ARRIVAL (Confirmed or On Hold) ── */}
                      {(() => {

                        if (!nextArr) return null;
                        const isHold = nextArr.status === "On Hold";
                        const daysUntil = Math.ceil((new Date(nextArr.checkIn+"T00:00:00")-new Date(today+"T00:00:00"))/86400000);
                        return (
                          <div style={{ marginBottom:14, padding:"10px 12px", background: isHold?"rgba(201,168,76,0.07)":"rgba(34,197,94,0.06)", border:`1px solid ${isHold?"rgba(201,168,76,0.25)":"rgba(34,197,94,0.2)"}`, borderRadius:8 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                              <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", color: isHold?"#b45309":"#16a34a", fontWeight:700 }}>

                            <div style={{ display:"flex", gap:12, marginTop:6 }}>
                              <div><div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase" }}>Check-In</div><div style={{ fontSize:11, color:"#a07830", fontWeight:600 }}>{fmtD(nextArr.checkIn)}</div></div>
                              <div><div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase" }}>Check-Out</div><div style={{ fontSize:11, color:"#a855f7", fontWeight:600 }}>{fmtD(nextArr.checkOut)}</div></div>
                              <div><div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase" }}>Nights</div><div style={{ fontSize:11, fontWeight:600 }}>{Math.round((new Date(nextArr.checkOut)-new Date(nextArr.checkIn))/86400000)}</div></div>
                            </div>
                            {nextArr.eta && <div style={{ fontSize:10, color:"#6b7280", marginTop:4 }}>ETA {nextArr.eta} hrs</div>}
                            {isHold && nextArr.holdUntilDate && <div style={{ fontSize:10, color:"#b45309", marginTop:4 }}>⏰ Hold until {nextArr.holdUntilDate} {nextArr.holdUntilTime||"18:00"}</div>}
                            {nextArr.specialRequests && <div style={{ fontSize:10, color:"#f59e0b", marginTop:4 }}>📝 {nextArr.specialRequests}</div>}
                          </div>
                        );
                      })()}

                      {/* ── Blocked Info Card ── */}
                      {liveRoom.status === "Blocked" && (
                        <div style={{ marginBottom:14, padding:"12px 14px", background:"rgba(99,102,241,0.07)", border:"2px solid rgba(99,102,241,0.25)", borderRadius:10 }}>
                          <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", color:"#6366f1", fontWeight:700, marginBottom:8 }}>🔒 Block Details</div>
                          {liveRoom.blockedReason && (
                            <div style={{ fontSize:12, color:"#374151", marginBottom:6 }}>
                              <span style={{ color:"#9ca3af", fontSize:10 }}>Reason</span><br/>
                              <strong>{liveRoom.blockedReason}</strong>
                            </div>
                          )}
                          <div style={{ display:"flex", gap:16, marginBottom:10 }}>
                            {liveRoom.blockedFrom && (
                              <div><div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase" }}>From</div><div style={{ fontSize:11, fontWeight:600, color:"#6366f1" }}>{liveRoom.blockedFrom}</div></div>
                            )}
                            {liveRoom.blockedTo && (
                              <div><div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase" }}>Until</div><div style={{ fontSize:11, fontWeight:600, color:"#6366f1" }}>{liveRoom.blockedTo}</div></div>
                            )}
                            {!liveRoom.blockedFrom && !liveRoom.blockedTo && (
                              <div style={{ fontSize:11, color:"#9ca3af" }}>No date range set</div>
                            )}
                          </div>
                          <div style={{ display:"flex", gap:8 }}>
                            <button onClick={() => { setExtendBlockForm({ newTo: liveRoom.blockedTo || "", reason: "", releaseEarly: false }); setExtendBlockModal({ roomIds: [liveRoom.id], isBatch: false }); }}
                              style={{ flex:1, padding:"7px 0", borderRadius:7, border:"1px solid rgba(99,102,241,0.4)", background:"rgba(99,102,241,0.08)", color:"#6366f1", fontWeight:700, fontSize:11, cursor:"pointer" }}>
                              📅 Extend Block
                            </button>
                            <button onClick={() => { setExtendBlockForm({ newTo: liveRoom.blockedTo || "", reason: "", releaseEarly: true }); setExtendBlockModal({ roomIds: [liveRoom.id], isBatch: false }); }}
                              style={{ flex:1, padding:"7px 0", borderRadius:7, border:"1px solid rgba(245,158,11,0.4)", background:"rgba(245,158,11,0.07)", color:"#b45309", fontWeight:700, fontSize:11, cursor:"pointer" }}>
                              ✂ Release Early
                            </button>
                          </div>
                        </div>
                      )}

                      {/* Notes */}
                      {liveRoom.notes && (
                        <div style={{ marginBottom: 12, padding: "8px 10px", background: "rgba(245,158,11,0.06)", border: "1px solid rgba(245,158,11,0.2)", borderRadius: 6, fontSize: 12, color: "#b45309" }}>
                          📝 {liveRoom.notes}
                        </div>
                      )}

                      {/* Open Maintenance Alert */}
                      {openLogs.length > 0 && (
                        <div style={{ marginBottom: 12, padding: "8px 10px", background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.2)", borderRadius: 6, fontSize: 12, color: "#dc2626" }}>
                          🔧 {openLogs.length} open maintenance issue{openLogs.length > 1 ? "s" : ""} · <button style={{ background: "none", border: "none", color: "#dc2626", fontSize: 12, cursor: "pointer", textDecoration: "underline", padding: 0 }} onClick={() => setRoomDetailTab("maint")}>View</button>
                        </div>
                      )}



                      {/* Status Dropdown + Note */}
                      {(() => {
                        const statusMeta = {
                          "Available":    { color:"#16a34a", bg:"#f0fdf4", border:"#bbf7d0", hint:"Room is clean and ready for check-in." },
                          "Dirty":        { color:"#d97706", bg:"#fffbeb", border:"#fcd34d", hint:"Room needs cleaning after checkout." },
                          "Occupied":     { color:"#3b82f6", bg:"#eff6ff", border:"#bfdbfe", hint:"Guest currently in room." },
                          "Checking Out": { color:"#a855f7", bg:"#faf5ff", border:"#e9d5ff", hint:"Guest is checking out today." },
                          "Maintenance":  { color:"#ef4444", bg:"#fef2f2", border:"#fecaca", hint:"Room under repair or maintenance work." },
                          "Blocked":      { color:"#6366f1", bg:"#eef2ff", border:"#c7d2fe", hint:"Room held/blocked — not available for booking." },
                        };
                        const active = pendingStatus;
                        const meta = statusMeta[active] || {};
                        const needsNote = ["Maintenance","Dirty","Checking Out"].includes(active);
                        return (
                          <div style={{ marginBottom:12 }}>
                            <div style={{ fontSize:10, color:"#374151", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>Change Status</div>
                            <select value={active}
                              onChange={e => { setPendingStatus(e.target.value); setStatusNote(""); }}
                              style={{ width:"100%", padding:"9px 12px", fontSize:12, border:`1.5px solid ${meta.border||"#e2e8f0"}`, borderRadius:8, background:meta.bg||"#fff", color:meta.color||"#111827", fontWeight:600, outline:"none", boxSizing:"border-box", cursor:"pointer" }}>
                              {["Available","Occupied","Dirty","Maintenance","Checking Out","Blocked"].map(s => {
                                // Fix 6: block transitions that would desync from an active reservation
                                const isOccupied = liveRoom.status === "Occupied";
                                // Occupied rooms: only Maintenance (emergency) and Blocked (manager) allowed
                                // Available/Dirty/Checking Out would free the room while guest is inside
                                const occupiedUnsafe = isOccupied && ["Available","Dirty","Checking Out"].includes(s);
                                // Block only allowed from Available/Dirty/Checking Out
                                const canBlock = ["Available","Dirty","Checking Out"].includes(liveRoom.status);
                                const isDisabled = occupiedUnsafe || (s === "Blocked" && !canBlock);
                                const hint = occupiedUnsafe
                                  ? " (not allowed — guest in room; use Check Out)"
                                  : (s === "Blocked" && !canBlock) ? " (not allowed — room is " + liveRoom.status + ")" : "";
                                return <option key={s} value={s} disabled={isDisabled}>{s}{hint}</option>;
                              })}
                            </select>
                            {/* Fix 7: warn when changing status of an Occupied room manually */}
                            {liveRoom.status === "Occupied" && (
                              <div style={{ fontSize:10, color:"#b45309", marginTop:5, padding:"5px 8px", background:"rgba(245,158,11,0.07)", borderRadius:5, border:"1px solid rgba(245,158,11,0.2)" }}>
                                ⚠ This room has a live guest (Checked In). To end the stay, use <strong>Check Out</strong> in Reservations. Only Maintenance or Blocked overrides are allowed here.
                              </div>
                            )}


                            {meta.hint && (
                              <div style={{ fontSize:10, color:meta.color, marginTop:5, opacity:0.8 }}>{meta.hint}</div>
                            )}

                            {needsNote && (
                              <div style={{ marginTop:10 }}>
                                <div style={{ fontSize:10, color:"#374151", fontWeight:600, marginBottom:5 }}>
                                  Note {["Maintenance","Blocked"].includes(active) ? "*" : "(optional)"}
                                </div>
                                <textarea
                                  value={statusNote}
                                  onChange={e => setStatusNote(e.target.value)}
                                  placeholder={
                                    active === "Maintenance"  ? "e.g. AC not working, plumber called..." :
                                    active === "Blocked"      ? "e.g. VIP arrival prep, held for group..." :
                                    active === "Dirty"        ? "e.g. Deep clean required, pest spray..." :
                                    active === "Checking Out" ? "e.g. Guest extended, late checkout approved..." : ""
                                  }
                                  rows={2}
                                  style={{ width:"100%", padding:"8px 10px", fontSize:12, border:`1px solid ${meta.border||"#e2e8f0"}`, borderRadius:7, background:"#fff", color:"#111827", outline:"none", resize:"vertical", fontFamily:"inherit", boxSizing:"border-box" }}
                                />
                              </div>
                            )}

                            {pendingStatus && pendingStatus !== liveRoom.status && (
                              <div style={{ display:"flex", gap:8, marginTop:10 }}>
                                <button onClick={() => { setPendingStatus(""); setStatusNote(""); }}
                                  style={{ flex:1, padding:"8px", borderRadius:7, border:"1px solid #e2e8f0", background:"#fff", color:"#6b7280", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                                  Cancel
                                </button>
                                <button
                                  disabled={["Maintenance"].includes(pendingStatus) && !statusNote.trim()}
                                  onClick={() => {
                                    if (pendingStatus === "Blocked") {
                                      // Intercept — open Block Rooms modal for this single room
                                      setBlockedRooms(new Set([liveRoom.id]));
                                      setBlockForm({ reason:"", from:today, to:"", releaseEarly:false });
                                      setBlockModal(true);
                                      setPendingStatus("");
                                      setStatusNote("");
                                    } else {
                                      updateStatus(liveRoom.id, pendingStatus, statusNote.trim());
                                      setPendingStatus("");
                                      setStatusNote("");
                                    }
                                  }}
                                  style={{ flex:2, padding:"8px", borderRadius:7, border:`1.5px solid ${meta.border||"#e2e8f0"}`, background:meta.bg||"#f8fafc", color:meta.color||"#111827", cursor:"pointer", fontSize:12, fontWeight:700, opacity:(["Maintenance"].includes(pendingStatus)&&!statusNote.trim())?0.45:1 }}>
                                  {pendingStatus === "Blocked" ? "🔒 Set Block Details…" : `✓ Apply — ${pendingStatus}`}
