// ─── BILLING ──────────────────────────────────────────────────────────────────
function Billing({ reservations, setReservations, addLog }) {
  const [selected, setSelected] = useState(null);
  const [billingTab, setBillingTab] = useState("active"); // "active" | "pending"
  const [modal, setModal] = useState(null);
  const [chargeForm, setChargeForm] = useState({
    chargeCode: "",
    customDesc: "",
    description: "",
    qty: "1",
    rate: "",
    amount: "",
    useQtyRate: false,
    dateFrom: "",
    dateTo: "",
    chargeDate: new Date().toISOString().slice(0, 10),
    postedBy: "",
  });
  const [voidModal, setVoidModal] = useState(null); // { folioIdx, reason }
  const [editChargeModal, setEditChargeModal] = useState(null); // { folioIdx, desc, amount, chargeDate, postedBy }

  const CHARGE_ITEMS = [
    { group: "🏨 Room",         code: "RC001", label: "Extra Bed",            dateRange: true,  dateLabel: "nights" },
    { group: "🏨 Room",         code: "RC002", label: "Extra Person",         dateRange: true,  dateLabel: "nights" },
    { group: "🏨 Room",         code: "RC003", label: "Early Check-In Fee" },
    { group: "🏨 Room",         code: "RC004", label: "Late Check-Out Fee" },
    { group: "🏨 Room",         code: "RC005", label: "Room Upgrade" },
    { group: "🏨 Room",         code: "RC006", label: "Baby Cot / Crib",      dateRange: true,  dateLabel: "nights" },
    { group: "🍽 F&B",          code: "FB001", label: "Restaurant" },
    { group: "🍽 F&B",          code: "FB002", label: "Room Service" },
    { group: "🍽 F&B",          code: "FB003", label: "Minibar" },
    { group: "🍽 F&B",          code: "FB004", label: "Sanjeevika" },
    { group: "🍽 F&B",          code: "FB005", label: "Divya Misthan" },
    { group: "🍽 F&B",          code: "FB006", label: "Banquet / Events" },
    { group: "🧺 Laundry",      code: "LH001", label: "Laundry — Wash & Fold" },
    { group: "🧺 Laundry",      code: "LH002", label: "Laundry — Dry Cleaning" },
    { group: "🧺 Laundry",      code: "LH003", label: "Pressing / Ironing" },
    { group: "🧺 Laundry",      code: "LH004", label: "Extra Linen / Towels" },
    { group: "📞 Telecom",      code: "TC001", label: "Local / STD Calls" },
    { group: "📞 Telecom",      code: "TC002", label: "ISD Calls" },
    { group: "📞 Telecom",      code: "TC003", label: "Internet / Wi-Fi",     dateRange: true,  dateLabel: "days" },
    { group: "📞 Telecom",      code: "BC001", label: "Printing / Courier" },
    { group: "🚗 Transport",    code: "TR001", label: "Airport Pickup" },
    { group: "🚗 Transport",    code: "TR002", label: "Airport Drop" },
    { group: "🚗 Transport",    code: "TR003", label: "Local Taxi" },
    { group: "🚗 Transport",    code: "TR004", label: "Parking",              dateRange: true,  dateLabel: "days" },
    { group: "⚠ Damage",       code: "DP001", label: "Property Damage" },
    { group: "⚠ Damage",       code: "DP002", label: "Smoking Penalty" },
    { group: "⚠ Damage",       code: "DP003", label: "Lost Key / Card" },
    { group: "📋 Other",        code: "MS001", label: "Miscellaneous" },
  ];
  const [payForm, setPayForm] = useState({ paymentType: "full", splits: [{ id: 1, method: "UPI", amount: "", ref: "", extra: "" }], note: "", collectedBy: "", discount: "", discountReason: "", tip: "" });
  const [discountInput, setDiscountInput] = useState("");
  const [editDiscountModal, setEditDiscountModal] = useState(null); // { folioIdx, amount }
  const [showPaySuccess, setShowPaySuccess] = useState(null); // reservation after payment
  const [tipForm, setTipForm] = useState({ amount: "", method: "Cash", ref: "", staffName: "", note: "" });

  const res = selected ? reservations.find((r) => r.id === selected) : null;


  function addCharge() {
    const item = CHARGE_ITEMS.find(i => i.code === chargeForm.chargeCode);
    const isCustom = chargeForm.chargeCode === "MS001";
    if (!chargeForm.chargeCode) return;
    if (isCustom && !chargeForm.customDesc.trim()) return;

    const baseLabel = isCustom ? chargeForm.customDesc.trim() : item.label;
    const chargeCode = chargeForm.chargeCode;

    // Auto-compute nights/days from date range if applicable
    let resolvedQty = parseFloat(chargeForm.qty) || 1;
    if (item?.dateRange && chargeForm.dateFrom && chargeForm.dateTo) {
      const diff = Math.round((new Date(chargeForm.dateTo) - new Date(chargeForm.dateFrom)) / 86400000);
      if (diff > 0) resolvedQty = diff;
    }

    let baseAmt;
    if (chargeForm.useQtyRate) {
      const rate = parseFloat(chargeForm.rate) || 0;
      baseAmt = Math.round(resolvedQty * rate * 100) / 100;
    } else {
      baseAmt = parseFloat(chargeForm.amount) || 0;
    }
    if (baseAmt <= 0) return;

    const descParts = [baseLabel];
    if (item?.dateRange && chargeForm.dateFrom && chargeForm.dateTo) {
      const fmt = d => new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
      descParts.push(`${fmt(chargeForm.dateFrom)} – ${fmt(chargeForm.dateTo)} (${resolvedQty} ${item.dateLabel})`);
    } else if (chargeForm.useQtyRate && resolvedQty !== 1) {
      descParts[0] = `${baseLabel} × ${resolvedQty}`;
    }
    if (chargeForm.description.trim()) descParts.push(chargeForm.description.trim());
    const desc = descParts.join(" · ");

    const folioEntry = {
      desc,
      amount: baseAmt,
      chargeCode,
      department: item?.group || "",
      chargeDate: chargeForm.chargeDate || new Date().toISOString().slice(0, 10),
      postedBy: chargeForm.postedBy.trim() || "Front Office",
      date: new Date().toISOString(),
      voided: false,
    };

    setReservations(reservations.map((r) =>
      r.id === selected ? {
        ...r,
        folio: [...r.folio, folioEntry],
        total: r.total + baseAmt,
      } : r
    ));
    addLog(`Charge [${chargeCode}] added to ${res.guest} (${res.id}): ${desc} — ₹${rupees(baseAmt)}`, "pos");
    setChargeForm({ chargeCode: "", customDesc: "", description: "", qty: "1", rate: "", amount: "", useQtyRate: false, dateFrom: "", dateTo: "", chargeDate: new Date().toISOString().slice(0, 10), postedBy: "" });
    setModal(null);
  }

  function voidCharge(folioIdx, reason) {
    const item = res.folio[folioIdx];
    const reversalDesc = `VOID — ${item.desc}${reason ? ` (${reason})` : ""}`;
    const updated = res.folio.map((f, i) => i === folioIdx ? { ...f, voided: true, voidReason: reason, voidAt: new Date().toISOString() } : f);
    setReservations(reservations.map((r) =>
      r.id === selected ? {
        ...r,
        folio: [...updated, { desc: reversalDesc, amount: -item.amount, date: new Date().toISOString(), postedBy: "Front Office", isVoidReversal: true }],
        total: r.total - item.amount,
      } : r
    ));
    addLog(`Charge voided on ${res.guest} (${res.id}): ${item.desc} — ₹${rupees(item.amount)}. Reason: ${reason || "—"}`, "pos");
    setVoidModal(null);
  }

  function editCharge() {
    const m = editChargeModal;
    const oldItem = res.folio[m.folioIdx];
    const newAmt = parseFloat(m.amount) || 0;
    if (newAmt <= 0) return;
    const diff = newAmt - oldItem.amount;
    setReservations(reservations.map((r) =>
      r.id === selected ? {
        ...r,
        folio: r.folio.map((f, i) => i === m.folioIdx ? {
          ...f,
          desc: m.desc.trim() || f.desc,
          amount: newAmt,
          chargeDate: m.chargeDate || f.chargeDate,
          postedBy: m.postedBy.trim() || f.postedBy,
          editedAt: new Date().toISOString(),
        } : f),
        total: r.total + diff,
      } : r
    ));
    addLog(`Charge edited on ${res.guest} (${res.id}): "${oldItem.desc}" ₹${rupees(oldItem.amount)} → "${m.desc}" ₹${rupees(newAmt)}`, "pos");
    setEditChargeModal(null);
  }

  function deleteCharge(folioIdx) {
    const item = res.folio[folioIdx];
    setReservations(reservations.map((r) =>
      r.id === selected ? {
        ...r,
        folio: r.folio.filter((_, i) => i !== folioIdx),
        total: r.total - item.amount,
      } : r
    ));
    addLog(`Charge deleted on ${res.guest} (${res.id}): ${item.desc} — ₹${rupees(item.amount)}`, "pos");
  }

  function recordTip() {
    const amt = Math.round((parseFloat(tipForm.amount) || 0) * 100) / 100;
    if (amt <= 0) return;
    const now = new Date();
    const receiptNo = `TIP-${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*9000)+1000)}`;
    const ts = now.toISOString();
    const staffPart = tipForm.staffName.trim() ? ` — ${tipForm.staffName.trim()}` : "";
    const notePart  = tipForm.note.trim() ? ` · ${tipForm.note.trim()}` : "";
    const tipEntry = {
      desc: `Tip / Donation${staffPart}${notePart} [${tipForm.method}]`,
      amount: amt,
      date: ts,
      receiptNo,
      isTip: true,
      tipMethod: tipForm.method,
      tipRef: tipForm.ref?.trim() || "",
      staffName: tipForm.staffName.trim() || "Front Office",
      collectedBy: tipForm.staffName.trim() || "Front Office",
    };
    // Append to folio as a separate donation/tip entry — does NOT affect paid/total
    const updatedRes = { ...res, folio: [...res.folio, tipEntry], tips: (res.tips || 0) + amt };
    setReservations(reservations.map(r => r.id === selected ? updatedRes : r));
    addLog(`Tip ₹${rupees(amt)} (${tipForm.method}) recorded for ${res.guest} (${res.id})${staffPart} · Receipt ${receiptNo}`, "pos");
    setTipForm({ amount: "", method: "Cash", ref: "", staffName: "", note: "" });
    setModal(null);
  }

  function addPayment() {
    const validSplits = payForm.splits.filter(s => parseFloat(s.amount) > 0);
    if (!validSplits.length) return;

    const balanceDue = Math.round(((res.total || 0) - (res.paid || 0)) * 100) / 100;
    const discAmt = Math.round((parseFloat(payForm.discount) || 0) * 100) / 100;
    const tipAmt  = Math.round((parseFloat(payForm.tip)      || 0) * 100) / 100;
    const adjustedBalance = Math.max(0, Math.round((balanceDue - discAmt) * 100) / 100);

    // Tip is separated from payment total — collected alongside but tracked as donation
    const totalCollected  = Math.round(validSplits.reduce((s, sp) => s + parseFloat(sp.amount), 0) * 100) / 100;
    const paymentOnly     = Math.max(0, Math.round((totalCollected - tipAmt) * 100) / 100);
    const totalApplied    = Math.min(paymentOnly, adjustedBalance);

    const now = new Date();
    const receiptNo    = `RCT-${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*9000)+1000)}`;
    const tipReceiptNo = tipAmt > 0 ? `TIP-${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*9000)+1000)}` : null;
    const ts = now.toISOString();

    // Build payment folio lines (exclude tip amount from ratio calc)
    const ratio = totalApplied > 0 ? totalApplied / Math.max(paymentOnly, 0.01) : 0;
    const paymentSplits = validSplits.map((sp, i) => {
      const rawAmt = Math.max(0, parseFloat(sp.amount) - (i === validSplits.length - 1 ? tipAmt : 0));
      const applied = i < validSplits.length - 1
        ? Math.round(rawAmt * ratio * 100) / 100
        : Math.round((totalApplied - validSplits.slice(0, i).reduce((s, x) => s + Math.round(Math.max(0,parseFloat(x.amount)) * ratio * 100) / 100, 0)) * 100) / 100;
      const refPart  = sp.ref.trim()   ? ` · Ref: ${sp.ref.trim()}`   : "";
      const extrPart = sp.extra.trim() ? ` · ${sp.extra.trim()}`       : "";
      const notePart = payForm.note.trim() ? ` · ${payForm.note.trim()}` : "";
      const typePart = payForm.paymentType === "deposit" ? " [Deposit]" : payForm.paymentType === "partial" ? " [Partial]" : "";
      return { desc: `Payment — ${sp.method}${refPart}${extrPart}${notePart}${typePart}`, amount: -Math.abs(applied), date: ts, receiptNo, collectedBy: payForm.collectedBy.trim() || "Front Office" };
    });

    if (discAmt > 0) {
      const reason = payForm.discountReason.trim() ? ` · ${payForm.discountReason.trim()}` : "";
      paymentSplits.unshift({ desc: `Discount applied${reason}`, amount: -discAmt, date: ts, receiptNo });
    }

    // Tip is a separate donation/tip entry — does NOT touch res.total or res.paid
    const tipEntry = tipAmt > 0 ? {
      desc: `Tip / Donation — ${payForm.collectedBy.trim() || "Front Office"}`,
      amount: tipAmt,
      date: ts,
      receiptNo: tipReceiptNo,
      isTip: true,
      tipMethod: validSplits[validSplits.length - 1]?.method || "Cash",
      staffName: payForm.collectedBy.trim() || "Front Office",
      collectedBy: payForm.collectedBy.trim() || "Front Office",
    } : null;

    const newPaid     = res.paid + totalApplied;
    const newFolio    = [...res.folio, ...paymentSplits, ...(tipEntry ? [tipEntry] : [])];
    const updatedRes  = { ...res, paid: newPaid, discount: (res.discount || 0) + discAmt, total: discAmt > 0 ? res.total - discAmt : res.total, folio: newFolio, tips: (res.tips || 0) + tipAmt };

    setReservations(reservations.map((r) => r.id === selected ? updatedRes : r));
    const methodSummary = validSplits.map(s => `${s.method} ₹${rupees(parseFloat(s.amount))}`).join(" + ");
    addLog(`Payment ₹${rupees(totalApplied)} (${methodSummary})${discAmt > 0 ? ` · Discount ₹${rupees(discAmt)}` : ""}${tipAmt > 0 ? ` · Tip/Donation ₹${rupees(tipAmt)} · Receipt ${tipReceiptNo}` : ""} recorded for ${res.guest} (${res.id}) · Receipt ${receiptNo}`, "pos");
    setPayForm({ paymentType: "full", splits: [{ id: 1, method: "UPI", amount: "", ref: "", extra: "" }], note: "", collectedBy: "", discount: "", discountReason: "", tip: "" });
    setModal(null);
    setShowPaySuccess({ res: updatedRes, splits: validSplits, totalApplied, receiptNo, collectedBy: payForm.collectedBy.trim() || "Front Office", paymentType: payForm.paymentType, at: ts, discAmt, tipAmt });
  }

  function applyDiscount() {
    const disc = parseFloat(discountInput);
    if (!disc || disc <= 0) return;
    if (res.folio.some(item => item.desc.startsWith("Discount"))) return; // one discount only
    const maxDisc = res.total - res.paid; // can't discount below paid amount
    const applied = Math.min(disc, maxDisc);
    setReservations(reservations.map((r) =>
      r.id === selected ? {
        ...r,
        discount: (r.discount || 0) + applied,
        total: r.total - applied,
        folio: [...r.folio, { desc: `Discount applied`, amount: -applied }],
      } : r
    ));
    if (res) addLog(`Discount of ₹${rupees(applied)} applied to ${res.guest} (${res.id})`, "pos");
    setDiscountInput("");
  }

  }

    ));
    if (res) addLog(`Discount updated for ${res.guest} (${res.id}): ₹${rupees(oldAmt)} → ₹${rupees(newAmt)}`, "pos");

              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20 }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                    <div className="card-title" style={{ marginBottom: 0 }}>Folio — {res.guest}</div>
                    <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 10px", borderRadius: 20,
                      background: res.status === "Checked In" ? "rgba(34,197,94,0.15)" : "rgba(59,130,246,0.15)",
                      color: res.status === "Checked In" ? "#22c55e" : "#3b82f6",
                      border: `1px solid ${res.status === "Checked In" ? "rgba(34,197,94,0.3)" : "rgba(59,130,246,0.3)"}`,
                      textTransform: "uppercase", letterSpacing: "0.08em" }}>
                      {res.status}
                    </span>
                  </div>
                  <div style={{ fontSize: 12, color: "#6b7280" }}>
                    {res.id} · Room {res.room} · {res.bhavan} · {new Date(res.checkIn).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})} → {new Date(res.checkOut).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn btn-ghost btn-sm" onClick={() => printInvoice(res)} title="Print Invoice">🖨 Invoice</button>
                  {res.status === "Checked In" && (
                    <>
                      <button className="btn btn-ghost btn-sm" onClick={() => { setChargeForm({ chargeCode: "", customDesc: "", description: "", qty: "1", rate: "", amount: "", useQtyRate: false, dateFrom: "", dateTo: "", chargeDate: new Date().toISOString().slice(0, 10), postedBy: "" }); setModal("charge"); }}>+ Charge</button>
                      <button className="btn btn-primary btn-sm" onClick={() => { setPayForm({ paymentType: "full", splits: [{ id: Date.now(), method: "UPI", amount: "", ref: "", extra: "" }], note: "", collectedBy: "", discount: "", discountReason: "", tip: "" }); setModal("pay"); }}>Record Payment</button>
                    </>
                  )}
                  {res.status === "Checked Out" && Math.round(((res.total||0)-(res.paid||0))*100)/100 > 0 && (
                    <button className="btn btn-primary btn-sm" style={{ background:"#ef4444", borderColor:"#ef4444" }}
                      onClick={() => { setPayForm({ paymentType: "full", splits: [{ id: Date.now(), method: "UPI", amount: String(Math.round(((res.total||0)-(res.paid||0))*100)/100), ref: "", extra: "" }], note: "Late payment — post checkout", collectedBy: "", discount: "", discountReason: "", tip: "" }); setModal("pay"); }}>
                      💳 Record Payment
                    </button>
                  )}
                  <button className="btn btn-ghost btn-sm" style={{ color:"#f59e0b", borderColor:"rgba(245,158,11,0.4)", background:"rgba(245,158,11,0.06)" }}
                    onClick={() => setModal("tip")}
                    title="Record a tip — separate from folio">
                    💝 Record Tip
                  </button>
                </div>
              </div>

              {/* Read-only notice for checked-out */}
              {res.status === "Checked Out" && (() => {
                const bal = Math.round(((res.total||0)-(res.paid||0))*100)/100;
                return bal > 0 ? (
                  <div style={{ background:"rgba(239,68,68,0.06)", border:"1px solid rgba(239,68,68,0.25)", borderRadius:8, padding:"10px 14px", marginBottom:16, fontSize:12, display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:16 }}>⚠️</span>
                    <div style={{ flex:1 }}>
                      <span style={{ fontWeight:700, color:"#dc2626" }}>₹{rupees(bal)} outstanding</span>
                      <span style={{ color:"#6b7280" }}> — charges are locked. Use </span>
                      <strong style={{ color:"#ef4444" }}>💳 Record Payment</strong>
                      <span style={{ color:"#6b7280" }}> above to collect the balance.</span>
                    </div>
                  </div>
                ) : (
                  <div style={{ background:"rgba(59,130,246,0.06)", border:"1px solid rgba(59,130,246,0.2)", borderRadius:8, padding:"10px 14px", marginBottom:16, fontSize:12, color:"#6b7280", display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:14 }}>🔒</span>
                    <span>Folio <strong style={{ color:"#22c55e" }}>settled ✓</strong> — read-only. Use 🖨 Invoice to reprint.</span>
                  </div>
                );
              })()}

              {/* Folio rows */}
              {res.folio.map((item, i) => {
                const isDiscount = item.desc.startsWith("Discount");
                const isPayment = item.date && (item.desc.startsWith("Advance") || item.desc.startsWith("Payment"));
                const isVoid = item.voided;
                const isVoidReversal = item.isVoidReversal;
                const isCharge = !isDiscount && !isPayment && !isVoidReversal && item.amount > 0;
                const deptColors = {
                  "Room & Accommodation": "#3b82f6",
                  "Food & Beverage": "#f59e0b",
                  "Laundry & Housekeeping": "#8b5cf6",
                  "Telecom & Business": "#06b6d4",
                  "Transport": "#10b981",
                  "Damage & Penalties": "#ef4444",
                  "Miscellaneous": "#6b7280",
                };
                const deptColor = item.department ? deptColors[item.department] : null;
                return (
                  <div key={i} className="folio-row" style={{ alignItems: "flex-start", opacity: isVoid ? 0.45 : 1, background: isVoid ? "rgba(239,68,68,0.03)" : isVoidReversal ? "rgba(34,197,94,0.03)" : "transparent" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        {item.chargeCode && (
                          <span style={{ fontSize: 9, fontFamily: "monospace", background: "rgba(0,0,0,0.06)", color: "#6b7280", borderRadius: 3, padding: "1px 5px" }}>{item.chargeCode}</span>
                        )}
                        {item.department && (
                          <span style={{ fontSize: 9, color: deptColor, background: `${deptColor}15`, border: `1px solid ${deptColor}30`, borderRadius: 3, padding: "1px 5px" }}>{item.department.split(" ")[0]}</span>
                        )}
                        {isVoid && <span style={{ fontSize: 9, background: "#ef4444", color: "#fff", borderRadius: 3, padding: "1px 5px", fontWeight: 700 }}>VOIDED</span>}
                        {isVoidReversal && <span style={{ fontSize: 9, background: "#22c55e", color: "#fff", borderRadius: 3, padding: "1px 5px", fontWeight: 700 }}>REVERSAL</span>}
                        <span style={{ color: item.amount < 0 ? "#22c55e" : isVoid ? "#9ca3af" : "#374151", textDecoration: isVoid ? "line-through" : "none", fontSize: 13 }}>{item.desc}</span>
                      </div>
                      <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 2, display: "flex", gap: 10, flexWrap: "wrap" }}>
                        {item.chargeDate && !isPayment && <span>📅 {item.chargeDate}</span>}
                        {isPayment && item.date && (
                          <span>{new Date(item.date).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })} · {new Date(item.date).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true })}</span>
                        )}
                        {item.postedBy && !isPayment && <span>👤 {item.postedBy}</span>}
                        {item.taxPct > 0 && <span style={{ color: "#a07830" }}>GST {item.taxPct}% = ₹{rupees(item.taxAmount)}</span>}
                        {item.voidReason && <span style={{ color: "#ef4444" }}>Void reason: {item.voidReason}</span>}
                        {item.receiptNo && <span>Rcpt: {item.receiptNo}</span>}
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, paddingTop: 2 }}>
                      <span style={{ color: item.amount < 0 ? "#22c55e" : isVoid ? "#9ca3af" : "#111827", fontWeight: isPayment ? 700 : 400, textDecoration: isVoid ? "line-through" : "none" }}>
                        {item.amount < 0 ? `−₹${rupees(Math.abs(item.amount))}` : `₹${rupees(item.amount)}`}
                      </span>
                      {isDiscount && res.status === "Checked In" && (
                        <>
                          <button onClick={() => setEditDiscountModal({ folioIdx: i, amount: String(Math.abs(item.amount)) })}
                            title="Edit discount"
                            style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, padding: "2px 4px", color: "#a07830", lineHeight: 1 }}>✏️</button>
                          <button onClick={() => removeDiscount(i)}
                            title="Remove discount"
                            style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, padding: "2px 4px", color: "#ef4444", lineHeight: 1 }}>🗑</button>
                        </>
                      )}
                      {isCharge && res.status === "Checked In" && !isVoid && !item.desc.startsWith("Room charge") && (
                        <>
                          <button onClick={() => setEditChargeModal({ folioIdx: i, desc: item.desc, amount: String(item.amount), chargeDate: item.chargeDate || "", postedBy: item.postedBy || "" })}
                            title="Edit charge"
                            style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, padding: "2px 4px", color: "#a07830", lineHeight: 1 }}>✏️</button>
                          <button onClick={() => setVoidModal({ folioIdx: i, reason: "" })}
                            title="Void charge — posts a reversal entry with mandatory reason (audit-logged)"
                            style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, padding: "2px 4px", color: "#ef4444", lineHeight: 1 }}>⊘</button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}

              {/* Folio action legend */}
              {res.status === "Checked In" && (
                <div style={{ display:"flex", gap:16, padding:"6px 0 10px", fontSize:10, color:"#9ca3af", borderTop:"1px dashed rgba(0,0,0,0.06)", marginTop:4 }}>
                  <span>✏️ Edit amount / description</span>
                  <span>⊘ Void — posts reversal + audit log</span>
                </div>
              )}
              <div className="folio-total">
                <span>Total</span><span>₹{rupees(res.total)}</span>
              </div>
              {res.discount > 0 && (
                <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontSize: 13 }}>
                  <span style={{ color: "#22c55e" }}>Total Discount Applied</span>
                  <span style={{ color: "#22c55e" }}>−₹{rupees(res.discount)}</span>
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", fontSize: 13 }}>
                <span style={{ color: "#22c55e" }}>Paid</span>
                <span style={{ color: "#22c55e" }}>₹{rupees(res.paid)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", fontSize: 15, fontWeight: 700 }}>
                <span style={{ color: "#ef4444" }}>Balance Due</span>
                <span style={{ color: Math.round((res.total - res.paid) * 100) / 100 <= 0 ? "#22c55e" : "#ef4444" }}>
                  ₹{rupees(Math.max(0, res.total - res.paid))}
                </span>
              </div>

              {/* Progress bar */}
              <div style={{ marginTop: 16 }}>
                <div style={{ height: 8, background: "#f0f2f5", borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${Math.min((res.paid / res.total) * 100, 100)}%`, background: res.paid >= res.total ? "#22c55e" : "#a07830", borderRadius: 4, transition: "width 0.4s" }} />
                </div>
                <div style={{ fontSize: 12, color: res.paid >= res.total ? "#22c55e" : "#6b7280", marginTop: 6 }}>
                  {Math.round(Math.min((res.paid / res.total) * 100, 100))}% paid{res.paid >= res.total ? " · Cleared ✓" : ""}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ── TIP / GRATUITY MODAL ── */}
      {modal === "tip" && res && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal" style={{ maxWidth:400 }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">💝 Record Tip / Donation</div>
              <button className="modal-close" onClick={() => setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{ background:"rgba(245,158,11,0.08)", border:"1px solid rgba(245,158,11,0.2)", borderRadius:8, padding:"10px 14px", marginBottom:16, fontSize:12, color:"#a07830" }}>
                💡 Recorded as a <strong>separate donation/tip entry</strong> — does not affect the folio or room revenue.
              </div>
              <div style={{ fontSize:12, color:"#6b7280", marginBottom:16 }}>
                Guest: <strong>{res.guest}</strong> · Room {res.room} · {res.id}
              </div>

              {/* Amount + quick picks */}
              <div className="form-group">
                <label>Amount (₹) *</label>
                <input type="number" min="0" placeholder="e.g. 500"
                  value={tipForm.amount} onChange={e => setTipForm({...tipForm, amount: e.target.value})} />
                <div style={{ display:"flex", gap:8, marginTop:8 }}>
                  {[100,200,500,1000].map(a => (
                    <button key={a} onClick={() => setTipForm({...tipForm, amount: String(a)})}
                      style={{ padding:"4px 12px", borderRadius:6, border:"1px solid rgba(245,158,11,0.4)", background: tipForm.amount === String(a) ? "rgba(245,158,11,0.2)" : "rgba(245,158,11,0.06)", color:"#a07830", fontSize:12, cursor:"pointer", fontWeight:600 }}>
                      ₹{a}
                    </button>
                  ))}
                </div>
              </div>

              {/* Method toggle — Cash or UPI only */}
              <div className="form-group">
                <label>Payment Method</label>
                <div style={{ display:"flex", gap:8, marginTop:4 }}>
                  {[{ id:"Cash", icon:"💵" }, { id:"UPI", icon:"📲" }].map(m => (
                    <button key={m.id} onClick={() => setTipForm({...tipForm, method: m.id, ref: ""})}
                      style={{ flex:1, padding:"8px 0", borderRadius:8, border:`1.5px solid ${tipForm.method===m.id ? "#f59e0b" : "rgba(0,0,0,0.12)"}`,
                        background: tipForm.method===m.id ? "rgba(245,158,11,0.12)" : "#fff",
                        color: tipForm.method===m.id ? "#a07830" : "#6b7280",
                        fontWeight:700, fontSize:13, cursor:"pointer", transition:"all 0.15s" }}>
                      {m.icon} {m.id}
                    </button>
                  ))}
                </div>
              </div>

              {/* UPI — show transaction ID field */}
              {tipForm.method === "UPI" && (
                <div className="form-group">
                  <label>UPI Transaction ID</label>
                  <input placeholder="e.g. 4236xxxx1234" value={tipForm.ref || ""}
                    onChange={e => setTipForm({...tipForm, ref: e.target.value})}
                    style={{ fontFamily:"monospace", fontSize:13 }} />
                </div>
              )}

              {/* Cash — show denomination/remarks */}
              {tipForm.method === "Cash" && (
                <div className="form-group">
                  <label>Denomination / Remarks <span style={{ color:"#9ca3af", fontWeight:400 }}>(optional)</span></label>
                  <input placeholder="e.g. 2×500 + 4×100" value={tipForm.ref || ""}
                    onChange={e => setTipForm({...tipForm, ref: e.target.value})} />
                </div>
              )}

              {/* Staff name + note — always visible */}
              <div className="form-group">
                <label>Staff / Recipient Name <span style={{ color:"#9ca3af", fontWeight:400 }}>(optional)</span></label>
                <input placeholder="e.g. Ramesh (Housekeeping)" value={tipForm.staffName}
                  onChange={e => setTipForm({...tipForm, staffName: e.target.value})} />
              </div>
              <div className="form-group">
                <label>Note <span style={{ color:"#9ca3af", fontWeight:400 }}>(optional)</span></label>
                <input placeholder="e.g. Excellent service during stay" value={tipForm.note}
                  onChange={e => setTipForm({...tipForm, note: e.target.value})} />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn btn-primary" style={{ background:"#f59e0b", borderColor:"#f59e0b", color:"#000" }}
                onClick={recordTip} disabled={!(parseFloat(tipForm.amount) > 0)}>
                💝 Record Tip
              </button>
            </div>
          </div>
        </div>
      )}

      {modal === "charge" && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal" style={{ maxWidth: 460 }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">Add Charge</div>
                <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>{res?.guest} · Room {res?.room}</div>
              </div>
              <button className="modal-close" onClick={() => setModal(null)}>✕</button>
            </div>
            <div className="modal-body" style={{ display: "flex", flexDirection: "column", gap: 14 }}>

              {/* Single charge type dropdown with optgroups */}
              <div className="form-group" style={{ marginBottom: 0 }}>
                <label>Charge Type *</label>
                <select value={chargeForm.chargeCode}
                  onChange={e => {
                    const newItem = CHARGE_ITEMS.find(i => i.code === e.target.value);
                    // auto-enable qty×rate when switching to a date-range item
                    setChargeForm({ ...chargeForm, chargeCode: e.target.value, customDesc: "",
                      useQtyRate: newItem?.dateRange ? true : chargeForm.useQtyRate,
                      dateFrom: newItem?.dateRange ? (res?.checkIn || "") : "",
                      dateTo:   newItem?.dateRange ? (res?.checkOut || "") : "",
                    });
                  }} autoFocus>
                  <option value="">— Select charge type —</option>
                  {(() => {
                    const groups = [...new Set(CHARGE_ITEMS.map(i => i.group))];
                    return groups.map(g => (
                      <optgroup key={g} label={g}>
                        {CHARGE_ITEMS.filter(i => i.group === g).map(i => (
                          <option key={i.code} value={i.code}>{i.label}</option>
                        ))}
                      </optgroup>
                    ));
                  })()}
                </select>
              </div>

              {/* Custom description for Miscellaneous */}
              {chargeForm.chargeCode === "MS001" && (
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Describe Charge *</label>
                  <input value={chargeForm.customDesc} onChange={e => setChargeForm({ ...chargeForm, customDesc: e.target.value })}
                    placeholder="e.g. Telephone, lost item, newspaper delivery..." />
                </div>
              )}

              {/* Date range — shown for per-night/per-day charge types */}
              {(() => {
                const item = CHARGE_ITEMS.find(i => i.code === chargeForm.chargeCode);
                if (!item?.dateRange) return null;
                const nights = (chargeForm.dateFrom && chargeForm.dateTo)
                  ? Math.max(0, Math.round((new Date(chargeForm.dateTo) - new Date(chargeForm.dateFrom)) / 86400000))
                  : 0;
                const unitLabel = item.dateLabel === "nights" ? "night" : "day";
                return (
                  <div style={{ background: "rgba(59,130,246,0.04)", border: "1px solid rgba(59,130,246,0.18)", borderRadius: 10, padding: "12px 14px" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: "#3b82f6", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>
                      📅 Charge Period
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 10, alignItems: "flex-end" }}>
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label>From *</label>
                        <input type="date" value={chargeForm.dateFrom}
                          min={res?.checkIn || ""} max={chargeForm.dateTo || res?.checkOut || ""}
                          onChange={e => setChargeForm({ ...chargeForm, dateFrom: e.target.value })} />
                      </div>
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label>To *</label>
                        <input type="date" value={chargeForm.dateTo}
                          min={chargeForm.dateFrom || res?.checkIn || ""} max={res?.checkOut || ""}
                          onChange={e => setChargeForm({ ...chargeForm, dateTo: e.target.value })} />
                      </div>
                      <div style={{ paddingBottom: 2, textAlign: "center", minWidth: 56 }}>
                        {nights > 0 ? (
                          <div style={{ background: "rgba(59,130,246,0.12)", border: "1px solid rgba(59,130,246,0.3)", borderRadius: 8, padding: "6px 10px" }}>
                            <div style={{ fontSize: 16, fontWeight: 700, color: "#3b82f6", lineHeight: 1 }}>{nights}</div>
                            <div style={{ fontSize: 10, color: "#6b7280", marginTop: 2 }}>{unitLabel}{nights !== 1 ? "s" : ""}</div>
                          </div>
                        ) : (
                          <div style={{ fontSize: 11, color: "#9ca3af" }}>—</div>
                        )}
                      </div>
                    </div>
                    {nights > 0 && chargeForm.rate && (
                      <div style={{ marginTop: 8, fontSize: 12, color: "#3b82f6" }}>
                        ₹{rupees(parseFloat(chargeForm.rate)||0)} × {nights} {unitLabel}{nights !== 1 ? "s" : ""} = <strong>₹{rupees(Math.round((parseFloat(chargeForm.rate)||0) * nights * 100)/100)}</strong>
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* Notes */}
              <div className="form-group" style={{ marginBottom: 0 }}>
                <label>Notes <span style={{ fontSize: 11, color: "#9ca3af", fontWeight: 400 }}>(optional)</span></label>
                <input value={chargeForm.description} onChange={e => setChargeForm({ ...chargeForm, description: e.target.value })}
                  placeholder="e.g. quantity, POS ref, guest name..." />
              </div>

              {/* Amount row */}
              {(() => {
                const item = CHARGE_ITEMS.find(i => i.code === chargeForm.chargeCode);
                const nights = item?.dateRange && chargeForm.dateFrom && chargeForm.dateTo
                  ? Math.max(0, Math.round((new Date(chargeForm.dateTo) - new Date(chargeForm.dateFrom)) / 86400000))
                  : 0;
                const unitLabel = item?.dateLabel === "nights" ? "night" : "day";
                return (
                  <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
                    {chargeForm.useQtyRate ? (
                      <>
                        <div className="form-group" style={{ marginBottom: 0, flex: item?.dateRange ? 2 : 1 }}>
                          <label>Rate per {item?.dateRange ? unitLabel : "unit"} (₹) *</label>
                          <input type="number" min="0" value={chargeForm.rate}
                            onChange={e => setChargeForm({ ...chargeForm, rate: e.target.value })} placeholder="0.00" />
                        </div>
                        {!item?.dateRange && (
                          <>
                            <div style={{ paddingBottom: 10, color: "#9ca3af", fontSize: 18, fontWeight: 300 }}>×</div>
                            <div className="form-group" style={{ marginBottom: 0, flex: 1 }}>
                              <label>Qty</label>
                              <input type="number" min="0.1" step="0.1" value={chargeForm.qty}
                                onChange={e => setChargeForm({ ...chargeForm, qty: e.target.value })} />
                            </div>
                          </>
                        )}
                        <div className="form-group" style={{ marginBottom: 0, flex: 1 }}>
                          <label>Total</label>
                          <div style={{ padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)", background: "rgba(0,0,0,0.03)", fontSize: 14, fontWeight: 700, color: "#a07830" }}>
                            ₹{rupees(Math.round((item?.dateRange && nights > 0 ? nights : (parseFloat(chargeForm.qty)||1)) * (parseFloat(chargeForm.rate)||0) * 100)/100)}
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="form-group" style={{ marginBottom: 0, flex: 1 }}>
                        <label>Amount (₹) *</label>
                        <input type="number" min="1" value={chargeForm.amount}
                          onChange={e => setChargeForm({ ...chargeForm, amount: e.target.value })} placeholder="0.00" />
                      </div>
                    )}
                    {!item?.dateRange && (
                      <button type="button"
                        onClick={() => setChargeForm({ ...chargeForm, useQtyRate: !chargeForm.useQtyRate, amount: "", rate: "", qty: "1" })}
                        style={{ marginBottom: 1, padding: "8px 10px", fontSize: 11, borderRadius: 8, border: "1px solid var(--border)", background: chargeForm.useQtyRate ? "rgba(201,168,76,0.12)" : "transparent", color: chargeForm.useQtyRate ? "#a07830" : "#9ca3af", cursor: "pointer", whiteSpace: "nowrap" }}>
                        {chargeForm.useQtyRate ? "✕ Qty×Rate" : "Qty × Rate"}
                      </button>
                    )}
                  </div>
                );
              })()}

              {/* Date + Posted By */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Posted Date</label>
                  <input type="date" value={chargeForm.chargeDate}
                    onChange={e => setChargeForm({ ...chargeForm, chargeDate: e.target.value })}
                    max={new Date().toISOString().slice(0, 10)} />
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Posted By</label>
                  <input value={chargeForm.postedBy} onChange={e => setChargeForm({ ...chargeForm, postedBy: e.target.value })}
                    placeholder="Staff name" />
                </div>
              </div>

            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={addCharge}
                disabled={(() => {
                  if (!chargeForm.chargeCode) return true;
                  if (chargeForm.chargeCode === "MS001" && !chargeForm.customDesc.trim()) return true;
                  const item = CHARGE_ITEMS.find(i => i.code === chargeForm.chargeCode);
                  if (item?.dateRange) {
                    if (!chargeForm.dateFrom || !chargeForm.dateTo) return true;
                    const nights = Math.round((new Date(chargeForm.dateTo) - new Date(chargeForm.dateFrom)) / 86400000);
                    if (nights <= 0) return true;
                    return !(parseFloat(chargeForm.rate) > 0);
                  }
                  return chargeForm.useQtyRate
                    ? !(parseFloat(chargeForm.qty) > 0 && parseFloat(chargeForm.rate) > 0)
                    : !(parseFloat(chargeForm.amount) > 0);
                })()}>
                Post to Folio
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── VOID CHARGE MODAL ── */}
      {voidModal && res && (
        <div className="modal-overlay" onClick={() => setVoidModal(null)}>
          <div className="modal" style={{ maxWidth: 400 }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">⊘ Void Charge</div>
              <button className="modal-close" onClick={() => setVoidModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{ marginBottom: 14, padding: "10px 14px", background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.2)", borderRadius: 8 }}>
                <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 4 }}>Charge to void:</div>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#111827" }}>{res.folio[voidModal.folioIdx]?.desc}</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#ef4444", marginTop: 4 }}>₹{rupees(res.folio[voidModal.folioIdx]?.amount)}</div>
              </div>
              <div className="form-group">
                <label>Void Reason *</label>
                <input value={voidModal.reason} onChange={e => setVoidModal({ ...voidModal, reason: e.target.value })} placeholder="e.g. Posted in error, guest dispute, manager waiver..." autoFocus />
              </div>
              <div style={{ fontSize: 12, color: "#6b7280", lineHeight: 1.6 }}>
                A <strong>VOID reversal entry</strong> (credit line) will be automatically posted to the folio,
                reducing the balance by ₹{rupees(res.folio[voidModal.folioIdx]?.amount || 0)}.
                The original charge remains visible as <span style={{ textDecoration:"line-through" }}>struck-through</span> for audit purposes.
                This action is <strong>logged and cannot be undone</strong>.
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setVoidModal(null)}>Cancel</button>
              <button className="btn btn-primary" style={{ background: "#ef4444", borderColor: "#ef4444" }} onClick={() => voidCharge(voidModal.folioIdx, voidModal.reason)} disabled={!voidModal.reason.trim()}>
                Confirm Void
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── EDIT CHARGE MODAL ── */}
      {editChargeModal && res && (
        <div className="modal-overlay" onClick={() => setEditChargeModal(null)}>
          <div className="modal" style={{ maxWidth: 400 }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">✏️ Edit Charge</div>
                <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>{res.guest} · Room {res.room}</div>
              </div>
              <button className="modal-close" onClick={() => setEditChargeModal(null)}>✕</button>
            </div>
            <div className="modal-body" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div className="form-group" style={{ marginBottom: 0 }}>
                <label>Description</label>
                <input value={editChargeModal.desc}
                  onChange={e => setEditChargeModal({ ...editChargeModal, desc: e.target.value })}
                  placeholder="Charge description" autoFocus />
              </div>
              <div className="form-group" style={{ marginBottom: 0 }}>
                <label>Amount (₹) *</label>
                <input type="number" min="1" value={editChargeModal.amount}
                  onChange={e => setEditChargeModal({ ...editChargeModal, amount: e.target.value })}
                  placeholder="0.00" />
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Charge Date</label>
                  <input type="date" value={editChargeModal.chargeDate}
                    onChange={e => setEditChargeModal({ ...editChargeModal, chargeDate: e.target.value })}
                    max={new Date().toISOString().slice(0, 10)} />
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Posted By</label>
                  <input value={editChargeModal.postedBy}
                    onChange={e => setEditChargeModal({ ...editChargeModal, postedBy: e.target.value })}
                    placeholder="Staff name" />
                </div>
              </div>
              <div style={{ fontSize: 12, color: "#6b7280", padding: "8px 12px", background: "rgba(245,158,11,0.06)", border: "1px solid rgba(245,158,11,0.2)", borderRadius: 8 }}>
                ⚠ Changes are saved directly and logged to the audit trail.
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setEditChargeModal(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={editCharge}
                disabled={!editChargeModal.desc.trim() || !(parseFloat(editChargeModal.amount) > 0)}>
                Save Changes
              </button>
            </div>
          </div>
        </div>
      )}

      {modal === "pay" && res && (() => {
        const balanceDue      = Math.round((res.total - res.paid) * 100) / 100;
        const discAmt         = Math.round((parseFloat(payForm.discount) || 0) * 100) / 100;
        const tipAmt          = Math.round((parseFloat(payForm.tip)      || 0) * 100) / 100;
        const adjustedBalance = Math.max(0, Math.round((balanceDue - discAmt) * 100) / 100);
        const totalDue        = Math.round((adjustedBalance + tipAmt) * 100) / 100;
        const validSplits     = payForm.splits.filter(s => parseFloat(s.amount) > 0);
        const totalEntered    = Math.round(payForm.splits.reduce((s, sp) => s + (parseFloat(sp.amount) || 0), 0) * 100) / 100;
        const isOverpay       = totalEntered > totalDue + 0.001;
        const isFull          = totalEntered >= totalDue - 0.001 && totalEntered > 0;
        const isValid         = validSplits.length > 0 && !isOverpay;
        const balanceAfter    = Math.max(0, Math.round((totalDue - totalEntered) * 100) / 100);

        const METHODS = [
          { id: "UPI",          icon: "📲", refLabel: "UPI Transaction ID",      refRequired: true,  extraLabel: null },
          { id: "Cash",         icon: "💵", refLabel: "Receipt No.",             refRequired: false, extraLabel: "Denomination / Remarks" },
          { id: "Card",         icon: "💳", refLabel: "Approval / Auth Code",    refRequired: true,  extraLabel: "Last 4 Digits · Card Type (Visa/MC/RuPay)" },
          { id: "Bank Transfer",icon: "🏦", refLabel: "UTR / NEFT / IMPS Ref",  refRequired: true,  extraLabel: "Bank Name" },
          { id: "Cheque",       icon: "📝", refLabel: "Cheque Number",           refRequired: true,  extraLabel: "Bank Name · Cheque Date" },
          { id: "Complimentary",icon: "🎁", refLabel: "Reference Of",           refRequired: true,  extraLabel: "Reason / Approval Reference" },
          { id: "Sponsor",      icon: "🤝", refLabel: "Reference Of",           refRequired: true,  extraLabel: "Reason / Approval Reference" },
        ];
        const methodMap = Object.fromEntries(METHODS.map(m => [m.id, m]));

        const updateSplit = (id, key, val) =>
          setPayForm({ ...payForm, splits: payForm.splits.map(s => s.id === id ? { ...s, [key]: val } : s) });

        const removeSplit = (id) =>
          setPayForm({ ...payForm, splits: payForm.splits.filter(s => s.id !== id) });

        const addSplit = () =>
          setPayForm({ ...payForm, splits: [...payForm.splits, { id: Date.now(), method: "Cash", amount: "", ref: "", extra: "" }] });

        const setPreset = (id, pct) => {
          const remaining = balanceDue - payForm.splits.filter(s => s.id !== id).reduce((a, s) => a + (parseFloat(s.amount)||0), 0);
          updateSplit(id, "amount", String(Math.round(remaining * pct * 100) / 100));
        };

        const postPayment = (andPrint = false) => {
          if (!isValid) return;
          addPayment();
          if (andPrint) {
            // build snapshot for print
            const now = new Date();
            const ts = now.toISOString();
            const receiptNo = `RCT-${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*9000)+1000)}`;
            const applied = Math.min(totalEntered, balanceDue);
            const ratio = applied / totalEntered;
            const newFolio = validSplits.map((sp,i) => {
              const a = i < validSplits.length-1
                ? Math.round(parseFloat(sp.amount)*ratio*100)/100
                : Math.round((applied - validSplits.slice(0,i).reduce((s,x)=>s+Math.round(parseFloat(x.amount)*ratio*100)/100,0))*100)/100;
              return { desc: `Payment — ${sp.method}${sp.ref.trim()?` · Ref: ${sp.ref}`:""}`, amount: -a, date: ts, receiptNo };
            });
            const snap = { ...res, paid: res.paid + applied, folio: [...res.folio, ...newFolio] };
            setTimeout(() => printInvoice(snap), 200);
          }
        };

        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", backdropFilter: "blur(4px)", zIndex: 9998, display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "24px 16px" }}
            onClick={() => setModal(null)}>
            <div onClick={e => e.stopPropagation()}
              style={{ background: "#ffffff", border: "1px solid rgba(0,0,0,0.06)", borderRadius: 18, width: "100%", maxWidth: 620, boxShadow: "0 32px 80px rgba(0,0,0,0.45)" }}>

              {/* ── Header ── */}
              <div style={{ padding: "20px 24px 16px", borderBottom: "1px solid rgba(255,255,255,0.07)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: "#111827" }}>Record Payment</div>
                  <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>Post payment to guest folio</div>
                </div>
                <button onClick={() => setModal(null)} style={{ background: "none", border: "none", color: "#6b7280", fontSize: 20, cursor: "pointer", lineHeight: 1, padding: 4 }}>✕</button>
              </div>

              <div style={{ padding: "20px 24px", display: "flex", flexDirection: "column", gap: 18 }}>

                {/* ── Folio Summary ── */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, background: "rgba(0,0,0,0.02)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 12, overflow: "hidden" }}>
                  <div style={{ padding: "14px 18px", borderRight: "1px solid rgba(255,255,255,0.06)" }}>
                    <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 6 }}>Guest</div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#111827" }}>{res.guest}</div>
                    <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>Room {res.room} · {res.bhavan}</div>
                    <div style={{ fontSize: 11, color: "#6b7280" }}>
                      {new Date(res.checkIn).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})} → {new Date(res.checkOut).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
                    </div>
                  </div>
                  <div style={{ padding: "14px 18px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                      <span style={{ fontSize: 11, color: "#6b7280" }}>Total Bill</span>
                      <span style={{ fontSize: 12, color: "#111827", fontWeight: 600 }}>₹{rupees(res.total)}</span>
                    </div>
                    {res.paid > 0 && (
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                        <span style={{ fontSize: 11, color: "#22c55e" }}>Paid</span>
                        <span style={{ fontSize: 12, color: "#22c55e" }}>−₹{rupees(res.paid)}</span>
                      </div>
                    )}
                    <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 6, borderTop: "1px solid rgba(255,255,255,0.06)", marginTop: 2 }}>
                      <span style={{ fontSize: 12, fontWeight: 700, color: "#ef4444" }}>Balance Due</span>
                      <span style={{ fontSize: 15, fontWeight: 800, color: "#ef4444" }}>₹{rupees(balanceDue)}</span>
                    </div>
                  </div>
                </div>

                {/* ── Payment Type ── */}
                <div>
                  <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8, fontWeight: 600 }}>Payment Type</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    {[
                      { id: "full",    label: "Full Settlement", icon: "✅", desc: "Clears entire balance" },
                      { id: "partial", label: "Partial Payment", icon: "⚡", desc: "Partial amount now" },
                      { id: "deposit", label: "Security Deposit", icon: "🔒", desc: "Refundable deposit" },
                    ].map(t => (
                      <button key={t.id} onClick={() => setPayForm({ ...payForm, paymentType: t.id })}
                        style={{ flex: 1, padding: "10px 8px", borderRadius: 10, border: `2px solid ${payForm.paymentType === t.id ? "#a07830" : "rgba(0,0,0,0.05)"}`, background: payForm.paymentType === t.id ? "rgba(201,168,76,0.1)" : "rgba(0,0,0,0.02)", cursor: "pointer", textAlign: "center", transition: "all 0.15s" }}>
                        <div style={{ fontSize: 16, marginBottom: 3 }}>{t.icon}</div>
                        <div style={{ fontSize: 11, fontWeight: 700, color: payForm.paymentType === t.id ? "#a07830" : "#6b7280" }}>{t.label}</div>
                        <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 2 }}>{t.desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* ── Discount ── */}
                <div style={{ background: "rgba(34,197,94,0.04)", border: "1px solid rgba(34,197,94,0.18)", borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 10, color: "#22c55e", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 10 }}>🏷 Discount</div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>Amount (₹)</div>
                      <div style={{ position: "relative" }}>
                        <span style={{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", color: "#6b7280", fontSize: 13, fontWeight: 600 }}>₹</span>
                        <input type="number" min="0" step="1"
                          value={payForm.discount}
                          onChange={e => setPayForm(prev => ({ ...prev, discount: e.target.value }))}
                          placeholder="0.00"
                          style={{ paddingLeft: 24, fontSize: 13, borderColor: discAmt > balanceDue ? "rgba(239,68,68,0.5)" : discAmt > 0 ? "rgba(34,197,94,0.4)" : undefined }} />
                      </div>
                      {discAmt > balanceDue && <div style={{ fontSize: 10, color: "#ef4444", marginTop: 4 }}>⚠ Exceeds balance due</div>}
                      {discAmt > 0 && discAmt <= balanceDue && <div style={{ fontSize: 10, color: "#22c55e", marginTop: 4 }}>Balance reduced to ₹{rupees(adjustedBalance)}</div>}
                    </div>
                    <div style={{ flex: 2 }}>
                      <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>Reason / Authorised By</div>
                      <input value={payForm.discountReason}
                        onChange={e => setPayForm(prev => ({ ...prev, discountReason: e.target.value }))}
                        placeholder="e.g. Manager approval, loyalty discount…"
                        style={{ fontSize: 12 }} />
                    </div>
                  </div>
                </div>

                {/* ── Payment Splits ── */}
                <div>
                  <div style={{ fontSize: 11, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10, fontWeight: 600, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>Payment {payForm.splits.length > 1 ? "Splits" : "Details"}</span>
                    {payForm.splits.length > 1 && <span style={{ color: "#a07830", fontSize: 10 }}>{payForm.splits.length} methods</span>}
                  </div>

                  {payForm.splits.map((split, idx) => {
                    const mInfo = methodMap[split.method] || METHODS[0];
                    const isCompl = split.method === "Complimentary" || split.method === "Sponsor";
                    const splitAmt = parseFloat(split.amount) || 0;
                    const otherTotal = payForm.splits.filter(s => s.id !== split.id).reduce((a, s) => a + (parseFloat(s.amount)||0), 0);
                    const maxForThis = Math.max(0, balanceDue - otherTotal);

                    return (
                      <div key={split.id} style={{ background: "rgba(0,0,0,0.02)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 12, padding: "14px 16px", marginBottom: 10, position: "relative" }}>
                        {payForm.splits.length > 1 && (
                          <button onClick={() => removeSplit(split.id)}
                            style={{ position: "absolute", top: 10, right: 10, background: "rgba(239,68,68,0.1)", border: "1px solid rgba(239,68,68,0.2)", borderRadius: "50%", width: 22, height: 22, cursor: "pointer", color: "#ef4444", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>✕</button>
                        )}

                        {/* Method selector */}
                        <div style={{ marginBottom: 12 }}>
                          <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Payment Method</div>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                            {METHODS.map(m => (
                              <button key={m.id} onClick={() => {
                                setPayForm(prev => ({
                                  ...prev,
                                  splits: prev.splits.map(s => {
                                    if (s.id !== split.id) return s;
                                    const otherAmt = prev.splits.filter(x => x.id !== s.id).reduce((a, x) => a + (parseFloat(x.amount)||0), 0);
                                    const maxAmt = Math.max(0, Math.round((balanceDue - otherAmt) * 100) / 100);
                                    const newAmount = s.method !== m.id && (m.id === "Complimentary" || m.id === "Sponsor") ? String(maxAmt) : (s.method !== m.id ? "" : s.amount);
                                    return { ...s, method: m.id, amount: newAmount };
                                  })
                                }));
                              }}
                                style={{ padding: "6px 12px", borderRadius: 20, border: `1.5px solid ${split.method === m.id ? "#a07830" : "rgba(0,0,0,0.08)"}`, background: split.method === m.id ? "rgba(201,168,76,0.12)" : "transparent", cursor: "pointer", color: split.method === m.id ? "#a07830" : "#6b7280", fontSize: 12, fontWeight: split.method === m.id ? 700 : 400, display: "flex", alignItems: "center", gap: 5, transition: "all 0.15s", whiteSpace: "nowrap" }}>
                                <span>{m.icon}</span><span>{m.id}</span>
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* Amount + presets */}
                        <div style={{ marginBottom: mInfo.refLabel ? 12 : 0 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                            <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em" }}>Amount (₹) *</div>
                            {!isCompl && (
                              <div style={{ display: "flex", gap: 4 }}>
                                {[["25%", 0.25], ["50%", 0.5], ["75%", 0.75], ["Full", 1]].map(([lbl, pct]) => (
                                  <button key={lbl} onClick={() => setPreset(split.id, pct)}
                                    style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, border: "1px solid rgba(201,168,76,0.3)", background: "rgba(201,168,76,0.07)", color: "#a07830", cursor: "pointer" }}>
                                    {lbl}
                                  </button>
                                ))}
                              </div>
                            )}
                          </div>
                          <div style={{ position: "relative" }}>
                            <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "#6b7280", fontSize: 14, fontWeight: 700 }}>₹</span>
                            <input type="number" min="0.01" step="0.01"
                              value={split.amount}
                              onChange={e => updateSplit(split.id, "amount", e.target.value)}
                              placeholder="0.00"
                              autoFocus={idx === 0}
                              style={{ paddingLeft: 28, width: "100%",
                                borderColor: splitAmt > maxForThis + 0.001 ? "rgba(239,68,68,0.5)" : splitAmt > 0 ? "rgba(34,197,94,0.4)" : undefined }} />
                          </div>
                          {isCompl && splitAmt > 0 && <div style={{ fontSize: 10, color: "#22c55e", marginTop: 4 }}>🎁 Complimentary / Sponsor — requires reference below</div>}
                          {splitAmt > maxForThis + 0.001 && <div style={{ fontSize: 10, color: "#ef4444", marginTop: 4 }}>⚠ Exceeds available balance of ₹{rupees(maxForThis)}</div>}
                        </div>

                        {/* Method-specific fields */}
                        {mInfo.refLabel && (
                          <div style={{ display: "grid", gridTemplateColumns: mInfo.extraLabel ? "1fr 1fr" : "1fr", gap: 10, marginTop: 4 }}>
                            <div>
                              <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>
                                {mInfo.refLabel} {mInfo.refRequired && <span style={{ color: "#ef4444" }}>*</span>}
                              </div>
                              <input value={split.ref} onChange={e => updateSplit(split.id, "ref", e.target.value)}
                                placeholder={
                                  split.method === "UPI" ? "e.g. 4236xxxx1234" :
                                  split.method === "Card" ? "e.g. 489234" :
                                  split.method === "Bank Transfer" ? "e.g. NEFT2025xxxx" :
                                  split.method === "Cheque" ? "e.g. 012345" :
                                  (split.method === "Complimentary" || split.method === "Sponsor") ? "Name / Designation" : "—"
                                }
                                style={{ fontSize: 12, fontFamily: (split.method !== "Complimentary" && split.method !== "Sponsor") ? "monospace" : "inherit" }} />
                            </div>

                              <div>
                                <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>{mInfo.extraLabel}</div>
                                <input value={split.extra} onChange={e => updateSplit(split.id, "extra", e.target.value)}
                                  placeholder={
                                    split.method === "Card" ? "e.g. 4532 · Visa" :
                                    split.method === "Bank Transfer" ? "e.g. SBI / HDFC" :
                                    split.method === "Cheque" ? "e.g. ICICI · 21 Feb 2026" :
                                    split.method === "Cash" ? "e.g. 2×500 + 4×100" :
                                    (split.method === "Complimentary" || split.method === "Sponsor") ? "e.g. Loyalty waiver / Sponsor name" : "—"
                                  }
                                  style={{ fontSize: 12 }} />
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {/* Add Split button */}
                  {payForm.splits.length < 3 && balanceDue > 0 && (
                    <button onClick={addSplit}
                      style={{ width: "100%", padding: "9px", border: "1.5px dashed rgba(201,168,76,0.3)", borderRadius: 10, background: "transparent", color: "#a07830", fontSize: 12, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                      + Add Split Payment Method
                    </button>
                  )}
                </div>

                {/* ── Running Total ── */}
                {(totalEntered > 0 || discAmt > 0 || tipAmt > 0) && (
                  <div style={{ background: isOverpay ? "rgba(239,68,68,0.08)" : isFull ? "rgba(34,197,94,0.08)" : "rgba(245,158,11,0.07)", border: `1px solid ${isOverpay ? "rgba(239,68,68,0.25)" : isFull ? "rgba(34,197,94,0.25)" : "rgba(245,158,11,0.2)"}`, borderRadius: 10, padding: "12px 16px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span style={{ fontSize: 12, color: "#6b7280" }}>Original Balance</span>
                      <span style={{ fontSize: 12, color: "#111827" }}>₹{rupees(balanceDue)}</span>
                    </div>
                    {discAmt > 0 && (
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                        <span style={{ fontSize: 12, color: "#22c55e" }}>🏷 Discount</span>
                        <span style={{ fontSize: 12, color: "#22c55e", fontWeight: 600 }}>− ₹{rupees(discAmt)}</span>
                      </div>
                    )}
                    {tipAmt > 0 && (
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                        <span style={{ fontSize: 12, color: "#f59e0b" }}>💝 Tip</span>
                        <span style={{ fontSize: 12, color: "#f59e0b", fontWeight: 600 }}>+ ₹{rupees(tipAmt)}</span>
                      </div>
                    )}
                    <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid rgba(0,0,0,0.06)", paddingTop: 6, marginTop: 4, marginBottom: 5 }}>
                      <span style={{ fontSize: 12, color: "#6b7280" }}>Total Collected</span>
                      <span style={{ fontSize: 13, fontWeight: 700, color: "#111827" }}>₹{rupees(Math.min(totalEntered, totalDue))}</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ fontSize: 12, fontWeight: 700, color: isOverpay ? "#ef4444" : isFull ? "#22c55e" : "#f59e0b" }}>
                        {isOverpay ? "⚠ Overpay — exceeds balance" : isFull ? "✓ Fully settled" : "Remaining Balance"}
                      </span>
                      <span style={{ fontSize: 14, fontWeight: 800, color: isOverpay ? "#ef4444" : isFull ? "#22c55e" : "#f59e0b" }}>
                        {isOverpay ? `−₹${rupees(totalEntered - totalDue)} over` : isFull ? "₹0.00" : `₹${rupees(balanceAfter)}`}
                      </span>
                    </div>
                  </div>
                )}

                {/* ── Tip / Donation ── */}
                <div style={{ background: "rgba(245,158,11,0.04)", border: "1px solid rgba(245,158,11,0.18)", borderRadius: 10, padding: "14px 16px" }}>

                          style={{ padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${payForm.tip === String(amt) ? "#f59e0b" : "rgba(245,158,11,0.25)"}`, background: payForm.tip === String(amt) ? "rgba(245,158,11,0.15)" : "rgba(245,158,11,0.07)", color: "#f59e0b", fontSize: 12, cursor: "pointer", fontWeight: 600, whiteSpace: "nowrap" }}>

                    <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6, fontWeight: 600 }}>Remarks <span style={{ textTransform: "none", fontWeight: 400 }}>(optional)</span></div>
                    <input value={payForm.note} onChange={e => setPayForm({ ...payForm, note: e.target.value })}

                      style={{ fontSize: 12 }} />
                  </div>
                </div>

                {/* ── Actions ── */}
                <div style={{ display: "flex", gap: 10, paddingTop: 4, borderTop: "1px solid rgba(255,255,255,0.06)" }}>
                  <button className="btn btn-ghost" onClick={() => setModal(null)} style={{ flex: 1 }}>Cancel</button>
                  <button className="btn btn-ghost" onClick={() => postPayment(false)}
                    disabled={!isValid} style={{ flex: 1, opacity: !isValid ? 0.4 : 1 }}>
                    ✓ Post Payment
                  </button>
                  <button className="btn btn-primary" onClick={() => postPayment(true)}
                    disabled={!isValid} style={{ flex: 1.5, opacity: !isValid ? 0.4 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
