                  </button>
                </div>

              </div>
            </div>
          </div>
        );
      })()}

      {/* ── Payment Receipt Overlay ── */}
      {showPaySuccess && (() => {
        const { res: pr, splits, totalApplied, receiptNo, collectedBy, paymentType, at } = showPaySuccess;
        const newBalance = Math.max(0, Math.round((pr.total - pr.paid) * 100) / 100);
        const isPaidFull = newBalance <= 0;
        const methodIcons = { UPI: "📲", Cash: "💵", "Bank Transfer": "🏦", Card: "💳", Cheque: "📝", Complimentary: "🎁", Sponsor: "🤝" };
        const typeLabel = { full: "Full Settlement", partial: "Partial Payment", deposit: "Security Deposit" };
        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", backdropFilter: "blur(4px)", zIndex: 9999, display: "flex", alignItems: "center", justifyContent: "center" }}
            onClick={() => setShowPaySuccess(null)}>
            <div onClick={e => e.stopPropagation()}
              style={{ background: "#ffffff", border: `1px solid ${isPaidFull ? "rgba(34,197,94,0.35)" : "rgba(245,158,11,0.35)"}`, borderRadius: 20, width: 440, padding: "32px 28px", boxShadow: "0 40px 80px rgba(0,0,0,0.65)", textAlign: "center" }}>

              {/* Icon */}
              <div style={{ width: 68, height: 68, borderRadius: "50%", background: isPaidFull ? "rgba(34,197,94,0.12)" : "rgba(245,158,11,0.12)", border: `2px solid ${isPaidFull ? "#22c55e" : "#f59e0b"}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, margin: "0 auto 16px" }}>
                {isPaidFull ? "✓" : "⚡"}
              </div>

              <div style={{ fontSize: 20, fontWeight: 800, color: isPaidFull ? "#22c55e" : "#f59e0b", marginBottom: 4 }}>
                {isPaidFull ? "Payment Complete" : "Partial Payment Posted"}
              </div>
              <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 6 }}>
                {new Date(at).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" })} · {new Date(at).toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit", hour12: true })}
              </div>
              <div style={{ fontSize: 11, color: "#9ca3af", fontFamily: "monospace", marginBottom: 20 }}>Receipt: {receiptNo}</div>

              {/* Receipt card */}
              <div style={{ background: "rgba(0,0,0,0.02)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 12, padding: "16px 18px", textAlign: "left", marginBottom: 20 }}>
                {/* Guest row */}
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, paddingBottom: 8, borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#111827" }}>{pr.guest}</div>
                    <div style={{ fontSize: 11, color: "#6b7280" }}>Room {pr.room} · {pr.bhavan} · {pr.id}</div>
                  </div>
                  <div style={{ fontSize: 10, padding: "3px 10px", borderRadius: 10, alignSelf: "flex-start",
                    background: paymentType === "deposit" ? "rgba(168,85,247,0.15)" : paymentType === "partial" ? "rgba(245,158,11,0.15)" : "rgba(34,197,94,0.15)",
                    color: paymentType === "deposit" ? "#a855f7" : paymentType === "partial" ? "#f59e0b" : "#22c55e",
                    border: `1px solid ${paymentType === "deposit" ? "rgba(168,85,247,0.3)" : paymentType === "partial" ? "rgba(245,158,11,0.3)" : "rgba(34,197,94,0.3)"}`,
                    fontWeight: 700 }}>
                    {typeLabel[paymentType] || "Payment"}
                  </div>
                </div>

                {/* Split lines */}
                {(splits || []).map((sp, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                    <span style={{ fontSize: 12, color: "#6b7280", display: "flex", alignItems: "center", gap: 5 }}>
                      <span>{methodIcons[sp.method] || "💳"}</span> {sp.method}
                      {sp.ref && <span style={{ fontFamily: "monospace", fontSize: 10, color: "#9ca3af" }}>· {sp.ref}</span>}
                    </span>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#22c55e" }}>₹{rupees(parseFloat(sp.amount))}</span>
                  </div>
                ))}

                {(splits || []).length > 1 && (
                  <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 6, borderTop: "1px solid rgba(255,255,255,0.06)", marginTop: 4 }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: "#111827" }}>Total Received</span>
                    <span style={{ fontSize: 14, fontWeight: 800, color: "#22c55e" }}>₹{rupees(totalApplied)}</span>
                  </div>
                )}

                <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 8, borderTop: "1px solid rgba(255,255,255,0.06)", marginTop: 6 }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: isPaidFull ? "#22c55e" : "#f59e0b" }}>Balance Due</span>
                  <span style={{ fontSize: 15, fontWeight: 800, color: isPaidFull ? "#22c55e" : "#f59e0b" }}>
                    {isPaidFull ? "₹0.00 — Cleared ✓" : `₹${rupees(newBalance)}`}
                  </span>
                </div>

                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
                  <span style={{ fontSize: 10, color: "#9ca3af" }}>Collected by</span>
                  <span style={{ fontSize: 11, color: "#6b7280" }}>{collectedBy}</span>
                </div>
              </div>

              {/* Actions */}
              <div style={{ display: "flex", gap: 10 }}>
                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setShowPaySuccess(null)}>Done</button>
                <button className="btn btn-primary" style={{ flex: 1.4, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                  onClick={() => { printInvoice(pr); setShowPaySuccess(null); }}>
                  🖨 Print Invoice
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {editDiscountModal && (
        <Modal title="Edit Discount" onClose={() => setEditDiscountModal(null)}
          actions={
            <button className="btn btn-primary" onClick={saveEditDiscount}
              disabled={!editDiscountModal.amount || parseFloat(editDiscountModal.amount) <= 0}
              style={{ opacity: (!editDiscountModal.amount || parseFloat(editDiscountModal.amount) <= 0) ? 0.45 : 1 }}>
              Save Changes
            </button>
          }>
          <div className="form-group">
            <label>Discount Amount (₹) *</label>
            <div style={{ position: "relative" }}>
              <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#6b7280", fontSize: 14, fontWeight: 600 }}>₹</span>
              <input
                type="number"
                min="1"
                value={editDiscountModal.amount}
                onChange={(e) => setEditDiscountModal({ ...editDiscountModal, amount: e.target.value })}
                placeholder="Enter new discount amount"
                style={{ paddingLeft: 26 }}
                autoFocus
                onKeyDown={(e) => e.key === "Enter" && saveEditDiscount()}
              />
            </div>
            <div style={{ fontSize: 11, color: "#6b7280", marginTop: 6 }}>
              Current discount: ₹{rupees(Math.abs(res?.folio[editDiscountModal.folioIdx]?.amount || 0))}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── HOUSEKEEPING ─────────────────────────────────────────────────────────────
function Housekeeping({ tasks, setTasks, rooms, addLog }) {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ room: "", task: "Full Clean", assignedTo: "", priority: "Medium", note: "" });

  function addTask() {
    if (!form.room || !form.assignedTo) return;
    const newTask = { id: "H00" + (tasks.length + 1), ...form, status: "Pending" };
    setTasks([...tasks, newTask]);
    addLog(`Housekeeping task assigned — Room ${form.room}: ${form.task} → ${form.assignedTo}`, "housekeeping");
    setModal(false);
  }
  function updateTaskStatus(id, status) {
    const task = tasks.find((t) => t.id === id);
    setTasks(tasks.map((t) => t.id === id ? { ...t, status } : t));
    if (task) addLog(`Housekeeping task ${id} (Room ${task.room}) marked as ${status}`, "housekeeping");
  }

  const priorityColor = { High: "#ef4444", Medium: "#f59e0b", Low: "#22c55e" };

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Housekeeping</div>
        <button className="btn btn-primary" onClick={() => setModal(true)}>+ New Task</button>
      </div>

      <div className="grid-3" style={{ marginBottom: 20 }}>
        {["Pending", "In Progress", "Completed"].map((status) => (
          <div key={status} className="card" style={{ textAlign: "center", padding: "16px" }}>
            <div style={{ fontSize: 28, fontFamily: "'Cormorant Garamond', serif", fontWeight: 700, color: status === "Completed" ? "#22c55e" : status === "In Progress" ? "#3b82f6" : "#f59e0b" }}>
              {tasks.filter((t) => t.status === status).length}
            </div>
            <div style={{ fontSize: 12, color: "#6b7280", marginTop: 4 }}>{status}</div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-title">Active Tasks</div>
        {tasks.map((task) => (
          <div key={task.id} className="hk-card">
            <div className="hk-room">{task.room}</div>
            <div style={{ flex: 1 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 14, color: "#111827" }}>{task.task}</div>
                  <div style={{ fontSize: 12, color: "#6b7280", marginTop: 2 }}>Assigned to: {task.assignedTo}</div>
                  {task.note && <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 4, fontStyle: "italic" }}>{task.note}</div>}
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: priorityColor[task.priority] }}>{task.priority}</span>
                  <StatusPill status={task.status} />
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                {task.status === "Pending" && <button className="btn btn-sm btn-ghost" onClick={() => updateTaskStatus(task.id, "In Progress")}>Start</button>}
                {task.status === "In Progress" && <button className="btn btn-sm btn-primary" onClick={() => updateTaskStatus(task.id, "Completed")}>Mark Done</button>}
                {task.status === "Completed" && <span style={{ fontSize: 12, color: "#22c55e" }}>✓ Completed</span>}
              </div>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title="Assign Housekeeping Task" onClose={() => setModal(false)} actions={<button className="btn btn-primary" onClick={addTask}>Assign Task</button>}>
          <div className="grid-2">
            <div className="form-group"><label>Room Number</label><input value={form.room} onChange={(e) => setForm({ ...form, room: e.target.value })} placeholder="e.g. 205" /></div>
            <div className="form-group"><label>Task Type</label><select value={form.task} onChange={(e) => setForm({ ...form, task: e.target.value })}><option>Full Clean</option><option>Turndown</option><option>Deep Clean</option><option>Maintenance</option><option>Linen Change</option></select></div>
            <div className="form-group"><label>Assigned To</label><input value={form.assignedTo} onChange={(e) => setForm({ ...form, assignedTo: e.target.value })} placeholder="Staff name" /></div>
            <div className="form-group"><label>Priority</label><select value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}><option>High</option><option>Medium</option><option>Low</option></select></div>
          </div>
          <div className="form-group"><label>Note</label><textarea value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="Additional instructions..." rows={2} /></div>
        </Modal>
      )}
    </div>
  );
}

// ─── POS ──────────────────────────────────────────────────────────────────────
const MENU = [
  { name: "Club Sandwich", price: 350, cat: "Food" },
  { name: "Pasta Carbonara", price: 450, cat: "Food" },
  { name: "Caesar Salad", price: 320, cat: "Food" },
  { name: "Grilled Salmon", price: 750, cat: "Food" },
  { name: "Cappuccino", price: 180, cat: "Beverages" },
  { name: "Fresh OJ", price: 220, cat: "Beverages" },
  { name: "Wine Glass", price: 450, cat: "Beverages" },
  { name: "Mineral Water", price: 120, cat: "Beverages" },
];

function POS({ orders, setOrders, reservations, addLog }) {
  const [cart, setCart] = useState([]);
  const [attachRoom, setAttachRoom] = useState("");
  const [table, setTable] = useState("T1");
  const [tab, setTab] = useState("pos");

  function addToCart(item) {
    const existing = cart.find((c) => c.name === item.name);
    if (existing) setCart(cart.map((c) => c.name === item.name ? { ...c, qty: c.qty + 1 } : c));
    else setCart([...cart, { ...item, qty: 1 }]);
  }
  function removeFromCart(name) { setCart(cart.filter((c) => c.name !== name)); }
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);

  function placeOrder() {
    if (!cart.length) return;
    const newOrder = {
      id: "P00" + (orders.length + 1), table, room: attachRoom || null,
      items: cart.map((c) => ({ name: c.name, qty: c.qty, price: c.price })),
      status: "In Kitchen", total, attachToRoom: !!attachRoom,
    };
    setOrders([newOrder, ...orders]);
    addLog(`POS Order ${newOrder.id} placed for ${table}${attachRoom ? ` — attached to Room ${attachRoom}` : ""} — ₹${rupees(total)}`, "pos");
    setCart([]); setAttachRoom("");
  }

  const statusCycle = { "In Kitchen": "Ready", "Ready": "Served", "Served": "Served" };

  return (
    <div>
      <div className="section-header"><div className="section-title">Restaurant POS</div></div>
      <div className="tabs">
        {["pos", "orders"].map((t) => (
          <div key={t} className={`tab ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>
            {t === "pos" ? "New Order" : "Kitchen Orders"}
          </div>
        ))}
      </div>

      {tab === "pos" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>
          <div className="card">
            <div className="card-title">Menu</div>
            {["Food", "Beverages"].map((cat) => (
              <div key={cat} style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10 }}>{cat}</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {MENU.filter((m) => m.cat === cat).map((item) => (
                    <div key={item.name} className="menu-item" onClick={() => addToCart(item)}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13, color: "#111827" }}>{item.name}</div>
                      </div>
                      <div style={{ color: "#a07830", fontWeight: 700, fontSize: 14 }}>₹{item.price}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="card">
            <div className="card-title">Current Order</div>
            <div className="form-group">
              <label>Table</label>
              <select value={table} onChange={(e) => setTable(e.target.value)}>

                    <div style={{ fontSize: 13, color: "#111827" }}>{item.name}</div>

                  <span style={{ fontSize: 11, color: "#9ca3af", marginLeft: 10 }}>{order.id}</span>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <StatusPill status={order.status} />
                  {order.status !== "Served" && (
                    <button className="btn btn-sm btn-primary" onClick={() => { const next = statusCycle[order.status]; setOrders(orders.map((o) => o.id === order.id ? { ...o, status: next } : o)); addLog(`POS Order ${order.id} (${order.table}) status → ${next}`, "pos"); }}>
                      {order.status === "In Kitchen" ? "Mark Ready" : "Mark Served"}
                    </button>
                  )}
                </div>
              </div>
              {order.items.map((item, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#6b7280", marginBottom: 6 }}>
                  <span>{item.qty}× {item.name}</span><span>₹{item.price * item.qty}</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, color: "#111827", marginTop: 8, paddingTop: 8, borderTop: "1px solid var(--border)" }}>
                <span>Total</span><span style={{ color: "#a07830" }}>₹{rupees(order.total)}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── USERS ────────────────────────────────────────────────────────────────────
function Users({ users, setUsers, addLog }) {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ name: "", email: "", role: "Front Desk", active: true });

  function addUser() {
    if (!form.name || !form.email) return;
    const newUser = { id: "U00" + (users.length + 1), ...form, lastLogin: "Never" };
    setUsers([...users, newUser]);
    addLog(`New user created: ${form.name} (${form.role})`, "edit");
    setModal(false);
  }
  function toggleActive(id) {
    const user = users.find((u) => u.id === id);
    setUsers(users.map((u) => u.id === id ? { ...u, active: !u.active } : u));
    if (user) addLog(`User ${user.name} ${user.active ? "deactivated" : "activated"}`, "edit");
  }

  const perms = {
    Admin: ["Reservations", "Rooms", "Billing", "Housekeeping", "POS", "Users", "Reports"],
    "Front Desk": ["Reservations", "Rooms", "Billing"],
    Housekeeping: ["Rooms", "Housekeeping"],
    Restaurant: ["POS"],
  };

  return (
    <div>
      <div className="section-header">
        <div className="section-title">User Management</div>
        <button className="btn btn-primary" onClick={() => setModal(true)}>+ Add User</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>
        <div className="card">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last Login</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {users.map((u) => (
                <tr key={u.id}>
                  <td style={{ color: "#111827", fontWeight: 600 }}>{u.name}</td>
                  <td style={{ fontFamily: "monospace", fontSize: 12 }}>{u.email}</td>
                  <td><RoleChip role={u.role} /></td>
                  <td style={{ fontSize: 12 }}>{u.lastLogin}</td>
                  <td><StatusPill status={u.active ? "Active" : "Inactive"} /></td>
                  <td>
                    <button className={`btn btn-sm ${u.active ? "btn-danger" : "btn-ghost"}`} onClick={() => toggleActive(u.id)}>
                      {u.active ? "Deactivate" : "Activate"}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card">
          <div className="card-title">Role Permissions</div>
          {Object.entries(perms).map(([role, modules]) => (
            <div key={role} style={{ marginBottom: 16 }}>
              <RoleChip role={role} />
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                {modules.map((m) => <span key={m} style={{ fontSize: 11, padding: "3px 8px", background: "var(--surface2)", borderRadius: 4, color: "#6b7280" }}>{m}</span>)}
              </div>
            </div>
          ))}
        </div>
      </div>
      {modal && (
        <Modal title="Add New User" onClose={() => setModal(false)} actions={<button className="btn btn-primary" onClick={addUser}>Create User</button>}>
          <div className="form-group"><label>Full Name</label><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></div>
          <div className="form-group"><label>Email</label><input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></div>
          <div className="form-group"><label>Role</label><select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>{ROLES.map((r) => <option key={r}>{r}</option>)}</select></div>
        </Modal>
      )}
    </div>
  );
}

// ─── REPORTS ────────────────────────────────────────────────────────────────
function Reports({ rooms, reservations, setReservations, setRooms, auditLogs, addLog }) {
  const [reportType, setReportType] = useState("occupancy");
  const [exportStatus, setExportStatus] = useState("");
  const [dateFrom, setDateFrom] = useState(() => {
    const d = new Date(); d.setDate(d.getDate() - 30);
    return d.toISOString().split("T")[0];
  });
  const [dateTo, setDateTo] = useState(() => new Date().toISOString().split("T")[0]);
  const [guestSearch, setGuestSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("All");

  // ── Computed metrics from real reservation data ──────────────────────────────
  const totalRooms = rooms.length;
  const occupied = rooms.filter(r => r.status === "Occupied").length;
  const todayStr = new Date().toISOString().split("T")[0];

  // Revenue from reservations in range — exclude No Show (no stay occurred) and Cancelled
  const inRangeRes = reservations.filter(r => {
    if (!r.checkIn) return false;
    return r.checkIn >= dateFrom && r.checkIn <= dateTo &&
           r.status !== "Cancelled" && r.status !== "No Show";
  });
  // Room-only revenue: nights × room rate (excludes F&B extras, tips, discounts)
  // Industry standard: ADR and RevPAR are always room-revenue-only metrics
  const calcRoomRevenue = r => {
    const nights = (r.checkIn && r.checkOut)
      ? Math.max(1, Math.round((new Date(r.checkOut) - new Date(r.checkIn)) / 86400000))
      : 1;
    return getRoomRate(r.bhavan, r.type, r.room) * nights;
  };
  const totalRoomRevenue = inRangeRes.reduce((s, r) => s + calcRoomRevenue(r), 0);
  const totalRevenue     = inRangeRes.reduce((s, r) => s + (r.total || 0), 0); // folio total (balance calc)
  const totalPaid        = inRangeRes.reduce((s, r) => s + (r.paid  || 0), 0);
  const roomsSold        = inRangeRes.length;
  // ADR = room revenue ÷ rooms sold (room charges only — industry standard)
  const adr  = roomsSold > 0 ? Math.round(totalRoomRevenue / roomsSold) : 0;
  const days = Math.max(1, Math.round((new Date(dateTo) - new Date(dateFrom)) / 86400000) + 1);
  // RevPAR = room revenue ÷ total available rooms ÷ days in period
  const revpar = (totalRooms > 0 && days > 0) ? Math.round(totalRoomRevenue / totalRooms / days) : 0;
  // Occupancy: period-average from reservation data — not a live snapshot of today's room status
  const periodOccRoomNights = inRangeRes.reduce((s, r) => {
    if (!r.checkIn || !r.checkOut) return s;
    const ci = r.checkIn  >= dateFrom ? r.checkIn  : dateFrom;
    const co = r.checkOut <= dateTo   ? r.checkOut : dateTo;
    return s + Math.max(0, Math.round((new Date(co) - new Date(ci)) / 86400000));
  }, 0);
  const occupancyPct = (totalRooms > 0 && days > 0)
    ? Math.min(100, Math.round(periodOccRoomNights / totalRooms / days * 100))
    : 0;

  // Daily room revenue trend — revenue attributed per night consumed (not all on check-in day)
  const revenueChartData = Array.from({length:7}, (_,i) => {
    const d = new Date(dateTo + "T00:00:00"); d.setDate(d.getDate() - (6-i));
    const ds = d.toISOString().slice(0,10);
    const dayLabel = d.toLocaleDateString("en-IN", {weekday:"short",day:"numeric"});
    const rev = reservations
      .filter(r => r.checkIn && r.checkOut &&
                   r.status !== "Cancelled" && r.status !== "No Show" &&
                   ds >= r.checkIn && ds < r.checkOut)
      .reduce((s, r) => s + getRoomRate(r.bhavan, r.type, r.room), 0);
    return { day: dayLabel, revenue: rev };
  });

  // Room-type revenue (room charges only, not folio total)
  const roomTypeRevenue = ROOM_TYPES.map(type => {
    const res = inRangeRes.filter(r => r.type === type);
    const rev = res.reduce((s,r) => s + calcRoomRevenue(r), 0);
    return {
      name: type,
      rooms: rooms.filter(r => r.type === type).length,
      occupied: res.length,
      revenue: rev,
      adr: res.length > 0 ? Math.round(rev / res.length) : 0,
    };
  });
  // Bhavan-level revenue breakdown
  const bhavanRevenue = BHAVAN_LIST.map(bhavan => {
    const res = inRangeRes.filter(r => r.bhavan === bhavan);
    const rev = res.reduce((s,r) => s + calcRoomRevenue(r), 0);
    const paid = res.reduce((s,r) => s + (r.paid||0), 0);
    return {
      name: bhavan,
      rooms: rooms.filter(r => r.bhavan === bhavan).length,
      bookings: res.length,
      revenue: rev,
      paid,
      outstanding: Math.max(0, rev - paid),
      adr: res.length > 0 ? Math.round(rev / res.length) : 0,
    };
  });

  // Payment method revenue breakdown — ₹ collected (not count) for accurate split
  const paymentRevMap = {};
  inRangeRes.forEach(r => {
    const p = r.paymentMode || r.paymentMethod || "Not Recorded";
    paymentRevMap[p] = (paymentRevMap[p] || 0) + (r.paid || 0);
  });
  const paymentChartData = Object.entries(paymentRevMap)
    .map(([name, revenue]) => ({ name, revenue }))
    .sort((a,b) => b.revenue - a.revenue);

  // KPI-strip counters: always anchored to today (unaffected by date range picker)
  const arrivalsToday   = reservations.filter(r => r.checkIn  === todayStr && (r.status === "Confirmed" || r.status === "Checked In"));
  const departuresToday = reservations.filter(r => r.checkOut === todayStr && (r.status === "Checked In" || r.status === "Checked Out"));
  // Arrivals in selected period — drives the Arrivals report tab
  const arrivalsInRange = reservations.filter(r =>
    r.checkIn >= dateFrom && r.checkIn <= dateTo &&
    (r.status === "Confirmed" || r.status === "Checked In" || r.status === "Checked Out")
  ).sort((a,b) => a.checkIn.localeCompare(b.checkIn));
  // Departures in selected period — drives the Departures report tab
  const departuresInRange = reservations.filter(r =>
    r.checkOut >= dateFrom && r.checkOut <= dateTo &&
    (r.status === "Checked In" || r.status === "Checked Out")
  ).sort((a,b) => a.checkOut.localeCompare(b.checkOut));
  // In-house: always live (today's checked-in guests)
  const inHouseGuests = reservations.filter(r => r.status === "Checked In");
  // No-shows + cancellations: scoped to selected date range (by intended check-in date)
  const noShowCancelled = reservations.filter(r =>
    (r.status === "No Show" || r.status === "Cancelled") &&
    r.checkIn >= dateFrom && r.checkIn <= dateTo
  ).sort((a,b) => a.checkIn.localeCompare(b.checkIn));

  const REPORT_TYPES = [
    { id: "occupancy",   label: "Occupancy",        icon: "🏨" },
    { id: "revenue",     label: "Revenue",           icon: "💰" },
    { id: "bhavan",      label: "By Bhavan",         icon: "🏛" },
    { id: "cashier",     label: "Cashier",           icon: "💳" },
    { id: "arrivals",    label: "Arrivals",          icon: "✈" },
    { id: "departures",  label: "Departures",        icon: "🚪" },
    { id: "inhouse",     label: "In-House",          icon: "🛏" },
    { id: "guests",      label: "All Bookings",      icon: "👥" },
    { id: "noshow",      label: "No-Show / Cancel",  icon: "❌" },
    { id: "nightaudit",  label: "Night Audit",       icon: "🌙" },
    { id: "audit",       label: "Audit Log",         icon: "📋" },
  ];

  // ── Data builders ────────────────────────────────────────────────────────────

  const missedArrivals = reservations.filter(r =>
    r.status === "Confirmed" && r.checkIn <= todayStr
  );

  const expiredHolds = reservations.filter(r => {
    if (r.status !== "On Hold" || !r.holdUntilDate) return false;
    const deadline = r.holdUntilDate + "T" + (r.holdUntilTime || "23:59");
    return deadline <= new Date().toISOString().slice(0, 16);
  });

  function runNightAudit() {
    const auditDate = todayStr;
    const auditTs   = new Date().toISOString();

    // Step 1 — Post nightly room charge to every Checked In reservation (idempotent)
    const inHouseNow = reservations.filter(r => r.status === "Checked In");
    let updatedRes = reservations.map(r => {
      if (r.status !== "Checked In") return r;
      const alreadyPosted = (r.folio||[]).some(f =>
        f.desc === `Room charge (${auditDate})` && !f.voided
      );
      if (alreadyPosted) return r;
      const rate = getRoomRate(r.bhavan, r.type, r.room);
      const chargeEntry = {
        id: `NA-${Date.now()}-${r.id}`,
        desc: `Room charge (${auditDate})`,
        amount: rate,
        date: auditTs,
        postedBy: "Night Audit",
      };
      return { ...r, folio: [...(r.folio||[]), chargeEntry], total: (r.total||0) + rate };
    });

    // Step 2 — Mark missed Confirmed arrivals as No Show
    updatedRes = updatedRes.map(r => {
      if (r.status !== "Confirmed" || r.checkIn > auditDate) return r;
      return { ...r, status: "No Show" };
    });

    // Step 3 — Release rooms for No Shows (match by number AND bhavan to prevent cross-property collision)
    setRooms(prev => prev.map(rm => {
      const isNoShowRoom = missedArrivals.some(r => r.room === rm.number && r.bhavan === rm.bhavan);
      if (!isNoShowRoom) return rm;
      return (rm.status === "Occupied" || rm.status === "Blocked")
        ? { ...rm, status: "Available", guest: null }
        : rm;
    }));

    setReservations(updatedRes);

    const chargesPosted = inHouseNow.filter(r =>
      !(r.folio||[]).some(f => f.desc === `Room charge (${auditDate})` && !f.voided)
    ).length;
    const ns = missedArrivals.length;
    addLog(
      `Night Audit (${auditDate}): ` +
      `${inHouseNow.length} room charge${inHouseNow.length!==1?"s":""} posted` +
      (ns > 0 ? ` · ${ns} missed arrival${ns!==1?"s":""} → No Show (${missedArrivals.map(r=>r.guest).join(", ")})` : " · No missed arrivals"),
      "audit"
    );
  }

  function cancelExpiredHold(id) {
    const res = reservations.find(r => r.id === id);
    if (!res) return;
    setReservations(prev => prev.map(r =>
      r.id === id ? { ...r, status: "Cancelled", internalNotes: ((r.internalNotes||"") + " [Expired Hold — auto-cancelled via Night Audit]").trim() } : r
    ));
    if (res.room) {
      setRooms(prev => prev.map(rm =>
        rm.number === res.room ? { ...rm, status: "Available", guest: null } : rm
      ));
    }
    addLog(`Expired Hold cancelled: ${res.guest} (${id}) — room ${res.room||"TBA"} released`, "audit");
  }

  function cancelAllExpiredHolds() {
    if (expiredHolds.length === 0) return;
    const ids = expiredHolds.map(r => r.id);
    const rooms = expiredHolds.map(r => r.room).filter(Boolean);
    setReservations(prev => prev.map(r =>
      ids.includes(r.id) ? { ...r, status: "Cancelled", internalNotes: ((r.internalNotes||"") + " [Expired Hold — auto-cancelled via Night Audit]").trim() } : r
    ));
    if (rooms.length > 0) {
      setRooms(prev => prev.map(rm =>
        rooms.includes(rm.number) ? { ...rm, status: "Available", guest: null } : rm
      ));
    }
    addLog(`Night Audit: ${expiredHolds.length} expired hold${expiredHolds.length!==1?"s":""} cancelled — ${expiredHolds.map(r=>r.guest).join(", ")}`, "audit");
  }

  function getReportData() {
    const fmtD = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
    if (reportType === "occupancy") {
      return {
        title: "Room Occupancy Report",
        headers: ["Room No","Floor","Bhawan","Type","Status","Rate (₹/night)","Current Guest"],
        rows: rooms.map(r => [r.number, r.floor === 0 ? "Ground Floor" : `Floor ${r.floor}`, r.bhavan, r.type, r.status, rupees(r.rate), r.guest || "—"]),
      };
    }
    if (reportType === "revenue") {
      const pct = v => totalRoomRevenue > 0 ? `${Math.round(v/totalRoomRevenue*100)}%` : "—";
      return {
        title: `Revenue Report — ${fmtD(dateFrom)} to ${fmtD(dateTo)}`,
        headers: ["Segment","Rooms","Bookings","Room Revenue (₹)","ADR (₹)","% of Total"],
        rows: [
          ...bhavanRevenue.map(b => [`${b.name} (Bhavan)`, b.rooms, b.bookings, rupees(b.revenue), b.bookings > 0 ? rupees(b.adr) : "—", pct(b.revenue)]),
          ...roomTypeRevenue.map(rt => [`${rt.name} (Type)`, rt.rooms, rt.occupied, rupees(rt.revenue), rt.occupied > 0 ? rupees(rt.adr) : "—", pct(rt.revenue)]),
          ["── TOTAL ──", totalRooms, inRangeRes.length, rupees(totalRoomRevenue), roomsSold > 0 ? rupees(adr) : "—", "100%"],
        ],
      };
    }
    if (reportType === "bhavan") {
      return {
        title: `Revenue by Bhavan — ${fmtD(dateFrom)} to ${fmtD(dateTo)}`,
        headers: ["Bhavan","Total Rooms","Bookings","Room Revenue (₹)","ADR (₹)","Collected (₹)","Outstanding (₹)"],
        rows: [
          ...bhavanRevenue.map(b => [b.name, b.rooms, b.bookings, rupees(b.revenue), b.bookings > 0 ? rupees(b.adr) : "—", rupees(b.paid), rupees(b.outstanding)]),
          ["── TOTAL ──", totalRooms, inRangeRes.length, rupees(totalRoomRevenue), roomsSold > 0 ? rupees(adr) : "—", rupees(totalPaid), rupees(Math.max(0, totalRoomRevenue - totalPaid))],
        ],
      };
    }
    if (reportType === "arrivals") {
      const rangeLabel = (dateFrom === dateTo) ? fmtD(dateFrom) : `${fmtD(dateFrom)} to ${fmtD(dateTo)}`;
      return {
        title: `Arrivals — ${rangeLabel}`,
        headers: ["Booking ID","Guest","Room","Bhawan","Type","Check-In","ETA","Adults","Status","Mobile"],
        rows: arrivalsInRange.map(r => [r.id, r.guest, r.room||"TBA", r.bhavan||"—", r.type, r.checkIn, r.eta||"14:00", r.adults||1, r.status, r.mobile||"—"]),
      };
    }
    if (reportType === "departures") {
      const rangeLabel = (dateFrom === dateTo) ? fmtD(dateFrom) : `${fmtD(dateFrom)} to ${fmtD(dateTo)}`;
      return {
        title: `Departures — ${rangeLabel}`,
        headers: ["Booking ID","Guest","Room","Bhawan","Type","Check-In","Check-Out","ETD","Nights","Balance (₹)","Mobile"],
        rows: departuresInRange.map(r => {
          const nights = (r.checkIn && r.checkOut) ? Math.max(1, Math.round((new Date(r.checkOut)-new Date(r.checkIn))/86400000)) : 1;
          const bal = Math.max(0, (r.total||0) - (r.paid||0));
          return [r.id, r.guest, r.room||"—", r.bhavan||"—", r.type, r.checkIn, fmtD(r.checkOut), r.etd||"11:00", nights, rupees(bal), r.mobile||"—"];
        }),
      };
    }
    if (reportType === "inhouse") {
      return {
        title: "In-House Guest Report",
        headers: ["Booking ID","Guest","Room","Bhawan","Type","Check-In","Check-Out","Nights Left","Balance (₹)"],
        rows: inHouseGuests.map(r => {
          const today = new Date(); today.setHours(0,0,0,0);
          const co = new Date(r.checkOut); co.setHours(0,0,0,0);
          const nightsLeft = Math.max(0, Math.round((co - today) / 86400000));
          const bal = Math.max(0, (r.total||0) - (r.paid||0));
          return [r.id, r.guest, r.room||"—", r.bhavan||"—", r.type, fmtD(r.checkIn), fmtD(r.checkOut), nightsLeft, rupees(bal)];
        }),
      };
    }
    if (reportType === "noshow") {
      return {
        title: `No-Show / Cancellation — ${fmtD(dateFrom)} to ${fmtD(dateTo)}`,
        headers: ["Booking ID","Guest","Room","Bhawan","Type","Check-In","Status","Total (₹)","Paid (₹)","Balance (₹)"],
        rows: noShowCancelled.map(r => {
          const bal = Math.max(0, (r.total||0) - (r.paid||0));
          return [r.id, r.guest, r.room||"—", r.bhavan||"—", r.type, fmtD(r.checkIn), r.status, rupees(r.total||0), rupees(r.paid||0), rupees(bal)];
        }),
      };
    }
    if (reportType === "cashier") {
      // ── Payment transactions: advance + final payments in date range ──
      const paymentEntries = reservations.flatMap(r =>
        (r.folio || [])
          .filter(f => !f.voided && !f.isVoidReversal && f.amount < 0 &&
                       (f.desc?.startsWith("Advance") || f.desc?.startsWith("Payment")) &&
                       f.date && f.date.slice(0,10) >= dateFrom && f.date.slice(0,10) <= dateTo)
          .map(f => ({
            date: f.date.slice(0,10),
            guest: r.guest,
            resId: r.id,
            room: r.room || "TBA",
            bhavan: r.bhavan || "—",
            amount: Math.abs(f.amount),
            method: r.paymentMode || r.paymentMethod || "Not Recorded",
            desc: f.desc,
            type: "Payment",
          }))
      );
      // ── Tip / donation entries in date range ──
      const tipEntries = reservations.flatMap(r =>
        (r.folio || [])
          .filter(f => f.isTip && f.date && f.date.slice(0,10) >= dateFrom && f.date.slice(0,10) <= dateTo)
          .map(f => ({
            date: f.date.slice(0,10),
            guest: r.guest,
            resId: r.id,
            room: r.room || "TBA",
            bhavan: r.bhavan || "—",
            amount: f.amount,
            method: f.tipMethod || "Cash",
            desc: "Tip / Donation",
            type: "Tip",
            staff: f.staffName || "—",
          }))
      );
      const allEntries = [...paymentEntries, ...tipEntries].sort((a,b) => b.date.localeCompare(a.date));

      // ── Totals by payment method ──
      const byMethod = {};
      paymentEntries.forEach(e => { byMethod[e.method] = (byMethod[e.method] || 0) + e.amount; });
      const tipsByMethod = {};
      tipEntries.forEach(e => { tipsByMethod[e.method] = (tipsByMethod[e.method] || 0) + e.amount; });

      const totalPayments    = paymentEntries.reduce((s,e) => s + e.amount, 0);
      const totalTips        = tipEntries.reduce((s,e) => s + e.amount, 0);
      const totalOutstanding = Math.max(0, totalRevenue - totalPaid);

      return {
        title: `Cashier Settlement — ${fmtD(dateFrom)} to ${fmtD(dateTo)}`,
        summary: {
          totalPayments, totalRoomRev: totalRoomRevenue, totalTips, totalOutstanding,
          byMethod, tipsByMethod, entryCount: allEntries.length,
        },
        headers: ["Date","Type","Guest","Room","Bhawan","Reservation","Amount (₹)","Method"],
        rows: allEntries.map(e => [e.date, e.type, e.guest, e.room, e.bhavan, e.resId, rupees(e.amount), e.method]),
        isCashier: true,
      };
    }
    if (reportType === "nightaudit") {
      // Night Audit metrics are always anchored to today regardless of date picker
      const inHouseNow   = reservations.filter(r => r.status === "Checked In");
      const todayRoomRev = inHouseNow.reduce((s,r) => s + getRoomRate(r.bhavan, r.type, r.room), 0);
      const chargesAlreadyPosted = inHouseNow.filter(r =>
        (r.folio||[]).some(f => f.desc === `Room charge (${todayStr})` && !f.voided)
      ).length;
      const todayPayments = reservations.flatMap(r => (r.folio||[]).filter(f =>
        !f.voided && !f.isVoidReversal && f.amount < 0 &&
        (f.desc?.startsWith("Advance") || f.desc?.startsWith("Payment")) &&
        (f.date||"").slice(0,10) === todayStr
      )).reduce((s,f) => s + Math.abs(f.amount), 0);
      const todayTips = reservations.flatMap(r =>(r.folio||[]).filter(f =>
        f.isTip && (f.date||"").slice(0,10) === todayStr
      )).reduce((s,f) => s + f.amount, 0);
      // All no-shows + cancellations ever (Night Audit always shows global picture)
      const nsCanAll = reservations.filter(r => r.status === "No Show" || r.status === "Cancelled");
      return {
        title: `Night Audit — ${fmtD(todayStr)}`,
        headers: ["Metric","Value"],
        rows: [
          ["── ROOMS ──", ""],
          ["Total Rooms", totalRooms],
          ["Occupied (In-House)", inHouseNow.length],
          ["Live Occupancy %", `${totalRooms > 0 ? Math.round(inHouseNow.length/totalRooms*100) : 0}%`],
          ["Arrivals Today", arrivalsToday.length],
          ["Departures Today", departuresToday.length],
          ["── REVENUE ──", ""],
          ["Room Revenue Tonight (₹)", rupees(todayRoomRev)],
          ["Room Charges Already Posted", chargesAlreadyPosted],
          ["Room Charges Pending Post", inHouseNow.length - chargesAlreadyPosted],
          ["── PAYMENTS ──", ""],
          ["Payments Collected Today (₹)", rupees(todayPayments)],
          ["Tips / Donation Today (₹)", rupees(todayTips)],
          ["── ACTION ITEMS ──", ""],
          ["Missed Arrivals (→ No Show)", missedArrivals.length],
          ["Expired On Hold (→ Cancel)", expiredHolds.length],
          ["Total No-Shows / Cancellations", nsCanAll.length],
        ],
      };
    }
    if (reportType === "guests") {
      let rows = reservations;
      if (statusFilter !== "All") rows = rows.filter(r => r.status === statusFilter);
      if (guestSearch.trim()) {
        const q = guestSearch.toLowerCase();
        rows = rows.filter(r => (r.guest||"").toLowerCase().includes(q) || (r.id||"").toLowerCase().includes(q) || (r.mobile||"").includes(q));
      }
      rows = rows.filter(r => !dateFrom || !r.checkIn || r.checkIn >= dateFrom);
      rows = rows.filter(r => !dateTo   || !r.checkIn || r.checkIn <= dateTo);
      return {
        title: "Guest Reservations Report",
        headers: ["Booking ID","Guest","Room","Bhawan","Type","Check-In","Check-Out","Nights","Total (₹)","Paid (₹)","Balance","Status","Reference"],
        rows: rows.map(r => {
          const nights = r.checkIn && r.checkOut ? Math.max(1, Math.round((new Date(r.checkOut)-new Date(r.checkIn))/86400000)) : 0;
          const bal = Math.max(0,(r.total||0)-(r.paid||0));
          return [r.id, r.guest, r.room||"TBA", r.bhavan||"—", r.type, r.checkIn, r.checkOut, nights, rupees(r.total||0), rupees(r.paid||0), rupees(bal), r.status, r.reference||"—"];
        }),
      };
    }
    // Audit log
    return {
      title: "Audit Log",
      headers: ["Time","User","Action","Type"],
      rows: auditLogs.map(l => [l.time, l.user, l.action, l.type]),
    };
  }

  // ── Export functions ─────────────────────────────────────────────────────────
  function exportCSV() {
    const { title, headers, rows } = getReportData();
    const lines = [headers.join(","), ...rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(","))];
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    triggerDownload(blob, `${title.replace(/\s+/g,"_")}_${today()}.csv`);
    flash("✓ CSV exported");
  }
  function exportJSON() {
    const { title, headers, rows } = getReportData();
    const data = rows.map(r => Object.fromEntries(headers.map((h,i) => [h, r[i]])));
    const blob = new Blob([JSON.stringify({ report: title, generatedAt: new Date().toISOString(), period: { from: dateFrom, to: dateTo }, data }, null, 2)], { type: "application/json" });
    triggerDownload(blob, `${title.replace(/\s+/g,"_")}_${today()}.json`);
    flash("✓ JSON exported");
  }
  function exportHTML() {
    const { title, headers, rows } = getReportData();
    const thC = `style="padding:10px 14px;background:#1a1f2e;color:#a07830;text-align:left;font-size:12px;border-bottom:2px solid #a07830"`;
    const tdC = `style="padding:10px 14px;border-bottom:1px solid #dde1e9;color:#374151;font-size:13px"`;
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
<style>body{font-family:sans-serif;background:#f4f5f7;color:#111827;padding:32px}h1{color:#a07830;font-size:22px;margin-bottom:4px}p{color:#6b7280;font-size:13px;margin-bottom:24px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08)}</style>
</head><body>
<h1>${title}</h1><p>Period: ${dateFrom} to ${dateTo} · Generated: ${new Date().toLocaleString("en-IN")}</p>
<table><thead><tr>${headers.map(h=>`<th ${thC}>${h}</th>`).join("")}</tr></thead>
<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td ${tdC}>${c}</td>`).join("")}</tr>`).join("")}</tbody>
</table></body></html>`;
    const blob = new Blob([html], { type: "text/html;charset=utf-8;" });
    triggerDownload(blob, `${title.replace(/\s+/g,"_")}_${today()}.html`);
    flash("✓ HTML exported");
  }
  function exportXLSX() {
    const { title, headers, rows } = getReportData();
    const xmlRows = [headers,...rows].map((row,ri) =>
      `<Row ss:Index="${ri+1}">${row.map(cell=>
        `<Cell><Data ss:Type="${typeof cell==="number"?"Number":"String"}">${String(cell).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</Data></Cell>`
      ).join("")}</Row>`
    ).join("");
    const xml = `<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="${title.slice(0,31)}"><Table>${xmlRows}</Table></Worksheet></Workbook>`;
    const blob = new Blob([xml], { type: "application/vnd.ms-excel;charset=utf-8;" });
    triggerDownload(blob, `${title.replace(/\s+/g,"_")}_${today()}.xls`);
    flash("✓ Excel exported");
  }
  function exportPDF() {
    const { title, headers, rows } = getReportData();
    const thS = `style="padding:8px 12px;background:#1a1f2e;color:#a07830;text-align:left;font-size:11px;border-bottom:2px solid #a07830"`;
    const tdS = `style="padding:8px 12px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#334155"`;
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
<style>@media print{body{margin:0}button{display:none}}body{font-family:sans-serif;padding:24px;color:#1e293b}h1{font-size:20px;color:#92400e;margin-bottom:2px}p{color:#64748b;font-size:12px;margin-bottom:16px}table{width:100%;border-collapse:collapse;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}button{margin-top:16px;padding:8px 20px;background:#a07830;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600}</style>
</head><body>
<h1>${title}</h1><p>Period: ${dateFrom} to ${dateTo} · Generated: ${new Date().toLocaleString("en-IN")} · ${HOTEL_NAME}</p>
<button onclick="window.print()">🖨 Print / Save as PDF</button>
<table style="margin-top:16px"><thead><tr>${headers.map(h=>`<th ${thS}>${h}</th>`).join("")}</tr></thead>
<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td ${tdS}>${c}</td>`).join("")}</tr>`).join("")}</tbody>
</table></body></html>`;
    const w = window.open("","_blank"); w.document.write(html); w.document.close();
    flash("✓ PDF view opened — use browser Print");
  }
  function today() { return new Date().toISOString().slice(0,10); }
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function flash(msg) { setExportStatus(msg); setTimeout(() => setExportStatus(""), 3000); }

  const { title, headers, rows, isCashier, summary } = getReportData();

    { label: "JSON",  icon: "🔧", fn: exportJSON, color: "#f59e0b" },
    { label: "HTML",  icon: "🌐", fn: exportHTML, color: "#a855f7" },

    occupancy: "#a07830", revenue: "#22c55e", bhavan: "#0ea5e9",
    arrivals: "#3b82f6", departures: "#a855f7", inhouse: "#06b6d4",
    guests: "#111827", noshow: "#ef4444", nightaudit: "#6366f1",
    audit: "#6b7280", cashier: "#6366f1",
  }[reportType] || "#a07830";

  return (

        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

          <div className="stat-label">Occupancy (Period)</div>
          <div className="stat-value">{occupancyPct}%</div>

        <div className="stat-card" style={{ "--accent": "#22c55e" }}>

          <div className="stat-sub">{inRangeRes.length} bookings · {dateFrom} → {dateTo}</div>
        </div>
        <div className="stat-card" style={{ "--accent": "#3b82f6" }}>
          <div className="stat-label">ADR</div>
          <div className="stat-value">₹{rupees(adr)}</div>
          <div className="stat-sub">Avg daily rate / booking</div>
        </div>
        <div className="stat-card" style={{ "--accent": "#a855f7" }}>
          <div className="stat-label">RevPAR</div>
          <div className="stat-value">₹{rupees(revpar)}</div>
          <div className="stat-sub">Per available room/night</div>
        </div>
        <div className="stat-card" style={{ "--accent": "#06b6d4" }}>
          <div className="stat-label">Arrivals Today</div>
          <div className="stat-value">{arrivalsToday.length}</div>
          <div className="stat-sub">{departuresToday.length} departures</div>
        </div>
        <div className="stat-card" style={{ "--accent": "#f59e0b" }}>
          <div className="stat-label">Outstanding</div>
          <div className="stat-value">₹{rupees(Math.max(0, totalRevenue - totalPaid))}</div>
          <div className="stat-sub">Balance due (period)</div>
        </div>
      </div>

      {/* Date range + period selector */}
      <div className="card" style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.08em" }}>Report Period</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)}
              style={{ fontSize: 13, padding: "6px 10px", borderRadius: 7, border: "1px solid var(--border)", background: "var(--surface)", color: "var(--text)" }} />

          {[

      {/* Report generator */}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>

            <div className="card-title" style={{ marginBottom: 8 }}>Generate Report</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {REPORT_TYPES.map(rt => (
                <button key={rt.id}
                  className={`btn btn-sm ${reportType === rt.id ? "btn-primary" : "btn-ghost"}`}
                  onClick={() => setReportType(rt.id)}>
                  {rt.icon} {rt.label}

              ))}

            <div style={{ display: "flex", gap: 6 }}>
              {EXPORT_BTNS.map(btn => (
                <button key={btn.label} onClick={btn.fn}

                  onMouseEnter={e => { e.currentTarget.style.background = `${btn.color}22`; e.currentTarget.style.transform = "translateY(-1px)"; }}

          <div style={{ marginBottom:20 }}>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:14 }}>
              {[
                { label:"Payments Collected", value:`₹${rupees(summary.totalPayments)}`, color:"#22c55e", bg:"rgba(34,197,94,0.08)" },
                { label:"Room Revenue", value:`₹${rupees(summary.totalRoomRev)}`, color:"#3b82f6", bg:"rgba(59,130,246,0.08)" },
                { label:"Tips / Donation", value:`₹${rupees(summary.totalTips)}`, color:"#f59e0b", bg:"rgba(245,158,11,0.08)" },
                { label:"Outstanding Balance", value:`₹${rupees(summary.totalOutstanding)}`, color: summary.totalOutstanding > 0 ? "#ef4444" : "#22c55e", bg: summary.totalOutstanding > 0 ? "rgba(239,68,68,0.08)" : "rgba(34,197,94,0.08)" },
              ].map(s => (
                <div key={s.label} style={{ flex:1, minWidth:130, padding:"12px 14px", background:s.bg, border:`1px solid ${s.color}33`, borderRadius:10 }}>
                  <div style={{ fontSize:19, fontWeight:800, color:s.color }}>{s.value}</div>
                  <div style={{ fontSize:11, color:"#6b7280", marginTop:3 }}>{s.label}</div>
                </div>
              ))}
            </div>
            {Object.keys(summary.byMethod).length > 0 && (
              <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:10 }}>
                <div style={{ flex:1, background:"rgba(99,102,241,0.06)", border:"1px solid rgba(99,102,241,0.2)", borderRadius:8, padding:"10px 14px" }}>
                  <div style={{ fontSize:11, fontWeight:700, color:"#6366f1", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:8 }}>Payments by Method</div>
                  <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
                    {Object.entries(summary.byMethod).map(([method, amt]) => (
                      <div key={method} style={{ fontSize:13 }}>
                        <span style={{ color:"#374151" }}>{method}:</span>
                        <span style={{ fontWeight:700, color:"#6366f1", marginLeft:5 }}>₹{rupees(amt)}</span>
                      </div>
                    ))}
                  </div>
                </div>
                {Object.keys(summary.tipsByMethod).length > 0 && (
                  <div style={{ flex:1, background:"rgba(245,158,11,0.06)", border:"1px solid rgba(245,158,11,0.2)", borderRadius:8, padding:"10px 14px" }}>
                    <div style={{ fontSize:11, fontWeight:700, color:"#d97706", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:8 }}>Tips by Method</div>
                    <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
                      {Object.entries(summary.tipsByMethod).map(([method, amt]) => (
                        <div key={method} style={{ fontSize:13 }}>
                          <span style={{ color:"#374151" }}>{method}:</span>
                          <span style={{ fontWeight:700, color:"#d97706", marginLeft:5 }}>₹{rupees(amt)}</span>
                        </div>

        {/* Preview table */}
        <div style={{ borderTop: "1px solid var(--border)", paddingTop: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>

              {rows.length} record{rows.length !== 1 ? "s" : ""} · {new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}

          <div style={{ overflowX: "auto" }}>
            <table style={{ minWidth: 600 }}>

          {rows.length > 0 && (
            <div style={{ textAlign: "right", padding: "8px 4px 0", fontSize: 11, color: "#9ca3af" }}>

        </div>
      </div>
    </div>
  );
}

function LoginPage({ onLogin }) {

  const [password, setPassword] = useState("");

  const [remember, setRemember] = useState(false);

  function handleLogin() {
    setError("");

    setLoading(true);
    setTimeout(() => {
      const account = DEMO_ACCOUNTS.find((a) => a.email === email && a.password === password);
      if (account) {
        onLogin(account);
      } else {
        setError("Invalid credentials. Try a demo account below.");
        setLoading(false);
      }
    }, 900);
  }

  function quickLogin(account) {
    setEmail(account.email);
    setPassword(account.password);
    setError("");

    setTimeout(() => onLogin(account), 700);
  }

  return (
    <>
      <style>{css}</style>
      <div className="login-root">

        <div className="login-left">
          <div className="login-grid-lines" />
          <div style={{ position: "relative", zIndex: 1 }}>

            <div className="login-hotel-name">

            </div>
            <div className="login-tagline">Where every stay becomes an unforgettable story.</div>
            <div className="login-stats-row">
              <div className="login-stat">
                <div className="login-stat-val">32</div>
                <div className="login-stat-lbl">Floors</div>
              </div>
              <div className="login-stat">
                <div className="login-stat-val">284</div>
                <div className="login-stat-lbl">Rooms</div>
              </div>
              <div className="login-stat">
                <div className="login-stat-val">4.9★</div>
                <div className="login-stat-lbl">Rating</div>
              </div>
              <div className="login-stat">
                <div className="login-stat-val">38yr</div>
                <div className="login-stat-lbl">Legacy</div>
              </div>
            </div>
          </div>
        </div>

        {/* RIGHT PANEL */}

            </div>

            <div className="login-input-wrap">
              <span className="login-input-icon">🔒</span>
              <input
                type={showPw ? "text" : "password"} placeholder="Password"
                value={password} onChange={(e) => setPassword(e.target.value)}

// ─── INVOICE VIEWER ──────────────────────────────────────────────────────────
function InvoiceViewer() {
  const [html, setHtml] = useState(null);
  const iframeRef = useRef(null);
  const printRef  = useRef(null);

  useEffect(() => {
    const handler = (e) => setHtml(e.detail.html);
    window.addEventListener("showInvoice", handler);
    return () => window.removeEventListener("showInvoice", handler);
  }, []);

  // Write into BOTH iframes whenever html changes
  useEffect(() => {
    if (!html) return;
    [iframeRef, printRef].forEach(ref => {
      if (ref.current) {
        const doc = ref.current.contentDocument || ref.current.contentWindow.document;
        doc.open(); doc.write(html); doc.close();
      }
    });
    // Auto-resize visible iframe to full content height after render
    const resize = () => {
      if (iframeRef.current) {
        try {
          const body = iframeRef.current.contentDocument?.body;
          if (body) {
            const h = body.scrollHeight;
            if (h > 400) iframeRef.current.style.height = (h + 40) + "px";
          }
        } catch(e) {}
      }
    };
    setTimeout(resize, 200);
    setTimeout(resize, 600); // second pass after fonts/images settle
  }, [html]);

  function handlePrint() {
    if (printRef.current && printRef.current.contentWindow) {
      printRef.current.contentWindow.focus();
      printRef.current.contentWindow.print();
    }
  }

  if (!html) return null;

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 99999,
      background: "rgba(0,0,0,0.82)", backdropFilter: "blur(6px)",
      display: "flex", flexDirection: "column", alignItems: "center",
      overflowY: "auto", padding: "16px",
    }}>
      {/* Hidden iframe for printing only */}
      <iframe ref={printRef} title="invoice-print-hidden"
        style={{ position: "absolute", width: 0, height: 0, border: "none", opacity: 0, pointerEvents: "none" }} />

      {/* Floating toolbar */}
      <div style={{
        position: "sticky", top: 0, zIndex: 10,
        width: "100%", maxWidth: 820,
        display: "flex", justifyContent: "space-between", alignItems: "center",
        background: "rgba(19,22,30,0.95)", backdropFilter: "blur(8px)",
        borderRadius: 10, padding: "10px 16px", marginBottom: 12,
        border: "1px solid rgba(201,168,76,0.25)",
        boxShadow: "0 4px 20px rgba(0,0,0,0.5)",
      }}>
        <span style={{ color: "#a07830", fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 8 }}>
          🧾 Invoice Preview
        </span>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={handlePrint}
            style={{ background: "#a07830", color: "#1a1a2e", border: "none", padding: "8px 20px", borderRadius: 7, fontWeight: 700, fontSize: 13, cursor: "pointer", letterSpacing: "0.02em" }}>
            🖨 Print / Save PDF
          </button>
          <button onClick={() => setHtml(null)}
            style={{ background: "rgba(255,255,255,0.07)", color: "#111827", border: "1px solid rgba(0,0,0,0.09)", padding: "8px 16px", borderRadius: 7, fontSize: 13, cursor: "pointer" }}>
            ✕ Close
          </button>
        </div>
      </div>

      {/* Visible iframe — full invoice with all styles */}
      <iframe
        ref={iframeRef}
        title="invoice-preview"
        style={{
          width: "100%", maxWidth: 820,
          height: "1200px",
          border: "none",
          borderRadius: 10,
          boxShadow: "0 24px 60px rgba(0,0,0,0.5)",
          background: "#fff",
        }}
      />

      {/* Bottom close */}
      <button onClick={() => setHtml(null)}
        style={{ marginTop: 16, background: "rgba(255,255,255,0.07)", color: "#6b7280", border: "1px solid rgba(0,0,0,0.07)", padding: "9px 28px", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>
        ✕ Close Invoice
      </button>
    </div>
  );
}

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [navContext, setNavContext] = useState({});
  const [rooms, setRooms] = useState(generateRooms);
  const [reservations, setReservations] = useState(initReservations);
  const [hkTasks, setHkTasks] = useState(initHousekeeping);
  const [posOrders, setPosOrders] = useState(initPOSOrders);
  const [users, setUsers] = useState(initUsers);
  const [auditLogs, setAuditLogs] = useState(initAuditLogs);

  // Globally prevent mouse-wheel from changing number input values
  useEffect(() => {
    const handler = (e) => {
      if (document.activeElement?.type === "number") {
        document.activeElement.blur();
      }
    };
    document.addEventListener("wheel", handler, { passive: false });
    return () => document.removeEventListener("wheel", handler);
  }, []);

  if (!currentUser) return <LoginPage onLogin={(user) => setCurrentUser(user)} />;

  function addLog(action, type = "edit") {
    const now = new Date();
    const time = now.toTimeString().slice(0, 5);
    setAuditLogs((prev) => [{ time, user: currentUser.name, action, type }, ...prev]);
  }

  function navigateTo(targetPage, context = {}) {
    setNavContext(context);
    setPage(targetPage);
  }

  // Role-based nav filtering
  const roleNav = {
    Admin: ["dashboard","reservations","rooms","billing","housekeeping","pos","users","reports"],
    "Front Desk": ["dashboard","reservations","rooms","billing"],
    Housekeeping: ["rooms","housekeeping"],
    Restaurant: ["pos"],
  };
  const allowedPages = roleNav[currentUser.role] || ["dashboard"];
  const visibleNav = NAV_ITEMS.filter((n) => allowedPages.includes(n.id));

  const pageLabels = { dashboard: "Dashboard", reservations: "Reservations", rooms: "Rooms", billing: "Billing", housekeeping: "Housekeeping", pos: "Restaurant POS", users: "Users", reports: "Reports" };

  function renderPage() {
    switch (page) {
      case "dashboard": return <Dashboard rooms={rooms} reservations={reservations} onNavigate={navigateTo} auditLogs={auditLogs} currentUser={currentUser} />;
      case "reservations": return <Reservations reservations={reservations} setReservations={setReservations} rooms={rooms} setRooms={setRooms} initFilter={navContext.resFilter} onNavigate={navigateTo} addLog={addLog} />;
      case "rooms": return <Rooms rooms={rooms} setRooms={setRooms} initFilter={navContext.roomFilter} initRoomNumber={navContext.roomNumber} reservations={reservations} onNavigate={navigateTo} addLog={addLog} />;
      case "billing": return <Billing reservations={reservations} setReservations={setReservations} addLog={addLog} />;
      case "housekeeping": return <Housekeeping tasks={hkTasks} setTasks={setHkTasks} rooms={rooms} addLog={addLog} />;
      case "pos": return <POS orders={posOrders} setOrders={setPosOrders} reservations={reservations} addLog={addLog} />;
      case "users": return <Users users={users} setUsers={setUsers} addLog={addLog} />;
      case "reports": return <Reports rooms={rooms} reservations={reservations} setReservations={setReservations} setRooms={setRooms} auditLogs={auditLogs} addLog={addLog} />;
      default: return null;
    }
  }

  const roleColors = { Admin: "#ef4444", "Front Desk": "#3b82f6", Housekeeping: "#22c55e", Restaurant: "#f59e0b" };

  return (
    <>
      <style>{css}</style>
      <InvoiceViewer />
      <div className="app">
        <div className="sidebar">
          <div className="sidebar-logo">
            <h1>{HOTEL_NAME}</h1>
            <p>Hotel Management System</p>
          </div>
          <nav className="nav">
            {visibleNav.map((item) => (
              <div key={item.id}
                className={`nav-item ${page === item.id ? "active" : ""}`}
                onClick={() => !item.disabled && navigateTo(item.id)}
                title={item.disabled ? "Coming Soon" : item.label}
                style={{ opacity: item.disabled ? 0.4 : 1, cursor: item.disabled ? "not-allowed" : "pointer", position:"relative" }}>
                <span className="nav-icon">{item.icon}</span>
                {item.label}
                {item.disabled && (
                  <span style={{ fontSize:9, fontWeight:700, color:"#6b7280", background:"rgba(0,0,0,0.08)", border:"1px solid rgba(0,0,0,0.12)", borderRadius:4, padding:"1px 5px", marginLeft:"auto", letterSpacing:"0.04em" }}>
                    SOON
                  </span>
                )}
              </div>
            ))}
          </nav>
          <div className="sidebar-footer">
            <strong style={{ color: "var(--text-dim)" }}>{currentUser.avatar} {currentUser.name}</strong>
            <span style={{ color: roleColors[currentUser.role], fontSize: 11 }}>{currentUser.role}</span>
            <div style={{ marginTop: 10 }}>
              <button className="btn btn-ghost btn-sm" style={{ width: "100%", fontSize: 11 }}
                onClick={() => { setCurrentUser(null); setPage("dashboard"); }}>
                Sign Out
              </button>
            </div>
          </div>
        </div>

        <div className="main">
          <div className="topbar">
            <div className="topbar-title">{pageLabels[page]}</div>
            <div className="topbar-right">
              <span className="date-chip">{new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}</span>
              <div className="topbar-user" onClick={() => { setCurrentUser(null); setPage("dashboard"); }}>
                <div className="topbar-user-avatar">{currentUser.avatar}</div>
                <div className="topbar-user-info">
                  <div className="topbar-user-name">{currentUser.name}</div>
                  <div className="topbar-user-role">{currentUser.role}</div>
                </div>
              </div>
            </div>
          </div>
          <div className="content">{renderPage()}</div>
        </div>
      </div>
    </>
  );
}
