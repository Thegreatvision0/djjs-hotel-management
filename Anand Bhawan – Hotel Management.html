  });

  // ── Guest House: Ground floor (3 rooms) + First floor (5 rooms), all Standard ─
  const ghRooms = [
    { num: "03", floor: 0 }, // Ground floor
    { num: "04", floor: 0 },
    { num: "05", floor: 0 },
    { num: "06", floor: 1 }, // First floor
    { num: "07", floor: 1 },
    { num: "08", floor: 1 },
    { num: "09", floor: 1 },
    { num: "10", floor: 1 },
  ];
  ghRooms.forEach(({ num, floor }) => {
    rooms.push({ id: `GH-${num}`, number: "GH-"+num, floor, bhavan: "Guest House", type: "Standard", status: "Available", rate: GUEST_HOUSE_RATES["GH-"+num], guest: null, checkIn: null, checkOut: null, housekeepingNote: "", maxOcc: 2, amenities: { ac: true, tv: true, wifi: true, hotwater: true, attachedBath: true }, notes: "", dnd: false, lastCleaned: "", maintenanceLogs: [], stayHistory: [], serviceRequests: [], upgradeHistory: [] });
  });

  // ── Anand Bhawan ──────────────────────────────────────────────────────────
  // Ground (floor 0): rooms 01-12   Deluxe: 03,04,09,10  Standard: rest
  // 1st floor:        101-113       Deluxe: 103,104,109,110
  // 2nd floor:        201-213       Deluxe: 203,204,209,210
  // 3rd floor:        301-313       Deluxe: 303,304,309,310
  // 4th floor:        401-403       all Standard
  // Rates: Standard 800  Deluxe 1200
  const AB_DELUXE_SUFFIX = new Set([3, 4, 9, 10]);
  const AB_FLOORS = [
    { floor: 0, nums: Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0")) },
    { floor: 1, nums: Array.from({ length: 13 }, (_, i) => String(101 + i)) },
    { floor: 2, nums: Array.from({ length: 13 }, (_, i) => String(201 + i)) },
    { floor: 3, nums: Array.from({ length: 13 }, (_, i) => String(301 + i)) },
    { floor: 4, nums: ["401", "402", "403"] },
  ];
  AB_FLOORS.forEach(({ floor, nums }) => {
    nums.forEach((num) => {
      const suffix = parseInt(num, 10) % 100 || parseInt(num, 10);
      const isDeluxe = floor < 4 && AB_DELUXE_SUFFIX.has(suffix);
      const type = isDeluxe ? "Deluxe" : "Standard";
      const rate = isDeluxe ? ROOM_RATES.Deluxe : ROOM_RATES.Standard;
      rooms.push({
        id: "AB-" + num,
        number: num,
        floor,
        bhavan: "Anand Bhawan",
        type,
        status: "Available",
        rate,
        guest: null,
        checkIn: null,
        checkOut: null,
        housekeepingNote: "",
        maxOcc: isDeluxe ? 3 : 2,
        amenities: { ac: true, tv: true, wifi: true, hotwater: true, attachedBath: true, geyser: isDeluxe },
        notes: "",
        dnd: false,
        lastCleaned: "",
        maintenanceLogs: [], stayHistory: [], serviceRequests: [], upgradeHistory: [],
      });
    });
  });

  // Seed stayHistory from checked-out reservations
  initReservations.forEach((res) => {
    if (res.status !== "Checked Out") return;
    const room = rooms.find((rm) => rm.number === res.room && rm.bhavan === res.bhavan);
    if (!room) return;
    const nights = res.checkIn && res.checkOut ? Math.max(1, Math.round((new Date(res.checkOut) - new Date(res.checkIn)) / 86400000)) : 1;
    room.stayHistory.push({
      id: res.id, guest: res.guest, mobile: res.mobile || "", checkIn: res.checkIn, checkOut: res.checkOut,
      nights, total: res.total || 0, paid: res.paid || 0, adults: res.adults || 1, children: res.children || 0, bookingSource: res.bookingSource || "",
      incidents: [], notes: "", checkedOutAt: res.checkOut + "T11:00:00.000Z",
    });
  });

  // Sync status from initReservations so rooms always match at startup
  initReservations.forEach((res) => {
    const room = rooms.find((rm) => rm.number === res.room && rm.bhavan === res.bhavan);
    if (!room) return;
    if (res.status === "Checked In") {
      room.status = "Occupied";
      room.guest = res.guest;
      room.checkIn = res.checkIn;
      room.checkOut = res.checkOut;
    }
  });

  // Seed a few Dirty and Maintenance rooms for realism (non-DSB, non-GH)
  const dirtyRooms = ["05", "201"];
  const maintRooms = ["106", "302"];
  rooms.forEach((rm) => {
    if (dirtyRooms.includes(rm.number) && rm.bhavan !== "DSB" && rm.bhavan !== "Guest House") rm.status = "Dirty";
    if (maintRooms.includes(rm.number) && rm.bhavan !== "DSB" && rm.bhavan !== "Guest House") rm.status = "Maintenance";
  });

  return rooms;
}

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  /* ROOM GRID */
  .room-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }

    aspect-ratio: 1; border-radius: 8px;

  .room-number { font-size: 11px; font-weight: 800; color: #111827; }
  .room-type { font-size: 9px; opacity: 0.7; margin-top: 2px; }
  
  /* FORM */
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
  input, select, textarea {
    width: 100%; padding: 9px 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }

  input[type=number]::-webkit-inner-spin-button,

  .login-input-wrap { position: relative; margin-bottom: 16px; }

    border-radius: 8px; margin-bottom: 16px;
  }

    display: flex; align-items: center; gap: 10px;

  .topbar-user:hover { border-color: rgba(201,168,76,0.4); }
  .topbar-user-avatar {
    width: 28px; height: 28px; border-radius: "50%";
    background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.3);
    display: flex; align-items: center; justify-content: center; font-size: 13px; border-radius: 50%;
  }
  .topbar-user-info { line-height: 1.2; }
  .topbar-user-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .topbar-user-role { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
`;

// ─── PILL HELPERS ─────────────────────────────────────────────────────────────
function AlertBox({ message, onClose }) {
  if (!message) return null;
  const lines = message.split("\n");
  return (
    <>
      <div className="alert-overlay" onClick={onClose} />
      <div className="alert-box">
        <div style={{ fontSize: 36, marginBottom: 14 }}>⚠️</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: "#111827", marginBottom: 10 }}>Please Check</div>
        <div style={{ fontSize: 13, color: "#6b7280", lineHeight: 1.8, marginBottom: 20, textAlign: "left" }}>
          {lines.map((line, i) => (
            <div key={i} style={{ color: line.startsWith("•") ? "#ef4444" : "#6b7280", fontWeight: line.startsWith("•") ? 600 : 400 }}>
              {line}
            </div>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "center" }}>
          <button className="btn btn-primary" onClick={onClose}
            style={{ minWidth: 100, background: "rgba(239,68,68,0.15)", borderColor: "rgba(239,68,68,0.4)", color: "#ef4444" }}>
            OK
          </button>
        </div>
      </div>
    </>
  );
}

function StatusPill({ status }) {
  const map = {
    Available: "green", Occupied: "blue", Dirty: "amber", Maintenance: "red",
    "Checking Out": "purple", "Checked In": "blue", Confirmed: "gold",
    "Checked Out": "green", Cancelled: "red", Pending: "amber",
    "No Show": "red", "On Hold": "amber", "Due In": "blue",
    "In Progress": "blue", Completed: "green", Served: "green",
    "In Kitchen": "amber", Active: "green", Inactive: "red",
  };
  return <span className={`pill pill-${map[status] || "gold"}`}>{status}</span>;
}

function RoleChip({ role }) {
  const cls = { Admin: "role-admin", "Front Desk": "role-frontdesk", Housekeeping: "role-housekeeping", Restaurant: "role-restaurant" };
  return <span className={cls[role]} style={{ fontWeight: 600, fontSize: 13 }}>{role}</span>;
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function Modal({ title, onClose, children, actions }) {
  return (
    <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ padding: "24px" }}>
        <div className="modal-title">{title}</div>
        {children}
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          {actions}
        </div>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ rooms, reservations, onNavigate, auditLogs, currentUser }) {
  const occupied = rooms.filter((r) => r.status === "Occupied").length;
  const available = rooms.filter((r) => r.status === "Available").length;
  const todayRevenue = revenueData[revenueData.length - 1].revenue;
  const TODAY = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
  const todayCheckins = reservations.filter((r) => r.checkIn === TODAY).length;
  const todayCheckouts = reservations.filter((r) => r.checkOut === TODAY).length;
  // Pending collection — all checked-out guests with outstanding balance (period-independent)
  const pendingCollectionRes = reservations.filter(r =>
    r.status === "Checked Out" && Math.round(((r.total||0) - (r.paid||0)) * 100) / 100 > 0
  );
  const totalPendingCollection = pendingCollectionRes.reduce((s, r) =>
    s + Math.round(((r.total||0) - (r.paid||0)) * 100) / 100, 0
  );

  const pieData = [
    { name: "Occupied", value: occupied, color: "#3b82f6" },
    { name: "Available", value: available, color: "#22c55e" },
    { name: "Dirty", value: rooms.filter((r) => r.status === "Dirty").length, color: "#f59e0b" },
    { name: "Maintenance", value: rooms.filter((r) => r.status === "Maintenance").length, color: "#ef4444" },
  ];

  return (
    <div>
      <div className="section-header">
        <div className="section-title">{(() => { const h = new Date().getHours(); return h < 12 ? "Good Morning" : h < 17 ? "Good Afternoon" : "Good Evening"; })()}, {currentUser?.name?.split(" ")[0]} 👋</div>
        <div className="date-chip">{new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div>
      </div>

      <div className="stats-grid">
        <div className="stat-card clickable" style={{ "--accent": "#3b82f6" }}
          onClick={() => onNavigate("rooms", { roomFilter: "Occupied" })}>
          <div className="stat-label">Occupied Rooms</div>
          <div className="stat-value">{occupied}</div>
          <div className="stat-sub" style={{ color: "#3b82f6" }}>of {rooms.length} total rooms</div>
          <div className="stat-link-hint">View Rooms →</div>
        </div>
        <div className="stat-card clickable" style={{ "--accent": "#22c55e" }}
          onClick={() => onNavigate("rooms", { roomFilter: "Available" })}>
          <div className="stat-label">Vacant Rooms</div>
          <div className="stat-value">{available}</div>
          <div className="stat-sub" style={{ color: "#22c55e" }}>Ready for check-in</div>
          <div className="stat-link-hint">View Rooms →</div>
        </div>
        <div className="stat-card clickable" style={{ "--accent": "#a07830" }}
          onClick={() => onNavigate("reservations", { resFilter: "checkins" })}>
          <div className="stat-label">Today's Check-ins</div>
          <div className="stat-value">{todayCheckins}</div>
          <div className="stat-sub">Arrivals today</div>
          <div className="stat-link-hint">View Reservations →</div>
        </div>
        <div className="stat-card clickable" style={{ "--accent": "#a855f7" }}
          onClick={() => onNavigate("reservations", { resFilter: "checkouts" })}>
          <div className="stat-label">Today's Check-outs</div>
          <div className="stat-value">{todayCheckouts}</div>
          <div className="stat-sub">Departures today</div>
          <div className="stat-link-hint">View Reservations →</div>
        </div>
        <div className="stat-card clickable" style={{ "--accent": "#ef4444" }}
          onClick={() => onNavigate("billing")}>
          <div className="stat-label">Pending Collection</div>
          <div className="stat-value" style={{ color: totalPendingCollection > 0 ? "#ef4444" : "#22c55e" }}>
            {totalPendingCollection > 0 ? `₹${rupees(totalPendingCollection)}` : "✓ Clear"}
          </div>
          <div className="stat-sub" style={{ color: totalPendingCollection > 0 ? "#ef4444" : "#22c55e" }}>
            {pendingCollectionRes.length > 0
              ? `${pendingCollectionRes.length} checked-out guest${pendingCollectionRes.length !== 1 ? "s" : ""} unpaid`
              : "All checked-out folios settled"}
          </div>
          <div className="stat-link-hint">Go to Billing →</div>
        </div>
      </div>

      {/* ARRIVALS DEPARTURES QUEUE */}
      {(() => {
        const arrivals   = reservations.filter(r => r.checkIn  === TODAY && r.status !== "Cancelled" && r.status !== "Checked Out").sort((a,b)=>a.room.localeCompare(b.room));
        const departures = reservations.filter(r => r.checkOut === TODAY && r.status !== "Cancelled").sort((a,b)=>a.room.localeCompare(b.room));
        const QCard = ({ r, type }) => {
          const isArrival = type === "arrival";
          const checked = isArrival ? r.status === "Checked In" : r.status === "Checked Out";
          const roomObj = rooms.find(rm => rm.number === r.room && rm.bhavan === r.bhavan);
          const roomAlert = roomObj?.status === "Dirty" ? "🧹 Dirty" : roomObj?.status === "Maintenance" ? "🔧 Maint." : null;
          const borderCol = isArrival
            ? (checked ? "rgba(34,197,94,0.3)" : "rgba(201,168,76,0.3)")
            : (checked ? "rgba(107,114,128,0.25)" : "rgba(168,85,247,0.3)");
          const tagCol = isArrival
            ? (checked ? "#16a34a" : "#a07830")
            : (checked ? "#6b7280" : "#a855f7");
          return (
            <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:10, background:"rgba(255,255,255,0.03)", border:`1px solid ${borderCol}`, marginBottom:6, cursor:"pointer" }}
              onClick={() => onNavigate("reservations", { resFilter:"all" })}>
              <div style={{ fontSize:20, flexShrink:0 }}>{isArrival ? "🛬" : "🛫"}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:700, fontSize:13, color:"#111827", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.guest}</div>
                <div style={{ fontSize:11, color:"#6b7280", marginTop:1 }}>Rm {r.room} · {r.type} · {(r.bhavan||"").split("–")[0].trim()}</div>
              </div>
              <div style={{ textAlign:"right", flexShrink:0 }}>
                <div style={{ fontSize:10, fontWeight:700, color:tagCol, padding:"2px 8px", borderRadius:10, background:`${tagCol}18`, marginBottom:2 }}>{r.status}</div>
                {roomAlert && <div style={{ fontSize:9, color:"#f59e0b" }}>{roomAlert}</div>}
              </div>
            </div>
          );
        };
        return (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:20 }}>
            <div className="card">
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:20 }}>🛬</span>
                  <div className="card-title" style={{ marginBottom:0 }}>Today Arrivals</div>
                </div>
                <span style={{ fontSize:13, fontWeight:800, color:"#a07830", background:"rgba(201,168,76,0.12)", padding:"3px 10px", borderRadius:12 }}>{arrivals.length}</span>
              </div>
              {arrivals.length === 0 ? <div style={{ color:"#9ca3af", fontSize:13, textAlign:"center", padding:"20px 0" }}>No arrivals today</div> : arrivals.map(r=><QCard key={r.id} r={r} type="arrival" />)}
              {arrivals.length > 0 && (
                <div style={{ marginTop:8, paddingTop:8, borderTop:"1px solid rgba(255,255,255,0.06)", display:"flex", fontSize:11, color:"#6b7280" }}>
                  <span>In {arrivals.filter(r=>r.status==="Checked In").length}</span>
                  <span style={{ marginLeft:"auto" }}>Pending {arrivals.filter(r=>r.status==="Confirmed").length}</span>
                </div>
              )}
            </div>
            <div className="card">
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:20 }}>🛫</span>
                  <div className="card-title" style={{ marginBottom:0 }}>Today Departures</div>
                </div>
                <span style={{ fontSize:13, fontWeight:800, color:"#a855f7", background:"rgba(168,85,247,0.12)", padding:"3px 10px", borderRadius:12 }}>{departures.length}</span>
              </div>
              {departures.length === 0 ? <div style={{ color:"#9ca3af", fontSize:13, textAlign:"center", padding:"20px 0" }}>No departures today</div> : departures.map(r=><QCard key={r.id} r={r} type="departure" />)}
              {departures.length > 0 && (
                <div style={{ marginTop:8, paddingTop:8, borderTop:"1px solid rgba(255,255,255,0.06)", display:"flex", fontSize:11, color:"#6b7280" }}>
                  <span>Out {departures.filter(r=>r.status==="Checked Out").length}</span>
                  <span style={{ marginLeft:"auto" }}>Pending {departures.filter(r=>r.status!=="Checked Out").length}</span>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      <div className="grid-2" style={{ marginBottom: 20 }}>
        <div className="card">
          <div className="card-title">7-Day Revenue Trend</div>
          <ResponsiveContainer width="100%" height={180}>
            <LineChart data={revenueData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#dde1e9" />
              <XAxis dataKey="day" tick={{ fill: "#6b7280", fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: "#6b7280", fontSize: 11 }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ background: "#f0f2f5", border: "1px solid #232838", borderRadius: 8, color: "#111827", fontSize: 12 }} />
              <Line type="monotone" dataKey="revenue" stroke="#a07830" strokeWidth={2} dot={{ fill: "#a07830", r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>
        <div className="card">
          <div className="card-title">Room Status Distribution</div>
          <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
            <ResponsiveContainer width={140} height={140}>
              <PieChart>
                <Pie data={pieData} cx="50%" cy="50%" innerRadius={40} outerRadius={65} dataKey="value" paddingAngle={3}>
                  {pieData.map((entry, i) => <Cell key={i} fill={entry.color} />)}
                </Pie>
              </PieChart>
            </ResponsiveContainer>
            <div style={{ flex: 1 }}>
              {pieData.map((d) => (
                <div key={d.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ width: 10, height: 10, borderRadius: "50%", background: d.color }} />
                    <span style={{ fontSize: 13, color: "#6b7280" }}>{d.name}</span>
                  </div>
                  <span style={{ fontWeight: 700, fontSize: 14, color: "#111827" }}>{d.value}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-title">Recent Reservations</div>
          <table>
            <thead><tr><th>Guest</th><th>Room</th><th>Check-Out</th><th>Status</th></tr></thead>
            <tbody>
              {reservations.slice(0, 4).map((r) => (
                <tr key={r.id}>
                  <td style={{ color: "#111827" }}>{r.guest}</td>
                  <td>{r.room}</td>
                  <td>{r.checkOut}</td>
                  <td><StatusPill status={r.status} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card">
          <div className="card-title">Recent Activity</div>
          <div>
            {auditLogs.length === 0 ? (
              <div style={{ color: "#6b7280", fontSize: 13, padding: "16px 0", textAlign: "center" }}>No activity yet</div>
            ) : auditLogs.slice(0, 6).map((log, i) => {
              const icons = { checkin: "✅", checkout: "🚪", booking: "📋", housekeeping: "🧹", pos: "🍽", edit: "✏️" };
              return (
                <div key={i} className="audit-item">
                  <div style={{ fontSize: 18, width: 28, textAlign: "center", flexShrink: 0 }}>{icons[log.type] || "📝"}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="audit-action">{log.action}</div>
                    <div className="audit-user">{log.user} · {log.time}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── RESERVATIONS ─────────────────────────────────────────────────────────────
function Reservations({ reservations, setReservations, rooms, setRooms, initFilter, onNavigate, addLog }) {
  const [tab, setTab] = useState("list");

  const [form, setForm] = useState({ guest: "", room: "", type: "", checkIn: "", checkOut: "", status: "Confirmed", dob: "", countryCode: "+91", mobile: "", address: "", idPhotos: [null, null], adults: "1", children: "0", bhavan: "", idType: "Aadhaar", idNumber: "", advancePayment: "",

    dueout:     reservations.filter(r => r.checkOut === TODAY && r.status === "Checked In").length,

  const filtered = (() => {
    let rows = reservations.filter((r) => {

      if (!matchesSearch) return false;
      if (bhawanFilter !== "All" && r.bhavan !== bhawanFilter) return false;
      if (typeFilter   !== "All" && r.type   !== typeFilter)   return false;
      if (dateFrom && r.checkIn < dateFrom) return false;
      if (dateTo   && r.checkIn > dateTo)   return false;
      // Fix 7: duein includes On Hold arrivals today
      if (activeFilter === "duein")      return r.checkIn === TODAY && (r.status === "Confirmed" || r.status === "On Hold");
      // Arrived Today = CI guests whose checkIn is today (distinct from Due In = pending arrivals)
      if (activeFilter === "checkins")   return r.checkIn === TODAY && r.status === "Checked In";
      if (activeFilter === "dueout")     return r.checkOut === TODAY && r.status === "Checked In";
      if (activeFilter === "checkouts")  return r.checkOut === TODAY && r.status === "Checked Out";
      // Fix 8: overstay filter
      if (activeFilter === "overstay")   return r.status === "Checked In" && r.checkOut < TODAY;
      if (activeFilter === "earlyci")    return (r.status === "Confirmed" || r.status === "On Hold") && (r.earlyCheckIn === true || (r.checkIn === TODAY && r.eta && r.eta < "14:00"));
      if (activeFilter === "checkedin")  return r.status === "Checked In";
      // Fix 11: pre-arrivals = all Confirmed (not just today)
      if (activeFilter === "confirmed")  return r.status === "Confirmed";
      // Fix 12: checked-out filter
      if (activeFilter === "checkedout") return r.status === "Checked Out";
      if (activeFilter === "noshow")     return r.status === "No Show";
      if (activeFilter === "onhold")     return r.status === "On Hold";
      if (activeFilter === "vip")        return r.isVIP === true;
      if (activeFilter === "cancelled")  return r.status === "Cancelled";
      return true;
    });
    // Fix 5+16: sort — added status, room, bhavan, type cases
    rows = [...rows].sort((a, b) => {
      let va, vb;
      if      (sortCol === "checkIn")   { va = a.checkIn;  vb = b.checkIn; }
      else if (sortCol === "checkOut")  { va = a.checkOut; vb = b.checkOut; }
      else if (sortCol === "guest")     { va = a.guest.toLowerCase(); vb = b.guest.toLowerCase(); }
      else if (sortCol === "nights")    { va = Math.round((new Date(a.checkOut)-new Date(a.checkIn))/86400000); vb = Math.round((new Date(b.checkOut)-new Date(b.checkIn))/86400000); }
      else if (sortCol === "total")     { va = a.total||0; vb = b.total||0; }
      else if (sortCol === "balance")   { va = Math.max(0,(a.total||0)-(a.paid||0)); vb = Math.max(0,(b.total||0)-(b.paid||0)); }
      else if (sortCol === "createdAt") { va = a.createdAt||""; vb = b.createdAt||""; }
      else if (sortCol === "status")    { va = a.status||""; vb = b.status||""; }
      else if (sortCol === "room")      { va = (a.room||"").replace(/\D/g,"").padStart(6,"0"); vb = (b.room||"").replace(/\D/g,"").padStart(6,"0"); }
      else if (sortCol === "bhavan")    { va = a.bhavan||""; vb = b.bhavan||""; }
      else if (sortCol === "type")      { va = a.type||""; vb = b.type||""; }
      else { va = ""; vb = ""; }
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return rows;
  })();

  // Sync a room's status whenever reservation state changes
  function syncRoomStatus(roomNumber, newStatus, guestName = null, checkInDate = null, checkOutDate = null) {
    // Fix 1+2: preserve meaningful checkIn/checkOut on the room object
    setRooms((prevRooms) => prevRooms.map((rm) => {
      if (rm.number !== roomNumber) return rm;
      const patch = { status: newStatus, guest: guestName };
      if (newStatus === "Occupied") {
        patch.checkIn  = checkInDate || TODAY;
        patch.checkOut = checkOutDate || rm.checkOut || null;
      } else if (newStatus === "Blocked") {
        patch.checkIn  = checkInDate || null;
        patch.checkOut = checkOutDate || null;
      } else {
        patch.checkIn  = null;
        patch.checkOut = null;
      }
      return { ...rm, ...patch };
    }));
  }

  const [formError, setFormError] = useState("");
  const [formSections, setFormSections] = useState({ operational: false, emergency: false, requests: false });
  const toggleSection = (key) => setFormSections(s => ({ ...s, [key]: !s[key] }));
  const [guestSuggestions, setGuestSuggestions] = useState([]);

  const suggestionRef = useRef(null);
  const mobileSuggestionRef = useRef(null);

  // Close suggestions on click-outside or Escape anywhere on the page
  useEffect(() => {
    function handleOutside(e) {
      const inName = suggestionRef.current && suggestionRef.current.contains(e.target);
      const inMobile = mobileSuggestionRef.current && mobileSuggestionRef.current.contains(e.target);
      if (!inName && !inMobile) {
        setShowSuggestions(false);
        setSuggestionSource(null);
      }
    }
    function handleEsc(e) {
      if (e.key === "Escape") {
        setShowSuggestions(false);
        setSuggestionSource(null);
      }
    }
    document.addEventListener("mousedown", handleOutside);
    document.addEventListener("keydown", handleEsc);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      document.removeEventListener("keydown", handleEsc);
    };
  }, []);

  // Build a deduplicated guest directory from all past reservations (keyed by mobile)
  function buildGuestDB() {
    const db = {};
    reservations.forEach((r) => {
      if (!r.mobile) return;
      const key = (r.countryCode || "+91") + r.mobile.replace(/\D/g, "");
      if (!db[key]) {
        db[key] = { guest: r.guest, countryCode: r.countryCode || "+91", mobile: r.mobile, dob: r.dob || "", address: r.address || "", idPhotos: r.idPhotos || [], idType: r.idType || "Aadhaar", idNumber: r.idNumber || "", visits: 0, lastStay: "" };
      }
      db[key].visits += 1;
      if (!db[key].lastStay || r.checkIn > db[key].lastStay) {
        db[key].lastStay = r.checkIn;
        // Always keep latest details
        if (r.idPhotos && r.idPhotos.length) db[key].idPhotos = r.idPhotos;
        if (r.address) db[key].address = r.address;
        if (r.idNumber) db[key].idNumber = r.idNumber;
      }
    });
    return Object.values(db);
  }

  function searchGuests(query, source) {
    if (!query || query.length < 2) { setGuestSuggestions([]); setShowSuggestions(false); setSuggestionSource(null); return; }
    const q = query.toLowerCase();
    const matches = buildGuestDB().filter((g) => {
      if (source === "name") {
        // Only match if guest name STARTS WITH the typed characters
        return g.guest.toLowerCase().startsWith(q);
      }
      // Mobile: match anywhere in digits
      return g.mobile.replace(/\D/g, "").includes(q.replace(/\D/g, ""));
    }).slice(0, 6);
    setGuestSuggestions(matches);
    setShowSuggestions(matches.length > 0);
    setSuggestionSource(matches.length > 0 ? source : null);
  }

  // Validates ID number format per type. Returns null if OK, error string if not.
  function validateIdNumber(idType, idNumber) {
    const v = (idNumber || "").trim().toUpperCase();
    if (!v) return `${idType} number is required.`;
    switch (idType) {
      case "Aadhaar":
        if (!/^\d{12}$/.test(v)) return "Aadhaar must be exactly 12 digits.";
        break;
      case "PAN Card":
        if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v)) return "PAN Card format must be ABCDE1234F (5 letters · 4 digits · 1 letter).";
        break;
      case "Passport":
        if (!/^[A-Z][0-9]{7}$/.test(v)) return "Passport format must be 1 letter followed by 7 digits (e.g. A1234567).";
        break;
      case "Voter ID":
        if (!/^[A-Z]{3}[0-9]{7}$/.test(v)) return "Voter ID format must be 3 letters followed by 7 digits (e.g. ABC1234567).";
        break;
      case "Driving Licence":
        if (v.replace(/[-\s]/g, "").length < 10) return "Driving Licence must be at least 10 characters.";
        break;
      case "OCI Card":
        if (v.length < 7) return "OCI Card number must be at least 7 characters.";
        break;
      default:
        break;
    }
    return null; // valid
  }

  const EMPTY_FORM = { guest: "", room: "", type: "", checkIn: "", checkOut: "", status: "Confirmed", dob: "", _dobRaw: "", countryCode: "+91", mobile: "", address: "", idPhotos: [null, null], adults: "1", children: "0", bhavan: "", idType: "Aadhaar", idNumber: "", advancePayment: "", nationality: "Indian", bookingSource: "Walk-in", eta: "14:00", etd: "11:00", isVIP: false, groupId: "", groupName: "", specialRequests: "", internalNotes: "", companions: [], confirmationNo: "", reference: "",
    // Early check-in / late check-out
    earlyCheckIn: false, earlyCheckInTime: "",
    lateCheckOut: false, lateCheckOutTime: "",
    // NEW: Guest identity
    gender: "", email: "",
    // NEW: Operational

    // NEW: Hold until (for On Hold status)

  function openNew() { setForm({ ...EMPTY_FORM }); setFormError(""); setFormSections({ operational: false, emergency: false, requests: false }); setIsReturningGuest(false); setShowSuggestions(false); setModal("new"); }

  // Click-to-Book from Gantt — pre-fills room, type, bhavan, checkIn, checkOut
  function openNewFromGantt(room, checkInDate) {

  function openEdit(r) {
    if (r.status === "Cancelled" || r.status === "Checked Out" || r.status === "No Show") return;
    setViewGuest(null); setFormError(""); setIsReturningGuest(false); setShowSuggestions(false);
    const opFilled = !!(r.bookingSource && r.bookingSource !== "Walk-in") || !!(r.nationality && r.nationality !== "Indian") || !!r.earlyCheckIn || !!r.lateCheckOut || !!r.purposeOfVisit || !!r.isVIP || !!r.groupId;
    const emFilled = !!(r.emergencyName || r.emergencyPhone);
    const notesFilled = !!(r.specialRequests || r.internalNotes || (r.companions||[]).length > 0);
    setFormSections({ operational: opFilled, emergency: emFilled, requests: notesFilled });
    const _dob2 = r.dob ? (() => { const [ry,rm,rd]=r.dob.split("-"); return `${rd}/${rm}/${ry}`; })() : ""; setForm({ ...EMPTY_FORM, ...r, idType: r.idType || "Aadhaar", idNumber: r.idNumber || "", companions: r.companions || [], _dobRaw: _dob2 }); setModal("edit-" + r.id);
  }

  function hasDateOverlap(existingCheckIn, existingCheckOut, newCheckIn, newCheckOut) {
    const eIn  = new Date(existingCheckIn);
    const eOut = new Date(existingCheckOut);
    const nIn  = new Date(newCheckIn);
    const nOut = new Date(newCheckOut);
    return nIn < eOut && nOut > eIn;
  }

  function saveReservation() {
    setFormError("");

    // ── 1. Required fields ────────────────────────────────────────────────────
    const missing = [];
    if (!form.guest.trim())                              missing.push("Guest Full Name");
    if (!form.mobile || !form.mobile.replace(/\D/g,"")) missing.push("Mobile Number");
    if (!form.idNumber || !form.idNumber.trim())         missing.push("ID Number");
    if (!form.checkIn)                                   missing.push("Check-In Date");
    if (!form.checkOut)                                  missing.push("Check-Out Date");
    if (!form.bhavan)                                    missing.push("Bhawan / Property");
    if (form.bhavan && form.bhavan !== "DSB" && form.bhavan !== "Guest House" && !form.type)
                                                         missing.push("Room Type");
    if (form.status === "Checked In" && !form.room)      missing.push("Room Number (required for immediate check-in)");
    if (form.status === "On Hold" && !form.holdUntilDate) missing.push("Hold Until Date (required for On Hold bookings)");
    if (missing.length > 0) {
      setFormError(`The following required field${missing.length > 1 ? "s are" : " is"} missing:\n• ${missing.join("\n• ")}`);
      return;
    }

    // ── 2. Date logic ─────────────────────────────────────────────────────────
    if (new Date(form.checkOut) <= new Date(form.checkIn)) {
      setFormError("Check-Out date must be after Check-In date.");
      return;
    }
    const todayMidnight = new Date(); todayMidnight.setHours(0, 0, 0, 0);
    if (new Date(form.checkIn) < todayMidnight) {
      setFormError("⛔ Check-In date cannot be in the past.");
      return;
    }
    if (new Date(form.checkOut) < todayMidnight) {
      setFormError("⛔ Check-Out date cannot be in the past.");
      return;
    }
    if (form.status === "On Hold" && form.holdUntilDate && form.checkIn &&
        new Date(form.holdUntilDate) > new Date(form.checkIn)) {
      setFormError("⛔ Hold Until date must be on or before the Check-In date.");
      return;
    }
    if (form.status === "Checked In" && form.checkIn > new Date().toISOString().split("T")[0]) {
      setFormError("⛔ \"Checked In\" status cannot be used for a future check-in date. Use \"Confirmed\" for advance bookings.");
      return;
    }

    // ── 3. Mobile format ──────────────────────────────────────────────────────
    if (form.mobile) {
      const rule = COUNTRY_CODES.find(c => c.code === form.countryCode);
      const digits = form.mobile.replace(/\D/g, "");
      if (rule && digits.length !== rule.digits) {
        setFormError(`⚠ Mobile for ${rule.country.split(" ")[0]} must be exactly ${rule.digits} digits. You entered ${digits.length}.`);
        return;
      }
    }

    // ── 3b. ID number format ──────────────────────────────────────────────────
    {
      const idErr = validateIdNumber(form.idType, form.idNumber);
      if (idErr) { setFormError("⚠ " + idErr); return; }
    }

    // ── 3c. Email format (optional but validate if present) ──────────────────
    if (form.email && form.email.trim()) {
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim());
      if (!emailOk) {
        setFormError("⚠ Email address looks invalid — please check and correct it (e.g. guest@example.com).");
        return;
      }
    }

    // ── 3d. DOB sanity ────────────────────────────────────────────────────────
    if (form.dob) {
      const dobDate = new Date(form.dob);
      const todayForDob = new Date(); todayForDob.setHours(0, 0, 0, 0);
      if (dobDate >= todayForDob) {
        setFormError("⛔ Date of Birth cannot be today or in the future.");
        return;
      }
      const age = Math.floor((todayForDob - dobDate) / (365.25 * 24 * 3600 * 1000));
      if (age > 120) {
        setFormError(`⛔ Date of Birth gives an age of ${age} years — please verify it is correct.`);
        return;
      }
    }
    // ── 3e. ETA / ETD sanity ──────────────────────────────────────────────────
    if (form.eta && form.etd) {
      // Same-day multi-night stays: ETA after ETD is perfectly fine (arrive evening, leave morning).
      // The only nonsensical case is a 1-night stay where ETD < ETA (check out before arriving).
      const nights = Math.max(1, Math.round((new Date(form.checkOut) - new Date(form.checkIn)) / 86400000));
      if (nights === 1 && form.etd <= form.eta) {
        setFormError("⚠ For a 1-night stay, Expected Departure (ETD) must be after Expected Arrival (ETA).");
        return;
      }
      // Warn if ETD is before 06:00 — almost certainly a data-entry error
      const etdHour = parseInt(form.etd.split(":")[0], 10);
      if (etdHour < 6) {
        setFormError("⚠ ETD is set before 06:00 — please verify the departure time (standard check-out is 11:00).");
        return;
      }
    }
    // ── 4. Same-room date-overlap conflict ────────────────────────────────────
    if (form.room) {
      const conflict = reservations.find(r =>
        r.room === form.room &&
        r.bhavan === form.bhavan &&
        r.status !== "Checked Out" &&
        r.status !== "Cancelled" &&
        r.status !== "No Show" &&
        hasDateOverlap(r.checkIn, r.checkOut, form.checkIn, form.checkOut)
      );
      if (conflict) {
        const fmt = d => new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
        setFormError(`⚠ Room ${form.room} is already booked for ${conflict.guest} (${fmt(conflict.checkIn)} → ${fmt(conflict.checkOut)}). Choose a different room or dates.`);
        return;
      }
      if (form.status === "Checked In") {
        const rm = rooms.find(r => r.number === form.room);
        if (rm && rm.status === "Occupied") {
          setFormError(`⚠ Room ${form.room} is currently Occupied by ${rm.guest}. Cannot check in until they check out.`);
          return;
        }
      }
    }

    // ── 5. Cross-room same-guest duplicate (Fix #7) ───────────────────────────
    if (form.mobile) {
      const mDigits = form.mobile.replace(/\D/g, "");
      const dup = reservations.find(r =>
        r.mobile &&
        r.mobile.replace(/\D/g, "") === mDigits &&
        (r.countryCode || "+91") === (form.countryCode || "+91") &&
        r.status !== "Checked Out" &&
        r.status !== "Cancelled" &&
        r.status !== "No Show" &&
        hasDateOverlap(r.checkIn, r.checkOut, form.checkIn, form.checkOut)
      );
      if (dup) {
        const fmt = d => new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
        setFormError(
          `⚠ Duplicate booking detected — this guest (${form.mobile}) already has an active reservation ` +
          `(${dup.id}${dup.room ? " · Room " + dup.room : ""}) for overlapping dates ` +
          `(${fmt(dup.checkIn)} → ${fmt(dup.checkOut)}). Verify before saving.`
        );
        return;
      }
    }

    // ── 6. Rate calculation ──────────────────────────────────────────────────
    const nights = Math.max(1, Math.round((new Date(form.checkOut) - new Date(form.checkIn)) / 86400000));
    const effectiveRate = form.room
      ? getRoomRate(form.bhavan, form.type, form.room)
      : (ROOM_RATES[form.type] || ROOM_RATES.Standard);
    const total = Math.round(nights * effectiveRate * 100) / 100;

    // ── 7. Advance payment — hard block if exceeds total (Fix #5) ────────────
    const rawAdv = Math.round(Math.max(0, parseFloat(form.advancePayment) || 0)); // integer rupees
    if (rawAdv > total) {
      setFormError(
        `⚠ Advance payment ₹${rupees(rawAdv)} cannot exceed the booking total ₹${rupees(total)}. ` +
        `Please correct the advance amount.`
      );
      return;
    }
    const advPaid = rawAdv;

    // ── 8. Build folio ────────────────────────────────────────────────────────
    const roomChargeDesc = form.room
      ? `Room charge (${nights} night${nights !== 1 ? "s" : ""} @ ₹${rupees(effectiveRate)}/night)`
      : `Room charge — room TBA (${nights} night${nights !== 1 ? "s" : ""} @ ₹${rupees(effectiveRate)}/night)`;
    const folio = [{ desc: roomChargeDesc, amount: total }];
    if (advPaid > 0) {
      const method = form.advancePaymentMethod || "Cash";
      const refPart = (form.advancePayRef || "").trim();
      folio.push({
        desc: `Advance payment — ${method}${refPart ? " · Ref: " + refPart : ""}`,
        amount: -advPaid,
        date: new Date().toISOString(),
        collectedBy: currentUser ? currentUser.name : "Front Office",
      });
    }

    // ── 9. Collision-safe ID (Fix #3): timestamp base-36 + random suffix ─────
    const tsId = Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
    const confDate = form.checkIn.replace(/-/g, "");
    const confSeq  = String(Math.floor(1000 + Math.random() * 9000));
    const confirmationNo = `DJJS-${confDate}-${confSeq}`;

    const newR = {
      ...form,
      id: `RES-${tsId}`,
      total,
      paid: advPaid,
      folio,
      createdAt: new Date().toISOString(),
      confirmationNo,
      companions: (form.companions || []).filter(cp => cp.name && cp.name.trim()),
    };
    setReservations(prev => [...prev, newR]);
    const roomNote = form.room ? `Room ${form.room}` : `${form.type || ""} room TBA`;
    addLog(
      `New reservation ${newR.id} created for ${form.guest} — ${roomNote} · ${form.bhavan}` +
      ` (${form.checkIn} → ${form.checkOut})` +
      (advPaid > 0 ? ` · Advance ₹${rupees(advPaid)} via ${form.advancePaymentMethod || "Cash"}` : "") +
      (form.groupId ? ` · Group: ${form.groupId}` : "") +
      (form.isVIP ? " · ⭐ VIP" : "") +
      (form.reference ? ` · Ref: ${form.reference}` : ""),
      "booking"
    );
    if (form.room) {
      if (form.status === "Checked In") {
        syncRoomStatus(form.room, "Occupied", form.guest, form.checkIn, form.checkOut);
      } else if (form.status === "Confirmed" || form.status === "On Hold") {
        syncRoomStatus(form.room, "Blocked", form.guest, form.checkIn, form.checkOut);
      }
    }
    setModal(null);
  }

  function saveEdit(id) {
    setFormError("");
    const original = reservations.find(r => r.id === id);
    if (!original) return;

    // ── 1. Required fields ────────────────────────────────────────────────────
    const missing = [];
    if (!form.guest.trim())                              missing.push("Guest Full Name");
    if (!form.mobile || !form.mobile.replace(/\D/g,"")) missing.push("Mobile Number");
    if (!form.idNumber || !form.idNumber.trim())         missing.push("ID Number");
    if (!form.checkIn)                                   missing.push("Check-In Date");
    if (!form.checkOut)                                  missing.push("Check-Out Date");
    if (!form.bhavan)                                    missing.push("Bhawan / Property");
    if (form.bhavan && form.bhavan !== "DSB" && form.bhavan !== "Guest House" && !form.type)
                                                         missing.push("Room Type");
    if (form.status === "Checked In" && !form.room)       missing.push("Room Number (required for Checked In)");
    if (form.status === "On Hold" && !form.holdUntilDate)  missing.push("Hold Until Date (required for On Hold)");
    if (missing.length > 0) {
      setFormError(`Missing required field${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}`);
      return;
    }

    // ── 2. Date logic ─────────────────────────────────────────────────────────
    if (new Date(form.checkOut) <= new Date(form.checkIn)) {
      setFormError("Check-Out must be after Check-In.");
      return;
    }
    const todayMid = new Date(); todayMid.setHours(0, 0, 0, 0);
    if (new Date(form.checkIn) < todayMid && original.checkIn !== form.checkIn) {
      setFormError("⛔ Check-In date cannot be moved to the past.");
      return;
    }
    if (new Date(form.checkOut) < todayMid) {
      setFormError("⛔ Check-Out date cannot be in the past.");
      return;
    }
    if (form.status === "On Hold" && form.holdUntilDate && form.checkIn &&
        new Date(form.holdUntilDate) > new Date(form.checkIn)) {
      setFormError("⛔ Hold Until date must be on or before the Check-In date.");
      return;
    }
    if (form.status === "Checked In" && form.checkIn > new Date().toISOString().split("T")[0]
        && original.status !== "Checked In") {
      setFormError("⛔ \"Checked In\" status cannot be used for a future check-in date. Use \"Confirmed\" for advance bookings.");
      return;
    }

    // ── 3. Mobile format ──────────────────────────────────────────────────────
    if (form.mobile) {
      const rule = COUNTRY_CODES.find(c => c.code === form.countryCode);
      const digits = form.mobile.replace(/\D/g, "");
      if (rule && digits.length !== rule.digits) {
        setFormError(`⚠ Mobile for ${rule.country.split(" ")[0]} must be ${rule.digits} digits.`);
        return;
      }
    }

    // ── 3b. ID number format ──────────────────────────────────────────────────
    {
      const idErr = validateIdNumber(form.idType, form.idNumber);
      if (idErr) { setFormError("⚠ " + idErr); return; }
    }

    // ── 3c. Email format (optional but validate if present) ──────────────────
    if (form.email && form.email.trim()) {
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim());
      if (!emailOk) {
        setFormError("⚠ Email address looks invalid — please check and correct it (e.g. guest@example.com).");
        return;
      }
    }

    // ── 3d. DOB sanity ────────────────────────────────────────────────────────
    if (form.dob) {
      const dobDate = new Date(form.dob);
      const todayForDob = new Date(); todayForDob.setHours(0, 0, 0, 0);
      if (dobDate >= todayForDob) {
        setFormError("⛔ Date of Birth cannot be today or in the future.");
        return;
      }
      const age = Math.floor((todayForDob - dobDate) / (365.25 * 24 * 3600 * 1000));
      if (age > 120) {
        setFormError(`⛔ Date of Birth gives an age of ${age} years — please verify it is correct.`);
        return;
      }
    }
    // ── 3e. ETA / ETD sanity ──────────────────────────────────────────────────
    if (form.eta && form.etd) {
      // ETD before 06:00 is almost certainly a data-entry error regardless of status.
      const etdHour = parseInt(form.etd.split(":")[0], 10);
      if (etdHour < 6) {
        setFormError("⚠ ETD is set before 06:00 — please verify the departure time (standard check-out is 11:00).");
        return;
      }
      // ETA vs ETD logical clash: only meaningful for pre-arrival reservations.
      // Once Checked In, ETA records the actual arrival time — comparing it to ETD
      // would incorrectly block normal evening-arrival / morning-departure patterns.
      if (original.status !== "Checked In") {
        const nights = Math.max(1, Math.round((new Date(form.checkOut) - new Date(form.checkIn)) / 86400000));
        if (nights === 1 && form.etd <= form.eta) {
          setFormError("⚠ For a 1-night stay, Expected Departure (ETD) must be after Expected Arrival (ETA).");
          return;
        }
      }
    }
    // ── 4. Same-room conflict (excluding self) ────────────────────────────────
    if (form.room) {
      const conflict = reservations.find(r =>
        r.id !== id &&
        r.room === form.room &&
        r.bhavan === form.bhavan &&
        r.status !== "Checked Out" &&
        r.status !== "Cancelled" &&
        r.status !== "No Show" &&
        hasDateOverlap(r.checkIn, r.checkOut, form.checkIn, form.checkOut)
      );
      if (conflict) {
        const fmt = d => new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
        setFormError(`⚠ Room ${form.room} is booked for ${conflict.guest} (${fmt(conflict.checkIn)} → ${fmt(conflict.checkOut)}).`);
        return;
      }
    }

    // ── 5. Cross-room same-guest duplicate (Fix #7) ───────────────────────────
    if (form.mobile) {
      const mDigits = form.mobile.replace(/\D/g, "");
      const dup = reservations.find(r =>
        r.id !== id &&
        r.mobile &&
        r.mobile.replace(/\D/g, "") === mDigits &&
        (r.countryCode || "+91") === (form.countryCode || "+91") &&
        r.status !== "Checked Out" &&
        r.status !== "Cancelled" &&
        r.status !== "No Show" &&
        hasDateOverlap(r.checkIn, r.checkOut, form.checkIn, form.checkOut)
      );
      if (dup) {
        const fmt = d => new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
        setFormError(
          `⚠ Duplicate booking — this guest already has an active reservation ` +
          `(${dup.id}${dup.room ? " · Room " + dup.room : ""}) overlapping these dates ` +
          `(${fmt(dup.checkIn)} → ${fmt(dup.checkOut)}).`
        );
        return;
      }
    }

    // ── 6. Rate calculation ──────────────────────────────────────────────────
    const nights = Math.max(1, Math.round((new Date(form.checkOut) - new Date(form.checkIn)) / 86400000));
    const effectiveRate = form.room
      ? getRoomRate(form.bhavan, form.type, form.room)
      : (ROOM_RATES[form.type] || ROOM_RATES.Standard);
    const newTotal = Math.round(nights * effectiveRate * 100) / 100;

    // ── 7. Folio room-charge line (match ALL desc patterns) ───────────────────
    const newRoomChargeDesc = form.room
      ? `Room charge (${nights} night${nights !== 1 ? "s" : ""} @ ₹${rupees(effectiveRate)}/night)`
      : `Room charge — room TBA (${nights} night${nights !== 1 ? "s" : ""} @ ₹${rupees(effectiveRate)}/night)`;

    // Match any variant of the room charge description (Fix #4)
    const isRoomChargeLine = f =>
      f.desc === "Room charge" ||
      f.desc.startsWith("Room charge (") ||
      f.desc.startsWith("Room charge —");

    let newFolio = original.folio ? [...original.folio] : [];
    const rcIdx = newFolio.findIndex(isRoomChargeLine);
    if (rcIdx >= 0) {
      // Update in-place — preserve position in folio
      newFolio[rcIdx] = { ...newFolio[rcIdx], desc: newRoomChargeDesc, amount: newTotal };
    } else {
      // No room charge line yet — prepend it
      newFolio.unshift({ desc: newRoomChargeDesc, amount: newTotal });
    }

    const totalChanged = newTotal !== original.total;
    const updatedRes = {
      ...original,
      ...form,
      total: newTotal,
      folio: newFolio,
      companions: (form.companions || []).filter(cp => cp.name && cp.name.trim()),
    };
    setReservations(prev => prev.map(r => r.id === id ? updatedRes : r));
    addLog(
      `Reservation ${id} edited — ${form.guest}, Room ${form.room || "TBA"}, ` +
      `${form.checkIn} → ${form.checkOut}` +
      (totalChanged ? ` · Total revised ₹${rupees(newTotal)}` : "") +
      (form.isVIP ? " · ⭐ VIP" : ""),
      "edit"
    );

    // ── 8. Room status sync — covers status change, room change, room clearing, and name correction ──
    const statusChanged   = form.status !== original.status;
    const roomChanged     = form.room !== original.room;
    const guestNameChanged = form.guest.trim() !== original.guest?.trim();
    const hadRoom         = !!original.room;
    const hasRoom         = !!form.room;

    // If only the guest name changed while the room and status are unchanged (e.g. typo correction
    // on a CI guest), patch room.guest directly so floor plan / grid stay in sync.
    if (guestNameChanged && !roomChanged && !statusChanged && hasRoom && form.status === "Checked In") {
      setRooms(prev => prev.map(rm =>
        rm.number === form.room ? { ...rm, guest: form.guest.trim() } : rm
      ));
    }

    // Release the OLD room whenever it is no longer the active room for this booking
    if (hadRoom && (roomChanged || statusChanged)) {
      const oldWasActive = original.status === "Checked In" || original.status === "Confirmed" || original.status === "On Hold";
      if (oldWasActive) {
        const releaseAs = original.status === "Checked In" ? "Dirty" : "Available";
        syncRoomStatus(original.room, releaseAs, null);
      }
    }

    // Claim the NEW room based on the new status
    if (hasRoom && (roomChanged || statusChanged)) {
      if (form.status === "Checked In")                                   syncRoomStatus(form.room, "Occupied", form.guest, form.checkIn, form.checkOut);
      else if (form.status === "Confirmed" || form.status === "On Hold") syncRoomStatus(form.room, "Blocked",  form.guest, form.checkIn, form.checkOut);
      else if (form.status === "Checked Out")                             syncRoomStatus(form.room, "Dirty",    null);
    }

    // Room was explicitly cleared (set to "") — release old room if still active
    if (hadRoom && !hasRoom && !roomChanged) { /* already handled above via roomChanged */ }

    // Final edge: new status = Cancelled/No Show — always free the room
    if ((form.status === "Cancelled" || form.status === "No Show") && hadRoom) {
      syncRoomStatus(original.room, "Available", null);
    }

    setModal(null);
    setFormError("");
  }

  function checkIn(id) {
    const res = reservations.find((r) => r.id === id);
    if (!res) return;
    // Step 0 — early arrival date shift gate (guest arrives before booking date)
    const TODAY_STR = new Date().toISOString().split("T")[0];
    if (res.checkIn > TODAY_STR) {
      const origCheckIn = res.checkIn;
      const extraNights = Math.round((new Date(origCheckIn) - new Date(TODAY_STR)) / 86400000);
      setEarlyDateShiftModal({ id, origCheckIn, today: TODAY_STR, extraNights, chargeExtra: true });
      return;
    }
    // Step 1 — room assignment gate
    if (!res.room) {
      setAssignRoomModal({ id, room: "", bhavan: res.bhavan || "" });
      return;
    }
    // Step 2 — early arrival gate
    const now        = new Date();
    const nowHHMM    = now.getHours() * 60 + now.getMinutes();           // minutes since midnight
    const etaHHMM    = res.eta ? parseInt(res.eta.split(":")[0]) * 60 + parseInt(res.eta.split(":")[1]) : 14 * 60;
    const stdHHMM    = 14 * 60; // 14:00
    const gateTime   = Math.min(etaHHMM, stdHHMM);                      // earlier of ETA or standard
    const isEarly    = nowHHMM < gateTime;
    const roomObj    = rooms.find(rm => rm.number === res.room);
    const roomStatus = roomObj?.status || "Unknown";

    if (isEarly || roomStatus === "Dirty" || roomStatus === "Maintenance") {
      const fmt = (mins) => `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;
      setEarlyArrivalModal({
        id,
        roomNumber: res.room,
        currentTime: `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`,
        etaTime: res.eta || "14:00",
        stdTime: "14:00",
        gateTime: fmt(gateTime),
        isEarly,
        roomStatus,
        guestName: res.guest,
        earlyRequestedTime: res.earlyCheckIn ? res.earlyCheckInTime : null,
      });
      return;
    }
    confirmCheckIn(id, res.room);
  }

  function confirmDateShiftCheckIn(chargeExtra) {
    if (!earlyDateShiftModal) return;
    const { id, origCheckIn, today, extraNights } = earlyDateShiftModal;
    const res = reservations.find(r => r.id === id);
    if (!res) return;

    const rate = getRoomRate(res.bhavan, res.type, res.room || "");
    const origNights = Math.max(1, Math.round((new Date(res.checkOut) - new Date(origCheckIn)) / 86400000));
    const newNights  = origNights + extraNights;
    const extraCharge = extraNights * rate;
    const newTotal = chargeExtra ? (res.total || 0) + extraCharge : (res.total || 0);

    // Build folio entry for extra nights
    const newFolio = [...(res.folio || [])];
    if (chargeExtra && extraNights > 0) {
      newFolio.push({
        desc: `Early arrival — ${extraNights} extra night${extraNights > 1 ? "s" : ""} (${today} → ${origCheckIn})`,
        amount: extraCharge,
        date: new Date().toISOString(),
        postedBy: "Front Desk",
      });
    }

    // Shift checkIn date + update reservation
    setReservations(prev => prev.map(r =>
      r.id === id
        ? { ...r, checkIn: today, total: newTotal, folio: newFolio }
        : r
    ));

    addLog(
      `Early arrival date shift: ${res.guest} — check-in moved from ${origCheckIn} to ${today} (+${extraNights}N)${chargeExtra ? ` — ₹${rupees(extraCharge)} added to folio` : " — complimentary"}`,
      "checkin"
    );

    setEarlyDateShiftModal(null);
    // Now proceed with normal checkIn flow
    setTimeout(() => checkIn(id), 50);
  }

  function confirmCheckIn(id, roomNumber) {
    const res = reservations.find((r) => r.id === id);
    if (!res) return;
    const room = roomNumber || res.room;

    const rate   = getRoomRate(res.bhavan || assignRoomModal?.bhavan, res.type, room);
    const nights = Math.max(1, Math.round((new Date(res.checkOut) - new Date(res.checkIn)) / 86400000));
    const newTotal = nights * rate;

    let newFolio = res.folio ? [...res.folio] : [];
    if (!res.room) {
      // Replace the TBA placeholder with the real room-charge line,
      // preserving ALL other folio entries (advances, extras, add-ons).
      const isTbaRoomCharge = f =>
        f.desc === "Room charge — type reserved, room TBA" ||
        f.desc.startsWith("Room charge — room TBA");
      const realRoomCharge = {
        desc: `Room charge (${nights} night${nights !== 1 ? "s" : ""} @ ₹${rupees(rate)}/night)`,
        amount: newTotal,
      };
      if (newFolio.some(isTbaRoomCharge)) {
        // Swap placeholder in-place so folio order is preserved
        newFolio = newFolio.map(f => isTbaRoomCharge(f) ? realRoomCharge : f);
      } else {
        newFolio = [realRoomCharge, ...newFolio];
      }
    }

    // Record actual check-in datetime
    const checkInAt = new Date().toISOString();
    const now       = new Date();
    const etaHHMM   = res.eta ? parseInt(res.eta.split(":")[0]) * 60 + parseInt(res.eta.split(":")[1]) : 14 * 60;
    const stdHHMM   = 14 * 60;
    const gateTime  = Math.min(etaHHMM, stdHHMM);
    const nowHHMM   = now.getHours() * 60 + now.getMinutes();
    const isEarlyArrival = nowHHMM < gateTime;

    setReservations(reservations.map((r) =>
      r.id === id
        ? { ...r, status: "Checked In", room, total: res.room ? r.total : newTotal, folio: res.room ? r.folio : newFolio, checkInAt, isEarlyArrival }
        : r
    ));
    syncRoomStatus(room, "Occupied", res.guest, res.checkIn, res.checkOut);
    const timeStr = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    addLog(`Checked in ${res.guest} to Room ${room} at ${timeStr}${isEarlyArrival ? " ⚡ Early arrival" : ""}${!res.room ? " (room assigned at check-in)" : ""}`, "checkin");
    setAssignRoomModal(null);
    setEarlyArrivalModal(null);
    setViewGuest(null);
  }

  function checkOut(id, isEarly) {
    const res = reservations.find((r) => r.id === id);
    const actualCheckOut = new Date().toISOString().split("T")[0];
    setReservations(reservations.map((r) =>
      r.id === id
        ? { ...r, status: "Checked Out", checkOut: actualCheckOut }
        : r
    ));
    if (res) {
      // Append to room stay history
      const nights = res.checkIn ? Math.max(1, Math.round((new Date(actualCheckOut) - new Date(res.checkIn)) / 86400000)) : 1;
      const stayEntry = {
        id: res.id, guest: res.guest, mobile: res.mobile || "", checkIn: res.checkIn,
        checkOut: actualCheckOut, nights, total: res.total || 0, paid: res.paid || 0,
        adults: res.adults || 1, children: res.children || 0,
        bookingSource: res.bookingSource || "", incidents: [], notes: "",
        checkedOutAt: new Date().toISOString(),
        earlyDeparture: isEarly ? res.checkOut : null,
      };
      setRooms(prev => prev.map(rm =>
        rm.number === res.room
          ? { ...rm, stayHistory: [stayEntry, ...(rm.stayHistory || [])].slice(0, 20) }
          : rm
      ));
      syncRoomStatus(res.room, "Dirty", null);
      const earlyNote = isEarly ? ` (early departure — original checkout: ${res.checkOut})` : "";
      addLog(`Checked out ${res.guest} from Room ${res.room}${earlyNote}`, "checkout");
    }
  }

  function extendBooking() {
    if (!extendModal) return;
    const { id, newCheckOut, reason, addChargeFlag } = extendModal;
    const res = reservations.find((r) => r.id === id);
    if (!res) return;

    const oldCheckOut = res.checkOut;
    const oldNights   = Math.max(1, Math.round((new Date(oldCheckOut) - new Date(res.checkIn)) / 86400000));
    const newNights   = Math.max(1, Math.round((new Date(newCheckOut)  - new Date(res.checkIn)) / 86400000));
    const extraNights = newNights - oldNights;
    const rate        = getRoomRate(res.bhavan, res.type, res.room);
    const extraAmount = extraNights * rate;

    const newFolio = [...(res.folio || [])];
    const newTotal = res.total + (addChargeFlag ? extraAmount : 0);

    if (addChargeFlag && extraNights > 0) {
      newFolio.push({
        desc: `Extension charge — ${extraNights} extra night${extraNights !== 1 ? "s" : ""} (${oldCheckOut} → ${newCheckOut})${reason ? ` · ${reason}` : ""}`,
        amount: extraAmount,
        date: new Date().toISOString(),
      });
    }

    setReservations(reservations.map((r) =>
      r.id === id
        ? { ...r, checkOut: newCheckOut, total: newTotal, folio: newFolio, _extendedFrom: oldCheckOut }
        : r
    ));

    addLog(
      `Booking ${id} extended for ${res.guest} — Room ${res.room}: ${oldCheckOut} → ${newCheckOut} (+${extraNights} night${extraNights !== 1 ? "s" : ""})${addChargeFlag ? ` · Extension charge ₹${rupees(extraAmount)} added to folio` : " · No extra charge"}${reason ? ` · Reason: ${reason}` : ""}`,
      "booking"
    );
    setExtendModal(null);
  }

  const [confirmCancelId, setConfirmCancelId] = useState(null);

  const [confirmCheckoutId, setConfirmCheckoutId] = useState(null);
  const [earlyBillingPolicy, setEarlyBillingPolicy] = useState("full"); // "full" | "actual" | "waive"
  const [balanceOverrideAck, setBalanceOverrideAck] = useState(false); // override ack for partial balance
  const [balanceOverrideReason, setBalanceOverrideReason] = useState(""); // reason for override
  const [balanceOverrideNote, setBalanceOverrideNote] = useState(""); // free-text manager note
  const [inlineCheckoutConfirm, setInlineCheckoutConfirm] = useState(false);
  const [inlineExtendOpen, setInlineExtendOpen] = useState(false);
  const [inlineRoomMoveOpen, setInlineRoomMoveOpen] = useState(false);
  const inlineExtendRef = useRef(null);
  const inlineRoomMoveRef = useRef(null);
  const inlineCheckoutRef = useRef(null);
  const viewGuestModalRef = useRef(null);

  const scrollModalBottom = () => {
    setTimeout(() => {
      if (viewGuestModalRef.current) {
        viewGuestModalRef.current.scrollTop = viewGuestModalRef.current.scrollHeight;
      }
    }, 80);
  };

  useEffect(() => { if (inlineExtendOpen) scrollModalBottom(); }, [inlineExtendOpen]);
  useEffect(() => { if (inlineRoomMoveOpen) scrollModalBottom(); }, [inlineRoomMoveOpen]);
  useEffect(() => { if (inlineCheckoutConfirm) scrollModalBottom(); }, [inlineCheckoutConfirm]);
  const [assignRoomModal, setAssignRoomModal] = useState(null);
  const [confirmNoShowId, setConfirmNoShowId] = useState(null);
  const [roomMoveModal, setRoomMoveModal] = useState(null);
  useEffect(() => { if (extendModal?.newCheckOut) scrollModalBottom(); }, [extendModal?.newCheckOut]);
  useEffect(() => { if (roomMoveModal?.newRoom) scrollModalBottom(); }, [roomMoveModal?.newRoom]);
  const [cancelPolicyModal, setCancelPolicyModal] = useState(null);
  const [earlyArrivalModal, setEarlyArrivalModal] = useState(null); // { id, roomNumber, currentTime, etaTime, isEarly, roomStatus }
  const [earlyDateShiftModal, setEarlyDateShiftModal] = useState(null); // { id, origCheckIn, today, extraNights, chargeExtra }

  function cancelReservation(id) {
    const res = reservations.find((r) => r.id === id);
    if (!res) return;
    // Hard guard — Checked In bookings cannot be cancelled; use Early Check Out instead
    if (res.status === "Checked In") {
      alert("Cannot cancel an in-house booking.\nUse Early Check Out to end the stay.");
      setConfirmCancelId(null);
      return;
    }
    // Only Confirmed and On Hold are cancellable
    if (!["Confirmed", "On Hold"].includes(res.status)) {
      setConfirmCancelId(null);
      return;
    }
    const newFolio = [...(res.folio || [])];
    setReservations(reservations.map((r) => r.id === id ? { ...r, status: "Cancelled", folio: newFolio } : r));
    if (res.room) syncRoomStatus(res.room, "Available", null);
    addLog(`Reservation ${id} cancelled for ${res.guest}`, "edit");
    setConfirmCancelId(null);
    setViewGuest(null);
  }

  function markNoShow(id) {
    const res = reservations.find(r => r.id === id);
    if (!res) return;
    setReservations(reservations.map(r => r.id === id ? { ...r, status: "No Show" } : r));
    if (res.room) syncRoomStatus(res.room, "Available", null);
    addLog(`No-Show posted for ${res.guest} (${id}) — Room ${res.room || "TBA"}`, "checkout");
    setConfirmNoShowId(null);
    setViewGuest(null);
  }

  function moveRoom(id, newRoomNumber, rateAdjust, upgradeReason, authorizedBy) {
    const res = reservations.find(r => r.id === id);
    if (!res) return;
    const oldRoom = res.room;
    const oldRoomObj = rooms.find(r => r.number === oldRoom);
    const newRoomObj = rooms.find(r => r.number === newRoomNumber);
    const newFolio = [...(res.folio || [])];
    const moveType = rateAdjust > 0 ? "Upgrade" : rateAdjust < 0 ? "Downgrade" : "Lateral Move";
    if (rateAdjust !== 0) {
      const label = rateAdjust > 0 ? "Room upgrade supplement" : "Room downgrade adjustment";
      newFolio.push({ desc: `${label} — moved from Room ${oldRoom} to Room ${newRoomNumber}${upgradeReason ? " · " + upgradeReason : ""}`, amount: rateAdjust, date: new Date().toISOString() });
    }
    const newTotal = res.total + rateAdjust; // Fix 4: rateAdjust is negative for downgrades → correctly reduces total
    const upgradeEntry = {
      id: "UPG-" + Date.now(), resId: res.id, guest: res.guest,
      fromRoom: oldRoom, toRoom: newRoomNumber,
      fromType: oldRoomObj?.type || "", toType: newRoomObj?.type || "",
      moveType, rateAdjust, reason: upgradeReason || "", authorizedBy: authorizedBy || "",
      date: new Date().toISOString(),
    };
    setReservations(reservations.map(r => r.id === id ? { ...r, room: newRoomNumber, total: newTotal, folio: newFolio, _movedFrom: oldRoom } : r));
    setRooms(prev => prev.map(rm => {
      if (rm.number === newRoomNumber) return { ...rm, upgradeHistory: [upgradeEntry, ...(rm.upgradeHistory || [])] };
      return rm;
    }));
    syncRoomStatus(oldRoom, "Dirty", null);
    syncRoomStatus(newRoomNumber, "Occupied", res.guest);
    addLog(`${moveType}: ${res.guest} — Room ${oldRoom} → Room ${newRoomNumber}${rateAdjust !== 0 ? " · Rate adj ₹" + rupees(Math.abs(rateAdjust)) : ""}${upgradeReason ? " · " + upgradeReason : ""}`, "edit");
    setRoomMoveModal(null);
    setViewGuest(null);
  }

  function printConfirmation(r) {
    const fmtD = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
    const nights = r.checkIn && r.checkOut ? Math.max(1,Math.round((new Date(r.checkOut)-new Date(r.checkIn))/86400000)) : 0;
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Booking Confirmation</title>
    <style>
      @page{margin:14mm;size:A4 portrait;}
