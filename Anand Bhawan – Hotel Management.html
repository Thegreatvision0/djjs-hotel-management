                            style={{
                              color: isEarlyDepV2 ? "#f59e0b" : isLateDepV2 ? "#dc2626" : "#a855f7",
                              borderColor: isEarlyDepV2 ? "rgba(245,158,11,0.35)" : isLateDepV2 ? "rgba(220,38,38,0.4)" : "rgba(168,85,247,0.3)",
                              fontSize: 12, padding: "6px 12px"
                            }}
                            title={isEarlyDepV2 ? `Early departure — booked until ${g.checkOut}` : isLateDepV2 ? `Overstay — was due out ${g.checkOut}` : "Check out today"}
                            onClick={() => { closeModal(); setConfirmCheckoutId(g.id); setEarlyBillingPolicy("full"); setBalanceOverrideAck(false); setBalanceOverrideReason(""); setBalanceOverrideNote(""); }}>
                            ↩ {isEarlyDepV2 ? "Early Check Out" : isLateDepV2 ? "Check Out (Overstay)" : "Check Out"}
                          </button>
                          <button className="btn btn-ghost"
                            style={{ color: "#22c55e", borderColor: "rgba(34,197,94,0.3)", fontSize: 12, padding: "6px 12px" }}
                            onClick={() => { closeModal(); setExtendModal({ id: g.id, newCheckOut: "", nights: 1, reason: "", addChargeFlag: true }); }}>
                            ⟳ Extend Stay
                          </button>
                          <button className="btn btn-ghost"
                            style={{ color: "#3b82f6", borderColor: "rgba(59,130,246,0.3)", fontSize: 12, padding: "6px 12px" }}
                            onClick={() => { closeModal(); setRoomMoveModal({ id: g.id, newRoom: "", rateAdjust: 0, reason: "", authorizedBy: "" }); }}>
                            🔄 Room Move
                          </button>
                        </>
                      )}

                      {/* COLLECT PAYMENT — for any active booking with balance */}
                      {(g.status === "Confirmed" || g.status === "On Hold" || g.status === "Checked In") && (
                        <button className="btn btn-ghost"
                          style={{ color: "#16a34a", borderColor: "rgba(22,163,74,0.35)", fontSize: 12, padding: "6px 12px", fontWeight: 700 }}
                          onClick={() => { setPayTargetId(g.id); setPayForm({ paymentType: "full", splits: [{ id: Date.now(), method: "UPI", amount: gBalance > 0 ? String(gBalance) : "", ref: "", extra: "" }], note: "", collectedBy: "", discount: "", discountReason: "", tip: "" }); closeModal(); setModal("pay"); }}>
                          💳 {gBalance > 0 ? `Collect ₹${rupees(gBalance)}` : "Record Payment"}
                        </button>
                      )}
                    </div>

                    {/* ── Secondary: Edit, Print, Close ── */}
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", paddingTop: 10, borderTop: "1px solid rgba(0,0,0,0.06)" }}>
                      {g.status !== "Cancelled" && g.status !== "Checked Out" && g.status !== "No Show" && (
                        <button className="btn btn-ghost" onClick={() => { openEdit(g); }} style={{ fontSize: 12, padding: "6px 12px" }}>✏️ Edit</button>
                      )}
                      {(g.status === "Confirmed" || g.status === "On Hold") && (
                        <button className="btn btn-ghost" onClick={() => printConfirmation(g)} style={{ fontSize: 12, padding: "6px 12px" }}>📋 Confirmation</button>
                      )}
                      <button className="btn btn-ghost" onClick={() => printInvoice(g)} style={{ fontSize: 12, padding: "6px 12px" }}>🧾 Invoice</button>
                      <button className="btn btn-primary" style={{ fontSize: 12, padding: "6px 16px", marginLeft: "auto" }} onClick={closeModal}>Close</button>
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>
        );
      })()}

      {/* ── Assign Room Modal (for check-in or pre-assignment) ── */}
      {assignRoomModal && (() => {
        const res = reservations.find(r => r.id === assignRoomModal.id);
        if (!res) return null;
        const bhavan = res.bhavan;
        const fmtD = (d) => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
        const isCIFlow = res.status === "Confirmed"; // true = this is triggered from check-in button

        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", backdropFilter: "blur(4px)", zIndex: 9998, display: "flex", alignItems: "center", justifyContent: "center" }}
            onClick={() => setAssignRoomModal(null)}>
            <div onClick={e => e.stopPropagation()}
              style={{ background: "#ffffff", border: "1px solid rgba(201,168,76,0.25)", borderRadius: 18, width: 520, boxShadow: "0 32px 80px rgba(0,0,0,0.45)", overflow: "hidden" }}>

              {/* Header */}
              <div style={{ padding: "18px 24px 14px", borderBottom: "1px solid rgba(255,255,255,0.07)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: "#111827" }}>
                    {isCIFlow ? "📌 Assign Room & Check In" : "📌 Pre-Assign Room"}
                  </div>
                  <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>
                    {isCIFlow ? "Select a room to assign and proceed with check-in" : "Pre-assign a room to this advance booking"}
                  </div>
                </div>
                <button onClick={() => setAssignRoomModal(null)} style={{ background: "none", border: "none", color: "#6b7280", fontSize: 20, cursor: "pointer" }}>✕</button>
              </div>

              <div style={{ padding: "20px 24px", display: "flex", flexDirection: "column", gap: 16 }}>

                {/* Booking summary */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, background: "rgba(0,0,0,0.02)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 10, overflow: "hidden" }}>
                  {[
                    { label: "Guest",      value: res.guest },
                    { label: "Room Type",  value: res.type, color: "#a07830" },
                    { label: "Check-In",   value: fmtD(res.checkIn) },
                    { label: "Check-Out",  value: fmtD(res.checkOut) },
                  ].map(({ label, value, color }, i) => (
                    <div key={label} style={{ padding: "10px 14px", borderRight: i % 2 === 0 ? "1px solid rgba(255,255,255,0.06)" : "none", borderBottom: i < 2 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                      <div style={{ fontSize: 9, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 3 }}>{label}</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: color || "#111827" }}>{value}</div>
                    </div>
                  ))}
                </div>

                {/* Room grid */}
                <div>
                  <div style={{ fontSize: 10, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10, fontWeight: 600 }}>
                    Available {res.type} Rooms in {bhavan}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                    {rooms.filter(rm => rm.bhavan === bhavan && rm.type === res.type).map(rm => {
                      const conflict = reservations.find(r =>
                        r.id !== res.id && r.room === rm.number && r.bhavan === rm.bhavan &&
                        r.status !== "Checked Out" && r.status !== "Cancelled" &&
                        new Date(res.checkIn) < new Date(r.checkOut) && new Date(res.checkOut) > new Date(r.checkIn)
                      );
                      const isMaint = rm.status === "Maintenance";
                      const isDirty = rm.status === "Dirty";
                      const isUnavail = conflict || isMaint;
                      const isSelected = assignRoomModal.room === rm.number;
                      let bg, border, color, cursor;
                      if (isSelected)     { bg = "#a07830"; border = "#a07830"; color = "#000"; cursor = "pointer"; }
                      else if (isUnavail) { bg = "rgba(239,68,68,0.1)"; border = "rgba(239,68,68,0.3)"; color = "#ef4444"; cursor = "not-allowed"; }
                      else if (isDirty)   { bg = "rgba(245,158,11,0.1)"; border = "rgba(245,158,11,0.3)"; color = "#f59e0b"; cursor = "pointer"; }
                      else                { bg = "rgba(34,197,94,0.1)"; border = "rgba(34,197,94,0.35)"; color = "#22c55e"; cursor = "pointer"; }
                      const rate = getRoomRate(bhavan, res.type, rm.number);
                      return (
                        <div key={rm.id}
                          title={isUnavail ? (isMaint ? `Room ${rm.number} — Maintenance` : `Booked: ${conflict?.guest}`) : `Room ${rm.number} · ₹${rupees(rate)}/night${isDirty ? " · Dirty" : ""}`}
                          onClick={() => !isUnavail && setAssignRoomModal({ ...assignRoomModal, room: rm.number })}
                          style={{ width: 70, padding: "8px 4px", borderRadius: 8, border: `1.5px solid ${border}`, background: bg, color, cursor, textAlign: "center", userSelect: "none", boxShadow: isSelected ? "0 0 0 2px rgba(201,168,76,0.4)" : "none" }}>
                          <div style={{ fontSize: 14, fontWeight: 700 }}>{rm.number}</div>
                          <div style={{ fontSize: 9, marginTop: 1, opacity: 0.8 }}>{isUnavail ? (isMaint ? "MAINT" : "BOOKED") : isDirty ? "DIRTY" : "FREE"}</div>
                          <div style={{ fontSize: 9, marginTop: 1, opacity: 0.65 }}>₹{rupees(rate)}</div>
                        </div>
                      );
                    })}
                    {rooms.filter(rm => rm.bhavan === bhavan && rm.type === res.type).length === 0 && (
                      <div style={{ fontSize: 12, color: "#ef4444", padding: 12, background: "rgba(239,68,68,0.07)", borderRadius: 8, width: "100%" }}>
                        ⚠ No {res.type} rooms available in {bhavan}. Please contact the manager or change room type.
                      </div>
                    )}
                  </div>

                  {/* Legend */}
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    {[["#22c55e","Free"],["#f59e0b","Dirty"],["#ef4444","Unavailable"],["#a07830","Selected"]].map(([c,l]) => (
                      <div key={l} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, color: "#6b7280" }}>
                        <div style={{ width: 8, height: 8, borderRadius: 2, background: c }} />{l}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Dirty room warning */}
                {assignRoomModal.room && rooms.find(r => r.number === assignRoomModal.room)?.status === "Dirty" && (
                  <div style={{ background: "rgba(245,158,11,0.08)", border: "1px solid rgba(245,158,11,0.3)", borderRadius: 8, padding: "10px 14px", fontSize: 12, color: "#f59e0b" }}>
                    ⚠ Room {assignRoomModal.room} is marked Dirty. Ensure housekeeping clears it before guest occupancy.
                  </div>
                )}

                {/* Rate note if room changes total */}
                {assignRoomModal.room && (() => {
                  const rate = getRoomRate(bhavan, res.type, assignRoomModal.room);
                  const nights = Math.max(1, Math.round((new Date(res.checkOut) - new Date(res.checkIn)) / 86400000));
                  const newTotal = nights * rate;
                  const oldTotal = res.total;
                  if (newTotal !== oldTotal) return (
                    <div style={{ background: "rgba(34,197,94,0.06)", border: "1px solid rgba(34,197,94,0.2)", borderRadius: 8, padding: "10px 14px", fontSize: 12 }}>
                      <div style={{ color: "#22c55e", fontWeight: 600, marginBottom: 3 }}>💡 Rate Update</div>
                      <div style={{ color: "#6b7280" }}>
                        Room {assignRoomModal.room} at ₹{rupees(rate)}/night × {nights} nights = <strong style={{ color: "#111827" }}>₹{rupees(newTotal)}</strong>
                        {oldTotal !== newTotal && <span style={{ color: newTotal > oldTotal ? "#f59e0b" : "#22c55e" }}> (was ₹{rupees(oldTotal)})</span>}
                      </div>
                    </div>
                  );
                  return null;
                })()}

                {/* Actions */}
                <div style={{ display: "flex", gap: 10, paddingTop: 4, borderTop: "1px solid rgba(255,255,255,0.06)" }}>
                  <button className="btn btn-ghost" onClick={() => setAssignRoomModal(null)} style={{ flex: 1 }}>Cancel</button>
                  {isCIFlow && (
                    <button className="btn btn-ghost"
                      onClick={() => {
                        // Pre-assign without checking in
                        if (!assignRoomModal.room) return;
                        setReservations(reservations.map(r => r.id === res.id ? { ...r, room: assignRoomModal.room } : r));
                        addLog(`Room ${assignRoomModal.room} pre-assigned to booking ${res.id} for ${res.guest}`, "booking");
                        setAssignRoomModal(null);
                      }}
                      disabled={!assignRoomModal.room}
                      style={{ flex: 1, opacity: !assignRoomModal.room ? 0.4 : 1 }}>
                      📌 Assign Only
                    </button>
                  )}
                  <button className="btn btn-primary"
                    disabled={!assignRoomModal.room}
                    onClick={() => confirmCheckIn(assignRoomModal.id, assignRoomModal.room)}
                    style={{ flex: 1.5, opacity: !assignRoomModal.room ? 0.4 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                    ✓ {isCIFlow ? `Assign & Check In` : `Confirm Assignment`}
                    {assignRoomModal.room && ` → Room ${assignRoomModal.room}`}
                  </button>
                </div>

              </div>
            </div>
          </div>
        );
      })()}

      {/* ── Extend Stay Modal ── */}
      {extendModal && (() => {
        const res = reservations.find(r => r.id === extendModal.id);
        if (!res) return null;
        const fmtD = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
        const currentNights = Math.round((new Date(res.checkOut)-new Date(res.checkIn))/86400000);
        const newCheckOut = extendModal.newCheckOut;
        const newNights = newCheckOut ? Math.round((new Date(newCheckOut)-new Date(res.checkIn))/86400000) : 0;
        const extraNights = newNights - currentNights;
        const rate = getRoomRate(res.bhavan, res.type, res.room);
        const extraAmount = extraNights * rate;
        const newTotal = extendModal.addChargeFlag ? (res.total||0) + extraAmount : (res.total||0);
        const newBalance = newTotal - (res.paid||0);
        const conflict = newCheckOut ? reservations.find(r =>
          r.id !== res.id && r.room === res.room && r.bhavan === res.bhavan &&
          r.status !== "Checked Out" && r.status !== "Cancelled" && r.status !== "No Show" &&
          new Date(res.checkOut) < new Date(r.checkOut) && new Date(newCheckOut) > new Date(r.checkIn)
        ) : null;
        const addNights = (n) => { const d=new Date(res.checkOut); d.setDate(d.getDate()+n); setExtendModal({...extendModal,newCheckOut:d.toISOString().split("T")[0]}); };
        const isValid = newCheckOut && newCheckOut > res.checkOut && !conflict;
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", backdropFilter:"blur(4px)", zIndex:99999, display:"flex", alignItems:"flex-start", justifyContent:"center", overflowY:"auto", padding:"32px 16px" }}
            onClick={()=>setExtendModal(null)}>
            <div onClick={e=>e.stopPropagation()}
              style={{ background:"#ffffff", border:"1px solid #e2e8f0", borderRadius:16, width:"100%", maxWidth:520, boxShadow:"0 32px 80px rgba(0,0,0,0.25)", display:"flex", flexDirection:"column" }}>

              {/* Fixed Header */}
              <div style={{ padding:"18px 24px", borderBottom:"1px solid #e2e8f0", background:"#f0fdf4", borderRadius:"16px 16px 0 0", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:700, color:"#166534" }}>⟳ Extend Stay</div>
                  <div style={{ fontSize:11, color:"#6b7280", marginTop:2 }}>{res.guest} · Room {res.room} · {res.bhavan}</div>
                </div>
                <button onClick={()=>setExtendModal(null)} style={{ background:"none", border:"none", color:"#9ca3af", fontSize:20, cursor:"pointer", lineHeight:1, padding:"4px" }}>✕</button>
              </div>

              {/* Scrollable Body */}
              <div style={{ padding:"20px 24px", display:"flex", flexDirection:"column", gap:14, overflowY:"auto" }}>

                {/* Current booking strip */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:10, overflow:"hidden" }}>
                  {[
                    { label:"Room",           value:`${res.room} · ${res.bhavan}` },
                    { label:"Current C/O",    value:fmtD(res.checkOut), color:"#f59e0b" },
                    { label:"Nights Booked",  value:`${currentNights}N` },
                  ].map(({label,value,color},i) => (
                    <div key={label} style={{ padding:"10px 14px", borderRight:i<2?"1px solid #e2e8f0":"none" }}>
                      <div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:3 }}>{label}</div>
                      <div style={{ fontSize:13, fontWeight:700, color:color||"#111827" }}>{value}</div>
                    </div>
                  ))}
                </div>

                {/* Quick presets */}
                <div>
                  <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8, fontWeight:700 }}>Quick Extend</div>
                  <div style={{ display:"flex", gap:8 }}>
                    {[1,2,3,5,7].map(n => (
                      <button key={n} onClick={()=>addNights(n)}
                        style={{ flex:1, padding:"9px 4px", borderRadius:8, border:"1px solid #bbf7d0", background:"#f0fdf4", cursor:"pointer", color:"#166534", fontSize:13, fontWeight:700 }}>
                        +{n}N
                      </button>
                    ))}
                  </div>
                </div>

                {/* Date picker */}
                <div>
                  <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:7, fontWeight:700 }}>New Check-Out Date *</div>
                  <input type="date"
                    min={(() => { const d=new Date(res.checkOut); d.setDate(d.getDate()+1); return d.toISOString().split("T")[0]; })()}
                    value={newCheckOut||""}
                    onChange={e=>setExtendModal({...extendModal,newCheckOut:e.target.value})}
                    style={{ width:"100%", padding:"9px 12px", fontSize:13, border:"1px solid #d1d5db", borderRadius:8, background:"#fff", color:"#111827", outline:"none", boxSizing:"border-box" }} />
                  {newCheckOut && newCheckOut<=res.checkOut && (
                    <div style={{ fontSize:11, color:"#ef4444", marginTop:4 }}>⚠ Must be after current check-out ({fmtD(res.checkOut)})</div>
                  )}
                </div>

                {/* Conflict */}
                {conflict && (
                  <div style={{ background:"#fef2f2", border:"1px solid #fca5a5", borderRadius:8, padding:"10px 14px" }}>
                    <div style={{ fontSize:12, fontWeight:700, color:"#ef4444", marginBottom:3 }}>⛔ Room Conflict</div>
                    <div style={{ fontSize:11, color:"#6b7280", lineHeight:1.6 }}>Room {res.room} is booked for <strong style={{color:"#111827"}}>{conflict.guest}</strong> from {fmtD(conflict.checkIn)}.</div>
                  </div>
                )}

                {/* Extension summary */}
                {isValid && extraNights>0 && (
                  <>
                    <div style={{ background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:8, padding:"12px 14px" }}>
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"8px 16px" }}>
                        {[["New Check-Out",fmtD(newCheckOut)],["Total Nights",`${newNights} (was ${currentNights})`],["Extra Nights",`+${extraNights}N`],["Extra Charge",`₹${rupees(extraAmount)}`]].map(([l,v]) => (
                          <div key={l}>
                            <div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:2 }}>{l}</div>
                            <div style={{ fontSize:12, fontWeight:600, color:"#111827" }}>{v}</div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Billing toggle */}
                    <div>
                      <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8, fontWeight:700 }}>Billing</div>
                      <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                        {[
                          { flag:true,  label:"Charge Extension", desc:`+₹${rupees(extraAmount)} to folio`, color:"#a07830" },
                          { flag:false, label:"Complimentary",     desc:"No extra charge",                  color:"#22c55e" },
                        ].map(opt => (
                          <button key={String(opt.flag)} onClick={()=>setExtendModal({...extendModal,addChargeFlag:opt.flag})}
                            style={{ flex:1, padding:"10px 12px", borderRadius:8, border:`2px solid ${extendModal.addChargeFlag===opt.flag?opt.color:"#e2e8f0"}`, background:extendModal.addChargeFlag===opt.flag?`${opt.color}15`:"#fafafa", cursor:"pointer", textAlign:"left" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:extendModal.addChargeFlag===opt.flag?opt.color:"#6b7280" }}>{opt.label}</div>
                            <div style={{ fontSize:10, color:"#9ca3af", marginTop:2 }}>{opt.desc}</div>
                          </button>
                        ))}
                      </div>
                      <div style={{ background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:8, padding:"10px 14px" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                          <span style={{ fontSize:11, color:"#6b7280" }}>Current Total</span>
                          <span style={{ fontSize:12, color:"#111827" }}>₹{rupees(res.total)}</span>
                        </div>
                        {extendModal.addChargeFlag && (
                          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                            <span style={{ fontSize:11, color:"#a07830" }}>Extension ({extraNights}N × ₹{rupees(rate)})</span>
                            <span style={{ fontSize:12, color:"#a07830" }}>+₹{rupees(extraAmount)}</span>
                          </div>
                        )}
                        <div style={{ display:"flex", justifyContent:"space-between", paddingTop:6, borderTop:"1px solid #e2e8f0" }}>
                          <span style={{ fontSize:12, fontWeight:700 }}>New Total</span>
                          <span style={{ fontSize:14, fontWeight:800, color:"#a07830" }}>₹{rupees(newTotal)}</span>
                        </div>
                        <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
                          <span style={{ fontSize:11, color:"#6b7280" }}>New Balance</span>
                          <span style={{ fontSize:12, fontWeight:700, color:newBalance>0?"#ef4444":"#22c55e" }}>{newBalance>0?`₹${rupees(newBalance)}`:"Settled ✓"}</span>
                        </div>
                      </div>
                    </div>
                  </>
                )}

                {/* Reason */}
                <div>
                  <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:7, fontWeight:700 }}>Reason / Notes <span style={{ textTransform:"none", fontWeight:400 }}>(optional)</span></div>
                  <input value={extendModal.reason||""} onChange={e=>setExtendModal({...extendModal,reason:e.target.value})}
                    placeholder="e.g. Guest requested, tour extended…"
                    style={{ width:"100%", padding:"9px 12px", fontSize:12, border:"1px solid #d1d5db", borderRadius:8, background:"#fff", color:"#111827", outline:"none", boxSizing:"border-box" }} />
                </div>

              </div>

              {/* Fixed Footer */}
              <div style={{ padding:"14px 24px", borderTop:"1px solid #e2e8f0", background:"#f8fafc", borderRadius:"0 0 16px 16px", display:"flex", gap:10 }}>
                <button onClick={()=>setExtendModal(null)}
                  style={{ flex:1, padding:"11px", borderRadius:8, border:"1px solid #d1d5db", background:"#fff", color:"#374151", cursor:"pointer", fontWeight:600, fontSize:13 }}>
                  Cancel
                </button>
                <button disabled={!isValid}
                  onClick={()=>{ extendBooking(); setExtendModal(null); setViewGuest(null); }}
                  style={{ flex:2, padding:"11px", borderRadius:8, border:"2px solid rgba(34,197,94,0.5)", background:isValid?"rgba(34,197,94,0.12)":"rgba(34,197,94,0.04)", color:"#166534", cursor:isValid?"pointer":"not-allowed", fontWeight:700, fontSize:13, opacity:isValid?1:0.45 }}>
                  ✓ Confirm Extension{isValid&&extraNights>0?` (+${extraNights}N)`:""}
                </button>
              </div>

            </div>
          </div>
        );
      })()}

            {/* ── Check Out Confirmation Popup ── */}
      {confirmCheckoutId && (() => {
        const res = reservations.find(r => r.id === confirmCheckoutId);
        const todayStr = new Date().toISOString().split("T")[0];
        const isEarly = res && res.checkOut > todayStr;
        const isLate  = res && res.checkOut < todayStr;
        const nightsBooked   = res ? Math.round((new Date(res.checkOut) - new Date(res.checkIn)) / 86400000) : 0;
        const nightsActual   = res ? Math.round((new Date(todayStr) - new Date(res.checkIn)) / 86400000) : 0;
        const nightsDiff     = nightsBooked - nightsActual;
        const fmtD = (d) => new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
        const coBalance = res ? Math.max(0, (res.total||0) - (res.paid||0)) : 0;
        const isComplOrSponsor = res?.folio?.some(f => f.desc && (f.desc.includes("Complimentary") || f.desc.includes("Sponsor"))) || ["Complimentary","Sponsor"].includes(res?.paymentMode);
        const coHardBlocked = coBalance > 0 && (!res?.paid || res.paid === 0) && !isComplOrSponsor;
        const coSoftBlocked = coBalance > 0 && !coHardBlocked && (!balanceOverrideAck || !balanceOverrideReason);
        const coBlocked = coHardBlocked || coSoftBlocked;
        return (
          <>
            <div className="alert-overlay" onClick={() => { setConfirmCheckoutId(null); setBalanceOverrideAck(false); setBalanceOverrideReason(""); setBalanceOverrideNote(""); }} />
            <div className="alert-box" style={{ borderColor: isEarly ? "rgba(245,158,11,0.45)" : "rgba(168,85,247,0.45)", maxWidth: 460 }}>
              <div style={{ fontSize: 36, marginBottom: 14 }}>{isEarly ? "⚠️" : "↩️"}</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#111827", marginBottom: 8 }}>
                {isEarly ? "Early Departure" : isLate ? "Late Check Out" : "Confirm Check Out"}
              </div>

              {/* Guest + room */}
              <div style={{ fontSize: 13, color: "#6b7280", lineHeight: 1.7, marginBottom: 14 }}>
                Guest: <strong style={{ color: "#111827" }}>{res?.guest}</strong><br />
                Room: <strong style={{ color: "#111827" }}>#{res?.room} — {res?.bhavan}</strong>
              </div>

              {/* Date summary */}
              <div style={{ background: "rgba(0,0,0,0.03)", border: "1px solid rgba(0,0,0,0.05)", borderRadius: 10, padding: "12px 16px", marginBottom: 14, textAlign: "left" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 12, color: "#6b7280" }}>Check-In</span>
                  <span style={{ fontSize: 12, color: "#111827" }}>{res && fmtD(res.checkIn)}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 12, color: "#6b7280" }}>Original Check-Out</span>
                  <span style={{ fontSize: 12, color: isEarly ? "#f59e0b" : "#111827", fontWeight: isEarly ? 700 : 400 }}>{res && fmtD(res.checkOut)}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid rgba(0,0,0,0.08)", paddingTop: 8, marginTop: 4 }}>
                  <span style={{ fontSize: 12, color: "#6b7280" }}>Actual Check-Out</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: isEarly ? "#f59e0b" : "#22c55e" }}>{fmtD(todayStr)} (Today)</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
                  <span style={{ fontSize: 12, color: "#6b7280" }}>Nights Stayed</span>
                  <span style={{ fontSize: 12, color: "#111827" }}>{nightsActual} of {nightsBooked} booked</span>
                </div>
              </div>

              {/* Fix 9: Early departure billing choice */}
              {isEarly && (() => {
                const rate = getRoomRate(res.bhavan, res.type, res.room || "");
                const refundNights  = nightsDiff;
                const refundAmount  = refundNights * rate;
                const actualTotal   = nightsActual * rate;
                const opts = [
                  { id: "full",   label: "Charge Full Stay",        sub: `₹${rupees(res.total)} — original booking amount`, color: "#ef4444" },
                  { id: "actual", label: `Charge ${nightsActual}N Used`, sub: `₹${rupees(actualTotal)} — refund ₹${rupees(refundAmount)} for ${refundNights}N unused`, color: "#f59e0b" },
                  { id: "waive",  label: "Waive Remaining Nights",  sub: `₹${rupees(res.total)} — add credit ₹${rupees(refundAmount)} to folio`, color: "#22c55e" },
                ];
                return (
                  <div style={{ background: "rgba(245,158,11,0.07)", border: "1px solid rgba(245,158,11,0.35)", borderRadius: 8, padding: "12px 14px", marginBottom: 14, textAlign: "left" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#f59e0b", marginBottom: 8 }}>⚠ Early Departure — {nightsDiff} night{nightsDiff !== 1 ? "s" : ""} early · Choose billing policy</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {opts.map(o => (
                        <label key={o.id} style={{ display: "flex", alignItems: "flex-start", gap: 8, cursor: "pointer", padding: "8px 10px", borderRadius: 7,
                          border: `1.5px solid ${earlyBillingPolicy === o.id ? o.color : "rgba(0,0,0,0.1)"}`,
                          background: earlyBillingPolicy === o.id ? `${o.color}12` : "#fafafa" }}>
                          <input type="radio" name="earlyBillingPolicy" value={o.id}
                            checked={earlyBillingPolicy === o.id}
                            onChange={() => setEarlyBillingPolicy(o.id)}
                            style={{ marginTop: 2, accentColor: o.color }} />
                          <div>
                            <div style={{ fontSize: 12, fontWeight: 700, color: o.color }}>{o.label}</div>
                            <div style={{ fontSize: 10, color: "#6b7280", marginTop: 1 }}>{o.sub}</div>
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>
                );
              })()}
              {isLate && (
                <div style={{ background: "rgba(168,85,247,0.1)", border: "1px solid rgba(168,85,247,0.3)", borderRadius: 8, padding: "10px 14px", marginBottom: 14, textAlign: "left" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#a855f7", marginBottom: 4 }}>ℹ Late Check-Out</div>
                  <div style={{ fontSize: 11, color: "#6b7280" }}>Check-out date will be recorded as today. Verify billing for any late fees.</div>
                </div>
              )}

              {/* ── BALANCE GATE ── */}
              {coHardBlocked && (
                <div style={{ background:"rgba(239,68,68,0.08)", border:"2px solid rgba(239,68,68,0.5)", borderRadius:8, padding:"12px 14px", marginBottom:14, textAlign:"left" }}>
                  <div style={{ fontSize:13, fontWeight:800, color:"#dc2626", marginBottom:4 }}>🚫 Checkout Blocked — No Payment Recorded</div>
                  <div style={{ fontSize:11, color:"#6b7280", lineHeight:1.6, marginBottom:10 }}>
                    No payment on file. Collect <strong style={{color:"#dc2626"}}>₹{rupees(coBalance)}</strong> before proceeding.
                  </div>
                  <button
                    onClick={() => { setPayTargetId(confirmCheckoutId); setConfirmCheckoutId(null); setPayForm({ paymentType:"full", splits:[{id:Date.now(),method:"UPI",amount:"",ref:"",extra:""}], note:"", collectedBy:"", discount:"", discountReason:"", tip:"" }); setModal("pay"); }}
                    style={{ width:"100%", padding:"9px 0", borderRadius:8, border:"1px solid rgba(239,68,68,0.4)", background:"rgba(239,68,68,0.1)", color:"#dc2626", fontWeight:700, fontSize:13, cursor:"pointer" }}>
                    💳 Collect Payment — ₹{rupees(coBalance)}
                  </button>
                </div>
              )}

              {isComplOrSponsor && coBalance > 0 && (
                <div style={{ background:"rgba(34,197,94,0.07)", border:"1px solid rgba(34,197,94,0.3)", borderRadius:8, padding:"10px 14px", marginBottom:14, textAlign:"left" }}>
                  <div style={{ fontSize:12, fontWeight:700, color:"#16a34a", marginBottom:2 }}>✓ Complimentary / Sponsored Stay</div>
                  <div style={{ fontSize:11, color:"#6b7280" }}>Balance of ₹{rupees(coBalance)} waived — no payment required to proceed.</div>
                </div>
              )}

              {!coHardBlocked && coBalance > 0 && (
                <div style={{ background:"rgba(245,158,11,0.07)", border:"2px solid rgba(245,158,11,0.4)", borderRadius:8, padding:"12px 14px", marginBottom:14, textAlign:"left" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:800, color:"#d97706", marginBottom:2 }}>⚠ Outstanding Balance — ₹{rupees(coBalance)}</div>
                      <div style={{ fontSize:11, color:"#6b7280" }}>Settle now or provide manager override to proceed.</div>
                    </div>
                    <button
                      onClick={() => { setPayTargetId(confirmCheckoutId); setConfirmCheckoutId(null); setPayForm({ paymentType:"full", splits:[{id:Date.now(),method:"UPI",amount:String(coBalance),ref:"",extra:""}], note:"", collectedBy:"", discount:"", discountReason:"", tip:"" }); setModal("pay"); }}
                      style={{ flexShrink:0, marginLeft:12, padding:"7px 14px", borderRadius:8, border:"1px solid rgba(245,158,11,0.5)", background:"rgba(245,158,11,0.12)", color:"#b45309", fontWeight:700, fontSize:12, cursor:"pointer", whiteSpace:"nowrap" }}>
                      💳 Collect ₹{rupees(coBalance)}
                    </button>
                  </div>
                  <div className="form-group" style={{ marginBottom:8 }}>
                    <label style={{fontSize:10}}>Override Reason *</label>
                    <select value={balanceOverrideReason} onChange={e=>setBalanceOverrideReason(e.target.value)} style={{fontSize:12}}>
                      <option value="">— Select reason —</option>
                      <option>Corporate billing — invoice to follow</option>
                      <option>Travel agent settlement pending</option>
                      <option>City ledger transfer authorized</option>
                      <option>Complimentary waiver by management</option>
                      <option>Guest will pay by bank transfer</option>
                      <option>Dispute — referred to manager</option>
                      <option>Other</option>
                    </select>
                  </div>
                  <div className="form-group" style={{ marginBottom:10 }}>
                    <label style={{fontSize:10}}>Manager Note <span style={{color:"#9ca3af",fontWeight:400}}>(optional — for audit trail)</span></label>
                    <input placeholder="e.g. Authorised by GM — Sharma ji, corp acct INV-2026-031"
                      value={balanceOverrideNote} onChange={e=>setBalanceOverrideNote(e.target.value)}
                      style={{fontSize:12}} />
                  </div>
                  <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:12, color:"#374151" }}>
                    <input type="checkbox" checked={balanceOverrideAck} onChange={e=>setBalanceOverrideAck(e.target.checked)} />
                    I acknowledge the outstanding balance and confirm this override
                  </label>
                </div>
              )}

              <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 20 }}>
                Room will be marked <strong style={{ color: "#f59e0b" }}>Dirty</strong> and queued for housekeeping.
              </div>

              <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                <button className="btn btn-ghost" onClick={() => { setConfirmCheckoutId(null); setBalanceOverrideAck(false); setBalanceOverrideReason(""); setBalanceOverrideNote(""); }} style={{ minWidth: 100 }}>Cancel</button>
                <button className="btn btn-primary" disabled={coBlocked}
                  onClick={() => {
                    if (coBalance > 0 && balanceOverrideReason) addLog(`Checkout override: ${res?.guest} — balance ₹${rupees(coBalance)} — ${balanceOverrideReason}${balanceOverrideNote ? " · Note: "+balanceOverrideNote : ""}`, "checkout");
                    // Fix 9: apply early billing adjustment before checkout
                    if (isEarly && earlyBillingPolicy !== "full" && res) {
                      const rate = getRoomRate(res.bhavan, res.type, res.room || "");
                      const todayStr2 = new Date().toISOString().split("T")[0];
                      const nightsActual2 = Math.max(1, Math.round((new Date(todayStr2) - new Date(res.checkIn)) / 86400000));
                      const nightsBooked2 = Math.max(1, Math.round((new Date(res.checkOut) - new Date(res.checkIn)) / 86400000));
                      const unusedNights = nightsBooked2 - nightsActual2;
                      const adjustAmount = unusedNights * rate;
                      if (adjustAmount > 0) {
                        const newFolio = [...(res.folio || [])];
                        if (earlyBillingPolicy === "actual") {
                          newFolio.push({ desc: `Early departure adjustment — ${unusedNights} unused night${unusedNights!==1?"s":""} refunded (${nightsActual2}/${nightsBooked2} nights charged)`, amount: -adjustAmount, date: new Date().toISOString() });
                          setReservations(prev => prev.map(r => r.id === confirmCheckoutId ? { ...r, total: Math.max(0, r.total - adjustAmount), folio: newFolio } : r));
                          addLog(`Early checkout billing: ${res.guest} — ${nightsActual2}N charged, ${unusedNights}N refunded (₹${rupees(adjustAmount)})`, "checkout");
                        } else if (earlyBillingPolicy === "waive") {
                          newFolio.push({ desc: `Early departure — ${unusedNights} night${unusedNights!==1?"s":""} waived by management`, amount: -adjustAmount, date: new Date().toISOString() });
                          setReservations(prev => prev.map(r => r.id === confirmCheckoutId ? { ...r, total: Math.max(0, r.total - adjustAmount), folio: newFolio } : r));
                          addLog(`Early checkout waiver: ${res.guest} — ${unusedNights}N waived (₹${rupees(adjustAmount)})`, "checkout");
                        }
                      }
                    }
                    checkOut(confirmCheckoutId, isEarly); setConfirmCheckoutId(null); setViewGuest(null); setEarlyBillingPolicy("full"); setBalanceOverrideAck(false); setBalanceOverrideReason(""); setBalanceOverrideNote("");
                  }}
                  style={{ minWidth: 120, opacity: coBlocked?0.45:1, cursor: coBlocked?"not-allowed":"pointer",
                    background: coHardBlocked?"rgba(239,68,68,0.1)":coSoftBlocked?"rgba(245,158,11,0.1)":isEarly?"rgba(245,158,11,0.15)":"rgba(168,85,247,0.15)",
                    borderColor: coHardBlocked?"rgba(239,68,68,0.5)":coSoftBlocked?"rgba(245,158,11,0.4)":isEarly?"rgba(245,158,11,0.4)":"rgba(168,85,247,0.4)",
                    color: coHardBlocked?"#ef4444":coSoftBlocked?"#f59e0b":isEarly?"#f59e0b":"#a855f7" }}>
                  {coHardBlocked ? "🚫 Settle Balance First" : coSoftBlocked ? "⚠ Override Required" : "✓ Confirm Check Out"}
                </button>
              </div>
            </div>
          </>
        );
      })()}

      {/* ── Cancel Confirmation Popup ── */}
      {confirmCancelId && (() => {
        const res = reservations.find(r => r.id === confirmCancelId);
        if (!res) return null;
        return (
          <>
            <div className="alert-overlay" onClick={() => setConfirmCancelId(null)} />
            <div className="alert-box" style={{ borderColor: "rgba(239,68,68,0.45)", maxWidth: 420 }}>
              <div style={{ fontSize: 32, marginBottom: 12 }}>⚠️</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#111827", marginBottom: 8 }}>Cancel Booking?</div>
              <div style={{ fontSize: 13, color: "#6b7280", lineHeight: 1.7, marginBottom: 20 }}>
                <strong style={{ color: "#ef4444" }}>{res.guest}</strong> — Room {res.room || "TBA"} · {res.bhavan}<br />
                {res.checkIn} → {res.checkOut}
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                <button className="btn btn-ghost" onClick={() => setConfirmCancelId(null)} style={{ minWidth: 100 }}>Keep Booking</button>
                <button className="btn btn-primary"
                  onClick={() => cancelReservation(confirmCancelId)}
                  style={{ minWidth: 120, background: "rgba(239,68,68,0.15)", borderColor: "rgba(239,68,68,0.4)", color: "#ef4444" }}>
                  Yes, Cancel
                </button>
              </div>
            </div>
          </>
        );
      })()}

      {/* ── No Show Confirmation ── */}
      {confirmNoShowId && (() => {
        const res = reservations.find(r => r.id === confirmNoShowId);
        if (!res) return null;
        return (
          <>
            <div className="alert-overlay" onClick={() => setConfirmNoShowId(null)} />
            <div className="alert-box" style={{ borderColor: "rgba(239,68,68,0.45)", maxWidth: 420 }}>
              <div style={{ fontSize: 32, marginBottom: 10 }}>🚫</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#111827", marginBottom: 8 }}>Mark as No Show?</div>
              <div style={{ fontSize: 13, color: "#6b7280", marginBottom: 14 }}>
                <strong style={{ color: "#111827" }}>{res.guest}</strong> did not arrive for check-in on {res.checkIn}.<br />
                Room {res.room||"TBA"} · {res.bhavan}
              </div>
              <div style={{ background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.2)", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 11, color: "#6b7280" }}>
                Room will be released back to Available.
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                <button className="btn btn-ghost" onClick={() => setConfirmNoShowId(null)}>Cancel</button>
                <button className="btn btn-primary"
                  onClick={() => markNoShow(confirmNoShowId)}
                  style={{ background: "rgba(239,68,68,0.15)", borderColor: "rgba(239,68,68,0.4)", color: "#ef4444" }}>
                  🚫 Confirm No Show
                </button>
              </div>
            </div>
          </>
        );
      })()}

      {/* ── Room Move Modal ── */}
      {roomMoveModal && (() => {
        const res = reservations.find(r => r.id === roomMoveModal.id);
        if (!res) return null;
        const fmtD = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
        const currentRate = getRoomRate(res.bhavan, res.type, res.room);
        const remaining  = res.checkOut ? Math.max(1, Math.round((new Date(res.checkOut) - new Date()) / 86400000)) : 1;
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", backdropFilter:"blur(4px)", zIndex:99999, display:"flex", alignItems:"flex-start", justifyContent:"center", overflowY:"auto", padding:"32px 16px" }}
            onClick={()=>setRoomMoveModal(null)}>
            <div onClick={e=>e.stopPropagation()}
              style={{ background:"#ffffff", border:"1px solid #e2e8f0", borderRadius:16, width:"100%", maxWidth:560, boxShadow:"0 32px 80px rgba(0,0,0,0.25)", display:"flex", flexDirection:"column", minHeight:0 }}>

              {/* Fixed Header */}
              <div style={{ padding:"18px 24px", borderBottom:"1px solid #e2e8f0", background:"#eff6ff", borderRadius:"16px 16px 0 0", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:700, color:"#1d4ed8" }}>🔄 Room Move</div>
                  <div style={{ fontSize:11, color:"#6b7280", marginTop:2 }}>{res.guest} · Room {res.room} · {res.bhavan}</div>
                </div>
                <button onClick={()=>setRoomMoveModal(null)} style={{ background:"none", border:"none", color:"#9ca3af", fontSize:20, cursor:"pointer", lineHeight:1, padding:"4px" }}>✕</button>
              </div>

              {/* Scrollable Body */}
              <div style={{ padding:"20px 24px", display:"flex", flexDirection:"column", gap:16, overflowY:"auto" }}>

                {/* Current room strip */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:10, overflow:"hidden" }}>
                  {[
                    { label:"Current Room", value:`${res.room} · ${res.type}`, color:"#f59e0b" },
                    { label:"Bhawan",        value:res.bhavan },
                    { label:"Check-Out",     value:fmtD(res.checkOut) },
                  ].map(({label,value,color},i) => (
                    <div key={label} style={{ padding:"10px 14px", borderRight:i<2?"1px solid #e2e8f0":"none" }}>
                      <div style={{ fontSize:9, color:"#9ca3af", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:3 }}>{label}</div>
                      <div style={{ fontSize:13, fontWeight:700, color:color||"#111827" }}>{value}</div>
                    </div>
                  ))}
                </div>

                {/* Move Details */}
                <div style={{ background:"#f0f9ff", border:"1px solid #bae6fd", borderRadius:10, padding:"14px 16px" }}>
                  <div style={{ fontSize:10, color:"#0369a1", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:12 }}>Move Details</div>
                  <div style={{ display:"flex", gap:12 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:11, color:"#374151", fontWeight:600, marginBottom:6 }}>Reason for Move</div>
                      <input placeholder="Guest request, noise, view preference..."
                        value={roomMoveModal.reason||""}
                        onChange={e=>setRoomMoveModal({...roomMoveModal,reason:e.target.value})}
                        style={{ width:"100%", padding:"9px 11px", fontSize:12, border:"1px solid #93c5fd", borderRadius:7, background:"#fff", color:"#111827", outline:"none", boxSizing:"border-box" }} />
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:11, color:"#374151", fontWeight:600, marginBottom:6 }}>Authorized By</div>
                      <input placeholder="Manager name..."
                        value={roomMoveModal.authorizedBy||""}
                        onChange={e=>setRoomMoveModal({...roomMoveModal,authorizedBy:e.target.value})}
                        style={{ width:"100%", padding:"9px 11px", fontSize:12, border:"1px solid #93c5fd", borderRadius:7, background:"#fff", color:"#111827", outline:"none", boxSizing:"border-box" }} />
                    </div>
                  </div>
                </div>

                {/* Room picker grid */}
                <div>
                  <div style={{ fontSize:10, color:"#6b7280", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:10, fontWeight:700 }}>Select New Room in {res.bhavan}</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                    {rooms.filter(rm => rm.bhavan === res.bhavan && rm.number !== res.room).map(rm => {
                      const conflict = reservations.find(r =>
                        r.id !== res.id && r.room === rm.number && r.bhavan === rm.bhavan &&
                        r.status !== "Checked Out" && r.status !== "Cancelled" && r.status !== "No Show" &&
                        new Date(res.checkIn) < new Date(r.checkOut) && new Date(res.checkOut) > new Date(r.checkIn)
                      );
                      const isUnavail = conflict || rm.status === "Maintenance" || (rm.status === "Occupied" && rm.guest !== res.guest);
                      const isSelected = roomMoveModal.newRoom === rm.number;
                      const newRate = getRoomRate(res.bhavan, rm.type, rm.number);
                      const adj = (newRate - currentRate) * remaining;
                      let bg, bdr, col, cur;
                      if (isSelected)              { bg="#3b82f6"; bdr="#3b82f6"; col="#fff";    cur="pointer"; }
                      else if (isUnavail)          { bg="#fef2f2"; bdr="#fca5a5"; col="#ef4444"; cur="not-allowed"; }
                      else if (rm.status==="Dirty"){ bg="#fffbeb"; bdr="#fcd34d"; col="#d97706"; cur="pointer"; }
                      else                         { bg="#eff6ff"; bdr="#93c5fd"; col="#1d4ed8"; cur="pointer"; }
                      return (
                        <div key={rm.id}
                          title={isUnavail?"Not available":`${rm.type} · ₹${rupees(newRate)}/night`}
                          onClick={()=>!isUnavail&&setRoomMoveModal({...roomMoveModal,newRoom:rm.number,rateAdjust:adj})}
                          style={{ width:72, padding:"10px 4px", borderRadius:10, border:`1.5px solid ${bdr}`, background:bg, color:col, cursor:cur, textAlign:"center", userSelect:"none", transition:"all 0.12s", boxShadow:isSelected?"0 0 0 3px rgba(59,130,246,0.3)":"none" }}>
                          <div style={{ fontSize:14, fontWeight:700 }}>{rm.number}</div>
                          <div style={{ fontSize:9, marginTop:2, opacity:0.75 }}>{rm.type.substring(0,3).toUpperCase()}</div>

            {/* ── Early Date Shift Modal — guest arrives before booking date ── */}

              <div style={{ padding:"14px 24px", borderTop:"1px solid #e2e8f0", background:"#f8fafc", borderRadius:"0 0 16px 16px", display:"flex", gap:10 }}>

      {/* ── Early Arrival / Room Readiness Gate Modal ── */}
      {earlyArrivalModal && (() => {
        const m = earlyArrivalModal;

          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", backdropFilter: "blur(4px)", zIndex: 9999, display: "flex", alignItems: "center", justifyContent: "center" }}
            onClick={() => setEarlyArrivalModal(null)}>
            <div onClick={e => e.stopPropagation()}
              style={{ background: "#ffffff", border: "1px solid rgba(245,158,11,0.35)", borderRadius: 18, width: 500, boxShadow: "0 32px 80px rgba(0,0,0,0.8)", overflow: "hidden" }}>

              {/* Header */}
              <div style={{ padding: "18px 24px 14px", borderBottom: "1px solid rgba(255,255,255,0.07)", background: "rgba(245,158,11,0.06)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: "#f59e0b" }}>⚡ Early Arrival Check</div>
                  <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>{m.guestName} · Room {m.roomNumber}</div>
                </div>
                <button onClick={() => setEarlyArrivalModal(null)} style={{ background: "none", border: "none", color: "#6b7280", fontSize: 20, cursor: "pointer" }}>✕</button>
              </div>

              <div style={{ padding: "20px 24px", display: "flex", flexDirection: "column", gap: 14 }}>

                {/* Time status */}
                {isTimeProblem && (
                  <div style={{ background: "rgba(245,158,11,0.08)", border: "1px solid rgba(245,158,11,0.3)", borderRadius: 10, padding: "14px 16px" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#f59e0b", marginBottom: 8 }}>⏰ Before Standard Check-in Time</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 0, background: "rgba(0,0,0,0.2)", borderRadius: 8, overflow: "hidden" }}>
                      {[
                        { label: "Current Time",   value: m.currentTime + " hrs", color: "#111827" },
                        { label: "Guest ETA",       value: m.etaTime + " hrs",     color: "#f59e0b" },
                        { label: "Standard CI",     value: m.stdTime + " hrs",      color: "#6b7280" },
                      ].map(({ label, value, color }, i) => (
                        <div key={label} style={{ padding: "10px 12px", borderRight: i < 2 ? "1px solid rgba(255,255,255,0.06)" : "none", textAlign: "center" }}>
                          <div style={{ fontSize: 9, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>{label}</div>
                          <div style={{ fontSize: 14, fontWeight: 700, color }}>{value}</div>
                        </div>
                      ))}
                    </div>
                    {m.earlyRequestedTime && (
                      <div style={{ fontSize: 11, color: "#f59e0b", marginTop: 8 }}>
                        ✓ Guest pre-requested early check-in at {m.earlyRequestedTime} hrs
                      </div>
                    )}
                  </div>
                )}

                {/* Room status */}
                <div style={{ background: isRoomProblem ? "rgba(239,68,68,0.08)" : "rgba(34,197,94,0.08)", border: `1px solid ${isRoomProblem ? "rgba(239,68,68,0.3)" : "rgba(34,197,94,0.25)"}`, borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: isRoomProblem ? "#ef4444" : "#22c55e" }}>
                      {m.roomStatus === "Dirty" && "🧹 Room is Dirty — Needs Cleaning"}
                      {m.roomStatus === "Maintenance" && "🔧 Room is Under Maintenance"}
                      {!isRoomProblem && `✓ Room ${m.roomNumber} is ${m.roomStatus}`}
                    </div>
                    <span style={{ fontSize: 11, background: isRoomProblem ? "rgba(239,68,68,0.12)" : "rgba(34,197,94,0.12)", color: isRoomProblem ? "#ef4444" : "#22c55e", border: `1px solid ${isRoomProblem ? "rgba(239,68,68,0.3)" : "rgba(34,197,94,0.25)"}`, borderRadius: 8, padding: "2px 10px", fontWeight: 700 }}>
                      {m.roomStatus}
                    </span>
                  </div>
                  {m.roomStatus === "Dirty" && (
                    <div style={{ fontSize: 11, color: "#6b7280", marginTop: 6 }}>
                      Housekeeping has not cleared this room yet. Proceeding will mark it Occupied immediately.
                    </div>
                  )}
                  {m.roomStatus === "Maintenance" && (
                    <div style={{ fontSize: 11, color: "#ef4444", marginTop: 6 }}>
                      ⚠ This room is under maintenance. Consider assigning a different room before proceeding.
                    </div>
                  )}
                </div>

                {/* Summary instruction */}
                <div style={{ fontSize: 12, color: "#6b7280", lineHeight: 1.6, padding: "8px 12px", background: "rgba(0,0,0,0.02)", borderRadius: 8 }}>
                  {isRoomProblem && m.roomStatus !== "Maintenance"
                    ? "Confirm that the room has been physically cleaned and is ready for occupancy before proceeding."
                    : m.roomStatus === "Maintenance"
                    ? "It is recommended to assign a different room. You may still proceed if maintenance has been resolved."
                    : "Confirm that the room is ready for early occupancy before proceeding."}
                </div>

                {/* Actions */}
                <div style={{ display: "flex", gap: 10, paddingTop: 4, borderTop: "1px solid rgba(255,255,255,0.06)" }}>
                  <button className="btn btn-ghost" onClick={() => setEarlyArrivalModal(null)} style={{ flex: 1 }}>
                    ← Go Back
                  </button>
                  {m.roomStatus !== "Maintenance" && (
                    <button className="btn btn-primary"
                      onClick={() => confirmCheckIn(m.id, m.roomNumber)}
                      style={{ flex: 2, background: "rgba(245,158,11,0.15)", borderColor: "rgba(245,158,11,0.5)", color: "#f59e0b", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                      ⚡ Confirm Early Check-in → Room {m.roomNumber}
                    </button>
                  )}
                  {m.roomStatus === "Maintenance" && (
                    <button className="btn btn-ghost"
                      onClick={() => { setEarlyArrivalModal(null); setAssignRoomModal({ id: m.id, room: "", bhavan: res.bhavan }); }}
                      style={{ flex: 2, color: "#3b82f6", borderColor: "rgba(59,130,246,0.3)" }}>
                      📌 Assign Different Room
