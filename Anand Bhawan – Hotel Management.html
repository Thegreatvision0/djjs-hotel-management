      body{font-family:'Segoe UI',sans-serif;background:#fff;color:#1a1a1a;font-size:13px;}
      .header{background:#1a1f2e;color:#fff;padding:24px 28px 18px;border-bottom:4px solid #c9a84c;}
      .logo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:#c9a84c;border-radius:50%;font-size:22px;font-weight:900;color:#1a1f2e;margin-bottom:10px;}
      .hotel-name{font-size:18px;font-weight:700;color:#c9a84c;letter-spacing:0.04em;}
      .hotel-sub{font-size:11px;color:#a0aec0;margin-top:3px;}
      .conf-badge{background:#c9a84c;color:#1a1f2e;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:0.06em;display:inline-block;margin-top:10px;}
      .conf-no{font-family:monospace;font-size:22px;font-weight:900;color:#c9a84c;letter-spacing:0.1em;margin:8px 0 4px;}
      .body{padding:24px 28px;}
      .section{margin-bottom:20px;}
      .section-title{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#c9a84c;border-bottom:1px solid #e5e7eb;padding-bottom:5px;margin-bottom:12px;font-weight:700;}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
      .field label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:3px;}
      .field span{font-size:13px;font-weight:600;color:#1a1a1a;}
      .highlight{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin-bottom:16px;}
      .highlight .nights{font-size:28px;font-weight:900;color:#c9a84c;}
      .highlight .dates{font-size:13px;color:#374151;margin-top:4px;}
      .total-box{background:#1a1f2e;color:#fff;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
      .total-box .label{font-size:11px;color:#a0aec0;}
      .total-box .amount{font-size:22px;font-weight:900;color:#c9a84c;}
      .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:700;background:#dcfce7;color:#16a34a;margin-right:5px;}
      .pill.vip{background:#fef3c7;color:#92400e;}
      .pill.source{background:#ede9fe;color:#5b21b6;}
      table{width:100%;border-collapse:collapse;margin-top:8px;}
      th{background:#f3f4f6;font-size:10px;text-transform:uppercase;color:#6b7280;padding:6px 10px;text-align:left;font-weight:700;}
      td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f3f4f6;}
      .requests{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#713f12;}
      .notes-internal{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:12px;color:#991b1b;}
      .policy{background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:10px 14px;font-size:11px;color:#1e40af;}
      .footer{background:#f9fafb;border-top:1px solid #e5e7eb;padding:16px 28px;text-align:center;font-size:10px;color:#9ca3af;}
      .sig-block{margin-top:30px;display:flex;justify-content:space-between;}
      .sig-line{border-top:1px solid #374151;width:180px;padding-top:6px;font-size:10px;color:#6b7280;text-align:center;}
      @media print{.no-print{display:none!important;}}
    </style></head><body>
    <div class="header">
      <div class="logo">DJ</div>
      <div class="hotel-name">${HOTEL_NAME}</div>
      <div class="hotel-sub">Booking Confirmation</div>
      ${r.isVIP ? '<span class="pill vip">⭐ VIP GUEST</span>' : ""}
      ${r.bookingSource ? `<span class="pill source">${SOURCE_ICONS[r.bookingSource]||""} ${r.bookingSource}</span>` : ""}
      ${r.reference ? `<div style="font-size:11px;color:#a0aec0;margin-top:4px;">Ref: ${r.reference}</div>` : ""}
      <div class="conf-no">${r.confirmationNo || r.id}</div>
      <div style="font-size:11px;color:#a0aec0;">Booking ID: ${r.id} &nbsp;·&nbsp; Issued: ${new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</div>
      ${r.groupId ? `<div style="font-size:11px;color:#fcd34d;margin-top:4px;">Group: ${r.groupId}${r.groupName ? ` — ${r.groupName}` : ""}</div>` : ""}
    </div>
    <div class="body">
      <div class="highlight">
        <div class="nights">${nights} Night${nights!==1?"s":""}</div>
        <div class="dates">
          <strong>Check-In:</strong> ${fmtD(r.checkIn)}${r.eta ? ` at ${r.eta} hrs` : ""}${r.earlyCheckIn ? ` &nbsp;<span style="background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 6px;font-size:11px;">⚡ Early CI ${r.earlyCheckInTime||""}</span>` : ""} &nbsp;&nbsp;
          <strong>Check-Out:</strong> ${fmtD(r.checkOut)}${r.etd ? ` by ${r.etd} hrs` : ""}
        </div>
      </div>
      <div class="grid2">
        <div class="section">
          <div class="section-title">Guest Details</div>
          <div class="grid2">
            <div class="field"><label>Guest Name</label><span>${r.guest}</span></div>
            <div class="field"><label>Nationality</label><span>${r.nationality||"—"}</span></div>
            <div class="field"><label>Mobile</label><span>${r.countryCode||"+91"} ${r.mobile||"—"}</span></div>
            <div class="field"><label>ID</label><span>${r.idType}: ${r.idNumber||"—"}</span></div>
            ${r.companions&&r.companions.length>0?`<div class="field" style="grid-column:1/-1"><label>Companions (${r.companions.length})</label><span>${r.companions.map(c=>`${c.name}${c.relation?` (${c.relation})`:""}`).join(", ")}</span></div>`:""}
          </div>
        </div>
        <div class="section">
          <div class="section-title">Accommodation</div>
          <div class="grid2">
            <div class="field"><label>Bhawan</label><span>${r.bhavan||"—"}</span></div>
            <div class="field"><label>Room</label><span>${r.room ? `#${r.room}` : "TBA"} — ${r.type}</span></div>
            <div class="field"><label>Adults</label><span>${r.adults||1}</span></div>
            <div class="field"><label>Children</label><span>${r.children||0}</span></div>
          </div>
        </div>
      </div>
      ${r.specialRequests?`<div class="requests" style="margin-bottom:14px;"><strong>📋 Special Requests:</strong> ${r.specialRequests}</div>`:""}
      <div class="total-box" style="margin-bottom:16px;">
        <div><div class="label">Total Amount</div><div class="amount">₹${rupees(r.total||0)}</div></div>
        <div style="text-align:right"><div class="label">Paid</div><div style="font-size:15px;font-weight:700;color:#22c55e;">₹${rupees(r.paid||0)}</div></div>
        <div style="text-align:right"><div class="label">Balance Due</div><div style="font-size:15px;font-weight:700;color:${(r.total-r.paid)>0?"#ef4444":"#22c55e"};">₹${rupees(Math.max(0,r.total-r.paid))}</div></div>
      </div>
      <div class="sig-block">
        <div class="sig-line">Guest Signature</div>
        <div class="sig-line">Authorised Signatory<br>Front Office — ${HOTEL_NAME}</div>
      </div>
    </div>
    <div class="footer">
      This is a computer-generated confirmation. ${HOTEL_NAME} · Booking Ref: ${r.confirmationNo||r.id}<br>
      For queries contact Front Office. Check-in: ${r.eta||"14:00"} hrs · Check-out: ${r.etd||"11:00"} hrs
    </div>
    <div class="no-print" style="position:fixed;top:16px;right:16px;display:flex;gap:8px;">
      <button onclick="window.print()" style="padding:8px 18px;background:#c9a84c;border:none;border-radius:6px;font-weight:700;cursor:pointer;">🖨 Print</button>
      <button onclick="window.close()" style="padding:8px 18px;background:#374151;color:#fff;border:none;border-radius:6px;cursor:pointer;">✕ Close</button>
    </div>
    </body></html>`;
    window.dispatchEvent(new CustomEvent("showInvoice", { detail: { html } }));
  }

  const today0 = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
  const days = Array.from({ length: 14 }, (_, i) => {
    const base = new Date(ganttStart + "T00:00:00");
    base.setDate(base.getDate() + i);
    return {
      label: base.toLocaleDateString("en-IN", { weekday: "short", day: "numeric" }),
      dateStr: base.toISOString().split("T")[0],
      isToday: `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,"0")}-${String(base.getDate()).padStart(2,"0")}` === today0,
    };
  });

  const editId = modal && modal.startsWith("edit-") ? modal.replace("edit-", "") : null;
  const showForm = modal === "new" || !!editId;

  // ── Field-level locking based on reservation lifecycle status ──────────────
  // Industry standard: once a guest is Checked In, identity/booking-structure
  // fields become read-only. Operational/preference fields remain editable.
  const editRes = editId ? reservations.find(r => r.id === editId) : null;
  const isEditCI = editRes?.status === "Checked In"; // "Checked In" tier
  const fieldLock = {
    // Identity & verification — locked at check-in (physically verified at front desk)
    dob:            isEditCI,
    idType:         isEditCI,
    idNumber:       isEditCI,
    idPhotos:       isEditCI,
    nationality:    isEditCI,
    cForm:          isEditCI,  // C-Form (foreign national) also verified at CI
    // Booking structure — locked at check-in (use dedicated workflows to change)
    checkIn:        isEditCI,  // cannot rewrite arrival history
    checkOut:       isEditCI,  // use Extend Stay workflow
    bhavan:         isEditCI,  // use Room Move workflow
    roomType:       isEditCI,  // use Room Move workflow
    room:           isEditCI,  // use Room Move workflow
    bookingSource:  isEditCI,  // historical record
    // Payment & status — locked at check-in (use dedicated payment / checkout flows)
    advancePayment: isEditCI,
    bookingStatus:  isEditCI,  // use Check Out / Extend workflow; not inline edit
  };

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Reservation Management</div>
        <button className="btn btn-primary" onClick={openNew}>+ New Reservation</button>
      </div>
      <div className="tabs">
        {["list", "availability", "history"].map((t) => (
          <div key={t} className={`tab ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>
            {t === "list" ? "All Reservations" : t === "availability" ? "Room Availability" : "Guest History"}
          </div>
        ))}
      </div>

      {tab === "list" && (
        <>
          <div style={{ position:"sticky", top:0, zIndex:30, background:"#f8f6f1", paddingTop:4, paddingBottom:2, marginBottom:4 }}>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", paddingBottom:8 }}>
              {filterOptions.map((f) => {
                const count = badgeCounts[f.id] || 0;
                const isActive = activeFilter === f.id;
                const col = f.color || "#374151";
                return (
                  <button key={f.id} onClick={() => setActiveFilter(f.id)}
                    style={{ display:"inline-flex", alignItems:"center", gap:6, padding:"6px 12px",
                      borderRadius:20, fontSize:12, fontWeight:600, cursor:"pointer", border:"1px solid",
                      background: isActive ? col : "transparent",
                      color:      isActive ? "#fff" : col,
                      borderColor: isActive ? col : `${col}40`,
                      boxShadow:  isActive ? `0 2px 8px ${col}30` : "none",
                      transition: "all 0.15s",
                    }}>
                    {f.label}
                    {count > 0 && (
                      <span style={{ fontSize:10, fontWeight:800, lineHeight:1,
                        background: isActive ? "rgba(255,255,255,0.25)" : `${col}18`,
                        color:      isActive ? "#fff" : col,
                        padding:"2px 7px", borderRadius:10, minWidth:18, textAlign:"center" }}>
                        {count}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
            {/* ── Search + Date Range + Export toolbar ── */}
            <div style={{ display:"flex", gap:8, marginBottom:6, flexWrap:"wrap", alignItems:"center" }}>
            <div style={{ flex:1, minWidth:200 }}>
              <input placeholder="Search guest, room, ID, mobile..." value={search} onChange={e => setSearch(e.target.value)} style={{ width:"100%" }} />
            </div>
            {/* Bhawan filter */}
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <span style={{ fontSize:12, color:"#374151", fontWeight:600, whiteSpace:"nowrap" }}>Bhawan:</span>
              <select value={bhawanFilter} onChange={e => setBhawanFilter(e.target.value)}
                style={{ fontSize:12, padding:"6px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.15)", background:"#fff", color:"#111827", cursor:"pointer" }}>
                <option value="All">All Bhawans</option>
                {[...new Set(reservations.map(r=>r.bhavan).filter(Boolean))].sort().map(b => (
                  <option key={b} value={b}>{b}</option>
                ))}
              </select>
            </div>
            {/* Room Type filter */}
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <span style={{ fontSize:12, color:"#374151", fontWeight:600, whiteSpace:"nowrap" }}>Type:</span>
              <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)}
                style={{ fontSize:12, padding:"6px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.15)", background:"#fff", color:"#111827", cursor:"pointer" }}>
                <option value="All">All Types</option>
                {[...new Set(reservations.map(r=>r.type).filter(Boolean))].sort().map(t => (
                  <option key={t} value={t}>{t}</option>
                ))}
              </select>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <span style={{ fontSize:12, color:"#374151", fontWeight:600, whiteSpace:"nowrap" }}>Check-In:</span>
              <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)}
                style={{ width:140, fontSize:12, padding:"6px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.15)", background:"#fff", color:"#111827" }} />
              <span style={{ fontSize:12, color:"#374151" }}>–</span>
              <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)}
                style={{ width:140, fontSize:12, padding:"6px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.15)", background:"#fff", color:"#111827" }} />
              {(dateFrom||dateTo) && (
                <button onClick={() => { setDateFrom(""); setDateTo(""); }}
                  style={{ padding:"5px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.15)", background:"rgba(239,68,68,0.08)", color:"#ef4444", cursor:"pointer", fontSize:12, fontWeight:700 }}>✕</button>
              )}
            </div>
            {/* Export CSV */}
            <button onClick={() => {
              const hdrs = ["ID","Guest","Room","Bhawan","Type","Nights","Check-In","Check-Out","Total","Paid","Balance","Status","Booking Source","Created At"];
              // Fix 13: quote all fields to handle commas in guest names, addresses etc.
              const csvQ = v => `"${String(v).replace(/"/g,'""')}"`;
              const rows = filtered.map(r => {
                const nights = Math.round((new Date(r.checkOut)-new Date(r.checkIn))/86400000)||1;
                const bal    = Math.max(0,(r.total||0)-(r.paid||0));
                return [r.id, r.guest, r.room||"TBA", r.bhavan||"", r.type||"", nights, r.checkIn, r.checkOut, r.total||0, r.paid||0, bal, r.status, r.bookingSource||"", r.reference||"", r.createdAt?.slice(0,10)||""].map(csvQ).join(",");
              });
              const csv = [hdrs.join(","), ...rows].join("\n");
              const a = document.createElement("a");
              a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
              a.download = `reservations-${new Date().toISOString().slice(0,10)}.csv`;
              a.click();
            }}
              style={{ padding:"7px 14px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(34,197,94,0.08)", color:"#16a34a", cursor:"pointer", fontSize:12, fontWeight:700, whiteSpace:"nowrap" }}>
              ⬇ Export CSV
            </button>
            </div>{/* end toolbar */}
            {/* Active filters summary row */}

      {tab === "availability" && (() => {
        const filteredRooms = rooms.filter(room => {
          const matchBhawan = availBhawan === "All" || room.bhavan === availBhawan;
          const matchType   = availType   === "All" || room.type   === availType;
          return matchBhawan && matchType;
        });

        const statusColor = {
          Available:      { bg: "rgba(34,197,94,0.18)",   text: "#22c55e" },
          Occupied:       { bg: "rgba(59,130,246,0.22)",  text: "#3b82f6" },
          Dirty:          { bg: "rgba(245,158,11,0.2)",   text: "#f59e0b" },
          Maintenance:    { bg: "rgba(239,68,68,0.18)",   text: "#ef4444" },
          "Checking Out": { bg: "rgba(168,85,247,0.18)",  text: "#a855f7" },
          Confirmed:      { bg: "rgba(201,168,76,0.18)",  text: "#a07830" },
          "On Hold":      { bg: "rgba(201,168,76,0.10)",  text: "#b45309" },
          Blocked:        { bg: "rgba(99,102,241,0.18)",  text: "#6366f1" },
        };

        function getRoomDayStatus(room, dateStr) {
          // Fix B: exclude No Show — room was never used; Fix: exclude On Hold passthrough
          const booked = reservations.find(r =>
            r.room === room.number && r.bhavan === room.bhavan &&
            r.status !== "Cancelled" && r.status !== "Checked Out" && r.status !== "No Show" &&
            dateStr >= r.checkIn && dateStr < r.checkOut
          );
          if (booked) {
            if (booked.status === "Checked In") return { status: "Occupied",  res: booked };
            if (booked.status === "Confirmed")  return { status: "Confirmed", res: booked };
            // Fix A: On Hold — show as reserved so room isn't mistaken for free
            if (booked.status === "On Hold")    return { status: "On Hold",   res: booked };
          }
          const co = reservations.find(r =>
            r.room === room.number && r.bhavan === room.bhavan &&
            r.status === "Checked In" && r.checkOut === dateStr
          );
          if (co) return { status: "Checking Out", res: co };
          return { status: room.status, res: null };
        }

        const LABEL_MAP = {
          Available:"FREE", Occupied:"OCC", Dirty:"DIRT",
          Maintenance:"MAINT", "Checking Out":"CHKOUT", Confirmed:"RSVD",
          "On Hold":"HOLD", Blocked:"BLKD",
        };

        // ── helpers ──────────────────────────────────────────────
        // Earliest allowed Gantt start = 2 weeks before today
        const minGanttDate = (() => {
          const d = new Date(today0 + "T00:00:00");
          d.setDate(d.getDate() - 14);
          return d.toISOString().slice(0,10);
        })();
        const shiftGantt = (days14) => {
          setGanttStart(prev => {
            const d = new Date(prev + "T00:00:00");
            d.setDate(d.getDate() + days14);
            const next = d.toISOString().slice(0,10);
            if (next < minGanttDate) return prev; // block going back beyond 2 weeks
            return next;
          });
        };
        const ganttEnd = days[days.length - 1]?.dateStr || ganttStart;
        const isGanttToday = ganttStart === today0;
        const isAtMinDate = ganttStart <= minGanttDate;

        // calendar helpers
        const [calYear, calMon] = calMonth.split("-").map(Number);
        const calFirstDay = new Date(calYear, calMon - 1, 1);
        const calDaysInMonth = new Date(calYear, calMon, 0).getDate();
        const calStartDow = calFirstDay.getDay(); // 0=Sun
        const shiftCal = (m) => {
          const d = new Date(calYear, calMon - 1 + m, 1);
          setCalMonth(d.toISOString().slice(0,7));
          setCalDayDetail(null);
        };

        // For each date in calendar month, compute arrivals / departures / occupancy
        function getCalDayStats(dateStr) {
          // Fix G: exclude No Show from arrivals; Fix I: exclude On Hold from occ numerator
          // Fix J: scope arrivals/inhouse to active bhawan/type filter (match denominator)
          const scopeMatch = r =>
            (availBhawan === "All" || r.bhavan === availBhawan) &&
            (availType   === "All" || r.type   === availType);
          const arrivals   = reservations.filter(r =>
            r.checkIn === dateStr &&
            r.status !== "Cancelled" && r.status !== "No Show" && scopeMatch(r)
          ).length;
          // Fix F: exclude No Show from departures; Fix O: include Checked Out (already departed)
          const departures = reservations.filter(r =>
            r.checkOut === dateStr &&
            r.status !== "Cancelled" && r.status !== "No Show" && scopeMatch(r)
          ).length;
          // Fix I: On Hold excluded from inhouse occupancy count
          const inhouse    = reservations.filter(r =>
            r.status !== "Cancelled" && r.status !== "Checked Out" &&
            r.status !== "No Show"   && r.status !== "On Hold" &&
            dateStr > r.checkIn && dateStr < r.checkOut && scopeMatch(r)
          ).length;
          // Fix I: On Hold counted separately as provisional
          const provisional = reservations.filter(r =>
            r.status === "On Hold" &&
            dateStr >= r.checkIn && dateStr < r.checkOut && scopeMatch(r)
          ).length;
          const allOcc     = arrivals + inhouse;
          const totalRooms = filteredRooms.length || rooms.length;
          const occPct     = totalRooms > 0 ? Math.round(allOcc / totalRooms * 100) : 0;
          return { arrivals, departures, inhouse, occPct, provisional };
        }

        // Detail panel: bookings on a clicked day
        const dayDetailRes = calDayDetail
          ? reservations.filter(r =>
              r.status !== "Cancelled" && r.status !== "No Show" &&
              calDayDetail >= r.checkIn && calDayDetail <= r.checkOut &&
              (availBhawan === "All" || r.bhavan === availBhawan)
            ).sort((a,b) => (a.room||"").localeCompare(b.room||""))
          : [];

        return (
          <div>
            {/* ── Top filters row ── */}
            <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap", alignItems:"center" }}>
              <select value={availBhawan} onChange={e => setAvailBhawan(e.target.value)} style={{ width:200, fontSize:13 }}>
                <option value="All">All Bhawans</option>
                {BHAVAN_LIST.map(b => <option key={b} value={b}>{b}</option>)}
              </select>
              <select value={availType} onChange={e => setAvailType(e.target.value)} style={{ width:150, fontSize:13 }}>
                <option value="All">All Room Types</option>
                {ROOM_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <span style={{ fontSize:13, fontWeight:700, color:"#374151" }}>{filteredRooms.length} rooms</span>

              {/* View toggle */}
              <div style={{ marginLeft:"auto", display:"flex", background:"rgba(0,0,0,0.05)", borderRadius:8, padding:3, gap:2 }}>
                {[["gantt","📅 Gantt"],["calendar","🗓 Calendar"]].map(([v,lbl]) => (
                  <button key={v} onClick={() => setAvailView(v)}
                    style={{ padding:"6px 16px", borderRadius:7, fontSize:13, fontWeight: availView===v ? 800 : 600, border:"none", cursor:"pointer",
                      background: availView===v ? "rgba(201,168,76,0.2)" : "transparent",
                      color: availView===v ? "#a07830" : "#374151",
                      letterSpacing: availView===v ? "-0.01em" : "normal" }}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>

            {/* ══════════════════════════════════════════════════════
                GANTT VIEW
            ══════════════════════════════════════════════════════ */}
            {availView === "gantt" && (
              <div>
                {/* Date navigator */}
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
                  <button onClick={() => !isAtMinDate && shiftGantt(-14)} disabled={isAtMinDate}
                    style={{ padding:"7px 16px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:isAtMinDate?"rgba(0,0,0,0.03)":"rgba(0,0,0,0.07)", color:isAtMinDate?"#9ca3af":"#111827", cursor:isAtMinDate?"not-allowed":"pointer", fontSize:13, fontWeight:700, opacity:isAtMinDate?0.4:1 }}>
                    {"«"} Prev 2 Weeks
                  </button>
                  <button onClick={() => shiftGantt(14)}
                    style={{ padding:"7px 16px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.07)", color:"#111827", cursor:"pointer", fontSize:13, fontWeight:700 }}>
                    Next 2 Weeks {"»"}
                  </button>

                  {/* Date picker jump */}
                  <input type="date" value={ganttStart} min={minGanttDate}
                    onChange={e => { if(e.target.value >= minGanttDate) setGanttStart(e.target.value); }}
                    style={{ fontSize:12, padding:"5px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.05)", color:"#111827", width:150 }} />

                  {!isGanttToday && (
                    <button onClick={() => setGanttStart(today0)}
                      style={{ padding:"6px 12px", borderRadius:8, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.1)", color:"#c9a84c", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                      ⟳ Today
                    </button>
                  )}

                  <span style={{ fontSize:13, fontWeight:700, color:"#111827", marginLeft:"auto", background:"rgba(0,0,0,0.05)", padding:"5px 12px", borderRadius:8, border:"1px solid rgba(255,255,255,0.08)" }}>
                    {new Date(ganttStart+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
                    {" – "}
                    {new Date(ganttEnd+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
                  </span>
                </div>

                {/* Legend */}
                <div style={{ display:"flex", gap:10, marginBottom:12, flexWrap:"wrap" }}>
                  {Object.entries(statusColor).map(([s,c]) => (
                    <div key={s} style={{ display:"flex", alignItems:"center", gap:4 }}>
                      <div style={{ width:9, height:9, borderRadius:2, background:c.bg, border:`1px solid ${c.text}` }} />
                      <span style={{ fontSize:11, fontWeight:700, color:"#374151" }}>{s}</span>
                    </div>
                  ))}
                </div>

                {/* Grid */}
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                  <div style={{ fontSize:18, fontWeight:800, color:"#111827", letterSpacing:"-0.01em" }}>
                    14-Day Room Availability
                    <span style={{ marginLeft:10, fontSize:12, fontWeight:600, color:"#c9a84c", background:"rgba(201,168,76,0.12)", padding:"2px 10px", borderRadius:10, verticalAlign:"middle" }}>Gantt</span>
                  </div>
                  <div style={{ fontSize:12, color:"#4b5563" }}>Click room → manage &nbsp;·&nbsp; Click cell → view booking</div>
                </div>
                <div className="card" style={{ overflowX:"auto" }}>
                  <div style={{ display:"grid", gridTemplateColumns:`82px repeat(14, minmax(46px,1fr))`, gap:3, minWidth:840 }}>
                    {/* Header */}
                    <div style={{ fontSize:11, fontWeight:700, color:"#374151", padding:"6px 2px", textTransform:"uppercase", letterSpacing:"0.08em" }}>Room</div>
                    {days.map(d => (
                      <div key={d.dateStr} style={{ fontSize:11, textAlign:"center", color:d.isToday?"#a07830":"#374151", padding:"6px 2px", fontWeight:d.isToday?800:600, borderBottom:d.isToday?"2px solid #c9a84c":"1px solid rgba(255,255,255,0.06)" }}>
                        {d.label}
                        {d.isToday && <div style={{ fontSize:9, color:"#a07830" }}>Today</div>}
                      </div>
                    ))}

                    {filteredRooms.length === 0 ? (
                      <div style={{ gridColumn:"1 / -1", textAlign:"center", padding:"32px", color:"#4b5563", fontSize:13 }}>No rooms match filters.</div>
                    ) : filteredRooms.map(room => (
                      <React.Fragment key={room.id}>
                        <div onClick={() => onNavigate("rooms", { roomNumber:room.number, roomFilter:"All" })}
                          title={`${room.bhavan} · ${room.type} · Click to manage`}
                          style={{ display:"flex", flexDirection:"column", justifyContent:"center", cursor:"pointer", padding:"4px 0", borderRadius:5 }}
                          onMouseEnter={e => e.currentTarget.style.background="rgba(0,0,0,0.03)"}
                          onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                          <span style={{ fontWeight:700, color:"#111827", fontSize:13 }}>{room.number}</span>
                          <span style={{ fontSize:9, color:"#4b5563" }}>{room.type.slice(0,3).toUpperCase()}</span>
                          <span style={{ fontSize:9, color:"#a07830", opacity:0.7 }}>↗</span>
                        </div>
                        {days.map(d => {
                          const { status, res:dayRes } = getRoomDayStatus(room, d.dateStr);
                          const col = statusColor[status] || statusColor.Available;
                          const label = LABEL_MAP[status] || "FREE";
                          const tooltip = dayRes
                            ? `${dayRes.guest} · ${status}
${dayRes.checkIn} → ${dayRes.checkOut}`
                            : status==="Dirty" ? "Dirty — awaiting housekeeping"
                            : status==="Maintenance" ? "Under Maintenance"
                            : `Available — click to book`;
                          return (
                            <div key={`${room.id}-${d.dateStr}`} title={tooltip}
                              onClick={() => {
                                if (dayRes) {
                                  openEdit(dayRes);
                                } else if (status === "Available") {
                                  openNewFromGantt(room, d.dateStr);
                                } else {
                                  onNavigate("rooms", { roomNumber: room.number, roomFilter: "All" });
                                }
                              }}
                              style={{ height:34, borderRadius:4, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                                background:col.bg, color:col.text, fontWeight:700, fontSize:9, cursor:"pointer",
                                border:`1px solid ${col.text}30`, outline:d.isToday?`1px solid ${col.text}60`:"none" }}
                              onMouseEnter={e=>{ e.currentTarget.style.filter="brightness(1.3)"; e.currentTarget.style.transform="scale(1.05)"; }}
                              onMouseLeave={e=>{ e.currentTarget.style.filter="none"; e.currentTarget.style.transform="none"; }}>
                              {label}
                              {dayRes && <div style={{ fontSize:7, opacity:0.85, maxWidth:"90%", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", textAlign:"center" }}>{dayRes.guest.split(" ")[0]}</div>}
                              {!dayRes && status === "Available" && <div style={{ fontSize:8, opacity:0.5 }}>+</div>}
                            </div>
                          );
                        })}
                      </React.Fragment>
                    ))}
                  </div>
                </div>

                {/* Summary strip */}
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))", gap:10, marginTop:14 }}>
                  {Object.entries(statusColor).map(([status, col]) => {
                    const count = filteredRooms.filter(r => r.status === status).length;
                    if (!count) return null;
                    return (
                      <div key={status} onClick={() => onNavigate("rooms",{roomFilter:status})}
                        style={{ background:col.bg, border:`1px solid ${col.text}30`, borderRadius:10, padding:"12px 16px", cursor:"pointer" }}
                        onMouseEnter={e=>{ e.currentTarget.style.borderColor=col.text; e.currentTarget.style.transform="translateY(-2px)"; }}
                        onMouseLeave={e=>{ e.currentTarget.style.borderColor=`${col.text}30`; e.currentTarget.style.transform="none"; }}>
                        <div style={{ fontSize:22, fontWeight:700, color:col.text }}>{count}</div>
                        <div style={{ fontSize:11, color:col.text, opacity:0.85 }}>{status}</div>
                        <div style={{ fontSize:9, color:col.text, opacity:0.5, marginTop:2 }}>↗ View in Rooms</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ══════════════════════════════════════════════════════
                CALENDAR VIEW
            ══════════════════════════════════════════════════════ */}
            {availView === "calendar" && (
              <div>
                {/* Month navigator */}
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
                  <button onClick={() => shiftCal(-12)}
                    style={{ padding:"6px 12px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.06)", color:"#111827", cursor:"pointer", fontSize:12, fontWeight:700 }}>
                    ‹‹ Prev Year
                  </button>
                  <button onClick={() => shiftCal(-1)}
                    style={{ padding:"6px 12px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.06)", color:"#111827", cursor:"pointer", fontSize:13, fontWeight:700 }}>
                    ‹
                  </button>
                  <div style={{ flex:1, textAlign:"center", fontSize:20, fontWeight:800, color:"#111827", letterSpacing:"-0.01em" }}>
                    {calFirstDay.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
                  </div>
                  <button onClick={() => shiftCal(1)}
                    style={{ padding:"6px 12px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.06)", color:"#111827", cursor:"pointer", fontSize:13, fontWeight:700 }}>
                    ›
                  </button>
                  <button onClick={() => shiftCal(12)}
                    style={{ padding:"6px 12px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.06)", color:"#111827", cursor:"pointer", fontSize:12, fontWeight:700 }}>
                    Next Year ››
                  </button>
                  {/* jump to month */}
                  <input type="month" value={calMonth} onChange={e => { setCalMonth(e.target.value); setCalDayDetail(null); }}
                    style={{ fontSize:12, padding:"5px 10px", borderRadius:8, border:"1px solid rgba(0,0,0,0.18)", background:"rgba(0,0,0,0.05)", color:"#111827", width:140 }} />
                  <button onClick={() => { setCalMonth(today0.slice(0,7)); setCalDayDetail(null); }}
                    style={{ padding:"6px 12px", borderRadius:8, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.1)", color:"#c9a84c", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                    ⟳ This Month
                  </button>
                </div>

                {/* Monthly occupancy summary */}
                {(() => {
                  // Fix G/F/N: exclude No Show and Cancelled from all monthly KPIs
                  const monthArrivals   = reservations.filter(r => r.status !== "Cancelled" && r.status !== "No Show" && r.checkIn.startsWith(calMonth)).length;
                  // Fix O: include Checked Out in departures (historical + upcoming)
                  const monthDepartures = reservations.filter(r => r.status !== "Cancelled" && r.status !== "No Show" && r.checkOut.startsWith(calMonth)).length;
                  // Fix N: exclude No Show from revenue (unearned — only Cancelled was excluded before)
                  const monthRevenue    = reservations
                    .filter(r => r.status !== "Cancelled" && r.status !== "No Show" && r.checkIn.startsWith(calMonth))
                    .reduce((s,r) => s + (r.total||0), 0);
                  return (
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:14 }}>
                      {[
                        { icon:"🛬", label:"Arrivals this month",   val:monthArrivals,   color:"#a07830" },
                        { icon:"🛫", label:"Departures this month", val:monthDepartures, color:"#a855f7" },
                        { icon:"₹",  label:"Revenue (booked)",      val:"₹"+rupees(monthRevenue), color:"#22c55e", raw:true },
                      ].map(s => (
                        <div key={s.label} style={{ background:"rgba(0,0,0,0.04)", border:"1px solid rgba(0,0,0,0.10)", borderRadius:10, padding:"12px 16px" }}>
                          <div style={{ fontSize:11, fontWeight:700, color:"#4b5563", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>{s.icon} {s.label}</div>
                          <div style={{ fontSize:22, fontWeight:800, color:s.color }}>{s.val}</div>
                        </div>
                      ))}
                    </div>
                  );
                })()}

                <div style={{ display:"grid", gridTemplateColumns: calDayDetail ? "1fr 320px" : "1fr", gap:14, alignItems:"start" }}>
                  {/* Calendar grid */}
                  <div className="card" style={{ padding:"14px 16px" }}>
                    <div style={{ fontSize:15, fontWeight:800, color:"#111827", marginBottom:14, paddingBottom:10, borderBottom:"1px solid rgba(0,0,0,0.1)" }}>
                      Monthly Booking Overview
                      <span style={{ marginLeft:8, fontSize:11, fontWeight:600, color:"#4b5563" }}>Click a day to see bookings</span>
                    </div>
                    {/* Day of week headers */}
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6 }}>
                      {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => (
                        <div key={d} style={{ textAlign:"center", fontSize:12, fontWeight:700, color:"#374151", padding:"6px 0", textTransform:"uppercase", letterSpacing:"0.05em" }}>{d}</div>
                      ))}
                    </div>
                    {/* Date cells */}
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
                      {/* Empty leading cells */}
                      {Array.from({ length: calStartDow }, (_,i) => <div key={"e"+i} />)}
                      {/* Day cells */}
                      {Array.from({ length: calDaysInMonth }, (_,i) => {
                        const day = i + 1;
                        const dateStr = `${calMonth}-${String(day).padStart(2,"0")}`;
                        const { arrivals, departures, inhouse, occPct, provisional } = getCalDayStats(dateStr);
                        const isToday = dateStr === today0;
                        const isSelected = dateStr === calDayDetail;
                        const isPast = dateStr < today0;
                        const hasActivity = arrivals > 0 || departures > 0 || inhouse > 0 || provisional > 0;
                        const occColor = occPct >= 80 ? "#ef4444" : occPct >= 50 ? "#f59e0b" : occPct > 0 ? "#22c55e" : "#374151";
                        return (
                          <div key={dateStr} onClick={() => setCalDayDetail(isSelected ? null : dateStr)}
                            style={{ borderRadius:8, padding:"8px 6px", cursor:"pointer", minHeight:70,
                              background: isSelected ? "rgba(160,120,48,0.15)" : isToday ? "rgba(160,120,48,0.08)" : "rgba(0,0,0,0.02)",
                              border: isSelected ? "2px solid #a07830" : isToday ? "1px solid rgba(160,120,48,0.5)" : "1px solid rgba(0,0,0,0.08)",
                              opacity: isPast && !hasActivity ? 0.45 : 1 }}
                            onMouseEnter={e => { if(!isSelected) e.currentTarget.style.background="rgba(0,0,0,0.05)"; }}
                            onMouseLeave={e => { if(!isSelected) e.currentTarget.style.background=isToday?"rgba(160,120,48,0.08)":"rgba(0,0,0,0.02)"; }}>
                            {/* Day number */}
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                              <span style={{ fontSize:13, fontWeight: isToday ? 800 : 600, color: isToday ? "#a07830" : "#111827" }}>{day}</span>
                              {occPct > 0 && (
                                <span style={{ fontSize:9, fontWeight:700, color:occColor, background:`${occColor}18`, padding:"1px 4px", borderRadius:4 }}>{occPct}%</span>
                              )}
                            </div>
                            {/* Activity pills */}
                            <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
                              {arrivals > 0 && (
                                <div style={{ display:"flex", alignItems:"center", gap:3, fontSize:10, color:"#a07830" }}>
                                  <span style={{ fontSize:8 }}>🛬</span>
                                  <span style={{ fontWeight:600 }}>{arrivals} in</span>
                                </div>
                              )}
                              {departures > 0 && (
                                <div style={{ display:"flex", alignItems:"center", gap:3, fontSize:10, color:"#a855f7" }}>
                                  <span style={{ fontSize:8 }}>🛫</span>
                                  <span style={{ fontWeight:600 }}>{departures} out</span>
                                </div>
                              )}
                              {inhouse > 0 && (
                                <div style={{ display:"flex", alignItems:"center", gap:3, fontSize:10, color:"#3b82f6" }}>
                                  <span style={{ fontSize:8 }}>🛏</span>
                                  <span style={{ fontWeight:600 }}>{inhouse} stay</span>
                                </div>
                              )}
                              {provisional > 0 && (
                                <div style={{ display:"flex", alignItems:"center", gap:3, fontSize:10, color:"#b45309" }}>
                                  <span style={{ fontSize:8 }}>⏳</span>
                                  <span style={{ fontWeight:600 }}>{provisional} hold</span>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Day detail panel */}
                  {calDayDetail && (
                    <div className="card" style={{ padding:"14px 16px", position:"sticky", top:16 }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                        <div>
                          <div style={{ fontSize:16, fontWeight:800, color:"#f9fafb" }}>
                            {new Date(calDayDetail+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}
                          </div>
                          <div style={{ fontSize:11, color:"#4b5563", marginTop:2 }}>{dayDetailRes.length} reservation{dayDetailRes.length!==1?"s":""}</div>
                        </div>
                        <button onClick={() => setCalDayDetail(null)}
                          style={{ background:"none", border:"none", color:"#4b5563", cursor:"pointer", fontSize:18, lineHeight:1 }}>✕</button>
                      </div>

                      {/* Switch Gantt to this date */}
                      <button onClick={() => { setAvailView("gantt"); setGanttStart(calDayDetail); }}
                        style={{ width:"100%", marginBottom:12, padding:"7px", borderRadius:8, border:"1px solid rgba(201,168,76,0.3)", background:"rgba(201,168,76,0.08)", color:"#c9a84c", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                        📅 View in Gantt from this date
                      </button>

                      {dayDetailRes.length === 0 ? (
                        <div style={{ textAlign:"center", padding:"20px 0", color:"#4b5563", fontSize:13 }}>No bookings on this day</div>
                      ) : dayDetailRes.map(r => {

      {/* ── View Guest Modal ── */}
      {viewGuest && (() => {

        const balance = Math.max(0, Math.round((g.total - g.paid) * 100) / 100);
        const InfoRow = ({ label, value, valueColor }) => value ? (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "7px 0", borderBottom: "1px solid rgba(0,0,0,0.03)" }}>

            <span style={{ color: valueColor || "#111827", fontSize: 13, fontWeight: 500, textAlign: "right", maxWidth: 240 }}>{value}</span>

        const Section = ({ title, color, children }) => (

          </div>
        );
        const todayStrV = new Date().toISOString().split("T")[0];
        const isEarlyDepV = g.checkOut > todayStrV;
        const isLateStayV = g.checkOut < todayStrV;
        const nightsBookedV = Math.round((new Date(g.checkOut) - new Date(g.checkIn)) / 86400000);
        const nightsActualV = Math.round((new Date(todayStrV) - new Date(g.checkIn)) / 86400000);
        const fmtDV = d => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", backdropFilter: "blur(3px)", zIndex: 9998, display: "flex", alignItems: "center", justifyContent: "center" }}
            onClick={() => { setViewGuest(null); setInlineCheckoutConfirm(false); setInlineExtendOpen(false); setInlineRoomMoveOpen(false); }}>
            <div onClick={(e) => e.stopPropagation()}
              style={{ background: "#ffffff", border: "1px solid var(--border)", borderRadius: 16, width: 520, maxHeight: "88vh", overflowY: "auto", boxShadow: "0 32px 80px rgba(0,0,0,0.45)" }} ref={viewGuestModalRef}>

                  <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap", alignItems: "center" }}>

                    {g.status === "Confirmed" && g.checkIn === new Date().toISOString().split("T")[0]

                      : <StatusPill status={g.status} />

                    {g.earlyCheckIn && g.status !== "Checked In" && (
                      <span style={{ fontSize: 10, background: "rgba(245,158,11,0.12)", color: "#f59e0b", border: "1px solid rgba(245,158,11,0.3)", borderRadius: 10, padding: "2px 8px", fontWeight: 700 }}>

                      </span>
                    )}
                    {g.isEarlyArrival && g.status === "Checked In" && (
                      <span style={{ fontSize: 10, background: "rgba(245,158,11,0.12)", color: "#f59e0b", border: "1px solid rgba(245,158,11,0.3)", borderRadius: 10, padding: "2px 8px", fontWeight: 700 }}>
                        ⚡ Arrived Early
                      </span>
                    )}
                    {g.isVIP && (
                      <span style={{ fontSize: 10, background: "rgba(201,168,76,0.15)", color: "#a07830", border: "1px solid rgba(201,168,76,0.3)", borderRadius: 10, padding: "2px 8px", fontWeight: 700 }}>⭐ VIP</span>
                    )}
                    <span style={{ fontSize: 11, color: "#6b7280" }}>Booking ID: <span style={{ color: "#a07830", fontFamily: "monospace" }}>{g.id}</span></span>
                  </div>
                </div>
                <button onClick={() => { setViewGuest(null); setInlineCheckoutConfirm(false); setInlineExtendOpen(false); setInlineRoomMoveOpen(false); }} style={{ background: "none", border: "none", color: "#6b7280", fontSize: 20, cursor: "pointer", lineHeight: 1, padding: 4 }}>✕</button>
              </div>

              <div style={{ padding: "24px 28px" }}>

                {/* Guest Details */}

                  <InfoRow label="ID Number" value={g.idNumber || "—"} valueColor="#a07830" />
                  {g.idPhotos && g.idPhotos.length > 0 && (

                {/* Reservation Information */}
                <Section title="Reservation Information" color="#1d4ed8">

                  {/* Late check-out request info */}

                        <span style={{ display: "block", fontSize: 10, color: "#6b7280", marginTop: 2 }}>Late check-out charge may apply</span>
                      </span>
                    </div>
                  )}
                  <InfoRow label="Check-Out" value={g.checkOut ? `${new Date(g.checkOut).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })}${g.etd ? ` · ETD ${g.etd} hrs` : ""}` : "—"} valueColor={g.checkOut === new Date().toISOString().split("T")[0] ? "#a855f7" : undefined} />
                  <InfoRow label="Duration" value={nights ? `${nights} night${nights !== 1 ? "s" : ""}` : "—"} />
                  <InfoRow label="Adults" value={`${g.adults || 1} Adult${(g.adults || 1) != 1 ? "s" : ""}`} />
                  {g.children && g.children !== "0" && <InfoRow label="Children" value={`${g.children} Child${g.children != 1 ? "ren" : ""}`} />}
                  {g.companions && g.companions.length > 0 && (
                    <div style={{ padding: "7px 0", borderBottom: "1px solid rgba(0,0,0,0.03)" }}>
                      <span style={{ color: "#6b7280", fontSize: 12, minWidth: 130, display: "block", marginBottom: 4 }}>Companions ({g.companions.length})</span>
                      {g.companions.map((c, i) => (
                        <div key={i} style={{ fontSize: 12, color: "#111827", marginBottom: 2 }}>
                          {c.name}{c.relation && <span style={{ color: "#6b7280" }}> · {c.relation}</span>}
                        </div>
                      ))}
                    </div>
                  )}
                  <InfoRow label="Booking Source" value={g.bookingSource ? `${SOURCE_ICONS[g.bookingSource]||""} ${g.bookingSource}` : "—"} />
                  {g.reference && <InfoRow label="Reference" value={g.reference} valueColor="#a07830" />}
                  <InfoRow label="Nationality" value={g.nationality || "—"} />
                  {g.email && <InfoRow label="Email" value={g.email} />}
                  {g.gender && <InfoRow label="Gender" value={g.gender} />}
                  
                  {g.purposeOfVisit && <InfoRow label="Purpose" value={g.purposeOfVisit} />}
                  {g.groupId && <InfoRow label="Group ID" value={`${g.groupId}${g.groupName ? ` — ${g.groupName}` : ""}`} valueColor="#f59e0b" />}
                  {g.holdUntilDate && g.status === "On Hold" && (
                    <InfoRow label="Hold Until" value={`${g.holdUntilDate} at ${g.holdUntilTime || "18:00"} hrs`} valueColor="#f59e0b" />

                  {(g.emergencyName) && (
                    <div style={{ padding: "7px 0", borderBottom: "1px solid rgba(0,0,0,0.03)" }}>
                      <span style={{ color: "#6b7280", fontSize: 12, display: "block", marginBottom: 4 }}>Emergency Contact</span>

                  {g.specialRequests && (
                    <div style={{ padding: "7px 0", borderBottom: "1px solid rgba(0,0,0,0.03)" }}>
                      <span style={{ color: "#6b7280", fontSize: 12, display: "block", marginBottom: 4 }}>Special Requests</span>
                      <span style={{ fontSize: 12, color: "#fcd34d" }}>{g.specialRequests}</span>

                    <div style={{ padding: "7px 0", borderBottom: "1px solid rgba(0,0,0,0.03)" }}>

                      <span style={{ fontSize: 12, color: "#fca5a5" }}>{g.internalNotes}</span>
                    </div>

                </Section>

                {/* ── Operations Panel (Checked In guests only) ── */}
                {/* panels rendered as root-level overlays below */}

                  <InfoRow label="Amount Paid" value={`₹${rupees((g.paid || 0))}`} valueColor="#22c55e" />
                  <InfoRow label="Balance Due" value={`₹${rupees(balance)}`} valueColor={balance > 0 ? "#ef4444" : "#22c55e"} />
                  {g.folio && g.folio.length > 0 && (
                    <div style={{ marginTop: 10 }}>
                      <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>Folio</div>
                      {g.folio.map((item, i) => (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "5px 0", borderBottom: "1px solid rgba(0,0,0,0.03)" }}>
                          <div>
                            <span style={{ color: item.amount < 0 ? "#22c55e" : "#6b7280" }}>{item.desc}</span>

                              <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 1 }}>
                                {new Date(item.date).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })} · {new Date(item.date).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true })}
                              </div>
                            )}
                          </div>
                          <span style={{ color: item.amount < 0 ? "#22c55e" : "#111827", fontWeight: 500 }}>

                      ))}

                </Section>

              </div>

              {/* ── Reservation Actions footer — single source of truth for all ops ── */}
              {(() => {
                const todayV = new Date().toISOString().split("T")[0];
                const isEarlyDepV2 = g.checkOut > todayV;
                const isLateDepV2  = g.checkOut < todayV;
                const gBalance = Math.max(0, Math.round(((g.total||0) - (g.paid||0)) * 100) / 100);
                const closeModal = () => { setViewGuest(null); setInlineCheckoutConfirm(false); setInlineExtendOpen(false); setInlineRoomMoveOpen(false); };
                return (
                  <div style={{ padding: "14px 28px 18px", borderTop: "1px solid var(--border)" }}>
                    <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "#374151", fontWeight: 700, marginBottom: 12, paddingBottom: 6, borderBottom: "2px solid rgba(0,0,0,0.08)" }}>Reservation Actions</div>

                    {/* ── Closed statuses ── */}
                    {g.status === "Cancelled" && (
                      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderRadius: 8, background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.2)", marginBottom: 12 }}>
                        <span style={{ fontSize: 18 }}>🚫</span>
                        <span style={{ fontSize: 12, color: "#ef4444" }}>This booking has been <strong>cancelled</strong> and cannot be modified.</span>
                      </div>

                    {g.status === "No Show" && (
                      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderRadius: 8, background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.2)", marginBottom: 12 }}>
                        <span style={{ fontSize: 18 }}>🚷</span>
                        <span style={{ fontSize: 12, color: "#ef4444" }}>Guest did not arrive — marked <strong>No Show</strong>. Room has been released.</span>
                      </div>
                    )}
                    {g.status === "Checked Out" && (
                      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderRadius: 8, background: "rgba(34,197,94,0.06)", border: "1px solid rgba(34,197,94,0.2)", marginBottom: 12 }}>
                        <span style={{ fontSize: 18 }}>✅</span>
                        <span style={{ fontSize: 12, color: "#16a34a" }}>Guest has <strong>checked out</strong>. Stay is complete.</span>
                      </div>
                    )}

                    {/* ── Primary operational actions ── */}
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>

                      {/* CONFIRMED — Assign, No Show, Check In, Cancel */}
                      {g.status === "Confirmed" && (
                        <>
                          {!g.room && (
                            <button className="btn btn-ghost"
                              style={{ color: "#f59e0b", borderColor: "rgba(245,158,11,0.3)", fontSize: 12, padding: "6px 12px" }}
                              onClick={() => { setAssignRoomModal({ id: g.id, room: "", bhavan: g.bhavan }); closeModal(); }}>
                              📌 Assign Room

                          {g.checkIn <= todayV && (

                          <button className="btn btn-ghost"
